          (igen.has(m.id)?' · den här kom tillbaka':'')+(MUNTLIG_EXTRA.includes(m.delmoment)?' · extra, inte med i lärarens material':'')+'</p>'+prickar()+
        '<h3 class="fraga" style="margin-top:12px">'+esc(m.fraga)+'</h3>'+
        '<p class="mjuk" style="margin-top:10px">Säg svaret högt, som om du pratade med läraren. Du behöver inte skriva något.</p>'+
        '<p class="tips" id="mHjalp" style="margin-top:12px;display:none" aria-live="polite"></p>'+
        '<div class="rad">'+
          '<button class="knapp primar stor" id="mSagt">Jag har sagt mitt svar</button>'+
          '<button class="knapp" id="mBorja">💡 Hjälp mig börja</button>'+
          '<button class="lasknapp" id="mLas" style="margin:0">🔊 Läs frågan igen</button>'+
        '</div>'+
      '</section>';
    las(m.fraga);
    $('#mLas').onclick = () => { ljudKlick(); las(m.fraga, $('#mLas')); };
    $('#mBorja').onclick = () => {
      ljudKlick();
      const h = $('#mHjalp'); h.style.display = 'flex'; h.classList.add('ny'); h.textContent = m.borja;

    $('#mSagt').onclick = () => { ljudKlick(); tyst(); visaSvar(); };
    mu.scrollIntoView({behavior: lugn()?'auto':'smooth', block:'nearest'});

  const visaSvar = () => {

      '<section class="fragekort">'+

        '<div>'+m.nyckelord.map(k => '<span class="malchip" style="margin:3px 6px 3px 0;font-size:.82rem;text-transform:none;letter-spacing:0">'+esc(k)+'</span>').join('')+'</div>'+
        '<p class="fraga" style="font-size:1.12rem;margin-top:18px">Hur gick det?</p>'+
        '<div class="rad">'+
          '<button class="knapp primar" data-n="2">👍 Jag sa allt</button>'+
          '<button class="knapp" data-n="1">🙂 Jag sa en del</button>'+
          '<button class="knapp" data-n="0">Inte än</button>'+
          '<button class="lasknapp" id="mLasSvar" style="margin:0">🔊 Lyssna på exemplet</button>'+
        '</div>'+
      '</section>';
    las('Så kan man säga. '+m.svar);
    $('#mLasSvar').onclick = () => { ljudKlick(); las('Så kan man säga. '+m.svar, $('#mLasSvar')); };
    mu.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      const n = +b.dataset.n, f = spar.muntlig[m.id] || { antal:0 };
      spar.muntlig[m.id] = { niva:n, antal:f.antal+1, senast:idag() }; spara();
      betyg[m.id] = n;
      if(n === 2) ljudRatt(); else ljudSteg();
      ko.shift();
      if(n < 2 && !igen.has(m.id)){ igen.add(m.id); ko.push(m); }   // en andra chans, en enda gång
      else gjorda++;
      ko.length ? visaFraga() : sammanfatta();

  };

  const sammanfatta = () => {
    const allt = urval.filter(m => betyg[m.id] === 2).length;
    const kvar = urval.filter(m => betyg[m.id] !== 2);
    const delar = Array.from(new Set(kvar.map(m => DELMOMENT[m.delmoment] || m.delmoment)));
    if(allt >= Math.ceil(antal*0.8)) konfetti();
    mu.innerHTML =
      '<section class="fragekort">'+
        '<p class="etikett">Muntligt klart</p>'+
        '<h3 class="fraga">'+allt+' av '+antal+' frågor sa du med alla nyckelord</h3>'+
        '<p style="margin-top:10px">'+(kvar.length
          ? 'Att öva mer på: <strong>'+esc(delar.join(', '))+'</strong>. De kommer först nästa gång.'
          : 'Du förklarade allt. Det är precis så provet går till.')+'</p>'+
        '<div class="rad">'+
          '<button class="knapp primar" id="muNy">Öva fler frågor</button>'+
          '<button class="knapp" id="muRap">🖨 Visa resultat för läraren</button>'+
          '<button class="knapp" id="muHem">← Till labbet</button></div>'+
      '</section>';
    las('Klart. Du sa '+allt+' av '+antal+' frågor med alla nyckelord.');
    $('#muNy').onclick = () => visaMuntligt(omradeId, delmoment);
    $('#muRap').onclick = visaRapport;
    $('#muHem').onclick = () => { tyst(); visaLabbet(); };
    hud();
  };

  visaFraga();
  scrollTo(0,0);

EXP.partiklar={
  namn:'Partiklar och värme',
  intro:'All materia består av partiklar, alltså atomer och molekyler. Här ser du vatten i en glascylinder med en kolv. Med det ena reglaget ändrar du temperaturen. Med det andra ger du vattnet mer eller mindre plats. Håll ögonen på kokpunkten, den står inte still.',
  steg:[
    'Kyl vattnet tills det blir is.',
    'Värm tills det kokar och blir vattenånga.',
    'Tryck ihop vattenångan tills trycket blir minst tre atmosfärer.',
    'Håll temperaturen över 100 grader och tryck ihop tills vattenångan blir vatten igen.'
  ],
  fraga:['Varför kokar vattnet först vid 120 grader när kolven trycker ihop det?',
    ['Högre tryck håller kvar partiklarna, så det krävs mer värme',
     'Partiklarna blir tyngre av trycket och rör sig långsammare',
     'Det finns mindre vatten kvar när kolven trycker ihop det',
     'Kokpunkten ändras inte, men termometern visar fel'],
    'Kokpunkten beror på trycket. I en tryckkokare är trycket ungefär två atmosfärer och vattnet kokar först vid cirka 120 grader, så maten blir färdig fortare.'],
  bygg(api){
    const N=40,X0=86,CHT=88,CHB=298,MID=193,GOLV=332,BY=6,BH=62,AK=api.farg;
    const IS='#DCE7F0',VAT='#5CB8FF',ANG='#FF8A5B';
    const VMIN=25,VMAX=150,BREDD=318;
    let T=20,V=100,serie=[],ur=0,krockar=0,krockTakt=0,krockUr=0,stoppBlink=0,foreFas='flytande';
    const P=[];
    for(let i=0;i<N;i++)P.push({x:slump(X0+16,170),y:slump(200,280),vx:slump(-1,1),vy:slump(-1,1),dx:0,dy:0,
      hx:X0+20+(i%8)*19,hy:CHB-24-Math.floor(i/8)*19});
    const gn=new G.Partiklar({max:80});

    /* --- fysiken ---------------------------------------------------------
       Kokpunkten följer trycket enligt Clausius–Clapeyron. Konstanten 4886
       kelvin kommer av vattnets ångbildningsvärme. Formeln ger 120 grader vid
       2 atmosfärer och 81 grader vid en halv atmosfär, alltså rätt värden. */
    const KK=4886;
    const psat=x=>Math.exp(KK*(1/373.15-1/(x+273.15)));        // mättnadstryck i atm
    const tkok=p=>1/(1/373.15-Math.log(clamp(p,.02,60))/KK)-273.15;
    /* Så stor del av cylindern ämnet själv fyller. Gasen fyller allt; vätskan
       och isen har en egen volym som kolven inte kan pressa ihop. */
    const egenVolym=()=>{const f=fas(); return f==='gas'?18:f==='flytande'?40:63;};
    const Vef=()=>Math.max(V,egenVolym());
    const tarStopp=()=>V<egenVolym();
    const pgas=()=>(T+273.15)/373.15*100/Math.max(V,18);
    function fas(){ if(T<=0) return 'fast'; return pgas()<=psat(T) ? 'gas' : 'flytande'; }
    function tryck(){
      const f=fas();
      if(f==='gas') return pgas();
      const bas = f==='fast' ? 1 : Math.max(1,psat(T));
      return bas + Math.max(0,egenVolym()-V)*0.9;
    }
    const hoger=()=>X0+Vef()/VMAX*BREDD;
    const egenHoger=()=>X0+egenVolym()/VMAX*BREDD;
    const fFarg=f=>f==='fast'?IS:f==='flytande'?VAT:ANG;
    const fNamn=f=>f==='fast'?'IS':f==='flytande'?'VATTEN':'VATTENÅNGA';

    api.avlas('temp','Temperatur'); api.avlas('kok','Kokpunkt vid detta tryck');
    api.avlas('fas','Form'); api.avlas('tryck','Tryck'); api.avlas('krock','Krockar mot kolven');
    api.slider({id:'temp',etikett:'Temperatur',min:-40,max:200,steg:5,varde:20,fmt:v=>v+' °C',vid:v=>{T=v;kolla();}});
    api.slider({id:'kolv',etikett:'Kolven – hur stor plats ämnet får',min:VMIN,max:VMAX,steg:5,varde:100,
      fmt:v=>v+' %',vid:v=>{ V=v; kolla(true); }});
    api.peka('temp');
    api.hint(['Titta på termometern längst till vänster medan du drar.','Vatten blir is när det är kallare än noll grader.','Dra reglaget Temperatur till minus tjugo grader.']);

    function kolla(frankolven){
      const f=fas(), p=tryck(), kokv=tkok(p);

      /* stegen */
      if(f==='fast'&&!api.gjort(0)){ api.peka('temp');
        const t0='Nu sitter partiklarna fast på sina platser och bara skakar lite. Det är is. Ju kallare det är, desto långsammare rör sig atomerna.';
        api.tips(t0,true); api.klar(0,t0);
        api.hint(['Nu ska isen bli vattenånga i stället.','Vatten kokar vid hundra grader när trycket är en atmosfär.','Dra reglaget Temperatur till hundra femtio grader.']); }
      else if(f==='gas'&&api.gjort(0)&&!api.gjort(1)){ api.peka('kolv');
        const t1='Nu flyger partiklarna fritt och fyller hela cylindern. Det är vattenånga. Samma vattenånga finns i bubblorna när vatten kokar. Hög temperatur betyder att atomerna rör sig snabbt.';
        api.tips(t1,true); api.klar(1,t1);
        api.hint(['Nu ska du klämma ihop vattenångan med kolven.','Mindre plats ger fler krockar mot kolven, och fler krockar betyder högre tryck.','Dra reglaget Kolven till trettio procent.']); }
      else if(f==='gas'&&p>=3&&api.gjort(1)&&!api.gjort(2)){ api.peka('temp');
        const t2='Över tre atmosfärer. Titta på kokpunkten. Den har flyttat sig långt över hundra grader.';
        api.tips(t2,true); api.klar(2,t2);
        api.hint(['Vattenångan blir vatten igen om trycket blir högre än vad ångan klarar. Det kallas kondensation.','Ställ temperaturen på 110 grader och minska sedan plats med kolven.','Dra Temperatur till 110 grader och Kolven till 60 procent.']); }
      else if(f==='flytande'&&T>100&&api.gjort(2)&&!api.gjort(3)){
        const t3='Där! Vatten som är varmare än hundra grader men ändå flytande. Det är precis vad som händer i en tryckkokare.';
        api.tips(t3,true); api.klar(3,t3); }

      /* återkoppling på kolven, så länge det finns steg kvar */
      else if(frankolven&&!api.gjort(3)){
        if(f!=='gas'&&tarStopp()){ stoppBlink=1.1;
          api.tips('Kolven tar stopp mot '+(f==='fast'?'isen':'vattnet')+'. Partiklarna ligger redan tätt, så nästan ingenting ger med sig – och då rusar trycket i höjden.'); }
        else if(foreFas==='gas'&&f==='flytande'){
          api.tips('Vattenångan blev vatten igen, bara för att du tryckte ihop den. Det kallas kondensation. Trycket blev högre än ångan klarar vid '+heltal(T)+' grader.'); }
        else if(foreFas==='flytande'&&f==='gas'){
          api.tips('Vattnet kokade utan att du värmde det! Du gav det mer plats, trycket sjönk, och då räcker '+heltal(T)+' grader för att koka.'); }
        else if(f==='gas'){
          api.tips('Trycket är '+dec(p,1)+' atmosfärer. Vid det trycket kokar vatten först vid '+heltal(kokv)+' grader.',true); }
        else{
          api.tips('Kolven glider ner mot ytan. Ovanför '+(f==='fast'?'isen':'vattnet')+' finns bara vattenånga och luft.',true); }
      }
      foreFas=f;
    }

    function formIkon(c,x,y,w,h,typ,pa){
      G.rund(c,x,y,w,h,6,'#0B121B',pa?AK:'rgba(163,179,197,.3)',pa?2:1);
      const fg=fFarg(typ);
      if(typ==='fast'){for(let i=0;i<9;i++)G.klot(c,x+14+(i%3)*16,y+12+Math.floor(i/3)*11,4,fg);}
      else if(typ==='flytande'){for(let i=0;i<9;i++)G.klot(c,x+11+(i%3)*17+(i%2)*4,y+17+Math.floor(i/3)*10,4,fg);}
      else{for(let i=0;i<7;i++)G.klot(c,x+10+(i*17)%(w-20),y+9+(i*23)%(h-18),4,fg);}
    }
    /* temperatur till y-läge på termometern */
    const tempY=x=>CHB-10-((clamp(x,-40,200)+40)/240)*(CHB-CHT-30);

    return {rita(c,t,dt){
      const f=fas(),H=hoger(),fart=Math.sqrt((T+273.15)/293),tr=tryck(),lg=lugn(),gas=f==='gas';
      const kokv=tkok(tr), stopp=tarStopp(), visFart=f==='fast'?0:fart*(gas?4:1);
      stoppBlink=Math.max(0,stoppBlink-dt);
      ur+=dt; if(ur>.2){ur=0;serie.push(tr); if(serie.length>56)serie.shift();}
      krockUr+=dt; if(krockUr>=.5){ const takt=krockar/krockUr;
        krockTakt += (takt-krockTakt)*(krockTakt?.45:1); krockar=0; krockUr=0; }

      G.scen(c,{topp:'#070C12',botten:'#16222F',rutnat:32,vinjett:true});
      G.golv(c,GOLV,{farg:'#1F2E3D',djup:'#0B121B',linjer:true});
      G.skugga(c,(X0+H)/2,GOLV,(H-X0)/2+40,13,.55);
      const hf=T>=kokv?'#FF7A7A':T<=0?'#7CC6FE':'#FFD166';
      G.glod(c,(X0+H)/2,CHB+14,116,hf,clamp(Math.abs(T-20)/150,.12,.85));
      G.metall(c,X0-16,CHB+4,H-X0+30,14,4,{ljus:'#DCE7F0',mork:'#6B7C8F'});
      G.text(c,T<=0?'Kylplatta':'Värmeplatta',X0-8,CHB+15,{font:F_LITEN,f:'#0B121B',skugga:false});

      const bana=new Path2D(); bana.rect(X0-7,CHT-7,H-X0+14,CHB-CHT+14); G.glas(c,bana);

      const yttre=egenHoger();
      for(const q of P){
        if(f==='fast'){
          const a=(lg?.4:1)*(.5+(T+40)/60);
          q.x+=(Math.min(q.hx,H-14)-q.x)*.2; q.y+=(q.hy-q.y)*.2;
          q.dx=Math.sin(t*22+q.hx)*a; q.dy=Math.cos(t*18+q.hy)*a;
        }else{
          const s=(gas?200:55)*fart*(lg?.45:1);
          const hx1=gas ? H-9 : Math.min(H-9, yttre-9);   // vätskan behåller sin volym
          const l=Math.hypot(q.vx,q.vy)||1; q.vx/=l; q.vy/=l;
          q.x+=q.vx*s*dt; q.y+=q.vy*s*dt; q.dx=0; q.dy=0;
          const yta=gas?CHT+9:CHB-112;
          if(!gas){q.vy+=.9*dt; if(q.y<yta){q.y=yta;q.vy=Math.abs(q.vy);}}
          if(q.x<X0+9){q.x=X0+9;q.vx=Math.abs(q.vx);}
          if(q.x>hx1){q.x=hx1;q.vx=-Math.abs(q.vx);
            if(gas||stopp){ krockar++;
              if(!lg&&Math.random()<.5)gn.skapa({x:hx1+4,y:q.y,vx:slump(-55,-14),vy:slump(-22,22),liv:.26,r:2,farg:'#FFD166',gravitation:0}); } }
          if(q.y<CHT+9){q.y=CHT+9;q.vy=Math.abs(q.vy);}
          if(q.y>CHB-9){q.y=CHB-9;q.vy=-Math.abs(q.vy);}
          if(Math.random()<.02){q.vx+=slump(-.6,.6);q.vy+=slump(-.6,.6);}
        }
        G.klot(c,q.x+q.dx,q.y+q.dy,7,fFarg(f));
      }
      gn.uppdatera(dt); gn.rita(c);

      G.rund(c,X0-7,CHT-7,H-X0+14,CHB-CHT+14,9,null,tr>=3?'#7BD389':'rgba(220,231,240,.6)',3);

      /* kolven */
      if(stopp) G.glod(c,H+7,MID,46,'#FF7A7A',.55+stoppBlink*.5);
      G.metall(c,H,CHT-2,14,CHB-CHT+4,3,
        stopp?{ljus:'#FFC9C9',mork:'#B45A5A'}:{ljus:'#DCE7F0',mork:'#6B7C8F'});
      const rorSlut=Math.min(H+150,600);
      if(rorSlut>H+30){
        G.ror(c,[[H+14,MID],[rorSlut,MID]],13,'#A3B3C5');
        G.metall(c,rorSlut,MID-16,22,32,5,{ljus:'#DCE7F0',mork:'#6B7C8F'});
        G.text(c,'Kolv',H+26,MID-12,{f:'#DCE7F0'});
      }

      /* termometer med kokpunktsmarkering */
      const ty=tempY(T), ky=tempY(kokv);
      const rr=new Path2D(); rr.rect(18,CHT,22,CHB-CHT); G.glas(c,rr);
      G.rund(c,23,ty,12,CHB-8-ty,6,hf);
      G.rund(c,18,CHT,22,CHB-CHT,11,null,'rgba(220,231,240,.5)',2);
      G.glod(c,29,CHB+2,20,hf,.55); G.cirkel(c,29,CHB+2,13,hf);
      for(let i=0;i<=6;i++){const yy=CHB-10-(i/6)*(CHB-CHT-30); G.linje(c,41,yy,48,yy,'rgba(163,179,197,.55)',1);}
      if(kokv<200){
        G.linje(c,14,ky,52,ky,'#FF7A7A',2,[5,3]);
        G.text(c,'kokar',56,ky-3,{font:F_LITEN,f:'#FF7A7A'});
        G.text(c,heltal(kokv)+'°',56,ky+11,{font:F_LITEN,f:'#FF7A7A'});
      }

      G.matband(c,X0,CHB+32,H,heltal(Vef())+' % plats',AK);
      G.callout(c,X0+52,CHT+22,fNamn(f),{till:[X0+52,CHT+52],farg:fFarg(f)});
      if(stopp) G.callout(c,Math.min(H-64,520),CHB-22,'KOLVEN TAR STOPP',{till:[H-2,MID+40],farg:'#FF7A7A'});
      else if(f==='flytande'&&T>100) G.callout(c,X0+96,CHB-22,'VATTEN ÖVER 100 °C',{till:[X0+60,CHB-60],farg:'#FFC95C'});

      G.bricka(c,412,88,216,82,{titel:'Tre former',farg:AK});
      formIkon(c,420,110,60,44,'fast',f==='fast');
      formIkon(c,492,110,60,44,'flytande',f==='flytande');
      formIkon(c,564,110,60,44,'gas',gas);
      G.text(c,'Fast',450,168,{a:'center',f:f==='fast'?IS:'#A3B3C5'});
      G.text(c,'Flytande',522,168,{a:'center',f:f==='flytande'?VAT:'#A3B3C5'});
      G.text(c,'Gas',594,168,{a:'center',f:gas?ANG:'#A3B3C5'});
      G.graf(c,412,212,216,86,serie,{min:0,max:Math.max(5,Math.ceil(tr)+1),farg:AK,titel:'Tryck i atmosfärer'});

      G.bricka(c,16,BY,150,BH,{titel:'Temperatur',farg:AK});
      G.digit(c,heltal(T)+' °C',30,BY+46,{farg:'#9FF0FF',storlek:22});
      G.bricka(c,180,BY,150,BH,{titel:'Kokpunkt just nu',farg:'#FF7A7A'});
      G.digit(c,heltal(kokv)+' °C',194,BY+40,{farg:'#FF9E9E',storlek:20});
      G.text(c,kokv>101?'högre än normalt':kokv<99?'lägre än normalt':'normalt',194,BY+56,{font:F_LITEN,f:'#9DAFC4'});
      G.bricka(c,344,BY,140,BH,{titel:'Tryck',farg:stopp?'#FF7A7A':AK});
      G.digit(c,dec(tr,1)+' atm',356,BY+40,{farg:tr>=3?(stopp?'#FF7A7A':'#7BD389'):'#9FF0FF',storlek:19});
      G.stapel(c,356,BY+48,112,9,clamp(tr/6,0,1),tr>=3?(stopp?'#FF7A7A':'#7BD389'):AK,{bakgrund:'#0B121B'});
      G.bricka(c,498,BY,130,BH,{titel:'Krockar mot kolven',farg:AK});
      G.digit(c,f==='fast'?'–':heltal(krockTakt)+'/s',510,BY+40,{farg:'#9FF0FF',storlek:19});
      G.stapel(c,510,BY+48,104,9,clamp(krockTakt/90,0,1),'#FFD166',{bakgrund:'#0B121B'});

      api.satt('temp',heltal(T)+' °C');
      api.satt('kok',heltal(kokv)+' °C');
      api.satt('fas',fNamn(f).toLowerCase());
      api.satt('tryck',dec(tr,1)+' atm'+(stopp?' – kolven bottnar':''));
      api.satt('krock',f==='fast'?'inga, partiklarna sitter fast':heltal(krockTakt)+' per sekund');
    }};
  }
};

// Rum 1 – Materia och tryck: densitet avgör om något flyter eller sjunker.
EXP.densitet={
  namn:'Flyta eller sjunka',
  intro:'Du står vid ett vattenlabb. Vågen visar massan i gram. Mätglaset visar volymen i kubikcentimeter. Densitet, eller täthet, är massa delat med volym. Välj ett föremål och en vätska, och se i akvariet vad som händer.',
  steg:['Hitta ett föremål som flyter i vatten.','Hitta föremålet som flyter i vatten men sjunker i tändvätska.','Hitta föremålet som sjunker i vatten men flyter i saltvatten.'],

    'Ett föremål flyter när dess densitet är lägre än vätskans. Ett stålfartyg flyter, eftersom fartyget med all luft inuti har lägre densitet än vatten.'],
  bygg(api){

      is:{n:'Is',d:.92,v:20,f:'#CFEFFF',typ:'block'},

      alu:{n:'Aluminium',d:2.7,v:10,f:'#C7CED6',typ:'metall',l:'#E8EFF6',m:'#78828E'},
      jarn:{n:'Järn',d:7.8,v:10,f:'#8D97A3',typ:'metall',l:'#BAC5CF',m:'#49545F'},
      bly:{n:'Bly',d:11.3,v:8,f:'#7F8A96',typ:'metall',l:'#A9B4C0',m:'#4A545F'},

    const VATS={

      salt:{n:'Saltvatten',d:1.2,f:'rgba(120,220,210,.46)',k:'#5CE1E6'},
      kvick:{n:'Kvicksilver',d:13.6,f:'rgba(200,210,222,.62)',k:'#DCE4EC'}};
    const fd=d=>dec(d,d>=10?1:2);
    const andel=d=>Math.sqrt(clamp(d/MAXD,0,1));
    let sak='jarn',vats='vatten',oy=YT,plask=1,bub=0;
    const par=new G.Partiklar({max:110});
    const stl=()=>Math.cbrt(SAK[sak].v)*13;
    const flyt=()=>SAK[sak].d<VATS[vats].d;
    const mal=()=>{const s=stl();return flyt()?YT-s*(1-SAK[sak].d/VATS[vats].d):BB-8-s;};
    api.avlas('m','Massa'); api.avlas('v','Volym');
    api.avlas('rho','Densitet'); api.avlas('res','I vätskan');
    api.val({id:'sak',etikett:'Föremål',varde:sak,alt:Object.keys(SAK).map(k=>[k,SAK[k].n]),

    api.val({id:'vats',etikett:'Vätska i akvariet',varde:vats,
      alt:Object.keys(VATS).map(k=>[k,VATS[k].n+' '+fd(VATS[k].d)]),

    function nasta(){

        api.hint(['Salt gör vattnet tätare.',
          'Ett ägg sjunker i vanligt vatten men flyter i saltvatten.',
          'Välj Ägg som föremål och sedan Saltvatten som vätska.']); }
      else api.peka(null);

    function kolla(){

        api.tips('Ägget flyter i saltvatten. Saltet ger vätskan högre densitet än ägget.'); }
      else api.tips(o.n+' har densiteten '+fd(o.d)+'. '+vt.n+' har '+fd(vt.d)+
        '. Därför '+(f?'flyter':'sjunker')+' det.',true);
      nasta();
    }
    function ritaSak(c,x,yb,s){
      const o=SAK[sak];
      if(o.typ==='agg'){ c.save(); c.translate(x,yb-s/2); c.scale(1,1.2); G.klot(c,0,0,s/2,o.f); c.restore(); }
      else if(o.typ==='metall') G.metall(c,x-s/2,yb-s,s,s,4,{ljus:o.l,mork:o.m,vinkel:1});

    }
    nasta();
    return {rita(c,t,dt){
      const o=SAK[sak],vt=VATS[vats],f=flyt(),s=stl(),massa=o.d*o.v,lg=lugn();
      const rf=f?'#7BD389':'#FF7A7A';
      oy+=(mal()-oy)*Math.min(1,dt*3.2);
      const ox=BX+BW/2, oyy=oy+(f&&!lg?Math.sin(t*1.8)*1.7:0);
      G.scen(c,{topp:'#070C12',botten:'#16222F',rutnat:32,vinjett:true});

      G.rekt(c,BX,YT,BW,BB-YT,vt.f);

      ritaSak(c,ox,oyy+s,s);
      c.save(); c.globalAlpha=.5; G.rekt(c,BX,YT,BW,BB-YT,vt.f); c.restore();
      bub+=dt;
      if(!lg&&bub>.1){ bub=0; par.skapa({x:slump(BX+16,BX+BW-16),y:BB-10,vx:slump(-5,5),
        vy:slump(-30,-16),liv:slump(1.4,2.6),r:slump(1.2,2.6),farg:'rgba(226,244,255,.75)',gravitation:-5}); }
      if(plask){ plask=0; if(!lg) for(let i=0;i<16;i++) par.skapa({x:ox+slump(-30,30),y:YT-3,
        vx:slump(-80,80),vy:slump(-140,-50),liv:slump(.4,.85),r:slump(1.4,3),farg:vt.k,gravitation:300}); }
      par.uppdatera(lg?dt*.3:dt); par.rita(c);
      G.vag(c,{x0:BX+2,x1:BX+BW-2,y:YT,amplitud:lg?0:2.2,vaglangd:96,fas:t*2,farg:vt.k,bredd:2.5,glod:10});
      G.glas(c,[[BX,BT],[BX,BB],[BX+BW,BB],[BX+BW,BT]],{hx:BX,hy:BT});
      G.rund(c,BX,BT,BW,BB-BT,6,null,rf,2.5);
      G.rund(c,ox-s/2-6,oyy-6,s+12,s+12,9,null,rf,2);
      G.etikett(c,vt.n+' med densitet '+fd(vt.d),ox,BT-8,{f:vt.k,font:F_LITEN});
      G.callout(c,BX+72,YT-14,f?'FLYTER':'SJUNKER',{till:[ox,oyy+s/2],farg:rf});
      /* mätglaset */
      const niva=N0-o.v*1.1;
      G.skugga(c,GX+GW/2,GB+7,GW/2+12,9,.5);
      G.rekt(c,GX+2,niva,GW-4,GB-2-niva,'rgba(92,184,255,.45)');
      ritaSak(c,GX+GW/2,GB-6,Math.min(GW-18,s*.72));
      G.linje(c,GX-6,N0,GX+GW+6,N0,'#FFD166',1.5,[5,4]);
      for(let i=0;i<=7;i++){ const yy=GB-8-i*18; G.linje(c,GX+GW-16,yy,GX+GW-3,yy,'rgba(220,231,240,.5)',1); }
      G.glas(c,[[GX,GT],[GX,GB],[GX+GW,GB],[GX+GW,GT]],{hx:GX,hy:GT});
      G.text(c,'Mätglas',GX+GW/2,GT-10,{a:'center',font:F_LITEN,f:'#A3B3C5'});
      G.digit(c,'+'+o.v+' cm³',GX+GW/2,niva-9,{farg:'#FFD166',storlek:14,a:'center'});
      G.matband(c,GX,GB+22,GX+GW,o.v+' cm³',AK);
      /* vågen */
      const wx=84;
      G.skugga(c,wx,GOLV+6,74,10,.5);
      G.ror(c,[[wx+54,GOLV-6],[138,GOLV+20],[GX-14,GOLV+20]],5,'#2A3C4F');
      G.metall(c,wx-62,GOLV-14,124,14,4,{ljus:'#DCE7F0',mork:'#6B7C8F'});
      G.metall(c,wx-11,GOLV-30,22,16,3,{ljus:'#C8D5E2',mork:'#6B7C8F'});
      G.metall(c,wx-58,GOLV-42,116,12,5,{ljus:'#E4ECF4',mork:'#7D8B9B'});
      ritaSak(c,wx,GOLV-42,s*.62);
      G.text(c,'Vågen mäter massan',wx,GOLV+42,{a:'center',font:F_LITEN,f:'#A3B3C5'});
      /* staplarna: föremålets densitet mot vätskans */
      G.text(c,'Densitet (täthet) = massa delat med volym',S0,319,{font:F_LITEN,f:'#A3B3C5'});
      G.stapel(c,S0,326,SW,12,andel(o.d),rf,{etikett:'Föremål '+fd(o.d),bakgrund:'#0B121B'});
      G.stapel(c,S0,344,SW,12,andel(vt.d),vt.k,{etikett:'Vätska '+fd(vt.d),bakgrund:'#0B121B'});
      const lx=S0+andel(vt.d)*SW;
      G.linje(c,lx,322,lx,358,'#FFD166',1.5,[4,3]);
      /* instrumentpanelen */
      G.bricka(c,16,6,148,62,{titel:'Massa',farg:AK});
      G.digit(c,dec(massa,1)+' g',90,52,{farg:'#9FF0FF',storlek:21,a:'center'});
      G.bricka(c,172,6,148,62,{titel:'Volym',farg:AK});
      G.digit(c,o.v+' cm³',246,52,{farg:'#9FF0FF',storlek:21,a:'center'});
      G.bricka(c,328,6,148,62,{titel:'Densitet',farg:AK});
      G.digit(c,fd(o.d)+' g/cm³',402,52,{farg:rf,storlek:18,a:'center'});

      G.digit(c,f?'FLYTER':'SJUNKER',558,52,{farg:rf,storlek:19,a:'center'});
      api.satt('m',dec(massa,1)+' g'); api.satt('v',o.v+' cm³');

      api.satt('res',f?'flyter':'sjunker');
    }};
  }
};

// Rum 1 – Materia och tryck: tryck är kraft delat med area.
EXP.snotryck={
  namn:'Tryck i snön',
  intro:'Stina står i djup snö. Hennes tyngd är en kraft, och 100 gram dras ner med 1 newton. Tryck är kraft delat med area. Snön här håller för högst 2 000 pascal. Byt skor och ändra massan, och se hur djupt hon sjunker.',
  steg:['Ta på klackskorna och se hur djupt hon sjunker.','Hitta skorna där hon inte sjunker alls.','Öka vikten tills hon sjunker även med skidorna.'],
  fraga:['Varför sjunker man mindre med skidor?',
    ['Tyngden sprids ut över större yta, så trycket blir lägre','Skidorna gör att man väger mindre, så trycket minskar','Skidorna är glatta, så man sjunker inte lika djupt','Man trycker med mindre kraft när man står stilla'],
    'Tryck är kraft delat med area. Skidorna sprider samma tyngd på en mycket större yta, så trycket blir mycket mindre.'],
  bygg(api){
    const AK=api.farg,YT=252,PX=448,PW=180,GRANS=2000,HX=170,POL=300;
    const SKOR={klack:{n:'Klackskor',a:.002},sneak:{n:'Sneakers',a:.04},
      snosko:{n:'Snöskor',a:.3},skidor:{n:'Skidor',a:.35}};
    const ORD=['klack','sneak','snosko','skidor'];
    let sko='sneak',massa=50,djup=0,serie=[],sn=0,gt=0;
    const flingor=new G.Partiklar({max:120});
    const F=()=>massa*10, A=()=>SKOR[sko].a, p=()=>F()/A();      // 10 newton per kilogram, som i lärarens häfte
    const bredd=()=>clamp(A()*700,8,220);
    const andel=v=>clamp(Math.log10(Math.max(v,200)/200)/Math.log10(2000),0,1);
    api.avlas('F','Tyngd'); api.avlas('A','Yta mot snön');
    api.avlas('p','Tryck'); api.avlas('d','Sjunker');
    api.val({id:'sko',etikett:'Skor',varde:sko,alt:ORD.map(k=>[k,SKOR[k].n]),vid:v=>{sko=v;kolla();}});
    api.slider({id:'massa',etikett:'Personens massa',min:30,max:100,steg:5,varde:massa,
      fmt:v=>v+' kg',vid:v=>{massa=v;kolla();}});
    function nasta(){
      if(!api.gjort(0)){ api.peka('sko');
        api.hint(['Börja med skorna som har allra minst yta mot snön.',
          'Klackarna är pyttesmå. Hela tyngden hamnar på dem.',
          'Tryck på Klackskor i raden Skor.']); }
      else if(!api.gjort(1)){ api.peka('sko');
        api.hint(['Stor yta ger litet tryck.',
          'Trycket måste ner till högst två tusen pascal.',
          'Tryck på Skidor i raden Skor och låt massan vara femtio kilo.']); }
      else if(!api.gjort(2)){ api.peka('massa');
        api.hint(['Behåll skidorna. Ändra i stället vikten.',
          'Mer tyngd på samma yta ger högre tryck.',
          'Dra reglaget Personens massa till åttio kilo.']); }
      else api.peka(null);
    }
    function kolla(){
      const pr=p();
      if(sko==='klack'&&!api.gjort(0)){ api.klar(0);
        api.tips('Klackarna har pytteliten yta. Trycket blir enormt och hon sjunker djupt ner.'); }
      else if(pr<=GRANS&&!api.gjort(1)){ api.klar(1);
        api.tips('Nu bär snön. Tyngden är utspridd på stor yta, så trycket blev litet.'); }
      else if(sko==='skidor'&&pr>GRANS&&!api.gjort(2)){ api.klar(2);
        api.tips('Nu blev tyngden för stor. Samma yta men större kraft ger högre tryck.'); }
      else api.tips(SKOR[sko].n+' ger '+heltal(pr)+' pascal. Gränsen är 2 000 pascal. '+
        (pr>GRANS?'Hon sjunker.':'Snön bär.'),true);
      nasta();
    }
    function utrustning(c,x,y,br){
      if(sko==='skidor'){ G.rund(c,x-br/2,y-9,br,10,5,'#FF7A7A','#8E3B3B',1.5);
        G.rund(c,x-br/2+8,y-8,br-16,3,2,'rgba(255,255,255,.55)'); }
      else if(sko==='snosko'){ G.cirkel(c,x-br/4,y-7,br/4,'rgba(124,198,254,.28)',AK,3);
        G.cirkel(c,x+br/4,y-7,br/4,'rgba(124,198,254,.28)',AK,3); }
      else if(sko==='sneak'){ G.rund(c,x-17,y-10,16,10,5,'#EEF3F7'); G.rund(c,x+1,y-10,16,10,5,'#EEF3F7'); }
      else { G.poly(c,[[x-14,y-13],[x-4,y-13],[x-4,y],[x-7,y]],'#FF7EB6');
        G.poly(c,[[x+4,y-13],[x+14,y-13],[x+10,y],[x+7,y]],'#FF7EB6'); }
    }
    nasta();
    return {rita(c,t,dt){
      const pr=p(),br=bredd(),lg=lugn(),sjunk=pr>GRANS,rf=sjunk?'#FF7A7A':'#7BD389';
      const mal=sjunk?clamp(10+Math.log10(pr/GRANS)*28,0,78):0;
      djup+=(mal-djup)*Math.min(1,dt*3.4);
      const fy=YT+djup, cm=djup/70*60, hw=Math.max(br+20,86), sk=1.15+(massa-50)/170;
      gt+=dt; if(gt>.25){ gt=0; serie.push(pr); if(serie.length>44) serie.shift(); }
      G.scen(c,{topp:'#0B1220',botten:'#28405C',stjarnor:.55,vinjett:true});
      G.glod(c,392,68,58,'#DCE7F0',.7); G.klot(c,392,68,16,'#DCE7F0');
      [[34,.8],[404,1],[436,.65]].forEach(function(g){ const tx=g[0],ts=g[1];
        G.skugga(c,tx,YT+4,26*ts,7,.4);
        G.rekt(c,tx-3,YT-16*ts,6,16*ts,'#3A2E24');
        G.poly(c,[[tx,YT-78*ts],[tx-24*ts,YT-13*ts],[tx+24*ts,YT-13*ts]],'#17362E');
        G.poly(c,[[tx,YT-60*ts],[tx-19*ts,YT-24*ts],[tx+19*ts,YT-24*ts]],'#22493E'); });
      G.golv(c,YT,{farg:'#A9C1D4',djup:'#EAF3FA',kant:'rgba(110,150,190,.55)',linjer:true});
      G.rund(c,0,YT-10,132,26,13,'#EAF3FA'); G.rund(c,516,YT-8,120,22,11,'#EAF3FA');
      /* gropen i snön */
      if(djup>1) G.rund(c,HX-hw/2,YT,hw,djup+12,10,'#93AEC4');
      /* mätsticka som visar djupet */
      G.metall(c,POL-4,YT-96,8,152,2,{ljus:'#DCE7F0',mork:'#6B7C8F'});
      for(let i=0;i<=6;i++){ const yy=YT+i*11.6;
        G.linje(c,POL+4,yy,POL+(i%2?10:16),yy,'rgba(30,55,80,.75)',1.3); }
      G.rund(c,POL-12,YT+djup-2,24,5,2,rf);
      /* personen */

      G.person(c,HX,fy-6,sk,'#16222F');
      G.rund(c,HX-10*sk,fy-6-75*sk,20*sk,9*sk,4,AK);

      if(djup>1) G.rund(c,HX-hw/2,YT-4,hw,9,4,'#F4FAFF');
      /* trycket mot snön syns som en färgad platta */
      G.glod(c,HX,fy+2,br/2+18,rf,.6);
      G.rund(c,HX-br/2,fy,br,6,3,rf);
      G.matband(c,HX-br/2,fy+20,HX+br/2,dec(A(),3)+' m²',AK);
      /* tyngden som pil */
      const len=34+massa*.78;
      G.pil(c,236,YT-150,236,YT-150+len,'#FFD166',4);
      G.etikett(c,'Tyngd '+heltal(F())+' N',236,YT-158,{f:'#FFD166',font:F_LITEN});
      G.callout(c,362,YT-70,djup>1?'Sjunker '+heltal(cm)+' cm':'Sjunker inte alls',
        {till:[POL,YT+Math.max(djup,3)],farg:rf});
      /* snöfall */
      sn+=dt;
      if(!lg&&sn>.05){ sn=0; flingor.skapa({x:slump(0,CW),y:-4,vx:slump(-14,14),vy:slump(38,66),
        liv:slump(4.5,7),r:slump(1,2.4),farg:'rgba(255,255,255,.85)',gravitation:3,blekna:false}); }
      flingor.uppdatera(lg?dt*.25:dt); flingor.rita(c);
      /* mätstationen */
      G.skugga(c,425,YT+34,22,6,.45);
      G.metall(c,410,YT+16,30,18,4,{ljus:'#DCE7F0',mork:'#6B7C8F'});
      G.ror(c,[[425,YT+18],[436,YT+40],[PX+6,YT+54]],4,'#2A3C4F');
      G.bricka(c,PX,10,PW,78,{titel:'TRYCK PÅ SNÖN',farg:rf});
      G.digit(c,heltal(pr)+' Pa',PX+PW/2,48,{farg:rf,storlek:20,a:'center'});
      G.stapel(c,PX+14,60,PW-28,10,andel(pr),rf,{bakgrund:'#0B121B'});
      const g1=PX+14+andel(GRANS)*(PW-28);

/* Gungbrädan – en hävstång. Lärarens ord: vridpunkt, hävarm, vridmoment = kraft · hävarm i newtonmeter (Nm).
   Förenkling: brädan väger ingenting. Tyngd = massa · 10 N/kg, så 30 kg är 300 N (lärarens exempel: 20 kg = 200 N). */
EXP.havstang={
  namn:'Gungbrädan',
  intro:'En gungbräda är en hävstång. Den vrids runt vridpunkten, och avståndet dit är hävarmen. Vridmomentet är kraft gånger hävarm och ska vara lika stort på båda sidor. Brädan väger ingenting.',
  steg:['Få gungbrädan i balans.','Hitta ett annat sätt att få balans.','Få balans med den största massan, 60 kg.'],
  fraga:['Var ska en tung person sitta för att väga upp en lätt person?',
    ['Nära vridpunkten, med kort hävarm','Långt från vridpunkten, med lång hävarm','Lika långt ut som den lätta personen','Det spelar ingen roll var personen sitter'],
    'Vridmomentet är kraft gånger hävarm. Den tunga personen har stor kraft och behöver en kort hävarm. Samma sak med en kofot: ett långt skaft ger stort vridmoment.'],
  bygg(api){
    const AK=api.farg, CX=316, CY=206, SK=58, GOLV=300, BL='#7CC6FE', OR='#FF8A5B', GRN='#6FD68A';
    const VM=30, VD=2, vanster=VM*10*VD;          // 300 N · 2 m = 600 Nm
    let mR=15, dR=1, vinkel=0, blink=0;
    const losn=new Set();
    const LOSN=[[15,4],[20,3],[60,1],[30,2]];          // alla fyra sätt att få 600 Nm
    const damm=new G.Partiklar({max:40});
    const hoger=()=>mR*10*dR;                      // Nm
    const balans=()=>hoger()===vanster;
    const nm=v=>heltal(v);

    api.avlas('v','Vänster sida'); api.avlas('h','Höger sida'); api.avlas('l','Läge'); api.avlas('n','Lösningar hittade');
    api.val({id:'m',etikett:'Massa på höger sida',varde:mR,alt:[10,15,20,30,60].map(v=>[v,v+' kg']),vid:v=>{mR=+v;kolla();}});
    api.val({id:'d',etikett:'Hävarm på höger sida',varde:dR,alt:[1,2,3,4].map(v=>[v,v+' m']),vid:v=>{dR=+v;kolla();}});
    api.peka('m');
    api.hint([
      'Vänster sida: 300 N gånger 2 m blir 600 newtonmeter. Höger sida måste också bli 600 newtonmeter.',
      'Vilken kraft gånger vilken hävarm blir 600 newtonmeter? Testa 300 N och 2 m. Det är massan 30 kg.',
      'Välj 30 kg och 2 m. Då står brädan still.'
    ]);

    function kolla(){
      if(balans()){
        const k=mR+'@'+dR, ny=!losn.has(k);
        losn.add(k); blink=1.2;
        api.klar(0);
        if(losn.size>=2) api.klar(1);
        if(mR===60&&api.gjort(1)) api.klar(2);
        if(!api.gjort(1)){ const [m,d]=LOSN.find(([mm,dd])=>!losn.has(mm+'@'+dd))||[15,4];
          api.hint(['Det finns fler kombinationer som ger 600 newtonmeter.','Testa en lättare massa längre ut, eller en tyngre massa närmare mitten.','Välj '+m+' kg och '+d+' m. Då är kraften '+(m*10)+' N, och '+(m*10)+' gånger '+d+' är också 600 newtonmeter.']); }
        else if(!api.gjort(2)) api.hint(['Nu den största massan.','60 kg är 600 N. Vilken hävarm ger 600 newtonmeter med 600 N?','Välj 60 kg och 1 m.']);
        api.tips(ny? 'Balans! '+(mR*10)+' N gånger '+dR+' m blir '+hoger()+' newtonmeter, precis som 300 N gånger 2 m.'
                   : 'Balans, men den lösningen har du redan hittat. Testa en annan kombination.');
        api.peka(losn.size<2?'d':'m');
      } else {
        api.tips(hoger()<vanster
          ? 'Vänster sida har större vridmoment. Flytta ut vikten eller välj en större massa.'
          : 'Höger sida har större vridmoment. Flytta in vikten eller välj en mindre massa.', true);
      }
      api.satt('n',losn.size+' av 4');
    }
    kolla();

    return {rita(c,t,dt){
      const bal=balans(), lg=lugn();
      blink=Math.max(0,blink-dt);
      const mal=clamp((hoger()-vanster)*.00055,-.28,.28);
      vinkel += (mal-vinkel)*Math.min(1,dt*3.2);
      const cs=Math.cos(vinkel), sn=Math.sin(vinkel);
      const pt=(m,off)=>[CX+m*SK*cs-off*sn, CY+m*SK*sn+off*cs];     // punkt på brädan (m från mitten, off under brädan)

      G.scen(c,{topp:'#132133',botten:'#20364B',stjarnor:0,rutnat:34,vinjett:true});
      G.golv(c,GOLV,{farg:'#233A2A',djup:'#2E4A33',kant:'rgba(150,200,160,.35)',linjer:false});
      G.glod(c,570,100,70,'#FFC95C',.3);
      G.cirkel(c,570,100,16,'#FFE39B');

      /* stativet */
      G.skugga(c,CX,GOLV+4,74,12,.55);
      G.poly(c,[[CX,CY+4],[CX-36,GOLV],[CX+36,GOLV]],'#6B7C8F','#98A7B6',2);
      G.poly(c,[[CX,CY+4],[CX-36,GOLV],[CX-14,GOLV]],'rgba(255,255,255,.12)');

      /* brädan med skala i meter */
      c.save(); c.translate(CX,CY); c.rotate(vinkel);
      G.metall(c,-272,-10,544,20,7,{ljus:'#E8D2A8',mork:'#B58554'});
      for(let d=-4;d<=4;d++){
        if(!d) continue;
        G.linje(c,d*SK,-10,d*SK,-2,'rgba(60,40,20,.8)',2);
        G.text(c,Math.abs(d)+' m',d*SK,8,{a:'center',font:F_LITEN,f:'#3A2814',skugga:false});
      }
      /* hävarmarna som färgade streck under brädan */
      G.linje(c,0,17,-VD*SK,17,BL,4); G.linje(c,-VD*SK,11,-VD*SK,23,BL,2.5);
      G.linje(c,0,17,dR*SK,17,OR,4);  G.linje(c,dR*SK,11,dR*SK,23,OR,2.5);

      /* barnet till vänster */
      c.save(); c.translate(-VD*SK,-10); c.rotate(-vinkel);
      G.skugga(c,0,2,22,5,.4);
      G.person(c,0,0,.92,BL);
      G.text(c,'30 kg = 300 N',0,-76,{a:'center',f:BL,font:F_LITEN});
      c.restore();

      /* vikten till höger */
      c.save(); c.translate(dR*SK,-10); c.rotate(-vinkel);
      const s=18+Math.sqrt(mR)*5.4;
      G.skugga(c,0,2,s*.7,5,.4);
      G.metall(c,-s/2,-s,s,s,5,{ljus:'#FFB98F',mork:'#B45A2A'});
      G.rund(c,-s/6,-s-9,s/3,11,4,null,'#FFB98F',3);
      G.text(c,mR+' kg = '+(mR*10)+' N',0,-s-16,{a:'center',f:OR,font:F_LITEN});
      c.restore();
      c.restore();

      /* vridpunkten */
      G.cirkel(c,CX,CY,7,'#0B121B','#EEF3F7',2);
      G.linje(c,CX-3.5,CY-3.5,CX+3.5,CY+3.5,'#FF6B8A',2); G.linje(c,CX+3.5,CY-3.5,CX-3.5,CY+3.5,'#FF6B8A',2);

      /* hävarmsetiketter under brädan */
      const pl=pt(-VD,36), pr=pt(dR,36);
      G.etikett(c,'hävarm '+VD+' m',pl[0],pl[1],{f:BL,kant:BL,font:F_LITEN});
      G.etikett(c,'hävarm '+dR+' m',pr[0],pr[1],{f:OR,kant:OR,font:F_LITEN});

      /* dammpuff när änden slår i */
      if(!lg && Math.abs(vinkel)>.24 && Math.random()<.25){
        const x=CX+(vinkel>0?250:-250);
        damm.skapa({x,y:GOLV-6,vx:slump(-30,30),vy:slump(-40,-10),liv:.7,r:slump(2,5),farg:'rgba(180,200,215,.5)',gravitation:40});
      }
      damm.uppdatera(dt); damm.rita(c);

      /* rutor överst: vridmoment per sida */
      G.bricka(c,10,6,206,70,{titel:'VÄNSTER SIDA',farg:BL});
      G.text(c,'300 N · '+VD+' m',113,38,{a:'center',font:F_MONO,f:'#DCE7F0',skugga:false});
      G.digit(c,nm(vanster)+' Nm',113,64,{farg:BL,storlek:20,a:'center'});
      G.bricka(c,424,6,206,70,{titel:'HÖGER SIDA',farg:OR});
      G.text(c,(mR*10)+' N · '+dR+' m',527,38,{a:'center',font:F_MONO,f:'#DCE7F0',skugga:false});
      G.digit(c,nm(hoger())+' Nm',527,64,{farg:OR,storlek:20,a:'center'});
      G.bricka(c,226,6,188,70,{titel:'LÄGE',farg:bal?GRN:AK});
      G.digit(c,bal?'BALANS':'OBALANS',320,44,{farg:bal?GRN:'#FF8080',storlek:19,a:'center'});
      G.digit(c,losn.size+' av 4 sätt',320,66,{farg:'#9FF0FF',storlek:13,a:'center'});
      if(bal&&blink>0&&!lg) G.glod(c,320,40,60,GRN,blink*.7);

      G.callout(c,CX,GOLV+24,'vridpunkt',{till:[CX,CY+8],farg:'#FF6B8A'});
      const txt = bal ? 'Balans! Lika stort vridmoment på båda sidor.' : hoger()<vanster ? 'Vänster sida har större vridmoment.' : 'Höger sida har större vridmoment.';
      G.etikett(c,txt,CX,350,{f:'#EEF3F7',kant:bal?GRN:'#FFC95C',font:F_BROD});

      api.satt('v',nm(vanster)+' Nm');
      api.satt('h',(mR*10)+' N · '+dR+' m = '+nm(hoger())+' Nm');
      api.satt('l',bal?'balans':'obalans');
    }};
  }
};
EXP.fartkoll={
  namn:'Fartkontrollen',
  intro:'Du är polis vid en fartkontroll. Klockan startar när bilen passerar den första linjen och stannar vid den andra. Fart är sträcka delat med tid. Meter per sekund gånger tre komma sex ger kilometer i timmen. Här får man köra högst femtio.',
  steg:['Skicka fram en bil och döm farten rätt.','Döm en annan bil rätt.','Byt mätsträcka till hundra meter och döm en bil rätt.'],
  fraga:['Hur räknar man ut hastighet?',
    ['Sträckan delat med tiden','Tiden delat med sträckan','Sträckan gånger tiden','Massan gånger tiden'],
    'Hastighet är sträckan delat med tiden. Femtio meter på fyra sekunder blir tolv komma fem meter per sekund, och det är fyrtiofem kilometer i timmen. Samma tid på dubbelt så lång sträcka betyder dubbelt så hög fart. Därför mäter polisen alltid både sträckan och tiden.'],
  bygg(api){
    const L1=150,L2=520,GRANS=50,AK=api.farg,GY=200,VY=210,BY=300,STOPP=578;
    const FARGER=['#B69CFF','#5CB8FF','#FF7EB6','#FFD166'];
    const KO={50:blanda([72,60,45,36,30]),100:blanda([90,72,60,45])};
    const N={50:0,100:0};
    const HS=['Klockan startar när bilen passerar den första linjen.',
      'Du behöver både sträckan och tiden för att veta farten.',
      'Tryck på knappen Skicka fram nästa bil och titta sedan på klockan.'];
    const HL=['Nu ska du mäta på en längre sträcka.',
      'Samma tid på dubbelt så lång sträcka betyder dubbelt så hög fart.',
      'Tryck på hundra meter under Mätsträcka. Skicka sedan fram en bil.'];
    const par=new G.Partiklar({max:140});
    let strecka=50,bil=null,ratt=0,blink=0,damm=0;
    api.avlas('s','Sträcka'); api.avlas('t','Tid mellan linjerna');
    api.avlas('v','Hastighet'); api.avlas('r','Rätt bedömda');
    api.val({id:'strecka',etikett:'Mätsträcka mellan linjerna',varde:50,
      alt:[[50,'50 meter'],[100,'100 meter']],vid:v=>{ strecka=v;
        api.tips('Nästa bil mäts på '+heltal(v)+' meter.',true); nasta(); }});
    api.knapp({id:'skicka',text:'🚙 Skicka fram nästa bil',primar:true,vid:()=>{
      if(bil&&bil.fram&&!bil.svarat){ api.tips('Döm den här bilen först.',true); api.peka('dom'); return; }
      if(bil&&!bil.fram){ api.tips('En bil är redan på väg.',true); return; }
      const lista=KO[strecka], kmh=lista[N[strecka]%lista.length]; N[strecka]++;
      bil={s:strecka,tid:strecka/(kmh/3.6),x:44,klocka:0,fram:false,svarat:false,farg:valj(FARGER)};
      dom.set('',true); api.satt('v','?'); api.peka(null);
      api.tips('Bilen kommer. Klockan startar vid den första linjen.',true);
    }});
    const dom=api.val({id:'dom',etikett:'Din bedömning',varde:'',
      alt:[['fort','🚨 För fort'],['lag','👍 Laglig fart']],vid:v=>svara(v==='fort')});
    function nasta(){
      if(api.gjort(0)&&api.gjort(1)&&api.gjort(2)) return;
      if(api.gjort(0)&&api.gjort(1)&&strecka!==100){ api.peka('strecka'); api.hint(HL); }
      else { api.peka('skicka'); api.hint(HS); }
    }
    function anlant(){
      const gr=dec(bil.s/(GRANS/3.6),1);
      api.satt('t',dec(bil.tid,1)+' s'); api.peka('dom');
      api.hint(['Ta sträckan delat med tiden. Det blir meter per sekund.',
        'Meter per sekund gånger tre komma sex ger kilometer i timmen.',
        'På '+heltal(bil.s)+' meter är '+gr+' sekunder precis femtio kilometer i timmen. Kortare tid betyder för fort.']);
      api.tips('Bilen körde '+heltal(bil.s)+' meter på '+dec(bil.tid,1)+' sekunder. Körde den för fort?');
    }
    function svara(sagt){
      if(!bil||!bil.fram){ dom.set('',true); api.tips('Vänta tills bilen har passerat den andra linjen.',true); return; }
      if(bil.svarat){ dom.set('',true); api.tips('Den bilen är redan dömd. Skicka fram nästa bil.',true); return; }
      bil.svarat=true; blink=1;
      bil.ms=bil.s/bil.tid; bil.kmh=bil.ms*3.6; bil.fort=bil.kmh>GRANS; bil.ok=sagt===bil.fort;
      api.satt('v',heltal(bil.kmh)+' km/h');
      const rakn=heltal(bil.s)+' meter delat med '+dec(bil.tid,1)+' sekunder är '+dec(bil.ms,1)+
        ' meter per sekund. Gånger tre komma sex blir '+heltal(bil.kmh)+' kilometer i timmen.';
      for(let i=0;i<(bil.ok?26:10);i++) par.skapa({x:bil.x,y:262,vx:slump(-70,70),vy:slump(-175,-40),
        liv:slump(.4,.75),r:slump(2,3.6),farg:bil.ok?valj(['#7BD389','#FFD166','#9FF0FF']):'#FF7A7A',gravitation:240});
      if(bil.ok){ ratt++;
        const kvar=api.gjort(0)&&api.gjort(1);
        if(!api.gjort(0)) api.klar(0);
        else if(!api.gjort(1)) api.klar(1);
        else if(bil.s===100) api.klar(2);
        api.tips('Rätt! '+rakn+(bil.fort?' Mer än femtio. Bilen körde för fort.':' Högst femtio. Bilen körde lagligt.')+
          (kvar&&bil.s!==100?' Nu återstår att mäta på hundra meter.':''));
      } else api.tips('Inte riktigt. '+rakn+(bil.fort?' Mer än femtio är för fort.':' Högst femtio är lagligt.')+' Skicka fram en ny bil och försök igen.');
      dom.set('',true); nasta();
    }
    nasta(); api.tips('Tryck på Skicka fram nästa bil när du är redo.',true);
    return {rita(c,t,dt){
      const lg=lugn(), puls=lg?0:Math.sin(t*4), akt=bil&&!bil.svarat?bil.s:strecka;

        if(!bil.fram){ bil.x+=pxs*dt;
          if(bil.x>=L1) bil.klocka=clamp((bil.x-L1)/pxs,0,bil.tid);
          if(bil.x>=L2){ bil.x=L2; bil.fram=true; bil.klocka=bil.tid; anlant(); }
        } else bil.x+=(STOPP-bil.x)*Math.min(1,dt*2.4);

      blink=Math.max(0,blink-dt*1.6);
      G.scen(c,{topp:'#070C12',botten:'#16222F',stjarnor:.45,vinjett:true});
      G.golv(c,GY,{farg:'#0D1622',djup:'#1B2836',linjer:true});
      G.rekt(c,0,VY,CW,BY-VY,'#26333F');
      G.linje(c,0,VY,CW,VY,'rgba(220,231,240,.35)',2);
      G.linje(c,0,BY-1,CW,BY-1,'rgba(220,231,240,.2)',2);
      for(let x=8;x<CW;x+=48) G.rekt(c,x,251,Math.min(26,CW-x),5,'rgba(238,243,247,.4)');
      [{x:L1,pa:!!(bil&&bil.x>=L1),n:'Startlinje'},{x:L2,pa:!!(bil&&bil.fram),n:'Mållinje'}].forEach(s=>{
        const f=s.pa?'#7BD389':'#FFD166';
        G.rekt(c,s.x-3,VY,6,BY-VY,f);
        G.skugga(c,s.x,VY-3,15,5,.55);
        G.metall(c,s.x-7,172,14,34,4,{ljus:'#DCE7F0',mork:'#6B7C8F'});
        G.glod(c,s.x,170,15+(s.pa?4+puls*3:0),f,s.pa?1:.45);
        G.cirkel(c,s.x,170,5,f);
        G.callout(c,s.x,152,s.n,{till:[s.x,164],farg:f});
      });
      G.matband(c,L1,230,L2,heltal(akt)+' meter',AK);
      G.skugga(c,58,VY-2,20,6,.55);
      G.person(c,58,VY-4,.62,'#DCE7F0');

      if(upp&&b.tot&&api.gjort(1)&&!api.gjort(2)){fardig(2,'Totalreflektion. Allt ljus studsar tillbaka in i ämnet. Så skickas ljus genom fiberoptiska kablar.');}

    return {rita(c,t,dt){

      G.skugga(c,(TV+TH)/2,TB+6,(TH-TV)/2,10,.6);
      G.rekt(c,TV,Y,TH-TV,TB-Y,mf);
      if(!lg){bub+=d; if(bub>.22){bub=0;par.skapa({x:slump(TV+20,TH-20),y:TB-6,vx:slump(-5,5),vy:slump(-26,-12),liv:slump(1.2,2.6),r:slump(1,2.6),farg:mk,gravitation:0});}}
      par.uppdatera(lg?0:d); par.rita(c);
      G.vag(c,{x0:TV,x1:TH,y:Y,amplitud:lg?0:1.6,våglängd:52,vaglangd:52,fas:t*1.2,färg:mk,farg:mk,bredd:2,glöd:.6,glod:.6});
      G.poly(c,[[TV,Y-30],[TH,Y-30],[TH,TB],[TV,TB]],null,mk,2);
      G.rekt(c,TV,Y-30,7,TB-Y+30,'rgba(220,240,255,.12)');
      G.rekt(c,TH-7,Y-30,7,TB-Y+30,'rgba(220,240,255,.12)');
      G.text(c,'LUFT',20,32,{f:'#A3B3C5',font:F_RUB});
      G.etikett(c,mn.toUpperCase(),14,TB-44,{a:'left',f:mk,font:F_RUB});
      G.etikett(c,'optisk täthet n = '+dec(b.n,2),14,TB-18,{a:'left',f:'#DCE7F0',font:F_BROD});
      G.linje(c,X,26,X,TB-8,'rgba(255,255,255,.5)',2,[8,6]);
      const stral=(x1,y1,x2,y2,al,br)=>{c.save();c.globalAlpha=al;c.shadowColor=A;c.shadowBlur=14;
        G.linje(c,x1,y1,x2,y2,'#FFE9A6',br||5);c.restore();};
      stral(sx,sy,X,Y,1,5);
      G.pil(c,(sx+X)/2-Math.sin(a)*14,(sy+Y)/2+dir*Math.cos(a)*14,(sx+X)/2,(sy+Y)/2,'#FFE9A6',3);
      stral(X,Y,X+Math.sin(a)*L,sy,b.tot?1:.2,b.tot?5:3);
      if(!b.tot){const rr=b.r*Math.PI/180;stral(X,Y,X+Math.sin(rr)*L*1.15,Y-dir*Math.cos(rr)*L*1.15,1,5);}
      G.glod(c,X,Y,26,'#FFE9A6',.9);
      c.save(); c.strokeStyle=A; c.lineWidth=2; c.beginPath();
      if(!upp)c.arc(X,Y,52,-Math.PI/2-a,-Math.PI/2); else c.arc(X,Y,52,Math.PI/2,Math.PI/2+a);
      c.stroke(); c.restore();
      const plat=(x,y,s,f)=>{const w=s.length*9+16;G.rund(c,x-w/2,y-12,w,24,7,'rgba(7,12,18,.88)',f,1.2);
        G.text(c,s,x,y+5,{a:'center',f:f,font:F_MONO});};
      plat(X-Math.sin(a/2)*76,Y+dir*Math.cos(a/2)*76,vin+'°',A);
      if(!b.tot){const rr=b.r*Math.PI/180;
        c.save(); c.strokeStyle='#5CE1E6'; c.lineWidth=2; c.beginPath();
        if(!upp)c.arc(X,Y,78,Math.PI/2-rr,Math.PI/2); else c.arc(X,Y,78,-Math.PI/2,-Math.PI/2+rr);
        c.stroke(); c.restore();
        plat(X+Math.sin(rr/2)*102,Y-dir*Math.cos(rr/2)*102,dec(b.r,0)+'°','#5CE1E6');
      }
      G.callout(c,X+16,26,'Normal',{till:[X,64],farg:'#A3B3C5'});
      if(b.tot)G.callout(c,60,Y+66,'TOTALREFLEKTION',{till:[X+Math.sin(a)*L*.6,Y+Math.cos(a)*L*.6],farg:A});
      if(upp&&!b.tot)G.callout(c,40,Y+72,'Över '+dec(gv,0)+' grader kommer inget ut',{till:[X-20,Y+30],farg:'#A3B3C5'});
      const serie=[]; for(let i=0;i<=80;i+=4){const q=Math.sin(i*Math.PI/180),sr=upp?q*b.n:q/b.n;
        serie.push(sr>1?90:Math.asin(sr)*180/Math.PI);}
      G.bricka(c,446,10,182,126,{titel:'MÄTVÄRDEN',farg:A});
      G.text(c,'Infallsvinkel',458,50,{f:'#A3B3C5',font:F_LITEN});
      G.digit(c,vin+'°',458,76,{farg:'#9FF0FF',storlek:24});
      G.text(c,'Brytningsvinkel',458,100,{f:'#A3B3C5',font:F_LITEN});
      G.digit(c,b.tot?'ingen':dec(b.r,0)+'°',458,126,{farg:b.tot?'#FF7A7A':'#9FF0FF',storlek:24});
      G.graf(c,446,146,182,96,serie,{min:0,max:90,farg:A,titel:'Brytning vid 0–80°',nolllinje:false});
      G.stapel(c,446,254,182,16,1/b.n,'#5CE1E6',{etikett:'Ljusets fart i ämnet',bakgrund:'#16222F'});
      for(let i=0;i<3;i++){const gj=api.gjort(i),bx=446+i*62;
        G.rund(c,bx,286,54,26,7,gj?'rgba(123,211,137,.22)':'rgba(42,60,79,.55)',gj?'#7BD389':'#2A3C4F',1.5);
        G.text(c,gj?'klart':String(i+1),bx+27,303,{a:'center',f:gj?'#7BD389':'#A3B3C5',font:F_LITEN});}
      if(klar)G.rund(c,2,2,CW-4,CH-4,14,null,'#7BD389',3);
      api.satt('i',vin+'°'); api.satt('r',b.tot?'ingen, allt studsar':dec(b.r,0)+'°');
      api.satt('n',dec(b.n,2)); api.satt('fart',heltal(Math.round(300000/b.n))+' km/s');
    }};
  }
};

// Rum 3 – Ljus och optik: prismat delar vitt ljus, och färgat ljus blandas.
/* Station: Prisma och färgat ljus (canvas). Fyra lägen: Prisma, Blanda ljus, Regnbåge, Tröjor. Stegen 1–4 gäller Prisma och Blanda ljus.
   Fysik: prismats strålgång räknas med brytningslagen (vektorform) för sju våglängder, glas med apexvinkel 60 grader.
   Glaset sprider färgerna extra mycket (n = 1,52 för rött och 1,60 för violett) så att spektrumet syns tydligt. Spektrumets bredd mäts på en skärm vinkelrätt mot
   lampans stråle. När prismat vrids ändras både hur mycket ljuset böjs och hur brett spektrumet blir. Bredden är störst i den ena änden av reglaget, minst i mitten och ökar svagt igen i andra änden.
   Regnbåge: en stråle genom en rund regndroppe (en inre reflektion), n = 1,331 för rött och 1,343 för violett, så rött lämnar droppen i 42 grader och violett i 41 grader. */
EXP.farger={
  namn:'Prisma och färgat ljus',
  intro:'Vitt ljus innehåller alla färger. Ett prisma av glas delar upp det i ett spektrum. Det här glaset sprider färgerna extra mycket, så att du ser dem tydligt. Sedan blandar du färgat ljus med tre lampor. Du kan också prova Regnbåge och Tröjor.',
  steg:['Tänd den vita lampan.','Vrid prismat tills spektrumet blir minst femton centimeter brett.','Byt till Blanda ljus och gör gult ljus med två lampor.','Tänd alla tre lamporna och få vitt ljus.'],
  fraga:['Vilken färg bryts mest i ett prisma?',
    ['Violett ljus bryts mest','Rött ljus bryts mest','Gult ljus bryts mest','Alla färger bryts lika mycket'],
    'Violett bryts mest och rött minst, så vitt ljus delas upp i ett spektrum. Samma sak händer i regndroppar, och då ser vi en regnbåge.'],
  bygg(api){
    const A=api.farg;
    /* ---------- gemensamt ---------- */
    const F=['#FF3B3B','#FF9A2E','#FFE14D','#7BD389','#5CB8FF','#5B5BFF','#B69CFF'];
    const LAM=[650,605,580,530,490,450,410];
    const MIX=['MÖRKT','BLÅTT','GRÖNT','CYAN','RÖTT','MAGENTA','GULT','VITT'];
    const MF=['#6B7C8F','#5CB8FF','#7BD389','#5CE1E6','#FF7A7A','#FF7EB6','#FFE14D','#FFFFFF'];
    const rad=a=>a*Math.PI/180;
    const dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
    // brytning i vektorform. N pekar mot den sida som strålen kommer från. Ger null vid totalreflektion.
    const bryt=(d,N,eta)=>{ const c=-dot(d,N), k=1-eta*eta*(1-c*c); if(k<0) return null;
      const f=eta*c-Math.sqrt(k); return [eta*d[0]+f*N[0], eta*d[1]+f*N[1]]; };
    let lage='prisma',tand=false,vin=16,troja='rod';
    const L={r:false,g:false,b:false};
    const damm=new G.Partiklar({max:70});
    const kod=()=>(L.r?4:0)+(L.g?2:0)+(L.b?1:0);

    /* ---------- prismat ---------- */
    const LY=100,PX=262,PY=128,SIDE=92,SX=450,SK=188/60;         // SK = bildpunkter per centimeter, 60 cm från prismat till skärmen
    const NR=1.52,NV=1.60, B=(NV-NR)/(1/(410*410)-1/(650*650)), N0=NR-B/(650*650);
    const NN=LAM.map(l=>N0+B/(l*l));
    const inkant=(a,b,cen)=>{ const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy); let n=[-dy/l,dx/l];
      const m=[(a[0]+b[0])/2,(a[1]+b[1])/2]; if((cen[0]-m[0])*n[0]+(cen[1]-m[1])*n[1]<0) n=[-n[0],-n[1]]; return n; };
    /* vin 0–32 grader ger infallsvinkel 40–72 grader mot prismats första sida. */
    function spar(v){
      const i=40+v, al=rad(i-30), h=SIDE*Math.sqrt(3)/2;
      const A3=[[0,-2*h/3],[-SIDE/2,h/3],[SIDE/2,h/3]].map(p=>[PX+p[0]*Math.cos(al)-p[1]*Math.sin(al), PY+p[0]*Math.sin(al)+p[1]*Math.cos(al)]);
      const a0=A3[0],a1=A3[1],a2=A3[2], cen=[(a0[0]+a1[0]+a2[0])/3,(a0[1]+a1[1]+a2[1])/3];
      const t=(LY-a0[1])/(a1[1]-a0[1]), E=[a0[0]+t*(a1[0]-a0[0]),LY];
      const N1=inkant(a0,a1,cen), N2=inkant(a0,a2,cen), ex=a2[0]-a0[0], ey=a2[1]-a0[1];
      const ut=[];
      for(let k=0;k<7;k++){
        const n=NN[k], d1=bryt([1,0],[-N1[0],-N1[1]],1/n);
        const det=d1[0]*(-ey)-d1[1]*(-ex), tt=((a0[0]-E[0])*(-ey)-(a0[1]-E[1])*(-ex))/det;
        const X=[E[0]+tt*d1[0],E[1]+tt*d1[1]], d2=bryt(d1,N2,n);
        if(!d2) return {ok:false};
        ut.push({X:X,ys:X[1]+(SX-X[0])*d2[1]/d2[0],ang:Math.atan2(d2[1],d2[0])*180/Math.PI});
      }
      return {ok:true,A3:A3,E:E,ut:ut,yr:ut[0].ys,yv:ut[6].ys,bredd:(ut[6].ys-ut[0].ys)/SK,bojs:ut[3].ang};
    }
    const BREDDMAL=15;
    const bredd=()=>spar(vin).bredd;

    /* ---------- regndroppen ---------- */
    const DX=300,DY=188,DR=74,DB=.86;
    function droppe(nr){
      const y0=DY-DB*DR, S=[DX-DR*2.2,y0], P1=[DX-Math.sqrt(DR*DR-(DB*DR)*(DB*DR)),y0];
      const N1=[(P1[0]-DX)/DR,(P1[1]-DY)/DR], d1=bryt([1,0],N1,1/nr);
      const t1=-2*dot(d1,[P1[0]-DX,P1[1]-DY]), P2=[P1[0]+t1*d1[0],P1[1]+t1*d1[1]];
      const N2=[(P2[0]-DX)/DR,(P2[1]-DY)/DR], d2=[d1[0]-2*dot(d1,N2)*N2[0], d1[1]-2*dot(d1,N2)*N2[1]];
      const t2=-2*dot(d2,[P2[0]-DX,P2[1]-DY]), P3=[P2[0]+t2*d2[0],P2[1]+t2*d2[1]];
      const N3=[(P3[0]-DX)/DR,(P3[1]-DY)/DR], d3=bryt(d2,[-N3[0],-N3[1]],nr);
      return {S:S,P1:P1,P2:P2,P3:P3,d3:d3,ang:Math.atan2(d3[1],-d3[0])*180/Math.PI};
    }
    const DRR=droppe(1.331), DRV=droppe(1.343);

    /* ---------- tröjor ---------- */
    const TROJA={
      rod:{namn:'röd',neutr:'rött',fyll:'#D93A3A',ref:'r',tips:'Röd tröja: den reflekterar rött ljus och absorberar grönt och blått. Därför ser den röd ut.'},
      bla:{namn:'blå',neutr:'blått',fyll:'#2F6FE0',ref:'b',tips:'Blå tröja: den reflekterar blått ljus och absorberar rött och grönt. Därför ser den blå ut.'},
      vit:{namn:'vit',neutr:'vitt',fyll:'#F2F2F2',ref:'rgb',tips:'Vit tröja: den reflekterar alla färger, så den ser vit ut. Den absorberar lite, så den blir minst varm.'},
      svart:{namn:'svart',neutr:'svart',fyll:'#14171D',ref:'',tips:'Svart tröja: den absorberar alla färger. Inget ljus kommer tillbaka, så den ser svart ut. Därför blir den varmast, och därför är svart egentligen ingen färg.'}
    };
    const KFARG={r:'#FF5A5A',g:'#5BE08A',b:'#5C9CFF'}, KNAMN={r:'rött',g:'grönt',b:'blått'};
    const VARME={rod:.62,bla:.66,vit:.15,svart:.97};

    /* ---------- reglage ---------- */
    api.avlas('lage','Läge'); api.avlas('ljus','Ljuset');
    api.avlas('bredd','Spektrum brett'); api.avlas('farg','Färgen blir');
    api.val({id:'lage',etikett:'Läge',varde:'prisma',alt:[['prisma','Prisma'],['blanda','Blanda ljus'],['regnbage','Regnbåge'],['troja','Tröjor']],
      vid:v=>{lage=v;visa();kolla(true);}});
    const lk=api.knapp({id:'vit',text:'Tänd vit lampa',primar:true,
      vid:()=>{tand=!tand;lk.textContent=tand?'Släck vita lampan':'Tänd vit lampa';kolla();}});
    const vs=api.slider({id:'vinkel',etikett:'Vrid prismat',min:0,max:32,steg:2,varde:vin,
      fmt:v=>v+' grader',vid:v=>{vin=v;kolla();}});
    const kn={};
    [['r','Röd'],['g','Grön'],['b','Blå']].forEach(p=>{kn[p[0]]=api.knapp({id:'l'+p[0],text:p[1]+' lampa: av',
      vid:()=>{L[p[0]]=!L[p[0]];kn[p[0]].textContent=p[1]+' lampa: '+(L[p[0]]?'PÅ':'av');kolla();}});});
    const tv=api.val({id:'troja',etikett:'Tröja',varde:troja,alt:[['rod','Röd'],['bla','Blå'],['vit','Vit'],['svart','Svart']],
      vid:v=>{troja=v;kolla(true);}});

    function visa(){
      lk.classList.toggle('dold',lage!=='prisma');
      vs.el.closest('.ctl').classList.toggle('dold',lage!=='prisma');
      ['r','g','b'].forEach(k=>kn[k].classList.toggle('dold',lage!=='blanda'));
      tv.el.closest('.ctl').classList.toggle('dold',lage!=='troja');
    }
    const H0=['Optikbordet är mörkt tills du tänder lampan.','Knappen ligger först bland reglagen under bilden.','Tryck på knappen Tänd vit lampa.'];
    const H1=['Spektrumets bredd ändras när du vrider prismat.','Dra reglaget Vrid prismat åt vänster. Då blir spektrumet bredare.','Dra reglaget Vrid prismat till 0 grader.'];
    const H2=['Nu ska du blanda färgat ljus i stället.','Läget står högst upp bland reglagen.','Tryck på knappen Blanda ljus under rubriken Läge.'];
    /* Hjälp och pekning följer det steg som är på tur och det läge du står i. */
    const LN={r:'Röd lampa',g:'Grön lampa',b:'Blå lampa'};
    const lista=a=>a.length>1?a.slice(0,-1).join(', ')+' och '+a[a.length-1]:a[0];
    function uppdHint(){
      const n=[0,1,2,3].find(i=>!api.gjort(i));
      if(n===undefined){ api.peka(null); return; }
      const behov=n<2?'prisma':'blanda';
      if(lage!==behov){
        api.hint(n===2&&lage==='prisma'?H2:['Det här steget gör du i ett annat läge.','Läget väljer du högst upp bland reglagen.','Tryck på knappen '+(behov==='prisma'?'Prisma':'Blanda ljus')+' under rubriken Läge.']);
        api.peka('lage'); return; }
      if(n===0){ api.hint(H0); api.peka('vit'); }
      else if(n===1){ api.hint(H1); api.peka('vinkel'); }
      else if(n===2){
        if(L.b){ api.hint(['Gult ljus har ingen blå färg.','Släck den blå lampan.','Tryck på Blå lampa så att den släcks. Tänd sedan Röd lampa och Grön lampa.']); api.peka('lb'); }
        else { const sak=['r','g'].filter(k=>!L[k]);
          api.hint(['Gult ljus är två färger tillsammans.','Rött och grönt ljus ger gult.','Tryck på '+lista(sak.map(k=>LN[k]))+'.']); api.peka('l'+sak[0]); } }
      else { const sak=['r','g','b'].filter(k=>!L[k]);
        api.hint(['En färg till saknas för att det ska bli vitt.','Vitt ljus behöver alla tre grundfärgerna.','Tryck på '+lista(sak.map(k=>LN[k]))+' så att alla tre lamporna lyser.']); api.peka('l'+sak[0]); }
    }
    function kolla(byttLage){
      const p=lage==='prisma',n=kod();
      if(byttLage) uppdHint();
      if(byttLage&&lage==='regnbage'){
        api.tips('Regnbåge: solljuset bryts in i regndroppen, reflekteras på baksidan och bryts ut. Violett bryts mest, så rött kommer ut ytterst.'); return; }
      if(byttLage&&lage==='troja'){ api.tips(TROJA[troja].tips); return; }
      if(lage==='troja'){ api.tips(TROJA[troja].tips); return; }
      if(lage==='regnbage') return;
      if(p&&tand&&!api.gjort(0)){ api.klar(0,'Ljuset delas upp i regnbågens färger. Rött bryts minst och violett mest.');
        api.tips('Vitt ljus delas upp i regnbågens färger. Rött bryts minst och violett mest.',true); uppdHint(); }
      else if(p&&tand&&bredd()>=BREDDMAL&&api.gjort(0)&&!api.gjort(1)){ api.klar(1,'Spektrumet blev brett. Vrid åt andra hållet, så blir det smalare.');
        api.tips('Spektrumet blev brett. Vrid åt andra hållet, så blir det smalare.',true); uppdHint(); }
      else if(p&&!tand) api.tips('Lampan är släckt. Tryck på Tänd vit lampa.',true);
      else if(p&&tand&&!api.gjort(1)) api.tips('Spektrumet är '+heltal(bredd())+' cm brett. Det ska bli minst '+BREDDMAL+' cm.',true);
      else if(p&&tand) api.tips('Spektrumet är '+heltal(bredd())+' cm brett. Ljuset böjs olika mycket beroende på hur prismat står.',true);
      if(!p&&n===6&&!api.gjort(2)){ api.klar(2,'Rött ljus plus grönt ljus blir gult. Ögat ser ingen skillnad mot riktigt gult ljus.');
        api.tips('Rött ljus plus grönt ljus blir gult. Ögat ser ingen skillnad mot riktigt gult ljus.',true); uppdHint(); }
      else if(!p&&n===7&&api.gjort(2)&&!api.gjort(3)){
        api.tips('Rött, grönt och blått ljus tillsammans blir vitt. Precis så gör de små punkterna i en mobilskärm.',true);
        api.klar(3,'Rött, grönt och blått ljus tillsammans blir vitt. Precis så gör de små punkterna i en mobilskärm. Du kan också prova lägena Regnbåge och Tröjor.'); }
      else if(!p&&n===7) api.tips('Vitt redan. Ta stegen i ordning: släck blå lampan och gör gult först.',true);
      else if(!p&&n===5) api.tips('Rött plus blått blir magenta, en rosalila färg.',true);
      else if(!p&&n===3) api.tips('Grönt plus blått blir cyan, en turkos färg.',true);
      else if(!p&&n<2) api.tips('Tänd två lampor, röd och grön, så får du gult ljus.',true);
      uppdHint();
    }
    visa(); uppdHint();

    /* ---------- ritning: gemensamma delar ---------- */
    function oga(c,x,y,vander,lj){

    /* ---------- läge: blanda ljus ---------- */
    const LP={r:118,g:180,b:242},FF={r:'#E02020',g:'#18D018',b:'#2020F0'},RF={r:'#FF7A7A',g:'#7BD389',b:'#5CB8FF'};

    /* ---------- läge: tröjor ---------- */
    function trojaRita(c,t,d,lg){

      const heta=VARME[troja];

      // ljus in: tre färger (rött, grönt, blått) som tillsammans är vitt
      const ys={r:CY-34,g:CY,b:CY+34};

        c.save(); c.globalCompositeOperation='lighter'; G.linje(c,xs,y,xe,y,KFARG[k],4); c.restore();
        G.pil(c,xe-34,y,xe-14,y,KFARG[k],3);

    function panel(c){

      const T=[['LÄGE',lage==='prisma'?'PRISMA':lage==='blanda'?'BLANDA':lage==='regnbage'?'REGNBÅGE':'TRÖJOR',A,18]];

        T.push(['SPEKTRUM BRETT',tand?heltal(br)+' cm':'–',bra?'#7BD389':'#9FF0FF',19],['BRYTS MEST',tand?'VIOLETT':'–','#B69CFF',17],['BRYTS MINST',tand?'RÖTT':'–','#FF7A7A',18]); }
      else if(lage==='blanda'){ const bra=pa===3;
        T.push(['LAMPOR PÅ',pa+' av 3',bra?'#7BD389':'#9FF0FF',19],['FÄRGEN BLIR',MIX[n],MF[n],17],['LAMPOR',(L.r?'R':'·')+(L.g?'G':'·')+(L.b?'B':'·'),'#9FF0FF',18]); }

      else { const Tr=TROJA[troja]; T.push(['TRÖJAN',Tr.namn.toUpperCase(),'#9FF0FF',18],['REFLEKTERAR',Tr.ref?Tr.ref.split('').map(k=>KNAMN[k]).join(' + ').toUpperCase().replace('RÖTT + GRÖNT + BLÅTT','ALLT'):'INGET',KFARG[Tr.ref[0]]||'#9FF0FF',15],['DU SER',Tr.neutr.toUpperCase(),'#9FF0FF',17]); }

    }

    return {rita(c,t,dt){
      const lg=lugn(),d=dt||1/60,p=lage==='prisma',n=kod(),S=p?spar(vin):null;
      G.scen(c,{topp:'#070C12',botten:'#0E1621',rutnat:32,vinjett:true});
      if(p) prisma(c,t,d,lg); else if(lage==='blanda') blanda(c,t,d,lg); else if(lage==='regnbage') regnbage(c,t,d,lg); else trojaRita(c,t,d,lg);

      api.satt('lage',p?'prisma':lage==='blanda'?'blanda ljus':lage==='regnbage'?'regnbåge':'tröjor');

      api.satt('bredd',p&&tand?heltal(S.bredd)+' cm':'–');
      api.satt('farg',p?(tand?'regnbågens färger':'–'):lage==='blanda'?MIX[n].toLowerCase():lage==='regnbage'?'rött ytterst':TROJA[troja].namn);
    }};
  }
};
EXP.lins={
  namn:'Linsen och bilden',
  intro:'Du står vid en optisk bänk. Den konvexa linsen samlar ljuset i en brännpunkt, som också kallas fokus, tio centimeter från linsen. Flytta lampan och skärmen och se var bilden blir skarp.',
  steg:['Flytta skärmen tills bilden blir skarp. Lampan står tjugo centimeter bort.',
    'Flytta lampan till femton centimeter och gör bilden skarp igen.',
    'Dra lampan innanför brännpunkten och se förstoringsglaset.'],
  fraga:['Vad gör en konvex lins med parallella ljusstrålar?',
    ['Samlar dem i en brännpunkt, kallad fokus','Sprider ut dem så att de aldrig möts igen','Reflekterar dem tillbaka som en spegel gör','Absorberar dem så att de försvinner helt'],
    'En konvex lins är tjockast på mitten och bryter strålarna inåt, så att de möts i brännpunkten. Ögat, kameran och förstoringsglaset har konvexa linser.'],
  bygg(api){

    const scharpa=()=>a>f?clamp(1-Math.max(0,miss()-1)/8,0,1):0;

    api.avlas('a','Lampans avstånd'); api.avlas('b','Bilden hamnar');

    function nasta(){
      if(!api.gjort(0)){ api.peka(a>=16?'sk':'a');
        api.hint(['Bilden finns redan, men skärmen står på fel ställe.',
          'Med lampan tjugo centimeter bort hamnar bilden tjugo centimeter på andra sidan.',

      else if(!api.gjort(1)){ api.peka('a');
        api.hint(['Flytta lampan närmare linsen och se vad som händer med bilden.',
          'Närmare lampa ger en bild som hamnar längre bort och blir större.',
          'Dra Lampans avstånd till femton centimeter och Skärmens avstånd till trettio.']); }
      else if(!api.gjort(2)){ api.peka('a');
        api.hint(['Nu ska lampan innanför brännpunkten.','Brännvidden är tio centimeter, så gå närmare än så.',
          'Dra Lampans avstånd till nio centimeter.']); }
    }
    const fardig=(i,t)=>{ api.tips(t,true); api.klar(i,t); };
    function kolla(){
      const b=bild();
      if(a<f){
        if(!api.gjort(2)) fardig(2,'Innanför brännpunkten blir det ingen bild på skärmen. Men genom linsen ser du lampan förstorad och rättvänd. Det är ett förstoringsglas.');
        else api.tips('Innanför brännpunkten blir det ingen bild på skärmen. Men genom linsen ser du lampan förstorad och rättvänd. Det är ett förstoringsglas.',true);
      }
      else if(a===f) api.tips('Precis i brännpunkten går strålarna ut parallellt. Då möts de aldrig och det blir ingen bild.',true);
      else if(skarp()&&a>=16&&!api.gjort(0)){

EXP.skejt={
  namn:'Skejtrampen',

  steg:['Släpp skejtaren från sex meter utan friktion.','Slå på friktion och släpp igen.','Hitta en starthöjd som räcker ända fram även med friktion.'],

  fraga:['Varför räcker det inte med bara sol och vind alla timmar på dygnet?',
    ['De är beroende av vädret och av tiden på dygnet','De släpper ut för mycket koldioxid när de används','De ger radioaktivt avfall som är farligt länge','De tar slut efter några år och måste bytas'],
    'Sol och vind är förnybara och släpper inte ut koldioxid. Men de ger bara el när solen lyser och när det blåser. Därför behövs också kraftverk som kan ge el dygnet runt, som vattenkraft och kärnkraft. Energi kan också lagras till natten, i vattenmagasin eller i stora batterier.'],
  bygg(api){
    const K={
      vatten:{n:'Vattenkraft',kort:'Vatten',max:40,f:'#5CB8FF',rad:'Går att styra dygnet runt',
        info:'Vattenkraft är förnybar och går att styra. Men dammarna påverkar fiskar och natur i älvarna.'},
      karn:{n:'Kärnkraft',kort:'Kärnkraft',max:60,f:'#B69CFF',rad:'Stabil men ger radioaktivt avfall',
        info:'Kärnkraft ger mycket el och nästan ingen koldioxid. Men avfallet är radioaktivt i ungefär hundra tusen år.'},
      vind:{n:'Vindkraft',kort:'Vind',max:60,f:'#7BD389',rad:'Ger el bara när det blåser',
        info:'Vindkraft är förnybar och ren. Men den ger nästan ingen el när det är vindstilla.'},
      sol:{n:'Solkraft',kort:'Sol',max:60,f:'#FFD166',rad:'Ger ingen el på natten',
        info:'Solceller är förnybara och rena. Men på natten ger de ingen el alls.'},
      kol:{n:'Kolkraft',kort:'Kol',max:60,f:'#A3B3C5',rad:'Släpper ut koldioxid',
        info:'Kolkraft går att styra, men släpper ut mycket koldioxid som förstärker växthuseffekten.'}};
    const ord=['vatten','karn','vind','sol','kol'], XS={vatten:14,karn:94,vind:174,sol:254,kol:334}, MARK=270;
    const v={vatten:0,karn:0,vind:0,sol:0,kol:0};
    let dag=true,sist='sol',sagt=null,klock=0,glasOk=true;
    const P=new G.Partiklar({max:150}), serie=[0,0];
    const ut=k=>v[k]*(k==='vind'?(dag?1:.1):(k==='sol'?(dag?1:0):1));
    const prod=()=>ord.reduce((s,k)=>s+ut(k),0);
    const kab=u=>[24+u*446,150+u*16+Math.sin(u*Math.PI)*12];
    function glasa(c,pts){
      if(glasOk){ try{ const p=new Path2D(); p.moveTo(pts[0][0],pts[0][1]);
          for(let i=1;i<pts.length;i++)p.lineTo(pts[i][0],pts[i][1]);
          p.closePath(); G.glas(c,p); return; }catch(e){ glasOk=false; } }
      G.poly(c,pts,'rgba(220,231,240,.14)');
    }

    api.avlas('p','El till staden'); api.avlas('co2','Koldioxid');
    api.avlas('fn','Förnybar andel'); api.avlas('lage','Väder');
    api.val({id:'vader',etikett:'Väder',varde:'dag',alt:[['dag','Blåsig solig dag'],['natt','Vindstilla natt']],
      vid:x=>{ dag=x==='dag'; api.tips(dag?'Solen lyser och det blåser friskt.':'Mörkt och vindstilla. Nu ger solcellerna noll.'); kolla(); }});
    ord.forEach(k=>api.slider({id:k,etikett:K[k].n,min:0,max:K[k].max,steg:10,varde:0,fmt:x=>x+' enheter',
      vid:x=>{ const nyKalla=sagt!==k; v[k]=x; sist=sagt=k; api.tips(K[k].info,!nyKalla); kolla(); }}));

    function kolla(){ const p=prod();
      if(dag&&p>=100)api.klar(0);
      if(!dag&&p>=100&&api.gjort(0))api.klar(1);
      if(!dag&&p>=100&&v.kol===0&&api.gjort(1))api.klar(2);
      styr();
    }
    function styr(){
      if(!api.gjort(0)){
        api.hint(['Solen lyser och det blåser. Använd det.','Dra upp sol och vind tills mätaren visar hundra.','Ha Blåsig solig dag. Dra Solkraft till 60 och Vindkraft till 60 enheter.']);
        api.peka(!dag?'vader':(v.sol<60?'sol':'vind'));
      } else if(!api.gjort(1)){
        api.hint(['På natten ger solcellerna ingenting alls.','Byt till natt och använd kraftverk som alltid går.','Byt Väder till Vindstilla natt. Dra Kolkraft till 60 och Vattenkraft till 40 enheter.']);
        api.peka(dag?'vader':(v.kol<60?'kol':'vatten'));
      } else if(!api.gjort(2)){
        api.hint(['Kolkraften släpper ut koldioxid. Stäng av den.','Vattenkraft och kärnkraft kan ta över hela natten.','Ha Vindstilla natt. Dra Kolkraft till 0, Kärnkraft till 60 och Vattenkraft till 40 enheter.']);
        api.peka(v.kol>0?'kol':(v.karn<60?'karn':'vatten'));
      }
    }
    styr();

    return {rita(c,t,dt){
      const p=prod(), ok=p>=100, L=lugn(), tand=clamp(p/100,0,1);
      klock+=dt; if(klock>.25){ klock=0; serie.push(p); if(serie.length>72)serie.shift(); }

      G.scen(c,dag?{topp:'#2A3C4F',botten:'#5CB8FF',stjarnor:0,vinjett:true}
                 :{topp:'#070C12',botten:'#0E1621',stjarnor:.9,vinjett:true});
      if(dag){ G.glod(c,556,48,66,'#FFD166',.55); G.klot(c,556,48,20,'#FFD166'); }
      else { G.glod(c,556,48,48,'#DCE7F0',.28); G.klot(c,556,48,15,'#DCE7F0'); }
      G.golv(c,MARK,{farg:dag?'#2A3C4F':'#0E1621',djup:'#0A1119',linjer:true});

      ord.forEach(k=>{
        const x=XS[k], a=clamp(ut(k)/K[k].max,0,1), pa=v[k]>0;
        G.skugga(c,x+34,MARK+5,32,6,.4);
        c.globalAlpha=pa?1:.42;
        if(k==='vatten'){
          G.rund(c,x-2,214,34,56,3,'rgba(92,184,255,.35)');
          G.vag(c,{x0:x-2,x1:x+32,y:216,amplitud:2,våglängd:18,fas:L?0:t*2,färg:'#5CB8FF',bredd:2,glöd:.3});
          G.poly(c,[[x+32,204],[x+48,204],[x+52,270],[x+32,270]],'#2A3C4F','#DCE7F0',1.2);
          G.metall(c,x+50,242,20,28,3,{});
          if(pa)G.ror(c,[[x+44,230],[x+54,248],[x+58,266]],5,'rgba(92,184,255,.8)');
        } else if(k==='karn'){
          G.poly(c,[[x+4,270],[x+12,216],[x+8,200],[x+36,200],[x+32,216],[x+40,270]],'#2A3C4F','#A3B3C5',1.4);
          G.klot(c,x+56,256,14,'#2A3C4F');
          if(pa)G.glod(c,x+56,252,24,'#B69CFF',.5);
        } else if(k==='vind'){
          G.ror(c,[[x+30,270],[x+30,206]],5,'#DCE7F0');
          const rot=L?0:t*(dag?1.2+a*2.6:.18);
          for(let b=0;b<3;b++){ const an=rot+b*2.094;
            G.linje(c,x+30,204,x+30+Math.cos(an)*24,204+Math.sin(an)*24,'#EEF3F7',3.5); }
          G.cirkel(c,x+30,204,4,'#A3B3C5');
        } else if(k==='sol'){
          const pl=[[x+6,264],[x+60,264],[x+66,230],[x+12,230]];
          G.ror(c,[[x+20,270],[x+22,254]],4,'#2A3C4F'); G.ror(c,[[x+50,270],[x+52,254]],4,'#2A3C4F');
          G.poly(c,pl,'#1F2E3D','#A3B3C5',1.4);
          for(let i=1;i<4;i++)G.linje(c,x+6+i*14,264,x+12+i*14,230,'#2A3C4F',1);
          glasa(c,pl);
          if(pa&&dag)G.glod(c,x+38,246,26,'#FFD166',L?.3:.3+.12*vag(t,2));
        } else {
          G.metall(c,x+2,230,46,40,4,{});
          G.ror(c,[[x+34,236],[x+34,188]],10,'#2A3C4F');
          if(pa)G.glod(c,x+14,252,18,'#FF8A5B',.35);
        }
        c.globalAlpha=1;
        G.rund(c,x,278,68,28,5,'rgba(7,12,18,.55)');
        G.text(c,K[k].kort+' '+heltal(ut(k)),x+34,291,{a:'center',f:pa?'#EEF3F7':'#A3B3C5',font:F_BROD});
        G.stapel(c,x+6,295,56,8,a,K[k].f,{bakgrund:'rgba(255,255,255,.1)'});
      });

      if(!L&&v.kol>0&&Math.random()<dt*14)P.skapa({x:368+slump(-3,3),y:186,vx:slump(5,16),vy:slump(-24,-13),
        liv:slump(1.4,2.2),r:slump(3,6),farg:'rgba(163,179,197,.32)',gravitation:-7});
      if(!L&&v.karn>0&&Math.random()<dt*10)P.skapa({x:116+slump(-4,4),y:200,vx:slump(3,11),vy:slump(-20,-10),
        liv:slump(1.2,1.8),r:slump(3,6),farg:'rgba(238,243,247,.3)',gravitation:-9});
      if(!L&&v.vatten>0&&Math.random()<dt*22)P.skapa({x:72+slump(-2,2),y:264,vx:slump(6,20),vy:slump(-40,-14),
        liv:slump(.4,.7),r:slump(1,2),farg:'#5CB8FF',gravitation:220});
      P.uppdatera(dt); P.rita(c);

      const kp=[]; for(let u=0;u<=1.001;u+=.05)kp.push(kab(u));
      G.ror(c,kp,3,'#2A3C4F');
      const n=clamp(Math.ceil(p/12),0,9);
      for(let i=0;i<n;i++){ const u=((L?0:t*.18)+i/n)%1, q=kab(u);
        G.glod(c,q[0],q[1],9,api.farg,.5); G.cirkel(c,q[0],q[1],2.4,'#7BD389'); }
      G.rund(c,352,148,112,22,5,'rgba(7,12,18,.6)');
      G.text(c,'Elnät till staden',408,163,{a:'center',f:'#A3B3C5',font:F_BROD});

      G.skugga(c,528,274,102,7,.4);
      for(let i=0;i<6;i++){
        const bx=428+i*34, bh=52+((i*41)%68);
        G.rund(c,bx,MARK-bh,28,bh,2,dag?'#2A3C4F':'#16222F');
        for(let j=0;j*16+14<bh;j++)for(let q=0;q<2;q++){
          const niva=((i*7+j*3+q)%10)/10, blink=L?0:.05*Math.sin(t*5+i+j*2);
          G.rekt(c,bx+5+q*12,MARK-bh+8+j*16,8,9,niva<tand+blink?'#FFD166':(dag?'#1F2E3D':'#0A1119'));
        }
      }
      if(ok)G.glod(c,528,226,96,'#FFD166',.2);
      G.rund(c,446,120,166,26,6,ok?'rgba(123,211,137,.18)':'rgba(255,122,122,.18)',ok?'#7BD389':'#FF7A7A',1.5);
      G.text(c,ok?'STADEN HAR EL':'FÖR LITE EL',529,138,{a:'center',f:ok?'#7BD389':'#FF7A7A',font:F_RUB});

      G.callout(c,268,130,K[sist].rad,{till:[XS[sist]+34,sist==='kol'?188:210],farg:K[sist].f});

      G.bricka(c,12,8,250,96,{titel:'STADENS ELNÄT',farg:api.farg});
      G.digit(c,heltal(p)+' av 100',24,52,{farg:ok?'#9FF0FF':'#FF7A7A',storlek:22});
      G.stapel(c,24,62,224,14,clamp(p/150,0,1),ok?'#7BD389':'#FF7A7A',{bakgrund:'rgba(255,255,255,.1)'});
      G.linje(c,173,58,173,80,'#FFD166',1.5,[4,3]);
      G.text(c,'Behov 100',173,96,{a:'center',f:'#FFD166',font:F_BROD});
      G.graf(c,436,284,192,64,serie,{min:0,max:160,farg:api.farg,titel:'El över tid',nolllinje:true});
      if(ok)G.rund(c,3,3,634,354,12,'rgba(0,0,0,0)','#7BD389',3);

      api.satt('p',heltal(p)+' av 100 enheter');
      api.satt('co2',v.kol>=40?'mycket':(v.kol>0?'en del':'nästan ingen'));
      api.satt('fn',p>0?heltal(100*(ut('vatten')+ut('vind')+ut('sol'))/p)+' %':'–');
      api.satt('lage',dag?'Blåsig solig dag':'Vindstilla natt');
    }};
  }
};

EXP.ton={
  namn:'Tongeneratorn',
  intro:'Ljud är svängningar som sprids i luften. Frekvensen mäts i hertz och bestämmer om tonen låter ljus eller mörk. Amplituden bestämmer hur starkt det låter. Dra i reglagen och se hur vågen på skärmen ändrar sig.',
  steg:[
    'Gör en ljus och svag ton. Frekvens minst 1000 hertz och styrka högst 30 procent.',
    'Gör en mörk och stark ton. Frekvens högst 200 hertz och styrka minst 80 procent.',
    'Spela upp den mörka starka tonen.'
  ],
  fraga:['Vad avgör om en ton låter ljus eller mörk?',
    ['Frekvensen, alltså hur många svängningar ljudet gör varje sekund',
     'Amplituden, alltså hur stora svängningarna är i ljudvågen',
     'Ljudets fart, alltså hur fort ljudvågen rör sig genom luften',
     'Ljudnivån, alltså hur högt det låter när man lyssnar'],
    'Frekvensen räknar svängningar per sekund. Många svängningar ger en ljus ton, som en visselpipa. Få svängningar ger en mörk ton, som en bastrumma. Amplituden bestämmer i stället hur starkt det låter. Ett ungt, friskt öra hör ungefär 20 till 20 000 hertz.'],
  bygg(api){
    const F=api.farg, P=new G.Partiklar({max:80});
    let f=400, a=50, spelar=0, hjalpNyckel='';
    api.avlas('f','Frekvens'); api.avlas('ton','Tonhöjd');
    api.avlas('db','Ljudnivå'); api.avlas('vl','Våglängd i luft');
    api.slider({id:'f',etikett:'Frekvens',min:100,max:2000,steg:50,varde:f,fmt:v=>heltal(v)+' Hz',vid:v=>{f=v;kolla();}});
    api.slider({id:'a',etikett:'Styrka, alltså amplitud',min:10,max:100,steg:10,varde:a,fmt:v=>v+' %',vid:v=>{a=v;kolla();}});
    api.knapp({id:'spela',text:'Spela tonen',primar:true,vid:spela});
    leda(); api.tips('Dra i Frekvens och titta vad som händer med vågen.');

    function spela(){
      const x=api.ljudkontext();
      if(x){ try{
        const o=x.createOscillator(), g=x.createGain();
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(.0001,x.currentTime);
        g.gain.exponentialRampToValueAtTime(.02+a/100*.18,x.currentTime+.05);
        g.gain.exponentialRampToValueAtTime(.0001,x.currentTime+1.1);
        o.connect(g); g.connect(x.destination); o.start(); o.stop(x.currentTime+1.2);
      }catch(e){} }
      spelar=1.2;
      if(api.gjort(1)&&!api.gjort(2)){
        if(f<=200&&a>=80){ api.klar(2); api.tips('Hör du hur mörk och kraftig tonen är? Så låter en bastrumma.'); }
        else api.tips('Det här är inte den mörka starka tonen. Dra Frekvens till 200 hertz eller lägre och Styrka till 80 procent eller mer. Tryck sedan på Spela tonen igen.');
      }
      leda();
    }
    function kolla(){
      if(f>=1000&&a<=30&&!api.gjort(0)){ api.klar(0); api.tips('Ljus och svag ton klar. Gör nu tvärtom: mörk och stark.'); }
      if(f<=200&&a>=80&&api.gjort(0)&&!api.gjort(1)){ api.klar(1); api.tips('Mörk och stark ton klar. Tryck på knappen Spela tonen.'); }
      leda();
    }
    /* Hjälptrappan sätts om bara när läget ändras, så att "Mer hjälp" inte börjar om när du rör reglaget. */
    function leda(){
      let nyckel, peka, hjalp;
      if(!api.gjort(0)){ nyckel='0'; peka=f<1000?'f':'a';
        hjalp=['Ljus ton betyder många svängningar varje sekund. Svag ton betyder liten amplitud.',
          'Dra Frekvens åt höger och Styrka åt vänster.',
          'Dra Frekvens till 1000 hertz och dra Styrka till 30 procent.']; }
      else if(!api.gjort(1)){ nyckel='1'; peka=f>200?'f':'a';
        hjalp=['Mörk ton betyder få svängningar varje sekund. Stark ton betyder stor amplitud.',
          'Dra Frekvens åt vänster och Styrka åt höger.',
          'Dra Frekvens till 200 hertz och dra Styrka till 80 procent.']; }
      else if(f<=200&&a>=80){ nyckel='2'; peka='spela';
        hjalp=['Nu ska du få höra tonen du har byggt.','Knappen under reglagen spelar upp tonen.','Tryck på knappen Spela tonen.']; }
      else { nyckel='2b'; peka=f>200?'f':'a';
        hjalp=['Tonen är inte längre mörk och stark. Gör den så igen.','Dra Frekvens åt vänster och Styrka åt höger.',
          'Dra Frekvens till 200 hertz och dra Styrka till 80 procent. Tryck sedan på Spela tonen.']; }
      api.peka(peka);
      if(nyckel!==hjalpNyckel){ hjalpNyckel=nyckel; api.hint(hjalp); }
    }
    function mal(c,x,y,txt,ok){
      G.rund(c,x,y-16,182,26,13,ok?'rgba(123,211,137,.16)':'rgba(238,243,247,.05)',ok?'#7BD389':'rgba(238,243,247,.16)',1);

    }

    return {rita(c,t,dt){
      const dam=lugn()?.25:1;

      G.vag(c,{x0:x0,x1:x1,y:mid,amplitud:amp,'våglängd':vl,vaglangd:vl,fas:fas,
        'färg':F,farg:F,bredd:3,'glöd':spelar>0?1:.4,glod:spelar>0?1:.4});
      G.pil(c,44,mid,44,mid-amp,'#FFD166',2);

      if(vl>=54&&vl<=320) G.matband(c,212-vl/2,202,212+vl/2,'en våglängd','#5CE1E6');
      else G.text(c,vl>320?'Vågen är längre än skärmen':'Vågorna ligger mycket tätt',212,206,{a:'center',f:'#5CE1E6'});
      G.rund(c,26,40,376,174,6,'rgba(0,0,0,0)',traff?'#7BD389':'rgba(238,243,247,.12)',2);
      if(traff){ G.rund(c,292,46,104,24,12,'rgba(123,211,137,.2)','#7BD389',1);
        G.text(c,'MÅL KLART',344,63,{a:'center',f:'#7BD389'}); }

      G.bricka(c,420,14,204,136,{titel:'Mätvärden',farg:F});
      G.text(c,'Frekvens',432,58,{f:'#A3B3C5'});
      G.digit(c,heltal(f)+' Hz',432,82,{farg:'#9FF0FF',storlek:22});
      G.text(c,'Ljudnivå',432,106,{f:'#A3B3C5'});
      G.digit(c,db+' dB',540,106,{farg:'#9FF0FF',storlek:18});
      G.stapel(c,492,118,120,16,a/100,F,{etikett:'Styrka',bakgrund:'#0E1621'});

      G.metall(c,40,232,190,64,8,{ljus:'#A3B3C5',mork:'#1F2E3D',vinkel:.3});
      G.skugga(c,135,299,98,9,.55);
      G.rund(c,54,244,116,26,5,'#060B11','#2A3C4F',1);
      G.digit(c,heltal(f)+' Hz',62,264,{farg:'#9FF0FF',storlek:16});
      G.klot(c,200,264,17,'#2A3C4F');
      G.linje(c,200,264,200+Math.cos(f/2000*4-2.2)*11,264+Math.sin(f/2000*4-2.2)*11,'#FFD166',3);
      G.ror(c,[[232,268],[300,292],[390,294],[446,272]],8,'#243646');

      const dx=spelar>0?Math.sin(t*26)*(a/100*4)*dam:0;
      G.skugga(c,512,299,74,11,.6);
      G.metall(c,448,164,128,132,10,{ljus:'#DCE7F0',mork:'#2A3C4F',vinkel:.5});
      G.glod(c,512,214,66,F,spelar>0?.85:.16);
      G.klot(c,512+dx,214,38,'#2A3C4F');
      G.cirkel(c,512+dx,214,14,'#0E1621');
      G.cirkel(c,502+dx,204,5,'rgba(238,243,247,.35)');
      G.klot(c,512+dx*.5,268,16,'#1F2E3D');
      if(spelar>0){ c.save(); c.beginPath(); c.rect(0,110,CW,190); c.clip();
