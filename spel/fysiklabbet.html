<html lang="sv">
<head>
<meta name="robots" content="noindex,nofollow">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Fysiklabbet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../fonter/fonter.css">
<style>
/* =====================================================================
   FYSIKLABBET – formgivning
   Mörk bakgrund, låg bländning, stora träffytor och dyslexivänliga
   typsnitt är medvetna anpassningar. Allt är byggt för iPad i första hand.
   ===================================================================== */
:root{
  /* botten och ytor – kallt mörkblått med värme i accenterna */
  --botten:#080D16; --grund:#0B1220; --yta:#141F30; --yta2:#1C2A3D; --yta3:#26374D;
  --linje:rgba(150,180,215,.16); --linje2:rgba(150,180,215,.30);
  --text:#EDF3F9; --dov:#9DAFC4; --kalk:#DCE7F0;
  /* signaler */
  --bra:#6FD68A; --fel:#FF8080; --guld:#FFC95C; --cyan:#5CE1E6; --display:#9FF0FF;
  /* rummets färg, sätts av JS */
  --rum:#FFC95C; --rum-dim:rgba(255,201,92,.16);
  /* typografi */
  --rubrik:"Lexend","Trebuchet MS",system-ui,sans-serif;
  --brod:"Atkinson Hyperlegible","Verdana",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bas:18px;                     /* ändras av textstorleksknappen */
  --radie:18px; --radie-s:12px;
  --skugga:0 18px 40px rgba(0,0,0,.45);
  --skugga-s:0 6px 16px rgba(0,0,0,.35);
  color-scheme:dark;
}
html[data-text="stor"]{--bas:20px}
html[data-text="storst"]{--bas:23px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--botten);min-height:100%}
body{
  margin:0;color:var(--text);font-family:var(--brod);font-size:var(--bas);line-height:1.55;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
  background-image:
    radial-gradient(1200px 700px at 78% -12%, rgba(92,225,230,.07), transparent 62%),
    radial-gradient(900px 600px at 6% 4%, rgba(255,201,92,.05), transparent 60%);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
button{font-family:var(--brod)}
:focus-visible{outline:3px solid var(--guld);outline-offset:3px;border-radius:6px}
.dold{display:none!important}
.bara-skarm{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{font-family:var(--rubrik);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6.2vw,3.1rem);font-weight:700;line-height:1.04;letter-spacing:-.025em}
h2{font-size:1.5rem;font-weight:600;line-height:1.18}
h3{font-size:1.14rem;font-weight:600}
p{margin:0 0 .6em}
p:last-child{margin-bottom:0}
strong,b{font-weight:700}
.etikett{font-family:var(--brod);font-weight:700;font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dov);margin:0 0 6px}
.mjuk{color:var(--dov)}

/* ---------- HUD ---------------------------------------------------- */
#hud{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;
  background:rgba(8,13,22,.88);backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--linje)}
#hud .titel{flex:1;min-width:0}
#hud .titel small{display:block;font-weight:700;font-size:.66rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--rum);line-height:1.3}
#hud .titel span{display:block;font-family:var(--rubrik);font-weight:600;font-size:1.02rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.mini{background:var(--yta2);border:1px solid var(--linje);border-radius:13px;
  min-width:48px;height:48px;display:grid;place-items:center;font-size:1.2rem;cursor:pointer;
  padding:0 10px;transition:background .13s,transform .13s;flex:0 0 auto}
.mini:hover{background:var(--yta3)}
.mini:active{transform:scale(.94)}
.mini[aria-pressed="false"]{opacity:.45}
.ring{flex:0 0 auto;width:46px;height:46px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .spar{stroke:var(--yta3)}
.ring .fyll{stroke:var(--guld);transition:stroke-dasharray .6s cubic-bezier(.3,1,.4,1)}
.ring b{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--guld);
  font-variant-numeric:tabular-nums;position:relative}

/* ---------- sidor -------------------------------------------------- */
#vy{max-width:1140px;margin:0 auto;padding:20px 16px calc(80px + env(safe-area-inset-bottom,0px))}
.sektion{margin:0 0 26px}
.byt{animation:blekin .34s cubic-bezier(.2,.8,.3,1)}
@keyframes blekin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* guide-roboten */
.guide{display:flex;gap:14px;align-items:flex-start}
.guide .robot{flex:0 0 76px;width:76px;height:76px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.guide .robot .oga{animation:blink 6.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubbla{position:relative;background:linear-gradient(160deg,var(--yta),var(--grund));
  border:1px solid var(--linje);border-radius:20px;padding:13px 17px;flex:1;min-width:0;max-width:64ch;
  box-shadow:var(--skugga-s)}
.bubbla::before{content:"";position:absolute;left:-7px;top:24px;width:14px;height:14px;
  background:var(--yta);border-left:1px solid var(--linje);border-bottom:1px solid var(--linje);
  transform:rotate(45deg);border-radius:0 0 0 4px}
.bubbla .vem{font-family:var(--rubrik);font-weight:600;color:var(--rum);font-size:.92rem;display:block}
.lasknapp{background:rgba(255,255,255,.04);border:1px solid var(--linje);border-radius:11px;
  padding:5px 12px;font-size:.86rem;cursor:pointer;color:var(--dov);margin-top:9px;
  display:inline-flex;align-items:center;gap:6px;min-height:36px}
.lasknapp:hover{background:var(--yta2);color:var(--text)}
.lasknapp.talar{color:var(--cyan);border-color:var(--cyan)}

/* ---------- knappar ------------------------------------------------ */
.knapp{font-family:var(--rubrik);font-weight:600;font-size:1rem;background:var(--yta2);
  border:1px solid var(--linje2);border-radius:14px;padding:12px 20px;min-height:52px;cursor:pointer;
  display:inline-flex;align-items:center;gap:9px;justify-content:center;
  transition:transform .12s,background .14s,box-shadow .14s}
.knapp:hover{background:var(--yta3)}
.knapp:active{transform:translateY(2px)}
.knapp.primar{background:linear-gradient(170deg,var(--rum),color-mix(in srgb,var(--rum) 78%,#000));
  border-color:transparent;color:#10192A;box-shadow:0 5px 0 color-mix(in srgb,var(--rum) 55%,#000)}
.knapp.primar:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--rum) 55%,#000)}
.knapp.stor{font-size:1.12rem;padding:16px 26px;min-height:62px}
.knapp:disabled{opacity:.38;cursor:default;transform:none;box-shadow:none}
.rad{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.rad.mitt{justify-content:center}

/* ---------- uppdragsbandet (kompletteringar) ------------------ */
.uppdrag{background:linear-gradient(150deg,rgba(255,201,92,.13),rgba(20,31,48,.9) 55%);
  border:1px solid rgba(255,201,92,.34);border-radius:var(--radie);padding:18px;box-shadow:var(--skugga-s)}
.uppdrag h2{font-size:1.24rem;margin-bottom:4px}
.spar-lista{display:grid;gap:12px;margin:15px 0 0}
.spar{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.spar .namn{font-family:var(--rubrik);font-weight:600;font-size:1.02rem}
.spar .namn small{display:block;font-family:var(--brod);font-weight:400;font-size:.8rem;color:var(--dov)}
.spar .siffra{font-family:var(--mono);font-weight:600;color:var(--guld);font-variant-numeric:tabular-nums}
.matt{grid-column:1/-1;height:12px;border-radius:99px;background:var(--yta3);overflow:hidden;position:relative}
.matt i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--guld),#FFE39B);transition:width .8s cubic-bezier(.3,1,.4,1)}
.matt.gron i{background:linear-gradient(90deg,var(--bra),#B6F0C2)}

/* ---------- siffertavlor ------------------------------------------- */
.siffror{display:flex;flex-wrap:wrap;gap:10px}
.siffra{background:var(--yta);border:1px solid var(--linje);border-radius:15px;padding:10px 16px;min-width:126px;flex:1 1 126px}
.siffra b{display:block;font-family:var(--mono);font-size:1.4rem;font-weight:600;color:var(--guld);font-variant-numeric:tabular-nums}
.siffra span{font-size:.74rem;color:var(--dov);font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* ---------- planritningen ------------------------------------------ */
.planritning{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;
  padding:16px;border-radius:24px;border:1px solid var(--linje);
  background:
    linear-gradient(rgba(150,180,215,.055) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(150,180,215,.055) 1px,transparent 1px) 0 0/32px 32px,
    radial-gradient(900px 400px at 50% 0%,rgba(92,225,230,.05),transparent 70%),
    #0A1120}
.rumkort{--rum:#FFC95C;position:relative;text-align:left;background:linear-gradient(168deg,var(--yta),#101A29);
  border:1px solid var(--linje);border-radius:var(--radie);padding:0;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .16s cubic-bezier(.3,1,.4,1),border-color .16s,box-shadow .16s;
  box-shadow:var(--skugga-s)}
.rumkort:hover{transform:translateY(-3px);border-color:var(--rum);box-shadow:0 14px 28px rgba(0,0,0,.42)}
.rumkort:active{transform:translateY(0)}
.rumkort .scenbild{display:block;width:100%;height:112px;background:#080E18;border-bottom:1px solid var(--linje);overflow:hidden}
.rumkort .scenbild svg{display:block;width:100%;height:100%}
.rumkort .kropp{padding:12px 15px 14px;display:grid;gap:5px;flex:1}
.rumkort .nr{font-family:var(--mono);font-size:.72rem;color:var(--rum);font-weight:600;letter-spacing:.1em}
.rumkort h3{font-size:1.06rem;line-height:1.2}
.rumkort .om{font-size:.86rem;color:var(--dov);line-height:1.34}
.rumkort .fotrad{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;
  font-family:var(--mono);font-size:.8rem;color:var(--dov)}
.malchip{display:inline-block;font-family:var(--brod);font-size:.68rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--rum-dim);
  color:var(--rum);border:1px solid color-mix(in srgb,var(--rum) 40%,transparent);width:fit-content}
.stj{letter-spacing:2px;color:var(--guld);font-size:1.02rem;white-space:nowrap}
.stj i{font-style:normal;opacity:.2}
.flagga{position:absolute;top:10px;left:10px;background:var(--guld);color:#241900;font-weight:700;
  font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:4px 11px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);z-index:2}
.rumkort.last{opacity:.5}
.rumkort.last:hover{transform:none}
.rumkort.slutprov{grid-column:1/-1;background:linear-gradient(120deg,#2B2410,#141F30 62%)}
.rumkort.slutprov .scenbild{height:112px}

/* ---------- rumsvy -------------------------------------------------- */
.rumhuvud{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.rumhuvud .emblem{flex:0 0 62px;width:62px;height:62px;border-radius:16px;background:var(--rum-dim);
  border:1px solid color-mix(in srgb,var(--rum) 34%,transparent);display:grid;place-items:center}
.rumhuvud .emblem svg{width:40px;height:40px}
.rumhuvud .t{flex:1;min-width:220px}
.malruta{background:var(--yta);border:1px solid var(--linje);border-radius:var(--radie);padding:15px 17px;margin:16px 0}
.malruta summary{cursor:pointer;font-family:var(--rubrik);font-weight:600;font-size:1.02rem;
  list-style:none;display:flex;align-items:center;gap:9px;min-height:34px}
.malruta summary::-webkit-details-marker{display:none}
.malruta summary::before{content:"▸";color:var(--rum);transition:transform .2s;display:inline-block}
.malruta[open] summary::before{transform:rotate(90deg)}
.malruta .innehall{padding-top:12px;display:grid;gap:12px}
.citat{border-left:3px solid var(--rum);padding:2px 0 2px 13px;color:var(--kalk);font-size:.96rem}
.citat small{display:block;color:var(--dov);font-size:.78rem;margin-top:5px;letter-spacing:.04em}
.punkter{margin:0;padding-left:1.15em;display:grid;gap:5px;font-size:.97rem}
.punkter li::marker{color:var(--rum)}

/* stationsraden */
.stationsrad{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 12px;margin:6px 0 4px;
  scrollbar-width:thin;scroll-snap-type:x proximity}
.flik{flex:0 0 auto;scroll-snap-align:center;background:var(--yta);border:2px solid var(--linje);
  border-radius:99px;padding:9px 17px 9px 11px;cursor:pointer;font-weight:700;font-size:.94rem;
  min-height:50px;display:flex;align-items:center;gap:9px;white-space:nowrap;transition:border-color .14s,background .14s}
.flik .kula{flex:0 0 26px;height:26px;border-radius:50%;background:var(--yta3);display:grid;place-items:center;
  font-family:var(--mono);font-size:.8rem;color:var(--dov)}
.flik.klar .kula{background:var(--bra);color:#0B1220}
.flik.aktiv{border-color:var(--rum);background:var(--yta2)}
.flik.aktiv .kula{background:var(--rum);color:#10192A}
.flik.prov{border-style:dashed}

/* ---------- stationen ----------------------------------------------- */
.station{display:grid;gap:14px}
.uppdragskort{background:linear-gradient(165deg,var(--yta),#101A29);border:1px solid var(--linje);
  border-radius:var(--radie);padding:15px 17px;box-shadow:var(--skugga-s)}
.uppdragskort p{max-width:68ch}
.steglista{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:7px}
.steglista li{display:flex;gap:11px;align-items:flex-start;padding:9px 12px;border-radius:13px;
  background:var(--yta2);border:1px solid transparent;transition:background .25s,border-color .25s,opacity .25s;opacity:.55}
.steglista li .ruta{flex:0 0 27px;height:27px;border-radius:9px;border:2px solid var(--dov);
  display:grid;place-items:center;font-size:.86rem;font-family:var(--mono);margin-top:1px;transition:all .25s}
.steglista li.nu{opacity:1;border-color:var(--rum);background:var(--rum-dim)}
.steglista li.nu .ruta{border-color:var(--rum);color:var(--rum)}
.steglista li.klar{opacity:1;background:rgba(111,214,138,.13)}
.steglista li.klar .ruta{background:var(--bra);border-color:var(--bra);color:#0B1220}
.steglista li.klar span:last-child{text-decoration:line-through;text-decoration-color:rgba(111,214,138,.5)}

.labbyta{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.labbyta{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.scen{background:#070C14;border:1px solid var(--linje);border-radius:var(--radie);overflow:hidden;
  align-self:start;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--skugga-s)}
.scen canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.avlas{display:flex;flex-wrap:wrap;gap:7px;padding:9px 11px;border-top:1px solid var(--linje);
  background:linear-gradient(180deg,#0A1019,#070C14)}
.avlas:empty{display:none}
.matare{background:#050A11;border:1px solid var(--linje);border-radius:11px;padding:5px 11px;min-width:104px;flex:1 1 auto}
.matare span{display:block;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dov);font-weight:700}
.matare b{font-family:var(--mono);font-weight:600;font-size:1.08rem;color:var(--display);
  font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 12px rgba(159,240,255,.3)}

.reglage{background:linear-gradient(165deg,var(--yta),#101A29);border:1px solid var(--linje);
  border-radius:var(--radie);padding:14px 15px;display:grid;gap:15px;align-content:start;box-shadow:var(--skugga-s)}
.ctl{border-radius:14px;padding:2px;transition:box-shadow .3s}
.peka{box-shadow:0 0 0 2px var(--rum),0 0 22px -2px var(--rum);animation:pulsa 1.9s ease-in-out infinite}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 2px var(--rum),0 0 18px -4px var(--rum)}
  50%{box-shadow:0 0 0 3px var(--rum),0 0 30px 0 var(--rum)}}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;gap:9px;font-weight:700;font-size:.95rem;align-items:baseline}
.ctl output{font-family:var(--mono);color:var(--rum);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.sl{display:flex;align-items:center;gap:9px;margin-top:7px}
.sl button{flex:0 0 48px;height:48px;border-radius:13px;background:var(--yta2);border:1px solid var(--linje);
  font-size:1.35rem;cursor:pointer;display:grid;place-items:center}
.sl button:active{background:var(--yta3);transform:scale(.94)}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:38px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:9px;background:var(--yta3);border:1px solid var(--linje)}
input[type=range]::-moz-range-track{height:9px;border-radius:9px;background:var(--yta3);border:1px solid var(--linje)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;
  background:var(--rum);margin-top:-12px;border:3px solid #0B1220;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--rum);
  border:3px solid #0B1220;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.seg{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.seg button{flex:1 1 auto;min-height:48px;background:var(--yta2);border:2px solid transparent;border-radius:13px;
  padding:9px 12px;cursor:pointer;font-weight:700;font-size:.92rem;transition:all .13s}
.seg button:hover{background:var(--yta3)}
.seg button.vald{border-color:var(--rum);background:var(--yta3);color:var(--text)}
.reglage .knapp{width:100%}

/* tipsraden + hjälpstegen */
.hjalpfalt{display:flex;gap:11px;align-items:flex-start;flex-wrap:wrap}
.tips{flex:1 1 260px;margin:0;min-height:52px;padding:12px 16px;border-radius:15px;background:#0F1B2B;
  border:1px dashed var(--linje2);color:var(--kalk);font-size:.98rem;display:flex;align-items:center;
  transition:border-color .3s,background .3s}
.tips.ny{border-color:var(--rum);background:var(--rum-dim);animation:knuff .5s}
@keyframes knuff{30%{transform:translateY(-4px)}60%{transform:translateY(1px)}}
.tips:empty::before{content:attr(data-start);color:var(--dov);opacity:.7}   /* startraden sätts per stationstyp i stationSkal() */
.hjalpknapp{flex:0 0 auto;background:var(--yta2);border:1px solid var(--linje2);border-radius:15px;
  min-height:52px;padding:0 18px;font-family:var(--rubrik);font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px}
.hjalpknapp:hover{background:var(--yta3)}

/* ---------- frågekort ----------------------------------------------- */
.fragekort{background:linear-gradient(165deg,var(--yta),#101A29);border:1px solid var(--linje);
  border-radius:22px;padding:20px;max-width:780px;box-shadow:var(--skugga)}
.fraga{font-family:var(--rubrik);font-weight:600;font-size:1.34rem;line-height:1.33;margin:5px 0 0;text-wrap:balance}
.alt{display:grid;gap:11px;margin-top:18px}

<script>
/* =====================================================================
   FYSIKLABBET v3  (oktober 2026)
   En enda fil. Ingen server, inget konto, fungerar utan nät efter
   första laddningen. Sparar framsteg lokalt i webbläsaren.

   Delar:
     1. Hjälpare och ritbibliotek G
     2. Motor: sparning, tal, ljud, vyer
     3. Innehåll: MAL (Lgr22), RUM, EXP (experimenten), MUNTLIG (muntliga övningar)

   v3: muntligt övningsläge, räkneövningar, jämnare kompletteringsprov,
   lärarrapport per delområde, nya stationer i rum 1–3. Sparnyckeln är
   oförändrad (fysiklabbet.v2) så att tidigare framsteg följer med.
   ===================================================================== */

/* ---------------------------------------------------------------
   1. HJÄLPARE
   --------------------------------------------------------------- */
const EXP = {};                         // alla experiment registrerar sig här
const CW = 640, CH = 360;               // experimentens logiska yta
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp  = (v,a,b) => v<a ? a : v>b ? b : v;
const slump  = (a,b) => a + Math.random()*(b-a);
const valj   = a => a[Math.floor(Math.random()*a.length)];
const blanda = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const esc    = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec    = (v,n=1) => Number(v).toFixed(n).replace('.',',');
const heltal = v => Math.round(v).toLocaleString('sv-SE');
const vag    = (t,fas) => Math.sin(t+(fas||0));
const idag   = () => new Date().toLocaleDateString('sv-SE');

/* Respekterar systemets inställning för mindre rörelse. */
let _lugn = false;
try{ const mq = matchMedia('(prefers-reduced-motion:reduce)'); _lugn = mq.matches;
     mq.addEventListener && mq.addEventListener('change', e => _lugn = e.matches); }catch(e){}
const lugn = () => _lugn;

const F_RUB   = '600 15px Lexend, sans-serif';
const F_BROD  = '700 14px "Atkinson Hyperlegible", Verdana, sans-serif';
const F_MONO  = '600 14px "IBM Plex Mono", monospace';
const F_LITEN = '700 11px "Atkinson Hyperlegible", Verdana, sans-serif';

/* ---------------------------------------------------------------
   RITBIBLIOTEK G
   Alla experiment ritar genom det här. Samma språk överallt ger
   samma känsla i alla tio rum.
   --------------------------------------------------------------- */
const G = {

  /* ---- grundformer ---- */
  rekt(c,x,y,w,h,f){ c.fillStyle=f; c.fillRect(x,y,w,h); },

  rund(c,x,y,w,h,r,f,s,lw){
    c.beginPath();
    if(c.roundRect) c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h);
    if(f){ c.fillStyle=f; c.fill(); }
    if(s){ c.strokeStyle=s; c.lineWidth=lw||2; c.stroke(); }
  },

  cirkel(c,x,y,r,f,s,lw){
    c.beginPath(); c.arc(x,y,Math.max(0,r),0,Math.PI*2);
    if(f){ c.fillStyle=f; c.fill(); }
    if(s){ c.strokeStyle=s; c.lineWidth=lw||2; c.stroke(); }
  },

  linje(c,x1,y1,x2,y2,f,w,streck){
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
    c.strokeStyle=f; c.lineWidth=w||2; c.setLineDash(streck||[]); c.lineCap='round';
    c.stroke(); c.setLineDash([]);
  },

  poly(c,pts,f,s,lw){
    c.beginPath(); pts.forEach((p,i)=> i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1])); c.closePath();
    if(f){ c.fillStyle=f; c.fill(); }
    if(s){ c.strokeStyle=s; c.lineWidth=lw||2; c.lineJoin='round'; c.stroke(); }
  },

  text(c,t,x,y,o){
    o=o||{}; c.font=o.font||F_BROD; c.fillStyle=o.f||'#DCE7F0';
    c.textAlign=o.a||'left'; c.textBaseline=o.b||'alphabetic';
    if(o.skugga!==false){ c.save(); c.shadowColor='rgba(0,0,0,.65)'; c.shadowBlur=4; c.shadowOffsetY=1; }
    c.fillText(t,x,y);
    if(o.skugga!==false) c.restore();
    c.textAlign='left'; c.textBaseline='alphabetic';
  },

  /* etikett med platta bakom – används när text ligger över brokig bakgrund */
  etikett(c,t,x,y,o){
    o=o||{}; c.font=o.font||F_BROD;
    const w=c.measureText(t).width+16, a=o.a||'center';
    const x0 = a==='center' ? x-w/2 : a==='right' ? x-w : x;
    G.rund(c,x0,y-16,w,24,9,o.bg||'rgba(5,10,17,.86)',o.kant||null,1.5);
    G.text(c,t,x0+8,y+1,{f:o.f||'#EEF3F7',font:o.font,skugga:false});
  },

  pil(c,x1,y1,x2,y2,f,w){
    w=w||3; G.linje(c,x1,y1,x2,y2,f,w);
    const a=Math.atan2(y2-y1,x2-x1), s=8+w;
    G.poly(c,[[x2,y2],[x2-s*Math.cos(a-.45),y2-s*Math.sin(a-.45)],[x2-s*Math.cos(a+.45),y2-s*Math.sin(a+.45)]],f);
  },

  ikonpil(c,x,y,riktning,f){
    const vinklar = {hoger:0,ner:Math.PI/2,vanster:Math.PI,upp:-Math.PI/2};
    const a = typeof riktning==='number' ? riktning : (vinklar[riktning]||0);
    G.pil(c,x-Math.cos(a)*9,y-Math.sin(a)*9,x+Math.cos(a)*9,y+Math.sin(a)*9,f||'#FFC95C',2.5);
  },

  person(c,x,y,s,f){                       // står med fötterna i (x,y)
    s=s||1; f=f||'#DCE7F0';
    G.cirkel(c,x,y-62*s,9*s,f);
    G.linje(c,x,y-52*s,x,y-24*s,f,5*s);
    G.linje(c,x,y-46*s,x-13*s,y-32*s,f,4*s);
    G.linje(c,x,y-46*s,x+13*s,y-32*s,f,4*s);
    G.linje(c,x,y-24*s,x-8*s,y,f,5*s);
    G.linje(c,x,y-24*s,x+8*s,y,f,5*s);
  },

  /* ---- bakgrund och rum ---- */

  /* En komplett bakgrund: gradient, valfria stjärnor, blueprint-rutnät, vinjett. */
  scen(c,o){
    o=o||{};
    const g=c.createLinearGradient(0,0,0,CH);
    g.addColorStop(0,o.topp||'#0A1220'); g.addColorStop(1,o.botten||'#0E1B2B');
    c.fillStyle=g; c.fillRect(0,0,CW,CH);
    if(o.stjarnor){
      const n=Math.round(60*o.stjarnor);
      for(let i=0;i<n;i++){
        const x=(i*97.3)%CW, y=(i*53.7)%CH, r=i%7===0?1.6:0.9;
        c.fillStyle='rgba(255,255,255,'+(0.28+(i%5)*0.13)+')';
        c.beginPath(); c.arc(x,y,r,0,7); c.fill();
      }
    }
    if(o.rutnat) G.rutnat(c, typeof o.rutnat==='number'?o.rutnat:26, o.rutnatFarg);
    if(o.vinjett!==false){
      const v=c.createRadialGradient(CW/2,CH/2,CH*0.34,CW/2,CH/2,CH*1.02);
      v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.42)');
      c.fillStyle=v; c.fillRect(0,0,CW,CH);
    }
  },

  himmel(c,a,b){ G.scen(c,{topp:a,botten:b,vinjett:false}); },

  rutnat(c,steg,f){
    c.strokeStyle=f||'rgba(150,180,215,.065)'; c.lineWidth=1; c.beginPath();
    for(let x=0;x<=CW;x+=steg){ c.moveTo(x+.5,0); c.lineTo(x+.5,CH); }
    for(let y=0;y<=CH;y+=steg){ c.moveTo(0,y+.5); c.lineTo(CW,y+.5); }
    c.stroke();
  },

  /* Markplan med perspektivlinjer. y = horisonten. */
  golv(c,y,o){
    o=o||{};
    const g=c.createLinearGradient(0,y,0,CH);
    g.addColorStop(0,o.djup||'#16222F'); g.addColorStop(1,o.farg||'#0D1622');
    c.fillStyle=g; c.fillRect(0,y,CW,CH-y);
    G.linje(c,0,y,CW,y,o.kant||'rgba(150,180,215,.35)',1.5);
    if(o.linjer!==false){
      c.save(); c.globalAlpha=.16;
      for(let i=-6;i<=6;i++){
        const x=CW/2+i*95;
        G.linje(c,CW/2+i*16,y,x,CH,o.kant||'#9DAFC4',1);
      }
      for(let k=1;k<=4;k++){
        const yy=y+(CH-y)*Math.pow(k/4,1.7);
        G.linje(c,0,yy,CW,yy,o.kant||'#9DAFC4',1);
      }
      c.restore();
    }
  },

  /* Mjuk markskugga. styrka 0..1 */
  skugga(c,x,y,rx,ry,styrka){
    const g=c.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));
    g.addColorStop(0,'rgba(0,0,0,'+(styrka==null?.45:styrka)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    c.save(); c.translate(x,y); c.scale(1,ry/Math.max(rx,.001)); c.translate(-x,-y);
    c.fillStyle=g; c.beginPath(); c.arc(x,y,rx,0,7); c.fill(); c.restore();
  },

  /* Radiell glöd runt en ljuskälla. */
  glod(c,x,y,r,f,styrka){
    const s=styrka==null?1:clamp(styrka,0,2); if(s<=0) return;
    const g=c.createRadialGradient(x,y,0,x,y,Math.max(1,r));
    const rgb=G._rgb(f);
    g.addColorStop(0,'rgba('+rgb+','+(.85*s)+')');
    g.addColorStop(.45,'rgba('+rgb+','+(.3*s)+')');
    g.addColorStop(1,'rgba('+rgb+',0)');
    c.save(); c.globalCompositeOperation='lighter';
    c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.restore();
  },

  /* ---- material ---- */

  metall(c,x,y,w,h,r,o){
    o=o||{};
    const vinkel=o.vinkel||0;
    const g = vinkel ? c.createLinearGradient(x,y,x+w,y+h) : c.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,o.ljus||'#C8D5E2'); g.addColorStop(.42,o.mork||'#7D8B9B');
    g.addColorStop(.58,o.ljus||'#B6C4D2'); g.addColorStop(1,o.mork||'#5D6A79');
    G.rund(c,x,y,w,h,r==null?4:r,g,'rgba(10,16,25,.6)',1);
    c.save(); c.globalAlpha=.25;
    G.linje(c,x+2,y+1.5,x+w-2,y+1.5,'#FFFFFF',1.5);
    c.restore();
  },

  /* path får vara en funktion som bygger vägen, eller en punktlista. */
  glas(c,path,o){
    o=o||{};
    const p2 = (typeof Path2D!=='undefined' && path instanceof Path2D) ? path : null;
    c.save();
    if(!p2){
      c.beginPath();
      if(typeof path==='function') path(c);
      else if(Array.isArray(path)) path.forEach((p,i)=> i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
      c.closePath();
    }
    c.fillStyle=o.fyll||'rgba(190,225,255,.09)'; p2?c.fill(p2):c.fill();
    c.strokeStyle=o.kant||'rgba(215,238,255,.72)'; c.lineWidth=o.bredd||2.5; c.lineJoin='round';
    p2?c.stroke(p2):c.stroke();
    p2?c.clip(p2):c.clip();
    c.globalAlpha=.16; c.fillStyle='#FFFFFF';
    c.beginPath(); c.ellipse((o.hx!=null?o.hx:0)+30,(o.hy!=null?o.hy:0)+30,14,70,-.5,0,7); c.fill();
    c.restore();
  },

  /* Sladd eller rör längs en punktlista. */
  ror(c,pts,bredd,f){
    if(pts.length<2) return;
    c.save(); c.lineJoin='round'; c.lineCap='round';
    c.beginPath(); pts.forEach((p,i)=> i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
    c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=bredd+3; c.stroke();
    c.strokeStyle=f||'#C98A4B'; c.lineWidth=bredd; c.stroke();
    c.globalAlpha=.3; c.strokeStyle='#FFFFFF'; c.lineWidth=Math.max(1,bredd*.28);
    c.beginPath(); pts.forEach((p,i)=> i?c.lineTo(p[0],p[1]-bredd*.26):c.moveTo(p[0],p[1]-bredd*.26)); c.stroke();
    c.restore();
  },

  /* Klot med ljus uppifrån vänster. */
  klot(c,x,y,r,f){
    if(r<=0) return;
    const g=c.createRadialGradient(x-r*.36,y-r*.38,r*.06,x,y,r);
    g.addColorStop(0,G._ljusare(f,.55)); g.addColorStop(.55,f); g.addColorStop(1,G._morkare(f,.42));
    c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill();
    c.save(); c.globalAlpha=.5; c.fillStyle='#FFFFFF';
    c.beginPath(); c.ellipse(x-r*.34,y-r*.4,r*.2,r*.13,-.6,0,7); c.fill(); c.restore();
  },

  /* ---- instrument ---- */

  bricka(c,x,y,w,h,o){
    o=o||{};
    G.rund(c,x,y,w,h,12,'rgba(4,9,16,.9)',o.farg||'rgba(92,225,230,.45)',1.5);
    c.save(); c.globalAlpha=.3;
    G.linje(c,x+8,y+1.5,x+w-8,y+1.5,'#FFFFFF',1); c.restore();
    if(o.titel) G.text(c,o.titel,x+11,y+15,{font:F_LITEN,f:'#9DAFC4',skugga:false});
  },

  digit(c,t,x,y,o){
    o=o||{};
    const st=o.storlek||22, f=o.farg||'#9FF0FF';
    c.save(); c.shadowColor=f; c.shadowBlur=12;
    G.text(c,t,x,y,{font:'600 '+st+'px "IBM Plex Mono", monospace',f,a:o.a||'left',skugga:false});
    c.restore();
  },

  /* Etikett med ledarlinje ut till den del den beskriver. */
  callout(c,x,y,t,o){
    o=o||{};
    const f=o.farg||'#FFC95C';
    if(o.till){
      G.linje(c,x,y,o.till[0],o.till[1],f,1.4,[4,3]);
      G.cirkel(c,o.till[0],o.till[1],3.5,f);
    }
    G.etikett(c,t,x,y,{f:'#EDF3F9',bg:'rgba(5,10,17,.9)',kant:f,font:o.font||F_LITEN,a:o.a||'center'});
  },

  /* Måttband med ändpilar och text i mitten. */
  matband(c,x1,y,x2,t,f){
    f=f||'#FFC95C';
    G.linje(c,x1,y-6,x1,y+6,f,1.5); G.linje(c,x2,y-6,x2,y+6,f,1.5);
    G.pil(c,x1+2,y,x2-2,y,f,1.5); G.pil(c,x2-2,y,x1+2,y,f,1.5);
    if(t) G.etikett(c,t,(x1+x2)/2,y+5,{f,font:F_LITEN});
  },

  /* Vågrät stapel, andel 0..1 */
  stapel(c,x,y,w,h,andel,f,o){
    o=o||{};
    G.rund(c,x,y,w,h,h/2,o.bakgrund||'rgba(255,255,255,.08)');
    const b=clamp(andel,0,1)*w;
    if(b>1){
      const g=c.createLinearGradient(x,y,x+b,y);
      g.addColorStop(0,G._morkare(f,.18)); g.addColorStop(1,f);
      G.rund(c,x,y,b,h,h/2,g);
    }
    if(o.etikett) G.text(c,o.etikett,x-8,y+h-1,{a:'right',font:F_LITEN,f:'#DCE7F0'});
  },

  /* Linjediagram i en ram. serie = array av tal. */
  graf(c,x,y,w,h,serie,o){
    o=o||{};
    G.bricka(c,x,y,w,h,{titel:o.titel,farg:o.ram});
    const ix=x+10, iy=y+(o.titel?22:10), iw=w-20, ih=h-(o.titel?32:20);
    const mn = o.min!=null ? o.min : Math.min.apply(null,serie.concat([0]));
    const mx = o.max!=null ? o.max : Math.max.apply(null,serie.concat([1]));
    const sp = (mx-mn)||1;
    if(o.nolllinje!==false && mn<0 && mx>0){
      const y0=iy+ih-((0-mn)/sp)*ih;
      G.linje(c,ix,y0,ix+iw,y0,'rgba(150,180,215,.3)',1,[4,4]);
    }
    if(serie.length>1){
      c.save(); c.beginPath();
      serie.forEach((v,i)=>{ const px=ix+i*(iw/(serie.length-1)), py=iy+ih-(clamp(v,mn,mx)-mn)/sp*ih;
        i?c.lineTo(px,py):c.moveTo(px,py); });
      c.shadowColor=o.farg||'#9FF0FF'; c.shadowBlur=8;
      c.strokeStyle=o.farg||'#9FF0FF'; c.lineWidth=2; c.lineJoin='round'; c.stroke(); c.restore();
    }
  },

  /* Sinusvåg. */
  vag(c,o){
    o=o||{};
    const x0=o.x0!=null?o.x0:0, x1=o.x1!=null?o.x1:CW, y=o.y!=null?o.y:CH/2;
    const amp=o.amplitud!=null?o.amplitud:40;
    const vl=o.våglängd||o.vaglangd||o.vl||120;
    const fas=o.fas||0, f=o.färg||o.farg||'#FF7EB6', bredd=o.bredd||3;
    c.save();
    if(o.glöd||o.glod){ c.shadowColor=f; c.shadowBlur=o.glöd||o.glod||14; }
    c.beginPath();
    for(let x=x0;x<=x1;x+=2){ const yy=y-Math.sin((x-x0)/vl*Math.PI*2-fas)*amp; x===x0?c.moveTo(x,yy):c.lineTo(x,yy); }
    c.strokeStyle=f; c.lineWidth=bredd; c.stroke(); c.restore();
  },

  /* ---- partikelsystem ---- */
  Partiklar: class {
    constructor(o){ o=o||{}; this.max=o.max||120; this.p=[]; }
    skapa(o){
      if(this.p.length>=this.max) this.p.shift();
      this.p.push({ x:o.x, y:o.y, vx:o.vx||0, vy:o.vy||0,
        liv:o.liv||1, maxliv:o.liv||1, r:o.r||3, farg:o.farg||'#FFC95C',
        g:o.gravitation||0, blek:o.blekna!==false });
    }
    uppdatera(dt){
      for(const q of this.p){ q.vy+=q.g*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.liv-=dt; }
      this.p=this.p.filter(q=>q.liv>0);
    }
    rita(c){
      c.save();
      for(const q of this.p){
        const a=q.blek ? clamp(q.liv/q.maxliv,0,1) : 1;
        c.globalAlpha=a; c.fillStyle=q.farg;
        c.beginPath(); c.arc(q.x,q.y,q.r*(0.4+0.6*a),0,7); c.fill();
      }
      c.restore();
    }
    get antal(){ return this.p.length; }
  },

  /* ---- färghjälp ---- */
  _rgb(f){
    if(f[0]==='#'){
      const h=f.slice(1); const n=h.length===3
        ? h.split('').map(x=>parseInt(x+x,16))
        : [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
      return n.join(',');
    }
    const m=f.match(/-?\d+(\.\d+)?/g);
    return m ? m.slice(0,3).join(',') : '255,255,255';
  },
  _ljusare(f,k){ const n=G._rgb(f).split(',').map(Number);
    return 'rgb('+n.map(v=>Math.round(v+(255-v)*k)).join(',')+')'; },
  _morkare(f,k){ const n=G._rgb(f).split(',').map(Number);
    return 'rgb('+n.map(v=>Math.round(v*(1-k))).join(',')+')'; },
};

/* Punkt på en sluten polylinje efter sträckan d – används av kretsexperimentet. */
function punktPa(pts,d){
  let tot=0; const L=[];
  for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length];
    const l=Math.hypot(b[0]-a[0],b[1]-a[1]); L.push(l); tot+=l; }
  d=((d%tot)+tot)%tot;
  for(let i=0;i<pts.length;i++){
    if(d<=L[i]){ const a=pts[i], b=pts[(i+1)%pts.length], k=d/L[i];
      return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]; }
    d-=L[i];
  }
  return pts[0];
}

const TAL_L = '(?![A-Za-zÅÄÖåäöÉé0-9])';
const TAL_REGLER = (() => {
  const L = TAL_L;
  const enh = (u, ord) => [new RegExp('(\\d)\\s?' + u + L, 'g'), '$1 ' + ord];
  return [
    /* sammansatta enheter först */

    [/g\/ml/g,' gram per milliliter'], [/N\/kg/g,' newton per kilogram'], [/N\/m(?![A-Za-z²³])/g,' newton per meter'], [/\bkgm\b/g,' kilogrammeter'],
    [/N\s?·\s?m/g,' newtonmeter'], [/kg\s?·\s?m/g,' kilogrammeter'],
    [new RegExp('(\\d)\\s?Nm' + L, 'g'), '$1 newtonmeter'], [new RegExp('(^|[\\s(])Nm' + L, 'g'), '$1newtonmeter'],
    /* potenser */
    [/cm³/g,' kubikcentimeter'], [/dm³/g,' kubikdecimeter'], [/m³/g,' kubikmeter'],
    [/cm²/g,' kvadratcentimeter'], [/mm²/g,' kvadratmillimeter'], [/m²/g,' kvadratmeter'],
    [/°C/g,' grader'], [/°/g,' grader'], [/Ω/g,' ohm'], [/H₂O/g,'H två O'], [/CO₂/g,'koldioxid'],
    /* enheter efter tal */
    enh('kWh','kilowattimmar'), enh('kPa','kilopascal'), enh('Hz','hertz'), enh('dB','decibel'), enh('ppm','miljondelar'),
    enh('Pa','pascal'), enh('kg','kilo'), enh('km','kilometer'), enh('cm','centimeter'), enh('mm','millimeter'),
    enh('dm','decimeter'), enh('ml','milliliter'), enh('dl','deciliter'), enh('cl','centiliter'), enh('min','minuter'),
    enh('N','newton'), enh('V','volt'), enh('A','ampere'), enh('W','watt'), enh('J','joule'),
    enh('m','meter'), enh('s','sekunder'), enh('g','gram'), enh('l','liter'),
    /* formler och tecken */
    [/U\s?=\s?R\s?·\s?I/g,'U är lika med R gånger I'],
    [/\bIR\b/g,'i-är'], [/\bUV\b/g,'u-ve'],
    [/[·×]/g,' gånger '], [/÷/g,' delat med '], [/−/g,' minus '], [/≈/g,' ungefär '], [/≥/g,' minst '], [/≤/g,' högst '], [/→/g,', till, '],
    [/[★✓●▸]/g,''], [/\s{2,}/g,' '],
  ];
})();
function talText(t){
  let s = String(t);
  for(const [re, ers] of TAL_REGLER) s = s.replace(re, ers);
  return s;
}

const rumFor    = id => RUM.find(r=>r.id===id);
/* Rummens id är nycklar i det sparade läget och ändras aldrig. Det rumsnummer eleven ser är platsen i listan RUM. */
const rumNr      = id => RUM.findIndex(r=>r.id===id)+1;
const rumNrLista = (ids, sep) => ids.map(rumNr).join(sep||' och ');
const ORDTAL     = ['noll','ett','två','tre','fyra','fem','sex','sju','åtta','nio','tio','elva','tolv','tretton','fjorton','femton','sexton'];
const antalOrd = n => ORDTAL[n] || String(n);
const antalRumOrd = () => antalOrd(RUM.length);
const antalExp  = () => RUM.reduce((s,r)=>s+r.exp.length,0);
const klaraExp  = () => RUM.reduce((s,r)=>s+r.exp.filter(e=>spar.exp[e]).length,0);
const totStj    = () => Object.values(spar.prov).reduce((a,b)=>a+b,0) + (spar.slut||0);
const maxStj    = () => RUM.length*3 + 3;
const provKlara = () => RUM.filter(r=>spar.prov[r.id]).length;
const slutUpplast = () => provKlara() === RUM.length;
const procentTot  = () => Math.round(100*(klaraExp()+totStj())/(antalExp()+maxStj()));
const stjarnor = n => '<span class="stj" aria-label="'+n+' av 3 stjärnor">'+[0,1,2].map(i=>i<n?'★':'<i>★</i>').join('')+'</span>';

/* Hur långt eleven kommit i ett av de områden hon behöver komplettera. */
function sparFramsteg(s){
  let gjort=0, av=0;
  for(const id of s.rum){
    const r = rumFor(id); if(!r) continue;
    gjort += r.exp.filter(e=>spar.exp[e]).length + (spar.prov[id]||0);
    av    += r.exp.length + 3;
  }
  const k = spar.kompl[s.id];
  if(k){ gjort += 4; av += 4; }              // klarat kompletteringsprovet väger tungt
  else av += 4;
  return { gjort, av, procent: av ? Math.round(100*gjort/av) : 0 };
}

/* Nästa sak att göra – används av Fortsätt-knappen. */
function nastaUppgift(){
  if(spar.senast){
    const r = rumFor(spar.senast.rum);
    if(r && spar.senast.station && spar.senast.station!=='prov' && !spar.exp[spar.senast.station])
      return { rum:r.id, station:spar.senast.station };
  }
  const ordning = RUM.slice().sort((a,b)=> (b.prio?1:0)-(a.prio?1:0) || a.id-b.id);
  for(const r of ordning){
    const e = r.exp.find(x=>!spar.exp[x]);
    if(e) return { rum:r.id, station:e };
    if(!spar.prov[r.id]) return { rum:r.id, station:'prov' };
  }
  return slutUpplast() && !spar.slut ? { rum:'slut' } : null;
}

/* ---- HUD ---- */
function hud(){
  const r = lage.rum && lage.rum!=='slut' ? rumFor(lage.rum) : null;
  const farg = r ? r.farg : '#FFC95C';
  document.documentElement.style.setProperty('--rum', farg);
  document.documentElement.style.setProperty('--rum-dim', farg+'26');
  $('#hudsmall').textContent = r ? ('Rum '+rumNr(r.id))
    : lage.rum==='slut' ? 'Slutprovet'
    : lage.vy==='mal' ? 'Dina mål' : 'Fysik åk 7–9';
  $('#hudnamn').textContent = r ? r.namn : lage.vy==='mal' ? 'Målkartan' : 'Fysiklabbet';
  const p = procentTot(), omkrets = 2*Math.PI*19;
  $('#hudprocent').textContent = p+'%';
  $('#hudring .fyll').setAttribute('stroke-dasharray', (omkrets*p/100)+' '+omkrets);
  $('#hudring').title = 'Du har klarat '+p+' procent av labbet';
}

function kopplaLas(rot){
  (rot||document).querySelectorAll('[data-las]').forEach(b => b.onclick = e => {
    e.stopPropagation(); ljudKlick(); las(b.dataset.las, b);
  });
}

function visaLabbet(){

    : slutUpplast()
      ? 'Alla '+antalRumOrd()+' labbprov är klara. Slutprovet är öppet längst ner!'
      : 'Välkommen tillbaka. Du har klarat ' + klaraExp() + ' experiment och ' + provKlara() + ' av ' + RUM.length + ' labbprov. Tryck på Fortsätt så tar jag dig dit du var.';

  skriv(
  '<section class="sektion">'+
    '<p class="etikett">Fysik årskurs 7–9 · Lgr22</p><h1>Fysiklabbet</h1>'+
    '<div style="margin:16px 0">'+guide(halsning)+'</div>'+
    (nasta ? '<div class="rad"><button class="knapp primar stor" id="fortsatt">▶ '+

        '<button class="knapp" id="tillMal">🎯 Målkartan</button>'+
        '<button class="knapp" id="pluggStart">📖 Plugglista</button></div>'
      : '<div class="rad"><button class="knapp" id="tillMal">🎯 Målkartan</button>'+
        '<button class="knapp" id="pluggStart">📖 Plugglista</button></div>')+
  '</section>'+

  uppdragsband()+

  '<section class="sektion" style="margin-top:22px">'+
    '<div class="siffror">'+
      '<div class="siffra"><b>'+procentTot()+'%</b><span>Klart totalt</span></div>'+
      '<div class="siffra"><b>'+klaraExp()+'/'+antalExp()+'</b><span>Experiment</span></div>'+
      '<div class="siffra"><b>'+provKlara()+'/'+RUM.length+'</b><span>Labbprov</span></div>'+
      '<div class="siffra"><b>'+totStj()+'/'+maxStj()+'</b><span>Stjärnor</span></div>'+
    '</div>'+
  '</section>'+

  '<p class="etikett">Planritning – tryck på ett rum</p>'+
  '<div class="planritning">'+
    RUM.map(rumkort).join('')+
    '<button class="rumkort slutprov '+(slutUpplast()?'':'last')+'" data-rum="slut">'+
      '<span class="scenbild">'+SCENBILD.slut+'</span>'+
      '<span class="kropp"><span class="nr">SLUTPROVET</span>'+
      '<h3>'+(slutUpplast()?'Slutprovet är öppet!':'🔒 Slutprovet')+'</h3>'+
      '<span class="om">'+(slutUpplast()
        ? '15 blandade frågor från alla '+antalRumOrd()+' rum. Klarar du det kan du hela kursen.'
        : 'Öppnas när alla '+antalRumOrd()+' labbprov är klara. Du har '+provKlara()+' av '+RUM.length+'.')+'</span>'+
      '<span class="fotrad"><span>Alla områden</span>'+stjarnor(spar.slut||0)+'</span></span>'+
    '</button>'+
  '</div>'+

  '<p class="mjuk" style="margin-top:20px;font-size:.88rem">'+
    'Innehållet följer Skolverkets kursplan i fysik för årskurs 7–9 (Lgr22). '+

  vy.querySelectorAll('[data-rum]').forEach(b => b.onclick = () => {

      else las('Slutprovet öppnas när du klarat alla '+antalRumOrd()+' labbprov. Du har '+provKlara()+' av '+antalRumOrd()+'.');

    }

/* Ett rumskort på planritningen. */
function rumkort(r){
  const k = r.exp.filter(e=>spar.exp[e]).length;
  const andel = Math.round(100*(k+(spar.prov[r.id]||0))/(r.exp.length+3));
  return '<button class="rumkort" style="--rum:'+r.farg+';--rum-dim:'+r.farg+'26" data-rum="'+r.id+'">'+
    (r.prio?'<span class="flagga">Börja här</span>':'')+
    '<span class="scenbild">'+SCENBILD[r.ikon]+'</span>'+
    '<span class="kropp">'+
      '<span class="nr">RUM '+rumNr(r.id)+' · '+andel+' %</span>'+
      '<h3>'+esc(r.namn)+'</h3>'+
      '<span class="om">'+esc(r.om)+'</span>'+
      (r.kompl?'<span class="malchip">'+esc(r.kompl)+'</span>':'')+
      '<span class="fotrad"><span>'+k+'/'+r.exp.length+' experiment</span>'+stjarnor(spar.prov[r.id]||0)+'</span>'+
    '</span></button>';
}

  const r = rumFor(id);

  hud();
  const klart = r.exp.filter(e=>spar.exp[e]).length;
  skriv(
  '<div class="rumhuvud">'+
    '<span class="emblem">'+ikon(r.ikon,r.farg)+'</span>'+
    '<div class="t"><p class="etikett">Rum '+rumNr(r.id)+(r.kompl?' · '+esc(r.kompl):'')+'</p>'+
      '<h2>'+esc(r.namn)+'</h2>'+
      '<p class="mjuk" style="font-size:.9rem">'+klart+' av '+r.exp.length+' experiment klara'+
      (spar.prov[r.id]?' · labbprov '+stjarnor(spar.prov[r.id]):' · labbprovet väntar')+'</p></div>'+
    '<button class="knapp" id="tillbaka">← Till labbet</button>'+
  '</div>'+
  guide(r.intro)+

  '<details class="malruta"'+(spar.exp[r.exp[0]]?'':' open')+'>'+
    '<summary>🎯 Vad ska du kunna efter det här rummet?</summary>'+
    '<div class="innehall">'+
      r.mal.map(mid=>{ const m=MAL.find(x=>x.id===mid); return m
        ? '<p class="citat">'+esc(m.text)+'<small>Centralt innehåll, fysik åk 7–9 (Lgr22)</small></p>' : ''; }).join('')+
      '<div><p class="etikett">Det här ska du kunna göra och förklara</p>'+
      '<ul class="punkter">'+r.kunna.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'+
      '<button class="lasknapp" data-las="'+esc('Mål för rummet. '+r.kunna.join('. '))+'">🔊 Lyssna på målen</button>'+
    '</div>'+
  '</details>'+

  '<p class="etikett" style="margin-top:18px">Stationer – gör dem i ordning</p>'+
  '<nav class="stationsrad" id="flikar" aria-label="Stationer i rummet">'+
    r.exp.map((e,i)=>'<button class="flik'+(spar.exp[e]?' klar':'')+'" data-st="'+e+'">'+
      '<span class="kula">'+(spar.exp[e]?'✓':(i+1))+'</span>'+esc(EXP[e].namn)+'</button>').join('')+
    '<button class="flik prov'+(spar.prov[r.id]?' klar':'')+'" data-st="prov">'+
      '<span class="kula">'+(spar.prov[r.id]?'✓':'📝')+'</span>Labbprov</button>'+
  '</nav>'+
  '<div id="stationsyta"></div>');

  $('#tillbaka').onclick = visaLabbet;
  vy.querySelectorAll('.flik').forEach(f => f.onclick = () => { ljudKlick(); valjStation(f.dataset.st); });
  valjStation(lage.station, !station);
  scrollTo(0,0);
}

function valjStation(st, lasIntro){
  stoppaStation();
  const r = rumFor(lage.rum);
  lage.station = st;
  spar.senast = { rum:lage.rum, station:st }; spara();
  vy.querySelectorAll('.flik').forEach(f => f.classList.toggle('aktiv', f.dataset.st===st));
  const akt = vy.querySelector('.flik.aktiv');
  if(akt && akt.scrollIntoView) akt.scrollIntoView({block:'nearest',inline:'center'});
  if(st==='prov') return provIRum(r);
  const E = EXP[st];
  if(E.typ) startaOvning(r,E,st,lasIntro); else startaExperiment(r,E,st,lasIntro);
}

function nastaStation(){
  const r = rumFor(lage.rum), i = r.exp.indexOf(lage.station);
  const nasta = r.exp.slice(i+1).find(e=>!spar.exp[e]) || r.exp.find(e=>!spar.exp[e]) || 'prov';
  valjStation(nasta===lage.station ? 'prov' : nasta);
  const y = $('#flikar').getBoundingClientRect().top + scrollY - 74;
  scrollTo({ top:y, behavior: lugn()?'auto':'smooth' });
}

function uppdateraFlikar(){
  const r = rumFor(lage.rum);
  vy.querySelectorAll('.flik').forEach(f => {
    const e = f.dataset.st; if(e==='prov') return;
    const i = r.exp.indexOf(e);
    f.classList.toggle('klar', !!spar.exp[e]);
    f.innerHTML = '<span class="kula">'+(spar.exp[e]?'✓':(i+1))+'</span>'+esc(EXP[e].namn);
  });
  hud();
}

          '<li data-i="'+i+'" class="'+(i===0?'nu':'')+'"><span class="ruta">'+(i+1)+'</span><span>'+esc(s)+'</span></li>').join('')+
        '</ol>' : '')+
      '<button class="lasknapp" data-las="'+esc(E.intro+(E.steg?' Att göra. '+E.steg.map((s,i)=>(i+1)+'. '+s).join(' '):''))+
        '">🔊 Lyssna på uppdraget</button>'+

      '<p class="tips" id="tips" aria-live="polite" data-start="'+esc(TIPSSTART[E.typ]||'Tryck på ett reglage och se vad som händer.')+'"></p>'+
      '<button class="hjalpknapp" id="hjalpknapp">💡 Jag fastnar</button>'+
    '</div>'+

}

/* Markerar vilket steg som är på tur och läser upp det. */
function stegLage(gjorda, steg, las_){
  const li = $$('#steglista li');
  let nasta = -1;
  li.forEach(el => {
    const i = +el.dataset.i;
    el.classList.toggle('klar', gjorda.has(i));
    el.classList.remove('nu');
    if(nasta<0 && !gjorda.has(i)) nasta = i;
  });
  if(nasta>=0 && li[nasta]){
    li[nasta].classList.add('nu');
    if(las_) las('Nästa: '+steg[nasta]);
  }
}
/* ---------------------------------------------------------------
   STATION: EXPERIMENT MED CANVAS
   --------------------------------------------------------------- */
function startaExperiment(r,E,id,lasIntro){
  $('#stationsyta').innerHTML = stationSkal(E);
  $('#arbetsyta').innerHTML =
    '<div class="labbyta">'+
      '<div class="scen"><canvas id="duk" width="'+CW+'" height="'+CH+'" role="img" aria-label="'+esc(E.namn)+
        '. Bilden ändras när du ändrar reglagen."></canvas><div class="avlas" id="avlas"></div></div>'+
      '<div class="reglage" id="reglage"></div>'+
    '</div>';
  kopplaLas($('#stationsyta'));

  const duk = $('#duk'), dpr = Math.min(2, window.devicePixelRatio||1);
  duk.width = CW*dpr; duk.height = CH*dpr;
  const ctx = duk.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const gjorda = new Set();
  let fardig = false, hjalp = [], hjalpIndex = 0;

  const visaTips = (text, tyst_, stark) => {
    const t = $('#tips'); if(!t) return;
    t.textContent = text;
    t.classList.toggle('ny', !!text && !!stark);
    if(text && !tyst_) las(text);
  };

  const api = {
    reglage: $('#reglage'), farg: r.farg,
    slider: o => skapaSlider($('#reglage'), o),
    val:    o => skapaVal($('#reglage'), o),
    knapp:  o => skapaKnapp($('#reglage'), o),

    avlas(nyckel, etikett){
      $('#avlas').insertAdjacentHTML('beforeend',
        '<div class="matare"><span>'+esc(etikett)+'</span><b id="m-'+nyckel+'">–</b></div>');
    },
    satt(nyckel, text){
      const e = document.getElementById('m-'+nyckel);
      if(e && e.textContent !== text) e.textContent = text;
    },
    tips: (text, tyst_) => visaTips(text, tyst_, true),

    /* Pekar ut vilket reglage som ska användas just nu. */
    peka(ctlId){
      $$('#reglage .peka').forEach(el => el.classList.remove('peka'));
      if(!ctlId) return;
      const el = document.querySelector('#reglage [data-ctl="'+ctlId+'"]');
      if(el) el.classList.add('peka');
    },

    /* Hjälpstege: mjukt tips först, sedan allt tydligare. */
    hint(lista){ hjalp = Array.isArray(lista) ? lista : [lista]; hjalpIndex = 0; },

    /* klar(i, text): bockar av steg i. Ger du en text som andra argument läser motorn den först och sedan
       «Nästa: …» (eller frågan) i ett enda stycke. Då hamnar slutsatsen före nästa uppdrag, den hinner inte bli
       gammal och frågan avbryter den inte. Utan text läses «Klart! Nästa: …» som förut. */
    klar(i, text){
      if(gjorda.has(i) || fardig) return;
      gjorda.add(i); ljudSteg(); hjalpIndex = 0;
      stegLage(gjorda, E.steg||[], false);
      const fore = text ? String(text).trim()+' ' : '';
      if(E.steg && gjorda.size===E.steg.length){
        fardig = true; api.peka(null);
        setTimeout(()=>vadHande(r,E,id,fore), 620);
      } else if(E.steg){
        const nasta = E.steg.findIndex((_,k)=>!gjorda.has(k));
        if(nasta>=0){
          if(fore) las(fore+'Nästa: '+E.steg[nasta]);
          else setTimeout(()=>las('Klart! Nästa: '+E.steg[nasta]), 380);
        }
      }
    },
    gjort: i => gjorda.has(i),
    las, pip, ljudkontext
  };

  const hk = $('#hjalpknapp');
  hk.onclick = () => {
    ljudKlick();
    if(!hjalp.length){
      const nasta = (E.steg||[]).findIndex((_,k)=>!gjorda.has(k));
      visaTips(nasta>=0 ? 'Gör det här nu: '+E.steg[nasta] : 'Du är klar med alla steg.', false, true);
      return;
    }
    visaTips(hjalp[Math.min(hjalpIndex, hjalp.length-1)], false, true);
    hjalpIndex = Math.min(hjalpIndex+1, hjalp.length-1);
    hk.textContent = hjalpIndex >= hjalp.length-1 ? '💡 Visa igen' : '💡 Mer hjälp';
  };

  let inst = {};
  try{ inst = E.bygg(api) || {}; }
  catch(e){ console.error('Fel i experiment '+id, e);
    visaTips('Något gick fel i experimentet. Prova att ladda om sidan.', true); }

  aktiv = { inst, raf:0 };
  let sist = performance.now(), t = 0;
  const loop = nu => {
    if(!aktiv || aktiv.inst !== inst) return;
    const dt = Math.min(.05,(nu-sist)/1000); sist = nu; t += dt;
    ctx.clearRect(0,0,CW,CH);
    try{ inst.rita && inst.rita(ctx,t,dt); }catch(e){ console.error(e); }
    aktiv.raf = requestAnimationFrame(loop);
  };
  aktiv.raf = requestAnimationFrame(loop);

  stegLage(gjorda, E.steg||[], false);
  if(lasIntro!==false)
    las(E.intro + (E.steg ? ' Första uppdraget: '+E.steg[0] : ''));
}

/* ---- reglagen ---- */
function skapaSlider(mal,o){
  const id = 's-'+o.id, fmt = o.fmt || (v => v + (o.enhet ? ' '+o.enhet : ''));
  mal.insertAdjacentHTML('beforeend',
    '<div class="ctl" data-ctl="'+esc(o.id)+'">'+
      '<label for="'+id+'"><span>'+esc(o.etikett)+'</span><output id="'+id+'-ut">'+esc(fmt(o.varde))+'</output></label>'+
      '<div class="sl"><button type="button" aria-label="Mindre '+esc(o.etikett)+'" id="'+id+'-m">−</button>'+
      '<input type="range" id="'+id+'" min="'+o.min+'" max="'+o.max+'" step="'+(o.steg||1)+'" value="'+o.varde+
        '" aria-label="'+esc(o.etikett)+'">'+
      '<button type="button" aria-label="Mer '+esc(o.etikett)+'" id="'+id+'-p">+</button></div>'+
    '</div>');
  const inp = document.getElementById(id), ut = document.getElementById(id+'-ut');
  const upd = () => { const v = +inp.value; ut.textContent = fmt(v); o.vid && o.vid(v); };
  inp.addEventListener('input', upd);
  const steg = d => { inp.value = clamp(+inp.value + d*(o.steg||1), o.min, o.max); upd(); ljudKlick(); };
  document.getElementById(id+'-m').onclick = () => steg(-1);
  document.getElementById(id+'-p').onclick = () => steg(1);
  return { get:()=>+inp.value, set:v=>{ inp.value=v; upd(); }, el:inp };
}

function skapaVal(mal,o){
  const id = 'v-'+o.id;
  mal.insertAdjacentHTML('beforeend',
    '<div class="ctl" data-ctl="'+esc(o.id)+'"><span class="lbl">'+esc(o.etikett)+'</span>'+
      '<div class="seg" id="'+id+'" role="group" aria-label="'+esc(o.etikett)+'">'+
        o.alt.map(([v,t]) => '<button type="button" data-v="'+esc(v)+'" class="'+
          (String(v)===String(o.varde)?'vald':'')+'">'+esc(t)+'</button>').join('')+
      '</div></div>');
  const grupp = document.getElementById(id);
  let varde = o.varde;
  const satt = (v, tyst_) => {
    varde = v;
    grupp.querySelectorAll('button').forEach(b => b.classList.toggle('vald', b.dataset.v===String(v)));
    if(!tyst_ && o.vid) o.vid(v);
  };
  grupp.querySelectorAll('button').forEach(b => b.onclick = () => {
    ljudKlick();
    const rad = o.alt.find(a => String(a[0])===b.dataset.v);
    satt(rad ? rad[0] : b.dataset.v);
  });
  return { get:()=>varde, set:satt, el:grupp };
}

function skapaKnapp(mal,o){
  mal.insertAdjacentHTML('beforeend',
    '<button type="button" class="knapp '+(o.primar?'primar':'')+'" data-ctl="'+esc(o.id)+'" id="k-'+o.id+'">'+esc(o.text)+'</button>');
  const b = document.getElementById('k-'+o.id);
  b.onclick = () => { ljudKlick(); o.vid && o.vid(); };
  return b;
}

function vadHande(r,E,id,fore){          // fore: text som ska läsas före frågan (från api.klar)

  const ordn = blanda(alt.map((_,i)=>i));
  efter.innerHTML =
    '<div class="fragekort"><p class="etikett">Alla steg klara! Nu förklaringen</p>'+
    '<h3 class="fraga">'+esc(f)+'</h3>'+

      '<button class="altknapp" data-i="'+k+'"><span class="bok">'+'ABCD'[n]+'</span><span>'+esc(alt[k])+'</span></button>').join('')+
    '</div><div id="vhsvar"></div></div>';

    efter.querySelectorAll('#vhalt .altknapp').forEach(x => {
      x.disabled = true;
      if(+x.dataset.i===0) x.classList.add('ratt');
      else if(x===b) x.classList.add('fel');
      else x.classList.add('blek');
    });
    if(ratt){ ljudRatt(); markeraKlar(r,E,id,facit,true); }
    else{
      ljudFel();
      $('#vhsvar').innerHTML =
        '<div class="facit daligt"><b>Inte riktigt</b><p>Rätt svar: <strong>'+esc(alt[0])+'</strong>. '+esc(facit)+'</p></div>'+

      las('Inte riktigt. Rätt svar: '+alt[0]+'. '+facit);
      $('#igen').onclick = () => vadHande(r,E,id);
    }
  });
}

/* ---------------------------------------------------------------
   STATION: ÖVNINGAR (para ihop, ordna, sortera)
   --------------------------------------------------------------- */
function startaOvning(r,E,id,lasIntro){
  $('#stationsyta').innerHTML = stationSkal(E);
  kopplaLas($('#stationsyta'));
  const yta = $('#arbetsyta');
  let fel = 0;
  const gjorda = new Set();

  const visaTips = (text,tyst_) => { const t=$('#tips'); if(!t) return;
    t.textContent=text; t.classList.add('ny'); if(!tyst_) las(text); };
  const klart = () => {
    gjorda.add(0); stegLage(gjorda, E.steg||[], false);
    setTimeout(()=>markeraKlar(r,E,id,(fel ? 'Du fick till det till slut. ' : 'Inga fel på vägen! ')+E.facit), 380);
  };
  const miss = el => { fel++; ljudFel(); el.classList.remove('skaka'); void el.offsetWidth; el.classList.add('skaka'); };

  const hjalpText = { para:'Läs texten till vänster högt för dig själv. Vilken förklaring till höger betyder samma sak?',
    ordning:'Fråga dig: vad måste hända allra först? Börja där.',
    sortera:'Ta ett kort i taget. Läs det och fundera på vilken låda det hör hemma i.',
    rakna:'Ta ett steg i taget. Först formeln, sedan talen, sist svaret. Tänk på enheten.' }[E.typ];
  $('#hjalpknapp').onclick = () => { ljudKlick(); visaTips(E.hjalp || hjalpText); };

  if(E.typ==='para'){
    const V = blanda(E.par.map((p,i)=>({t:p[0],i}))), H = blanda(E.par.map((p,i)=>({t:p[1],i})));
    let vald = null, kvar = E.par.length;
    yta.innerHTML = '<div class="ovning"><div class="parspel" id="par">'+
      '<div class="kol">'+V.map(o=>'<button class="altknapp" data-s="v" data-i="'+o.i+'"><span>'+esc(o.t)+'</span></button>').join('')+'</div>'+
      '<div class="kol">'+H.map(o=>'<button class="altknapp" data-s="h" data-i="'+o.i+'"><span>'+esc(o.t)+'</span></button>').join('')+'</div>'+
    '</div></div>';
    yta.querySelectorAll('#par button').forEach(b => b.onclick = () => {
      if(b.dataset.s==='v'){
        yta.querySelectorAll('[data-s="v"]').forEach(x=>x.classList.remove('vald'));
        b.classList.add('vald'); vald=b; las(b.textContent); return;
      }
      if(!vald){ visaTips('Välj först ett ord i vänstra kolumnen.'); return; }
      las(b.textContent);
      if(vald.dataset.i === b.dataset.i){
        vald.classList.remove('vald'); vald.classList.add('klar'); b.classList.add('klar');
        ljudSteg(); vald=null;
        if(--kvar===0) klart(); else visaTips('Rätt! '+kvar+' kvar.', true);
      } else { miss(b); vald.classList.remove('vald'); vald=null; visaTips('De hör inte ihop. Försök igen.', true); }
    });

  } else if(E.typ==='ordning'){
    let steg = 0;
    yta.innerHTML = '<div class="ovning"><p class="etikett">Din ordning</p><div class="bricklada" id="valda"></div>'+
      '<div class="alt" id="ord">'+blanda(E.ord).map(o=>
        '<button class="altknapp" data-o="'+esc(o)+'"><span>'+esc(o)+'</span></button>').join('')+'</div></div>';
    yta.querySelectorAll('#ord .altknapp').forEach(b => b.onclick = () => {
      if(b.disabled) return;
      if(b.dataset.o === E.ord[steg]){
        b.disabled=true; b.classList.add('blek'); ljudSteg(); las(b.dataset.o);
        $('#valda').insertAdjacentHTML('beforeend','<span class="brick ratt">'+(steg+1)+'. '+esc(b.dataset.o)+'</span>');
        if(++steg === E.ord.length) klart();
      } else { miss(b); visaTips(E.felText || 'Inte den. Något annat händer före.', true); }
    });

  } else if(E.typ==='sortera'){
    let vald = null, kvar = E.saker.length;
    yta.innerHTML = '<div class="ovning"><p class="etikett">Tryck på ett kort och sedan på rätt låda</p>'+
      '<div class="bricklada" id="lada">'+blanda(E.saker.map(s=>({t:s[0],h:s[1]}))).map(o=>
        '<button class="brick" data-h="'+o.h+'">'+esc(o.t)+'</button>').join('')+'</div>'+
      '<div class="hogar">'+E.hogar.map((h,i)=>
        '<button class="hog" data-h="'+i+'"><h4>'+esc(h)+'</h4><div class="innehall"></div></button>').join('')+'</div></div>';
    yta.querySelectorAll('#lada .brick').forEach(b => b.onclick = () => {
      yta.querySelectorAll('#lada .brick').forEach(x=>x.classList.remove('vald'));
      b.classList.add('vald'); vald=b; las(b.textContent);
    });
    yta.querySelectorAll('.hog').forEach(h => h.onclick = () => {
      if(!vald){ visaTips('Välj ett kort först.'); return; }
      if(vald.dataset.h === h.dataset.h){
        const k = document.createElement('span'); k.className='brick ratt'; k.textContent = vald.textContent;
        h.querySelector('.innehall').appendChild(k); vald.remove(); vald=null; ljudSteg();
        if(--kvar===0) klart(); else visaTips('Rätt låda! '+kvar+' kort kvar.', true);
      } else { miss(h); visaTips('Inte den lådan. Läs kortet en gång till.', true); }
    });
  } else if(E.typ==='rakna'){
    /* Räkneverkstad: formel → sätta in talen → svar med enhet. Rätt alternativ står först i varje lista. */
    const lista = blanda(E.uppgifter).slice(0, E.antal || 5);
    const RUB = ['Vilken formel passar?','Sätt in talen','Vad blir svaret?'];
    let u = 0, fas = 0, felUppg = 0, tagna = [];
    yta.innerHTML = '<div class="ovning" id="rk"></div>';
    const rk = $('#rk');
    const ritaUppgift = () => {
      const T = lista[u], lista3 = [T.formel, T.insatt, T.svar], RUBT = T.rubriker || RUB;
      const alt = lista3[fas], ordn = blanda(alt.map((_,i)=>i));
      rk.innerHTML =
        '<p class="etikett">Uppgift '+(u+1)+' av '+lista.length+'</p>'+
        '<div class="framsteg">'+lista.map((_,i)=>'<i class="'+(i<u?'ok':i===u?'nu':'')+'"></i>').join('')+'</div>'+
        (E.minnesregel ? '<p class="citat" style="margin:12px 0">'+esc(E.minnesregel)+'</p>' : '')+
        '<h3 class="fraga" style="font-size:1.16rem;margin-top:10px">'+esc(T.fraga)+'</h3>'+
        '<div class="bricklada">'+T.given.map(g=>'<span class="brick ratt" style="cursor:default">'+esc(g[0])+': <b>'+esc(g[1])+'</b></span>').join('')+'</div>'+
        tagna.map(t=>'<p class="mjuk" style="margin:4px 0">✓ '+esc(t)+'</p>').join('')+
        '<p class="etikett" style="margin-top:14px">Steg '+(fas+1)+' av 3 · '+RUBT[fas]+'</p>'+
        '<div class="alt" id="rkalt">'+ordn.map((k,n)=>
          '<button class="altknapp" data-i="'+k+'"><span class="bok">'+'ABCD'[n]+'</span><span>'+esc(alt[k])+'</span></button>').join('')+'</div>'+
        '<div id="rkfb"></div>';
      las(T.fraga+' '+T.given.map(g=>g[0]+' '+g[1]).join('. ')+'. '+RUBT[fas]+' '+altText(ordn.map(k=>alt[k])));
      rk.querySelectorAll('#rkalt .altknapp').forEach(b => b.onclick = () => {
        if(b.disabled) return;
        if(+b.dataset.i === 0){
          b.classList.add('ratt'); ljudSteg();
          rk.querySelectorAll('#rkalt .altknapp').forEach(x => { x.disabled = true; if(x!==b) x.classList.add('blek'); });
          tagna.push(alt[0]);
          if(++fas < 3){ setTimeout(ritaUppgift, 650); return; }
          if(T.delmoment){
            spar.dm = spar.dm || {};
            const d = spar.dm[T.delmoment] = spar.dm[T.delmoment] || { ratt:0, av:0 };
            d.av++; if(!felUppg) d.ratt++; d.senast = idag(); spara();
          }
          ljudRatt();
          const sist = ++u >= lista.length;
          $('#rkfb').innerHTML = '<div class="facit bra"><b>Rätt!</b><p>'+esc(T.facit)+'</p></div>'+
            '<div class="rad"><button class="knapp primar" id="rkNasta">'+(sist?'Klart ✓':'Nästa uppgift →')+'</button></div>';
          las('Rätt! '+T.facit);
          $('#rkNasta').onclick = () => { tyst(); if(sist) klart(); else { fas = 0; felUppg = 0; tagna = []; ritaUppgift(); } };
          $('#rkNasta').focus({preventScroll:true});
        } else {
          felUppg++; miss(b); b.disabled = true; b.classList.add('fel');
          visaTips((T.tips && T.tips[fas]) || 'Inte riktigt. Läs uppgiften en gång till och försök igen.', true);
        }
      });
    };
    ritaUppgift();
  }
  if(lasIntro!==false) las(E.intro+' '+(E.steg?E.steg.join(' '):''));
}

   PROVEN
   --------------------------------------------------------------- */
function provIRum(r){
  const bast = spar.prov[r.id] || 0;
  const klaraExpHar = r.exp.filter(e=>spar.exp[e]).length;
  $('#stationsyta').innerHTML =
    '<section class="fragekort">'+

        'Svarar du fel får du se rätt svar direkt, och frågan kommer tillbaka senare i provet. '+

/* Väljer n frågor så att varje delmoment får minst en fråga. Resten fördelas efter hur många frågor delmomentet har
   (ett område som läraren lägger mycket tid på har fler frågor och får därför fler på provet). Slumpen avgör
   vilka frågor, inte om ett delmoment råkar saknas. */
function stratifiera(fragor, n){
  const grupper = {};
  blanda(fragor).forEach(q => { const k = q[3] || '_'; (grupper[k] = grupper[k] || []).push(q); });
  const nycklar = Object.keys(grupper), tot = fragor.length;
  if(n >= tot) return blanda(fragor);
  const kvot = {}, rest = [];
  nycklar.forEach(k => { const x = n * grupper[k].length / tot; kvot[k] = Math.max(1, Math.floor(x)); rest.push([x - Math.floor(x), k]); });
  let summa = nycklar.reduce((s,k) => s + kvot[k], 0);
  rest.sort((p,q) => q[0]-p[0] || Math.random()-.5);
  for(let i = 0; summa < n && i < 4*rest.length; i++){ const k = rest[i % rest.length][1]; if(kvot[k] < grupper[k].length){ kvot[k]++; summa++; } }
  const mest = rest.slice().reverse();
  for(let i = 0; summa > n && i < 4*mest.length; i++){ const k = mest[i % mest.length][1]; if(kvot[k] > 1){ kvot[k]--; summa--; } }
  let val = [];
  nycklar.forEach(k => { val = val.concat(grupper[k].slice(0, Math.min(kvot[k], grupper[k].length))); });
  if(val.length > n) val = blanda(val).slice(0, n);               // fler delmoment än frågor på provet
  return blanda(val);
}

/* Delmomenten som hör till ett kompletteringsområde, i den ordning DELMOMENT anger. */
function delmomentFor(s){
  const finns = new Set(s.rum.flatMap(id => rumFor(id).fragor.map(q => q[3]).filter(Boolean)));
  return Object.keys(DELMOMENT).filter(k => finns.has(k));
}

/* Samlad bild av ett delmoment över alla försök: rätt på första försöket. */
function dmStatus(tag){
  const v = spar.dm && spar.dm[tag];
  if(!v || !v.av) return { ratt:0, av:0, pct:null, text:'ej testat än' };
  const pct = Math.round(100*v.ratt/v.av);
  const text = v.av < 3 ? 'för få svar än för att säga något'
    : pct >= 80 ? 'sitter' : pct >= 50 ? 'på väg' : 'behöver mer träning';
  return { ratt:v.ratt, av:v.av, pct, text };
}

/* rumId: ett rumsnummer, 'slut', eller 'kompl:<id>' */
function visaProv(rumId){
  stoppaStation();
  const komplId = typeof rumId==='string' && rumId.indexOf('kompl:')===0 ? rumId.slice(6) : null;
  const komplSpar = komplId ? KOMPLETTERING.find(s=>s.id===komplId) : null;

    n = 20; nAlt = 4; rubrik = 'Kompletteringsprov'; underrubrik = komplSpar.namn;
    pool = stratifiera(komplSpar.rum.flatMap(id => rumFor(id).fragor), n);
  } else if(slut){
    n = 15; nAlt = 4; rubrik = 'Slutprovet'; underrubrik = 'Alla '+antalRumOrd()+' rum';
    pool = blanda(RUM.flatMap(x => blanda(x.fragor).slice(0,3)));

    n = Math.min(8, r.fragor.length); nAlt = r.svar; rubrik = 'Labbprov'; underrubrik = r.namn;
    pool = blanda(r.fragor);
  }
  n = Math.min(n, pool.length);

  let ko = pool.slice(0,n).map(q => ({ q, forsok:0 }));
  let klara = 0, fel = 0, forstaRatt = 0;
  const forstaForsok = {};                 // delmoment -> {ratt, av}

  if(slut || komplSpar){
    lage = { vy:'prov', rum: slut?'slut':null, station:null }; hud();

      '<h2>'+rubrik+'</h2></div><button class="knapp" id="tillbaka">← Tillbaka</button></div>'+
      '<div id="stationsyta"></div>');
    $('#tillbaka').onclick = komplSpar ? visaMal : visaLabbet;
  }
  const yta = $('#stationsyta');

  const visaFraga = () => {
    const post = ko[0], [f, altAlla, facit, delmoment] = post.q;
    const alt = [altAlla[0], ...blanda(altAlla.slice(1)).slice(0, nAlt-1)];
    const ordn = blanda(alt.map((_,i)=>i));
    yta.innerHTML =
      '<section class="fragekort">'+
        '<p class="etikett">'+rubrik+' · fråga '+Math.min(n,klara+1)+' av '+n+
          (post.forsok ? ' · den här kom tillbaka' : '')+'</p>'+
        '<div class="framsteg">'+Array.from({length:n},(_,i)=>
          '<i class="'+(i<klara?'ok':i===klara?'nu':'')+'"></i>').join('')+'</div>'+
        '<h3 class="fraga" style="margin-top:12px">'+esc(f)+'</h3>'+
        '<div class="alt" id="palt">'+ordn.map((k,m)=>
          '<button class="altknapp" data-i="'+k+'"><span class="bok">'+'ABCD'[m]+'</span><span>'+esc(alt[k])+'</span></button>').join('')+
        '</div>'+
        '<button class="lasknapp" id="lasIgen">🔊 Läs frågan igen</button>'+
        '<div id="psvar"></div>'+
      '</section>';
    const upplas = f+' '+altText(ordn.map(k=>alt[k]));
    las(upplas);
    $('#lasIgen').onclick = () => las(upplas, $('#lasIgen'));
    yta.querySelectorAll('#palt .altknapp').forEach(b => b.onclick = () => {
      const ratt = +b.dataset.i === 0;
      yta.querySelectorAll('#palt .altknapp').forEach(x => {
        x.disabled = true;
        if(+x.dataset.i===0) x.classList.add('ratt');
        else if(x===b) x.classList.add('fel');
        else x.classList.add('blek');
      });
      if(delmoment && !post.forsok){
        forstaForsok[delmoment] = forstaForsok[delmoment] || { ratt:0, av:0 };
        forstaForsok[delmoment].av++;
        if(ratt) forstaForsok[delmoment].ratt++;
      }
      if(ratt && !post.forsok) forstaRatt++;
      ko.shift();
      if(ratt){ klara++; ljudRatt(); }
      else { fel++; ljudFel(); post.forsok++; ko.push(post); }

        '<div class="facit '+(ratt?'bra':'daligt')+'"><b>'+(ratt?valj(['Rätt!','Snyggt!','Precis!','Ja!']):'Inte riktigt')+'</b>'+

          (ratt?'':' Frågan kommer tillbaka senare i provet.')+'</p></div>'+
        '<div class="rad"><button class="knapp primar" id="vidare">'+(ko.length?'Nästa fråga →':'Se resultatet')+'</button></div>';

    /* samlad statistik per delmoment över alla prov (rätt på första försöket) */
    spar.dm = spar.dm || {};

      const d = spar.dm[k] = spar.dm[k] || { ratt:0, av:0 };

          '<p>'+(fel===0 ? 'Helt rätt hela vägen. Det här visar att du kan området.'
                : 'Du rättade alla '+fel+' felen innan provet tog slut. Kör gärna igen med nya frågor för att få det helt rent.')+'</p>'+
          '<div class="rad">'+
            '<button class="knapp primar" id="rapport">🖨 Visa resultat för läraren</button>'+
            '<button class="knapp" id="provIgen">Gör om med nya frågor</button>'+
            '<button class="knapp" id="provHem">← Till målkartan</button></div>'+
        '</section>';
      $('#rapport').onclick = visaRapport;
    } else {
      const nyttRekord = slut ? s > (spar.slut||0) : s > (spar.prov[rumId]||0);
      const forstaGang = !slut && !spar.prov[rumId];
      if(slut) spar.slut = Math.max(spar.slut||0, s);
      else spar.prov[rumId] = Math.max(spar.prov[rumId]||0, s);
      spara(); hud();
      const oppnade = !slut && forstaGang && slutUpplast();
      if(s===3 || oppnade) konfetti();
      yta.innerHTML =
        '<section class="fragekort"><p class="etikett">'+rubrik+' klart</p>'+
          '<h3 class="fraga">'+(s===3?'Perfekt – inga fel!':s===2?'Bra jobbat!':'Klart! Alla frågor rätt till slut.')+'</h3>'+
          '<div class="stora-stj">'+[0,1,2].map(i=>'<span data-i="'+i+'">★</span>').join('')+'</div>'+
          '<p>'+(fel===0 ? 'Du svarade rätt på allt direkt.'
            : 'Du hade '+fel+' fel på vägen men rättade allt. Noll fel ger tre stjärnor.')+
            (nyttRekord?' Nytt rekord!':'')+'</p>'+
          (oppnade ? '<p style="color:var(--guld);font-weight:700">Alla '+antalRumOrd()+' labbprov är klara – Slutprovet är öppet!</p>' : '')+
          '<div class="rad">'+
            '<button class="knapp primar" id="provHem">'+(slut?'Till labbet':'Tillbaka till labbet')+'</button>'+
            '<button class="knapp" id="provIgen">Gör om med nya frågor</button></div>'+
        '</section>';
    }
    yta.querySelectorAll('.stora-stj span').forEach((e,i) => {
      if(i<s) setTimeout(()=>{ e.classList.add('tand'); pip(660+i*170,.22,'sine',.05); }, 300+i*320);
    });
    las((s===3?'Perfekt! ':'Provet är klart! ')+'Du fick '+s+' stjärn'+(s===1?'a':'or')+'.');
    $('#provIgen').onclick = () => visaProv(rumId);
    $('#provHem').onclick = komplSpar ? visaMal : visaLabbet;
    if(!slut && !komplSpar)
      vy.querySelectorAll('.flik.prov').forEach(f => { f.classList.add('klar');
        f.innerHTML = '<span class="kula">✓</span>Labbprov '+stjarnor(spar.prov[rumId]); });
  };

  if(komplSpar){
    yta.innerHTML = '<section class="fragekort">'+
      '<p class="etikett">Kompletteringsprov</p><h3 class="fraga">'+esc(komplSpar.namn)+'</h3>'+
      '<p style="margin-top:10px">20 frågor med fyra svarsalternativ, från rum '+rumNrLista(komplSpar.rum)+
        '. Ingen tidsgräns. Efteråt får du en sammanställning per delområde som du kan visa läraren.</p>'+
      '<p class="mjuk" style="margin-top:8px">Det här är ingen officiell bedömning. Det är ett sätt att visa '+
        'vad du redan kan, så att du och läraren vet vad som återstår.</p>'+
      '<div class="rad"><button class="knapp primar stor" id="korProv">Starta kompletteringsprovet</button>'+
      '<button class="knapp" id="pluggKompl">📖 Plugga först</button></div></section>';
    las('Kompletteringsprov i '+komplSpar.namn+'. Tjugo frågor. Efteråt får du en sammanställning du kan visa läraren.');
    $('#korProv').onclick = () => { ljudKlick(); visaFraga(); };

  } else visaFraga();
}

function bygglRapport(){
  const rader = [];
  rader.push('FYSIKLABBET – sammanställning');
  rader.push('Utskriven ' + idag());
  rader.push('Innehållet följer Skolverkets kursplan i fysik, årskurs 7–9 (Lgr22).');
  rader.push('');
  rader.push('ÖVERGRIPANDE');
  rader.push('  Experiment genomförda ... ' + klaraExp() + ' av ' + antalExp());
  rader.push('  Labbprov klarade ........ ' + provKlara() + ' av ' + RUM.length);
  rader.push('  Stjärnor ................ ' + totStj() + ' av ' + maxStj());
  rader.push('');
  rader.push('OMRÅDEN SOM SKULLE KOMPLETTERAS');
  KOMPLETTERING.forEach(s => {
    const f = sparFramsteg(s), k = spar.kompl[s.id];
    rader.push('');
    rader.push('  ' + s.namn.toUpperCase() + '  (rum ' + rumNrLista(s.rum, ', ') + ')');
    rader.push('    Genomfört i spelet ... ' + f.procent + ' %');
    s.rum.forEach(id => {
      const r = rumFor(id);
      rader.push('    Rum ' + rumNr(id) + ' ' + r.namn + ': ' +
        r.exp.filter(e=>spar.exp[e]).length + '/' + r.exp.length + ' experiment, ' +
        'labbprov ' + (spar.prov[id] ? spar.prov[id] + ' av 3 stjärnor' : 'ej gjort'));
    });
    if(k){
      rader.push('    Kompletteringsprov, senast ' + k.datum + ': ' + k.ratt + ' av ' + k.totalt + ' rätt på första försöket');
      if(k.historik && k.historik.length > 1)
        rader.push('    Alla försök: ' + k.historik.map(h => h.ratt + '/' + h.totalt + ' (' + h.datum + ')').join(', '));
    } else {
      rader.push('    Kompletteringsprov: ej gjort än');
    }
    rader.push('    Delområden, rätt på första försöket (alla prov sammanlagt):');
    delmomentFor(s).forEach(d => {
      const st = dmStatus(d);
      rader.push('      ' + (DELMOMENT[d] || d) + ' ... ' +
        (st.av ? st.ratt + '/' + st.av + ' (' + st.pct + ' %) – ' + st.text : st.text));
    });
    if(typeof MUNTLIG !== 'undefined'){
      const mal = MUNTLIG.filter(m => m.omrade === s.id);
      const sagda = mal.filter(m => spar.muntlig && spar.muntlig[m.id]);
      if(mal.length){
        rader.push('    Muntlig träning: ' + sagda.length + ' av ' + mal.length + ' frågor övade, ' +
          sagda.filter(m => spar.muntlig[m.id].niva === 2).length + ' sagda med alla nyckelord');
        const namn = m => DELMOMENT[m.delmoment] || m.delmoment;
        const ovade = mal.filter(m => spar.muntlig && spar.muntlig[m.id] && spar.muntlig[m.id].niva < 2);
        const intet = Array.from(new Set(mal.map(namn))).filter(n => !mal.some(m => namn(m) === n && spar.muntlig && spar.muntlig[m.id]));
        if(ovade.length) rader.push('      Övat men behöver mer muntlig träning: ' + Array.from(new Set(ovade.map(namn))).join(', '));
        if(intet.length) rader.push('      Inte övat muntligt än: ' + intet.join(', '));
      }
    }
  });
  rader.push('');
  rader.push('LABBPROV PER RUM');
  RUM.forEach(r => {
    rader.push('  Rum ' + rumNr(r.id) + ' ' + r.namn + ': ' +
      (spar.prov[r.id] ? spar.prov[r.id] + ' av 3 stjärnor' : 'ej gjort') +
      ' · ' + r.exp.filter(e=>spar.exp[e]).length + '/' + r.exp.length + ' experiment');
  });
  if(spar.slut) rader.push('  Slutprovet: ' + spar.slut + ' av 3 stjärnor');
  rader.push('');
  rader.push('Tre stjärnor betyder noll fel på första försöket.');
  rader.push('«Rätt på första försöket» räknar bara det första svaret på varje fråga.');
  rader.push('Sammanställningen är elevens egen träning, inte en bedömning.');
  return rader.join('\n');
}

/* ---------------------------------------------------------------
   MUNTLIGT – öva på att förklara högt, så som provet hos läraren går till
   Läraren tar proven muntligt, en elev i taget. Här får eleven en fråga, säger
   svaret högt, jämför med ett exempelsvar och nyckelord och bedömer själv.
   Ingen mikrofon, inget skrivande.

   MUNTLIG = [{ id, omrade:'materia'|'optik', delmoment, fraga, borja, svar, nyckelord:[…] }]
   --------------------------------------------------------------- */
const MUNTLIG_PER_OMGANG = 6;
/* Delmoment som ligger utanför lärarens eget material – övas sist och märks som extra. */
const MUNTLIG_EXTRA = ['tryck','rorelse','trafik'];

function antalMuntliga(omradeId){ return MUNTLIG.filter(m => m.omrade === omradeId).length; }
function muntligaKlara(omradeId){
  return MUNTLIG.filter(m => m.omrade === omradeId && spar.muntlig[m.id] && spar.muntlig[m.id].niva === 2).length;
}

/* Väljare: vilket område (och eventuellt delområde) vill du öva muntligt? */
function valjMuntligt(){
  const delmomenten = om => Array.from(new Set(MUNTLIG.filter(m => m.omrade === om).map(m => m.delmoment)));
  visa('<h2>Öva muntligt</h2>'+
    '<p class="mjuk" style="font-size:.93rem">Läraren tar proven muntligt, en elev i taget. '+
      'Här övar du på att säga förklaringen högt. Du får en fråga, svarar högt, och jämför sedan med ett exempel.</p>'+
    '<div class="valrad">'+
      KOMPLETTERING.map(s => {
        const n = antalMuntliga(s.id);
        return '<button class="knapp primar" data-mu="'+s.id+'" style="flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 18px">'+
          '<span>'+esc(s.namn)+' – blandat</span>'+
          '<small style="font-weight:400;font-size:.8rem;opacity:.8">'+muntligaKlara(s.id)+' av '+n+' frågor sagda med alla nyckelord</small></button>'+
          '<details class="malruta" style="margin:0 0 4px"><summary>Välj ett delområde i '+esc(s.namn)+'</summary><div class="innehall"><div class="valrad" style="margin-top:6px">'+
          delmomenten(s.id).map(d => {
            const mal = MUNTLIG.filter(m => m.omrade === s.id && m.delmoment === d);
            const klara = mal.filter(m => spar.muntlig[m.id] && spar.muntlig[m.id].niva === 2).length;
            return '<button class="knapp" data-mu="'+s.id+'" data-dm="'+d+'" style="justify-content:space-between;width:100%"><span>'+esc(DELMOMENT[d]||d)+
              '</span><small style="font-family:var(--mono)">'+klara+'/'+mal.length+'</small></button>';
          }).join('')+'</div></div></details>';
      }).join('')+
      '<button class="knapp" id="muAvbryt">Avbryt</button>'+
    '</div>');
  overlagg.querySelectorAll('[data-mu]').forEach(b => b.onclick = () => { ljudKlick(); dolj(); visaMuntligt(b.dataset.mu, b.dataset.dm); });
  $('#muAvbryt').onclick = dolj;
}

function visaMuntligt(omradeId, delmoment){
  stoppaStation();
  const s = KOMPLETTERING.find(x => x.id === omradeId);
  const alla = MUNTLIG.filter(m => m.omrade === omradeId && (!delmoment || m.delmoment === delmoment));
  if(!s || !alla.length){ visaLabbet(); return; }
  lage = { vy:'muntligt', rum:null, station:null }; hud();

  /* de som sitter sämst först; slumpen avgör inom samma nivå */
  const rang = m => { const v = spar.muntlig[m.id]; return (v ? v.niva*10 + 5 : -1) + (MUNTLIG_EXTRA.includes(m.delmoment) ? 100 : 0); };
  const urval = blanda(alla).sort((a,b) => rang(a)-rang(b)).slice(0, MUNTLIG_PER_OMGANG);
  const ko = urval.slice(), betyg = {}, antal = urval.length, igen = new Set();
  let gjorda = 0;
