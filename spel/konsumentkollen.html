function stegKarta(){
  if(!mask)byggMask();
  karta.bat=arVatten(karta.x,karta.y);
  const fart=karta.bat?1.7:2.6; let dx=0,dy=0;
  if(tang.vanster)dx-=1; if(tang.hoger)dx+=1;
  if(tang.upp)dy-=1; if(tang.ner)dy+=1;
  if(dx||dy){const l=Math.hypot(dx,dy);karta.x+=dx/l*fart;karta.y+=dy/l*fart;
    if(dx)karta.riktning=dx>0?1:-1;
    karta.fart=fart; karta.steg+=fart*.24;}
  else karta.fart=0;
  karta.x=clamp(karta.x,10,MW-10); karta.y=clamp(karta.y,16,MH-10);
  karta.narmast=null;
  for(const p of PLATSER) if(Math.hypot(p.x-karta.x,p.y-karta.y)<34) karta.narmast=p;
  if(hoppTryck){
    hoppTryck=false;
    if(karta.narmast){
      if(uppLast(karta.narmast.id)) startaBana(karta.narmast.id);
      else { pip(180,.2,'square',.05); las('Den här platsen är låst. Klara banan innan först.'); }
    }
  }
  karta.cam.x+=(clamp(karta.x-W/2,0,Math.max(0,MW-W))-karta.cam.x)*.15;
  karta.cam.y+=(clamp(karta.y-VH/2,0,Math.max(0,MH-VH))-karta.cam.y)*.15;
}

function ritaKarta(){
  if(!mask)byggMask();
  const cx=Math.round(karta.cam.x), cy=Math.round(karta.cam.y);
  ctx.fillStyle='#0B1226'; ctx.fillRect(0,0,W,VH);
  ctx.save(); ctx.translate(-cx,-cy);

  // hav
  ctx.fillStyle='#2E6C93'; ctx.fillRect(0,0,MW,MH);
  ctx.globalAlpha=.16; ctx.strokeStyle='#CFE9F5'; ctx.lineWidth=2;
  for(let i=0;i<70;i++){const x=(i*173)%MW, y=(i*277)%MH;
    ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+7,y-3,x+14,y);ctx.quadraticCurveTo(x+21,y+3,x+28,y);ctx.stroke();}
  ctx.globalAlpha=1;
  // land
  [ON,HOLMEN].forEach(l=>fyllGeo(l,'#C6CFA2'));
  // parker och dungar
  ctx.fillStyle='#A8B886';
  for(let i=0;i<160;i++){const x=(i*151)%MW,y=(i*233)%MH;
    if(!arVatten(x,y)){ctx.beginPath();ctx.ellipse(x,y,9,4,0,0,7);ctx.fill();}}
  // bergen
  for(const kedja of BERG)
    for(let i=0;i<kedja.length-1;i++){
      const [x1,y1]=P(kedja[i][0],kedja[i][1]), [x2,y2]=P(kedja[i+1][0],kedja[i+1][1]);
      const n=Math.max(2,Math.round(Math.hypot(x2-x1,y2-y1)/20));
      for(let j=0;j<n;j++){const t=j/n,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t+((j%2)?4:-3);
        tri(x-12,y+6,x+12,y+6,x,y-11,'#9C9184'); tri(x-5,y-1,x+5,y-1,x,y-11,'#F2F6FF');}
    }
  // vägar
  for(const v of VAGAR){ strackGeo(v,'#E2D6B4',7); strackGeo(v,'#CDBF98',3); }
  // sjö, vik och å
  [SJON,VIKEN].forEach(s=>fyllGeo(s,'#2E6C93'));
  strackGeo(ALVEN,'#3B7FA6',3);
  // kustlinje
  ctx.globalAlpha=.5;
  [ON,HOLMEN].forEach(l=>{bana(l,true); ctx.strokeStyle='#8FD0EA';ctx.lineWidth=2;ctx.stroke();});
  ctx.globalAlpha=1;
  // resvägen
  ctx.strokeStyle='rgba(246,237,218,.5)';ctx.lineWidth=3;ctx.setLineDash([7,8]);
  ctx.beginPath();ctx.moveTo(PLATSER[0].x,PLATSER[0].y);
  for(let i=1;i<PLATSER.length;i++){const a=PLATSER[i-1],b=PLATSER[i];
    ctx.quadraticCurveTo((a.x+b.x)/2+((i%2)?26:-26),(a.y+b.y)/2-14,b.x,b.y);}
  ctx.stroke();ctx.setLineDash([]);
  // regionnamn
  ctx.textAlign='center';
  for(const [namn,lo,la,typ,st] of REGIONER){
    const [x,y]=P(lo,la);
    ctx.font=`700 ${st}px Assistant,sans-serif`;
    ctx.fillStyle= typ==='hav'?'rgba(228,244,252,.75)': typ==='sjo'?'rgba(226,242,250,.9)'
                 : typ==='flod'?'rgba(226,242,250,.85)':'rgba(60,70,40,.55)';
    ctx.save();
    if(typ==='flod'){ctx.translate(x,y);ctx.rotate(-.5);ctx.fillText(namn,0,0);}
    else{ctx.translate(x,y);ctx.fillText(namn.split('').join(String.fromCharCode(8202)),0,0);}
    ctx.restore();
  }
  ctx.textAlign='left';
  // hänvisningsstreck
  for(const p of PLATSER) if(p.pekar){
    const m=PLATSER.find(q=>q.id===p.pekar);
    ctx.strokeStyle='rgba(246,237,218,.45)';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(p.x,p.y+2);ctx.lineTo(m.x,m.y-20);ctx.stroke();ctx.setLineDash([]);
  }
  // platser
  for(const p of PLATSER) ritaPlatsIkon(p,uppLast(p.id));
  for(const p of PLATSER) ritaEtikett(p);
  // spelaren (med båt på vatten)
  if(karta.bat){
    const b=Math.sin(tick/12)*1.5;
    ritaSpelare({x:karta.x-8,y:karta.y-26+b,w:15,h:24,riktning:karta.riktning,paMark:true,vx:0,steg:0});
    ctx.fillStyle='#8A6A44';ctx.beginPath();
    ctx.moveTo(karta.x-15,karta.y-4+b);ctx.lineTo(karta.x+15,karta.y-4+b);

    ctx.globalAlpha=.6;

    ctx.globalAlpha=1;
  }else{
    ritaSpelare({x:karta.x-8,y:karta.y-24,w:15,h:24,riktning:karta.riktning,paMark:true,
      vx:karta.fart*1.25,steg:karta.steg});
  }
  // kompass
  const [kx,ky]=P(0.55,0.75);
  cirkel(kx,ky,15,'rgba(12,20,40,.6)');
  tri(kx,ky-12,kx-5,ky+4,kx+5,ky+4,'#F6EDDA');
  ctx.fillStyle='#F6EDDA';ctx.font='700 9px Assistant,sans-serif';ctx.textAlign='center';
  ctx.fillText('N',kx,ky+13);ctx.textAlign='left';
  ctx.restore();


  // minikarta
  const mw=56,mh=Math.round(mw*MH/MW),mx=W-mw-10,my=10;
  ctx.fillStyle='rgba(10,16,34,.8)';ctx.fillRect(mx-3,my-3,mw+6,mh+6);
  ctx.fillStyle='rgba(150,172,124,.45)';ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle='rgba(246,237,218,.35)';ctx.lineWidth=1;
  ctx.beginPath();
  PLATSER.forEach((q,i)=>{const px=mx+q.x/MW*mw,py=my+q.y/MH*mh;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
  ctx.stroke();
  for(const q of PLATSER){const px=mx+q.x/MW*mw,py=my+q.y/MH*mh;
    cirkel(px,py,3,(spar.ljus[q.id]||0)>0?'#F2A83B':uppLast(q.id)?'#5B87F0':'#5A6280');}
  const pxs=mx+karta.x/MW*mw,pys=my+karta.y/MH*mh;
  ctx.globalAlpha=.5+.5*Math.abs(Math.sin(tick/22)); cirkel(pxs,pys,5,'#FFFFFF'); ctx.globalAlpha=1;
  cirkel(pxs,pys,2.4,'#FFFFFF');

  // pil mot nästa mål
  const mal=PLATSER.find(q=>uppLast(q.id)&&!((spar.ljus[q.id]||0)>0));
  if(mal && karta.narmast!==mal){
    const sx=mal.x-cx, sy=mal.y-cy;
    if(sx<24||sx>W-24||sy<24||sy>VH-70){
      const mx2=W/2, my2=(VH-38)/2, dx=sx-mx2, dy=sy-my2, l=Math.hypot(dx,dy)||1;
      const r=Math.min(W,VH-38)/2-30, ax=mx2+dx/l*r, ay=my2+dy/l*r;

      tri(-10,-9,-10,9,12,0,'#F2A83B'); ctx.globalAlpha=1; ctx.restore();
    }
  }
  // banner
  ctx.fillStyle='rgba(10,16,34,.78)';ctx.fillRect(0,VH-38,W,38);
  ctx.fillStyle='#F6EDDA';ctx.font='600 13px Assistant,sans-serif';ctx.textAlign='center';
  if(karta.narmast){
    const v=VARLDAR.find(v=>v.id===karta.narmast.id);

    ctx.fillText(uppLast(v.id)? `${v.namn} – ${g} för att gå in` : `${v.namn} är låst – klara bana ${v.id-1} först`, W/2,VH-15);

  }else{
    ctx.fillText(pekskarm()?'Gå omkring med pilarna · gå fram till en plats och tryck HOPP'
      :'Gå omkring med piltangenterna · tryck mellanslag vid en plats',W/2,VH-15);

  ctx.textAlign='left';

/* =======================  LOOP  ======================= */
let sist=0,ack=0;
function loop(nu){
  requestAnimationFrame(loop);
  const dt=Math.min(50,nu-sist); sist=nu; ack+=dt;
  let steg=0;
  while(ack>=16.7 && steg<3){ ack-=16.7; steg++;
    tick++;
    if(!pausad){ if(lage==='bana')stegBana(); else stegKarta(); }
    else hoppTryck=false;
  }
  if(lage==='bana'&&spel) ritaBana(); else ritaKarta();
}
