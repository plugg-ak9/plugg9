  </div>
</div>

<script>
/* =======================================================================
   FRÅGEBANK – allt hämtat ur SO-serien Samhällskunskap 7–9 (Liber),
   kapitel 1–24. Banorna följer Lgr22:s fem kunskapsområden.
   ======================================================================= */
const VARLDAR=[
{id:1,namn:'Hemma',under:'Hemma – samhället, du och de andra',tema:'smaland',del:'Individer och gemenskaper',kap:'kap. 1–4 · s. 4–64',portar:3,langd:56,svar:2,
 fragor:[
  ['Vad betyder urbanisering?',['Att många flyttar från landet till städerna','Att många flyttar från städerna till landet'],'För 150 år sedan bodde de flesta på landsbygden. Idag bor de flesta i städer.'],
  ['Vad betyder migration?',['Att människor flyttar mellan länder','Att människor åker på semester utomlands'],'Migration är samlingsnamnet för både utvandring och invandring.'],
  ['Vad betyder emigration?',['Utvandring – att flytta från ett land','Invandring – att flytta till ett land'],'Under 1800-talet emigrerade många svenskar. De flesta flyttade till Nordamerika.'],
  ['Vad betyder immigration?',['Invandring – att flytta till ett land','Utvandring – att flytta från ett land'],'Idag är det fler som immigrerar till Sverige än som lämnar landet.'],
  ['Vad menas med levnadsstandard?',['Hur bra man har det med bostad, mat, lön och vård','Hur många som bor i landet och hur gamla de blir'],'För 150 år sedan var Sverige fattigt och levnadsstandarden mycket lägre än idag.'],
  ['Vad betyder medellivslängd?',['Hur gamla människor i genomsnitt blir','Hur gammal den äldsta personen i landet är'],'För 150 år sedan blev man i snitt ungefär 41 år. Idag ungefär 80 år.'],
  ['Vad betyder jämställdhet?',['Att kvinnor och män har samma rättigheter','Att alla människor har lika mycket pengar'],'Sverige räknas som ett av världens mest jämställda länder, men kvinnor har fortfarande ofta lägre lön än män.'],
  ['Vad betyder jämlikhet?',['Att alla har samma rättigheter och samma värde','Att alla människor ska tycka och tänka likadant'],'Ett jämlikt samhälle är ett samhälle där alla har samma rättigheter och samma värde.'],
  ['Vad betyder sekularisering?',['Att religionen blir mindre viktig i samhället','Att kyrkan får allt mer makt över samhället'],'För 150 år sedan hade kyrkan stor makt. Idag är Sverige ett av världens mest sekulariserade länder.'],
  ['Vad betyder allmän och lika rösträtt?',['Alla medborgare över 18 får rösta och varje röst väger lika','Alla får rösta, men den som betalar mest skatt får fler röster'],'Förr fick inte alla rösta, och allas röster var inte lika mycket värda.'],
  ['Vad är en norm?',['En oskriven regel för hur man ska bete sig','En lag i lagboken som säger hur man ska bete sig'],'De flesta regler om hur vi ska vara mot andra är inte nedskrivna – dem lär man sig steg för steg.'],
  ['Vad är din identitet?',['Din egen uppfattning om vem du är','Det som står i ditt pass och id-kort'],'Identiteten byggs upp av alla upplevelser och erfarenheter som format din personlighet.'],
  ['Vad är grupptryck?',['När man gör något man inte vill, för att passa in i gruppen','När alla i en grupp hjälps åt för att klara en svår uppgift'],'Grupptryck handlar om rädslan för att stöta sig med de andra i gruppen.'],
  ['Vad är mobbning?',['När en person utsätts för elakheter gång på gång','När två personer bråkar med varandra en gång'],'Det kan handla om att bli retad, knuffad eller utfryst – eller om kränkningar som sprids på sociala medier.'],
  ['Vad är diskriminering?',['När någon behandlas orättvist på grund av till exempel kön','När någon får lägre lön för att den har jobbat färre timmar'],'Diskriminering kan också handla om funktionsnedsättning, sexuell läggning eller ålder.'],
  ['Vad menas med genus?',['Det sociala könet – hur killar och tjejer förväntas vara','Det biologiska könet – hur kroppen ser ut från födseln'],'Det biologiska könet beror på kroppen, könsidentiteten på vad du känner dig som, och genus på samhällets förväntningar.'],
  ['Vad betyder heteronormen?',['Att det förväntas att en kille och en tjej blir ett par','Att alla får gifta sig med den de vill, oavsett kön'],'På de flesta håll i världen är det norm att en kille blir kär i en tjej och tvärtom.'],
  ['Vad står HBTQ för?',['Homosexuell, bisexuell, transperson och queer','Hälsa, bildning, trygghet och kvalitet'],'Många unga homo- och bisexuella upplever att de bemöts på ett förnedrande sätt, men situationen har förbättrats.'],
  ['Vad menas med socialt arv?',['Att man "ärver" föräldrarnas livsstil och yrkesval','Att man ärver föräldrarnas pengar och hus när de dör'],'Föräldrarnas utbildning och inkomst är socioekonomiska faktorer som påverkar även livet som vuxen.'],
  ['Vad är ett mångkulturellt samhälle?',['Ett samhälle där flera kulturer finns och tillåts','Ett samhälle där alla måste leva efter samma kultur'],'Samhället blir mer mångkulturellt när vi reser och när människor från andra länder flyttar hit.'],
  ['Vad betyder segregation?',['Att människor i samma land lever åtskilda och har det olika','Att människor från olika länder bor blandat i samma område'],'Främlingsfientlighet och utanförskap bidrar till segregation.'],
  ['Vad betyder utanförskap?',['Att hamna utanför gemenskapen i samhället','Att bo utanför tätorten, ute på landet'],'Utanförskap och främlingsfientlighet riskerar att leda till en uppdelning i "vi och dom".'],
  ['Vad är en subkultur?',['En grupp som lever på ett annat sätt än de flesta','Ett annat ord för ett nationellt minoritetsspråk'],'Subkulturer finns i alla samhällen och är en del av mångfalden.'],
  ['Vem räknas som flykting?',['Den som måste fly och söka skydd i ett annat land','Den som flyttar till ett annat land för att jobba'],'Orsaken till flykten kan vara krig, miljökatastrof eller förföljelse. Alla invandrare är inte flyktingar.'],
  ['Vad betyder asyl?',['Att få skydd i ett annat land än sitt eget','Att få lov att jobba i ett annat land'],'Sverige har, liksom över 150 andra länder, skrivit på FN:s flyktingkonvention.'],
  ['Vilken myndighet tar hand om asylsökande i Sverige?',['Migrationsverket','Försäkringskassan'],'Migrationsverket ordnar bostad medan man väntar på besked om man får stanna.'],
  ['Vad handlar integration om?',['Att den som kommer hit blir en del av samhället','Att den som kommer hit måste glömma sin gamla kultur'],'Både flyktingar och andra invandrare behöver komma in i samhället – integrationen måste fungera.'],
  ['Vad är den mest omfattande beskrivningen av begreppet "samhälle"?',['Ett land med dess invånare, lagar och allt som människor har byggt tillsammans.','Endast de byggnader och vägar som staten har ansvarat för att konstruera.','En samling människor som enbart förenas av att de pratar samma språk.','De lagar och regler som polisen och domstolarna använder för att döma brottslingar.'],'Begreppet innefattar både den fysiska miljön, människorna som lever där och de regler som styr deras samlevnad.'],
  ['Varför är samhällskunskap ett ämne som hela tiden förändras?',['Eftersom samhället hela tiden förändras med nya lagar, politiker och ny teknik.','Eftersom länders gränser i Europa ritas om helt och hållet varje år.','Eftersom de demokratiska grundprinciperna byts ut mot nya system med jämna mellanrum.','Eftersom forskare hittar nya historiska dokument som ändrar på hur forntiden såg ut.'],'Samhällskunskap speglar verkligheten, och när lagar stiftas eller ny teknik införs måste ämnet uppdateras för att vara relevant.'],
  ['Vad innebär begreppet "politik" i sitt ursprungliga sammanhang?',['Förmågan eller konsten att styra en stat eller ett land.','Rätten för alla medborgare att få rösta i fria val.','Läran om hur man hushåller med begränsade resurser och pengar.','Ett system där makten delas mellan kungen och folket.'],'Ordet kommer från grekiskan och avser de metoder och beslut som används för att leda ett samhälle.'],
  ['Vilket är ett tydligt exempel på hur globaliseringen påverkar samhället?',['En ekonomisk kris i en del av världen påverkar snabbt många andra länder.','Alla länder i världen har numera exakt samma lagar och regler för sina medborgare.','Människor har slutat resa mellan länder eftersom all information finns på internet.','Varje land producerar nu allting de behöver inom sina egna gränser.'],'Globaliseringen innebär att länders ekonomier och politik är sammanlänkade, vilket gör dem beroende av varandra.']
 ]},
{id:2,namn:'Visby',under:'Almedalen – demokrati eller diktatur',tema:'gotland',del:'Demokratiska rättigheter',kap:'kap. 5 · s. 66–84',portar:4,langd:62,svar:3,
 fragor:[
  ['Vad betyder demokrati?',['Att folket ska vara med och bestämma','Att en enda person bestämmer över allt','Att de som är rikast bestämmer allt'],'Demokrati betyder folkstyre. Alla har rätt att vara med och påverka.'],
  ['Vad kännetecknar en diktatur?',['Några få styr och man får inte säga vad man tycker','Alla över 18 år får rösta i fria och hemliga val','Det finns många fria tidningar som granskar makten'],'I en diktatur vågar de flesta inte öppet ifrågasätta hur landet styrs.'],
  ['Vad är representativ demokrati?',['Vi röstar på politiker som fattar besluten åt oss','Alla röstar direkt om varje enskild fråga','Kungen väljer vilka politiker som ska styra landet'],'Politikerna ska representera våra åsikter – därför heter det representativ demokrati.'],
  ['Vad är direkt demokrati?',['Alla röstar själva om en fråga, som i en folkomröstning','Politikerna i riksdagen röstar i vårt ställe om allt','Regeringen bestämmer ensam utan att fråga riksdagen'],'Folkomröstningar är ett exempel på direkt demokrati, till exempel om Sverige ska vara med i EU.'],
  ['Vad menas med valhemlighet?',['Ingen får tvinga dig att tala om hur du röstar','Att valresultatet hålls hemligt för folket','Att bara vissa får veta när det är val'],'Ingen får heller bestämma hur någon annan ska rösta.'],
  ['Vad menas med majoritet?',['Det förslag som får flest röster','Den minsta gruppen i hela landet','Att alla måste rösta likadant'],'Demokratiska beslut bygger på vad de flesta anser – på majoritetsbeslut.'],
  ['Vad är en opinion?',['När många har samma åsikt i en fråga','En omröstning bland politikerna i riksdagen','Ett beslut som en domstol har fattat'],'Ju fler som har samma uppfattning, desto starkare opinion och desto större möjlighet att påverka.'],
  ['Vad är civil olydnad?',['Att bryta mot en lag med flit för att protestera','Att låta bli att rösta i valet som protest','Att demonstrera på gatan med tillstånd från polisen'],'Om många använder civil olydnad kan det bli problem, eftersom demokratin bygger på att alla accepterar reglerna.'],
  ['Vad är en folkrörelse?',['Många som tillsammans kämpar för en viktig fråga','Ett politiskt parti som har platser i riksdagen','En myndighet som ser till att lagarna följs'],'Miljörörelsen, kvinnorörelsen och människorättsrörelsen är exempel på folkrörelser.'],
  ['Vad betyder rättssäkerhet?',['Att alla döms lika efter lagen, rik som fattig','Att polisen själv får bestämma vem som är skyldig','Att rättegångar hålls hemliga så att ingen störs'],'Rättssäkerheten är en av de viktigaste grunderna i en demokrati.'],
  ['Vad är censur?',['Att staten granskar och stoppar det medier säger','Att en tidning rättar ett fel som den har skrivit','Att man själv tar bort ett inlägg på sociala medier'],'Censur är vanligt i diktaturer.'],
  ['Vem har upprättat de mänskliga fri- och rättigheterna?',['FN','EU','Sveriges riksdag'],'De har skrivits under av nästan alla länder i världen.'],
  ['Hur gammal måste man vara för att få rösta i Sverige?',['18 år','16 år','21 år'],'Allmän och lika rösträtt gäller alla svenska medborgare över 18 år.'],
  ['Vad är typiskt för valen i en diktatur?',['Bara de som ledarna godkänner får ställa upp','Alla partier får ställa upp och tävla fritt','Det hålls val varje år med många partier'],'Ibland får inte ens alla rösta. Människor behandlas inte jämlikt i en diktatur.'],
  ['Hur börjar FN:s allmänna förklaring om de mänskliga rättigheterna?',['Alla människor är födda fria och lika i värde och rättigheter','Alla människor ska lyda de lagar och regler som gäller där de bor','Alla människor ska ha lika mycket pengar och lika stora hem'],'Det är grundtanken bakom alla demokratiska rättigheter.'],
  ['Varför har vissa minoriteter särskilt skydd i Sverige?',['För att beslut som passar de flesta kan drabba en liten grupp','För att de får fler röster i riksdagen än andra grupper','För att de betalar mer skatt än alla andra invånare'],'Därför har riksdagen bestämt att några minoriteter ska ha särskilt skydd.'],
  ['Hur kan du påverka utan att rösta?',['Samla namn, skriva insändare och skapa opinion','Det går inte – bara röstning i valet påverkar','Genom att betala mer skatt så att politikerna lyssnar'],'För att demokratin ska fungera måste medborgarna engagera sig och våga säga ifrån.'],
  ['Vad menas med att inget land har en perfekt demokrati?',['Om folk slutar rösta och protestera fungerar inte demokratin','Att alla länder i världen i själva verket är diktaturer','Att en demokrati alltid fungerar sämre än en diktatur'],'Erfarenheten visar ändå att de flesta har ett väsentligt bättre liv i en demokrati.']
 ]},
{id:3,namn:'Sápmi',under:'Jokkmokk – minoriteter och mänskliga rättigheter',tema:'fjall',del:'Demokratiska rättigheter',kap:'kap. 6 · s. 85–106',portar:4,langd:66,svar:3,
 fragor:[
  ['Vilka är Sveriges fem nationella minoriteter?',['Samer, sverigefinnar, tornedalingar, romer och judar','Samer, tornedalingar, norrmän, romer och danskar','Samer, sverigefinnar, romer, judar och syrianer'],'Riksdagen har bestämt att just dessa fem grupper ska ha särskilda rättigheter.'],
  ['Vad är ett urfolk?',['Ett folk som levde i området innan landet bildades','Den största folkgruppen som bor i ett land idag','En folkgrupp som nyligen har flyttat till landet'],'Det finns flera urfolk i världen med egen kultur, egna seder och eget språk.'],
  ['Vilken av Sveriges minoriteter räknas som urfolk?',['Samerna','Romerna','Sverigefinnarna'],'Samerna levde i norra Sverige långt innan landet Sverige bildades.'],
  ['Vad heter samernas område?',['Sápmi','Meänkieli','Tornedalen'],'Sápmi ligger i norra Sverige, Norge, Finland och Ryssland.'],
  ['Vad heter samernas egen "riksdag"?',['Sametinget','Samerådet','Lapplandsrådet'],'Samerna har en egen folkvald församling som kallas sameting.'],
  ['Vilka är Sveriges nationella minoritetsspråk?',['Samiska, finska, meänkieli, romani chib och jiddisch','Samiska, norska, danska, finska och romani chib','Finska, tyska, romani chib, jiddisch och samiska'],'Rätten att tala sitt eget språk är viktig för att behålla sin kultur och identitet.'],
  ['Vad heter tornedalingarnas språk?',['Meänkieli','Jiddisch','Romani chib'],'Meänkieli har finska rötter men är uppblandat med svenska ord och uttryck.'],
  ['Vad heter romernas språk?',['Romani chib','Meänkieli','Jiddisch'],'Romerna är egentligen flera folkgrupper som bor över hela världen.'],
  ['Vilket språk har utvecklats av judar främst i Östeuropa?',['Jiddisch','Hebreiska','Meänkieli'],'Jiddisch talas av en del judar i Sverige.'],
  ['Vilka tre minoritetsspråk har ett förstärkt skydd?',['Samiska, finska och meänkieli','Jiddisch, romani chib och finska','Samiska, jiddisch och romani chib'],'I vissa områden har man rätt att använda dessa språk i kontakt med myndigheter.'],
  ['Vad kallas främlingsfientlighet mot judar?',['Antisemitism','Rasism i allmänhet','Segregation'],'Antisemitism finns även idag.'],
  ['Vad kallas mordet på ungefär sex miljoner judar under andra världskriget?',['Förintelsen','Diasporan','Utvandringen'],'Även många europeiska romer mördades i Förintelsen.'],
  ['Vad menas med en nationell minoritet?',['En liten folkgrupp som har fått särskilda rättigheter','Alla som har invandrat till ett land de senaste åren','Den största folkgruppen, som bestämmer mest i landet'],'Samhället har skyldighet att stödja grupperna så att de kan behålla sitt språk och sina traditioner.'],
  ['Vad kallas de första romer som kom till Sverige för 500 år sedan?',['Resandefolket','Tornedalingarna','Sverigefinnarna'],'Staten har tidigare i historien behandlat många romer mycket illa.'],
  ['Vad är en stereotyp bild av en grupp?',['En förenklad bild av hur en hel grupp är','En bild av en grupp som visas i en tidning','Ett foto som visar en hel folkgrupp'],'Många tror till exempel att samer i allmänhet sysslar med rennäring, trots att bara en liten grupp gör det.'],
  ['Vilka är sverigefinnarna?',['De som bor i Sverige och har finskspråkig bakgrund','De som bor i Finland och har svenskspråkig bakgrund','De som bor i Tornedalen och talar meänkieli'],'Finsktalande har funnits mycket länge i det som idag är Sverige.'],
  ['Vilken rättighet lyfts fram särskilt för minoriteterna?',['Rätten att använda sitt eget språk','Rätten att få bo gratis i en bostad','Rätten att slippa betala skatt'],'Eleverna har också rätt till undervisning på och i minoritetsspråket.'],
  ['Vad handlar konflikterna i Sápmi ofta om idag?',['Rätten till marken','Rätten att rösta','Rätten att gå i skolan'],'Konflikterna står mellan samer, staten och företag.'],
  ['Vad står i Europakonventionen och Barnkonventionen?',['Rättigheter som alla människor och alla barn bör ha','Regler för vilka länder som får vara med i EU','Regler för hur handeln mellan länder ska gå till'],'Till exempel rätt till liv, frihet och personlig säkerhet.']
 ]},
{id:4,namn:'Jönköping',under:'Göta hovrätt – lag och rätt',tema:'domstol',del:'Lag och rätt',kap:'kap. 7–10 · s. 107–164',portar:4,langd:70,svar:4,
 fragor:[
  ['Vad heter boken med Sveriges viktigaste lagar?',['Sveriges rikes lag','Riksdagens protokoll','Regeringsformen','Brottsbalken'],'Lagboken är ungefär 3 000 sidor tjock. Alla lagar finns i Svensk författningssamling.'],
  ['Vilken lag står först i Lagboken?',['Regeringsformen','Brottsbalken','Skollagen','Successionsordningen'],'Där står att "All offentlig makt i Sverige utgår från folket".'],
  ['Vem stiftar lagarna i Sverige?',['Riksdagen','Regeringen','Domstolarna','Polisen'],'Riksdagen beslutar också vilka gamla lagar som ska tas bort.'],
  ['Vem dömer den som har brutit mot lagen?',['Domstolarna','Riksdagen','Regeringen','Polisen'],'Att många olika yrkesgrupper är inblandade gör rättssystemet öppnare och mer demokratiskt.'],
  ['Vad handlar civilrätt om?',['Avtal, arv och äktenskap mellan privatpersoner','Brott och straff, som stöld och misshandel','Regler mellan staten och invånarna, som skollagen','Regler för handel och tullar mellan olika länder'],'Civilrätt kallas också privaträtt.'],
  ['Vad handlar straffrätt om?',['Brott och straff, som stöld och misshandel','Avtal, arv och äktenskap mellan privatpersoner','Regler för skola och sjukvård i kommunen','Hur riksdagen och regeringen ska arbeta'],'De viktigaste bestämmelserna finns samlade i brottsbalken.'],
  ['Vad handlar offentlig rätt om?',['Vårt förhållande till stat, kommun och region','Arv, avtal och äktenskap mellan privatpersoner','Brott och straff, som stöld och misshandel','Handel och tullar mellan olika länder'],'Hit hör också sjukvårdslagen och semesterlagen.'],
  ['I vilka fyra grupper delas brotten i brottsbalken?',['Brott mot person, förmögenhet, staten och allmänheten','Grova brott, ringa brott, vanliga brott och mord','Våldsbrott, trafikbrott, narkotikabrott och sexualbrott','Brott mot lagen, mot normer, mot regler och avtal'],'Misshandel är brott mot person, stöld är förmögenhetsbrott, spioneri är brott mot staten och skadegörelse brott mot allmänheten.'],
  ['Vad är en rättighet?',['Något man har rätt till, som att få tycka fritt','Något man måste göra, till exempel att gå i skolan','Ett straff man får om man bryter mot lagen','En oskriven regel för hur man ska bete sig'],'Lagarna finns för att vi ska veta vilka rättigheter och skyldigheter vi har.'],
  ['Vad är en skyldighet?',['Något man måste göra, som att ha körkort när man kör','Något man har rätt till, som att få säga vad man tycker','En oskriven regel för hur man bör vara mot andra','Ett straff som man får om man bryter mot lagen'],'Man kan inte göra något brottsligt och sedan säga att man inte visste att det var olagligt.'],
  ['Vad betyder det att överklaga en dom?',['Att be en högre domstol pröva målet en gång till','Att vägra betala de böter som domstolen gav','Att anmäla domaren för att den har dömt fel','Att byta till en annan advokat mitt i rättegången'],'Det krävs inga nya bevis – det räcker att någon vill att målet prövas igen.'],
  ['Vilka är de tre allmänna domstolarna?',['Tingsrätt, hovrätt och Högsta domstolen','Tingsrätt, förvaltningsrätt och kammarrätt','Polisen, åklagaren och försvararen','Kommunfullmäktige, regionen och riksdagen'],'Tingsrätten prövar målet först. Sedan kan det överklagas uppåt.'],
  ['Vad kallas den som är åtalad för ett brott?',['Den tilltalade','Målsäganden','Vittnet','Nämndemannen'],'Den tilltalade får hjälp av en försvarsadvokat.'],
  ['Vad kallas den som är offer för ett brott i rättegången?',['Målsägande','Tilltalad','Vittne','Åklagare'],'På den målsägandes sida finns åklagaren.'],
  ['Vad gör åklagaren i rättegången?',['Bevisar att den tilltalade är skyldig','Försvarar den tilltalade i rättegången','Dömer den tilltalade och bestämmer straffet','Berättar vad hen själv har sett och hört'],'Åklagare är jurister som utreder brott, väcker åtal och deltar i rättegångar.'],
  ['Vad gör försvarsadvokaten?',['Hjälper den misstänkte att bli rättvist behandlad','Bevisar att den misstänkte är skyldig till brottet','Leder rättegången och ser till att alla får prata','Skriver domen och bestämmer vilket straff det blir'],'Alla i Sverige som anhålls eller häktas har rätt till en försvarsadvokat.'],
  ['Vad är en nämndeman?',['En person utan juristutbildning som dömer med domaren','En polis som ser till att det är ordning i rättssalen','Ett vittne som kallats in för att berätta vad hen sett','En jurist som hjälper åklagaren att samla in bevis'],'Nämndemän har andra arbeten, studerar eller är pensionärer när de inte sitter i rätten.'],
  ['Vad kallas det att ljuga i en domstol?',['Mened','Förtal','Ofredande','Bedrägeri'],'Mened är ett allvarligt brott. Ett vittne måste tala sanning.'],
  ['Vad är slutplädering?',['När åklagaren och försvaret sammanfattar målet','När domaren läser upp domen för den tilltalade','När vittnet förhörs om vad hen har sett och hört','När polisen berättar vad utredningen kom fram till'],'Varje sida berättar också vilken påföljd de anser att den tilltalade ska få.'],
  ['Vilken är den vanligaste påföljden i Sverige?',['Böter','Fängelse','Skyddstillsyn','Villkorlig dom'],'Bara böter och fängelse räknas som straff. Övriga kallas påföljder.'],
  ['Vad är dagsböter?',['Böter som beror på brottets allvar och vad man tjänar','Böter med en fast summa som är lika stor för alla','Böter som man måste betala en del av varje dag','Böter som bara unga under 18 år kan dömas till'],'Tanken är att straffet ska kännas lika hårt oavsett hur mycket man tjänar. Fast summa kallas penningböter.'],
  ['Vad är villkorlig dom?',['Man slipper fängelse, men ett nytt brott inom två år ger straff för båda','Man får sitta i fängelse en kortare tid än vanligt för brottet','Man får vård för sitt missbruk i stället för att sitta i fängelse','Man får böter som man får betala av lite i taget under två år'],'Villkorlig dom ges om domstolen tror att personen inte kommer att begå nya brott.'],
  ['Vid vilken ålder blir man straffmyndig i Sverige?',['15 år','18 år','13 år','21 år'],'Den som inte fyllt 15 år kan inte dömas i domstol – då har socialtjänsten ansvaret.'],
  ['Vilken myndighet ansvarar för fängelser och häkten?',['Kriminalvården','Polisen','Socialtjänsten','Åklagarmyndigheten'],'Kriminalvården ansvarar också för frivård, till exempel skyddstillsyn och fotboja.'],
  ['Vad står BRÅ för?',['Brottsförebyggande rådet','Barnens rätt i samhället','Brottsofferjourens råd','Brottsregistrets arkiv'],'BRÅ samlar in information om vilka brott som begås i Sverige.'],
  ['Vad är dold brottslighet?',['Brott som aldrig anmäls eller upptäcks','Brott som begås på natten när ingen ser','Brott som begås av stora kriminella gäng','Brott mot staten, till exempel spioneri'],'Vanligast är trafikbrott, snatteri, narkotikabrott och våld i nära relation.'],
  ['Vad är ett hatbrott?',['Brott mot någon på grund av hudfärg, religion eller sexualitet','Brott som någon begår när den blir väldigt arg på en annan','Alla slags misshandel, oavsett vem som drabbas och varför','Alla brott som begås mot någon på internet eller i sociala medier'],'Hatbrott handlar om att en människas eller grupps lika värde inte respekteras.'],
  ['Vad är grooming?',['När vuxna kontaktar barn på nätet för att begå sexualbrott','När någon sprider elaka rykten om en annan på nätet','När någon hotar en annan person med våld via nätet','När någon låtsas vara en annan för att få pengar'],'Det som är olagligt i verkligheten är också olagligt på nätet.'],
  ['Vad betyder offentlighetsprincipen?',['Att alla får läsa myndigheters handlingar','Att alla rättegångar hålls bakom stängda dörrar','Att staten äger och styr alla stora tidningar','Att alla brev till myndigheter hålls hemliga'],'Det gör det lättare för journalister och privatpersoner att granska makten.'],
  ['Vad är skadestånd?',['Pengar till den som drabbats av något man har gjort','Ett straff som domstolen dömer ut för ett brott','Böter som man måste betala till staten efter ett brott','En påföljd som Kriminalvården bestämmer över'],'Skadestånd är inte en påföljd – även den som inte är straffmyndig kan få betala skadestånd.'],
  ['Vilken organisation ger stöd åt barn under 18 år?',['BRIS – Barnens Rätt I Samhället','BRÅ – Brottsförebyggande rådet','Kriminalvården','Brottsofferjouren'],'Till BRIS kan barn ringa även om något som inte är brottsligt.'],
  ['Vad betyder att en domstol ska vara opartisk och oberoende?',['Riksdag och regering får inte styra domstolarna','Domaren får inte ha några politiska åsikter privat','Domstolen ska döma så som regeringen tycker är bäst','Domaren får själv välja vilka lagar som ska gälla'],'I en diktatur kan samma personer stifta lagar, utreda brott och döma. Det är inte rättssäkert.'],
  ['Vilka är de vanligaste brotten i Sverige?',['Stöld, inbrott, brott mot person och bedrägeri','Mord, dråp, kidnappningar och terrorbrott','Spioneri, landsförräderi, mutor och smuggling','Miljöbrott, skattebrott och brott mot tullen'],'Åtta av tio misstänkta för brott är män, och det är vanligast att unga 15–20 år begår brott.']
 ]},
{id:5,namn:'Göteborg',under:'Redaktionen – medier och källkritik',tema:'medier',del:'Information och kommunikation',kap:'kap. 11–14 · s. 165–226',portar:5,langd:74,svar:4,
 fragor:[
  ['Vad menas med medier?',['Alla kanaler som förmedlar information','Bara tidningar som trycks på papper','Bara appar och sociala medier på nätet','Bara kanaler som sänder tv och radio'],'Radio, tv och tidningar har funnits länge och kallas traditionella medier.'],
  ['Vad är massmedier?',['Medier som når väldigt många människor samtidigt','Medier som bara läses av några få personer','Reklamblad som delas ut i alla brevlådor','Mycket stora medieföretag med massor av anställda'],'Webbsidor, dagstidningar, tv och radio är massmedier.'],
  ['Vad är sociala medier?',['Appar där man kan ta emot och själv dela saker','Tv-kanaler som visar reklam mellan programmen','Dagstidningar som man kan läsa på nätet','Radiokanaler som man lyssnar på i mobilen'],'Där kan man själv delta med fakta, bilder, videoklipp och åsikter.'],
  ['Vilka är massmediernas tre uppgifter?',['Informera, granska och underhålla','Sälja reklam, tjäna pengar och växa','Stifta lagar, styra och döma','Skriva, trycka och sälja tidningar'],'Journalister som granskar politiker kontrollerar att de följer lagen och sköter sitt uppdrag.'],
  ['Vad är en dagstidning?',['En betald tidning som kommer minst fem dagar i veckan','En tidning som bara kommer ut en gång varje månad','En gratistidning som delas ut i alla brevlådor','En tidning som bara finns på nätet och inte på papper'],'Digitala tidningar kallas också nyhetssajt eller nätupplaga.'],
  ['Vad är mediestöd?',['Statliga pengar så att tidningar kan ges ut, även på små orter','Pengar från de företag som köper reklam i tidningen','Pengar som läsarna betalar för att få tidningen hem','Pengar från staten för att utbilda nya journalister'],'Mediestödet är en förutsättning för att nyhetstidningar på mindre orter ska kunna ges ut.'],
  ['Vad är en nyhetsbyrå?',['Ett företag som säljer nyheter till medierna','En redaktion som skriver en egen tidning','En myndighet som granskar att nyheter är sanna','En reklambyrå som gör reklam för medierna'],'Den största delen av nyheterna kommer från olika nyhetsbyråer.'],
  ['Varför kallas medierna "den tredje statsmakten"?',['För att de granskar makten, alltså riksdag och regering','För att de ägs och styrs av staten och av regeringen','För att de betalar mer skatt än nästan alla andra','För att de får rösta om nya lagar i riksdagen'],'Medierna har som uppgift att granska dem som styr i samhället.'],
  ['Vad betyder public service?',['Att kanalerna tar samhällsansvar och har alla slags program','Att kanalerna ägs av staten och får visa mycket reklam','Att alla program ska vara gratis att titta på via nätet','Att kanalerna bara sänder nyheter och fakta dygnet runt'],'I kanaler med public service-uppdrag är reklam förbjudet.'],
  ['Hur finansieras de privata tv-kanalerna?',['Framför allt genom reklam','Genom skattepengar från staten','Genom mediestöd från staten','Genom bidrag från kommunerna'],'Ju fler tittare, desto större reklamintäkter.'],
  ['Vad är infotainment?',['När fakta blandas med underhållning','När reklam visas mitt i ett program','När nyheter sänds dygnet runt på nätet','När man betalar för att streama filmer'],'Ordet är en sammansättning av engelskans information och entertainment.'],
  ['Vad är produktplacering?',['När ett företag betalar för att en vara syns i en film','En stor annons som finns på mitten av en tidning','Hur en butik ställer upp sina varor på hyllorna','Reklamfilmerna som visas innan filmen börjar på bio'],'Det ska tydligt framgå när något är reklam – annars är det smygreklam.'],
  ['Vad står i marknadsföringslagen?',['Att reklam inte får ljuga och tydligt ska synas som reklam','Att all reklam är förbjuden på tv och i sociala medier','Att all reklam måste vara skriven eller talad på svenska','Att bara stora företag har rätt att göra reklam för sig'],'Det är också förbjudet att göra reklam som vänder sig direkt till barn under 12 år.'],
  ['Vad är en målgrupp?',['De kunder som kan vilja köpa produkten','Alla som råkar se reklamen för produkten','De som jobbar på företaget som säljer den','De som äger företaget som gör produkten'],'I marknadsföring är det viktigt att vända sig till rätt målgrupp.'],
  ['Vilka två grundlagar skyddar medierna?',['Tryckfrihetsförordningen och yttrandefrihetsgrundlagen','Successionsordningen och marknadsföringslagen','Riksdagsordningen och diskrimineringslagen','Upphovsrättslagen och marknadsföringslagen'],'Tryckfrihetsförordningen gäller tryckt text, yttrandefrihetsgrundlagen internet, tv, film och video.'],
  ['Vad gör en ansvarig utgivare?',['Bestämmer vad som publiceras och straffas vid fel','Skriver själv alla artiklar som finns med i tidningen','Trycker tidningen och ser till att den kommer ut','Säljer annonser och ser till att tidningen tjänar pengar'],'Den som skrivit artikeln kan däremot inte straffas.'],
  ['Vad är en filterbubbla?',['När algoritmer bara visar dig det du väntas gilla','När du lägger ett filter på en bild innan du delar den','När en app blockerar all reklam på nätet åt dig','När en sökmotor bara visar de senaste nyheterna'],'Om vi bara får ett urval av information kan vi inte längre säga att vi använder fria och oberoende medier.'],
  ['Vad är förtal?',['Att sprida något osant om en annan person','Att skicka hot om våld till en annan person','Att ta en bild på någon utan att fråga','Att avslöja en hemlighet om landets försvar'],'Förtal och olaga hot är exempel på brott som kan ingå i nätmobbning.'],
  ['Vad är olaga hot?',['När någon hotar en annan med text eller bild','När någon skriver osanningar om en annan person','När någon sprider en bild utan att fråga','När någon ljuger när den vittnar i domstol'],'Det som är olagligt i verkligheten är också olagligt på nätet.'],
  ['Vad innebär upphovsrätt?',['Att man inte får kopiera andras texter och bilder fritt','Att man äger rätten till allt som man har laddat ner','Att alla bilder man hittar på nätet är gratis att använda','Att staten äger alla texter och bilder som ges ut'],'Den som bryter mot upphovsrätten kan få böter eller fängelse.'],
  ['Vilka fyra frågor ställer man när man är källkritisk?',['Vem? Varför? Vad? När?','Var? Hur? Vem? Vilken?','Vad? Hur mycket? Var? Vem?','Hur? När? Var? Varför?'],'Statens medieråd har ställt samman frågorna: vem står bakom, varför finns sidan, vad står där och när uppdaterades den?'],
  ['Vad menas med informationssamhälle?',['Ett samhälle där information är viktig och de flesta är uppkopplade','Ett samhälle där bara staten och företagen får använda internet','Ett samhälle där man bara får sina nyheter från papperstidningar','Ett samhälle där staten äger och bestämmer över all information'],'Många blir stressade av all information – det kan vara bra att stänga av mobilen ibland.'],
  ['Hur skildras män och kvinnor olika i nyheterna?',['Män är oftare experter, kvinnor berättar oftare om sig själva','Kvinnor är oftare experter, män berättar oftare om sig själva','Män och kvinnor syns lika ofta och på precis samma sätt','Kvinnor syns mycket oftare än män i alla slags nyheter'],'Sverige är ett av de länder där kvinnor syns mest i nyheter – ändå är siffran bara drygt 30 procent.'],
  ['Vad är nätvett?',['Regler för hur vi beter oss mot varandra på nätet','Kunskap om hur man bygger appar och hemsidor','Att ha en snabb och säker uppkoppling till nätet','Regler för hur länge barn får vara på nätet'],'En regel är att inte sprida bilder eller filmklipp på någon som inte godkänt det.'],
  ['Vad är sponsring i tv?',['Att ett företag betalar en del av programmet för att synas','Att vanliga reklamfilmer visas mitt inne i programmet','Att staten betalar hela programmet med skattepengar','Att tittarna betalar en avgift för att se programmet'],'Reklam är förbjudet i public service-kanalerna, men sponsring har varit tillåtet sedan 1991.'],
  ['Hur ser mediernas bild av verkligheten ut?',['Medierna väljer ut och visar bara en del av verkligheten','Medierna visar allt som händer, precis som det är','Medierna visar nästan bara positiva och glada nyheter','Medierna visar bara det som staten först har godkänt'],'Tidningar, tv-nyheter och nyhetssajter väljer vad de vill förmedla.']
 ]},
{id:6,namn:'Uppsala',under:'Idéernas stad – partier och ideologier',tema:'ideologi',del:'Beslutsfattande och politiska idéer',kap:'kap. 15 · s. 228–255',portar:5,langd:76,svar:4,
 fragor:[
  ['Vad handlar politik om?',['Förmågan att styra och fatta beslut som rör många','Bara att rösta i riksdagsvalet vart fjärde år','Att skriva domar i domstol efter rättegångar','Att arbeta på en myndighet och följa alla dess regler'],'Politiker har stor makt eftersom deras beslut påverkar många människors vardag.'],
  ['Vilka är Sveriges fyra grundlagar?',['Regeringsformen, successionsordningen, tryckfrihetsförordningen och yttrandefrihetsgrundlagen','Regeringsformen, riksdagsordningen, brottsbalken och yttrandefrihetsgrundlagen','Successionsordningen, tryckfrihetsförordningen, skollagen och diskrimineringslagen','Regeringsformen, marknadsföringslagen, upphovsrättslagen och brottsbalken'],'Grundlagarna är särskilt svåra att ändra eftersom de lägger grunden för hela samhället.'],
  ['Vad står i regeringsformen?',['Hur Sverige ska styras och vilka som får rösta','Vilka straff som gäller för olika sorters brott','Hur arv ska delas upp när någon har dött','Hur skolan ska fungera och vad elever ska lära sig'],'Den inleds med att all offentlig makt i Sverige utgår från folket.'],
  ['Vad står i successionsordningen?',['Hur Sveriges statschef ska utses','Vilka lagar riksdagen får stifta','Vad tidningar får skriva om kungen','Hur valen till riksdagen ska gå till'],'Statschef i Sverige är kungen.'],
  ['Vad är en monarki?',['Ett land med en kung eller drottning som statschef','Ett land där folket styr direkt i omröstningar','Ett land som har en president som folket har valt','Ett land där militären har tagit över all makt'],'I en monarki ärver statschefen sin titel.'],
  ['Vad är en republik?',['Ett land utan kung, oftast med en vald president','Ett land med en kung eller drottning som statschef','Ett land som är med i EU och följer dess lagar','Ett land där många partier sitter i riksdagen'],'I många republiker väljer medborgarna sin statschef, som då får stor politisk makt.'],
  ['Hur mycket politisk makt har Sveriges statschef?',['Ingen politisk makt, eftersom hen inte är vald','All makt i landet, eftersom hen är statschef','Lika mycket makt som statsministern och riksdagen','Hen leder regeringens arbete och väljer ministrarna'],'Tidigare i historien hade kungen mycket makt, men inte idag.'],
  ['Vad är en ideologi?',['Tankar om hur ett bra samhälle ska se ut','En lag som säger hur samhället ska styras','Ett politiskt parti som sitter i riksdagen','Ett val där folket bestämmer vem som styr'],'Ideologi är ungefär detsamma som politisk åskådning.'],
  ['Vilka är de tre stora ideologierna?',['Konservatism, liberalism och socialism','Feminism, nationalism och liberalism','Demokrati, diktatur och fundamentalism','Kapitalism, kommunism och fascism'],'De växte fram för flera hundra år sedan.'],
  ['Vad vill konservatismen?',['Förändra samhället långsamt','Sätta individens frihet först','Skapa ett helt jämlikt samhälle','Avskaffa staten helt och hållet'],'Konservatismen värnar om det som redan finns.'],
  ['Vad sätter liberalismen i centrum?',['Friheten','Traditionen','Jämlikheten','Staten'],'Liberala partier menar ofta att konkurrens mellan individer och företag gör att alla får det bättre.'],
  ['Vad strävar socialismen efter?',['Ett jämlikt samhälle','Långsam förändring','Så lite stat som möjligt','En stark kungamakt'],'Socialistiska partier tror att en stark stat skapar ett bättre och mer jämlikt samhälle.'],
  ['Vad är feminism?',['En åskådning som vill att kvinnor och män behandlas lika','En ideologi som vill avskaffa staten och alla lagar','Namnet på ett av partierna som sitter i riksdagen','En folkrörelse som kämpar för miljön och klimatet'],'Många politiker är feminister även om de företräder helt olika partier.'],
  ['Vad är en människosyn?',['En tanke om hur människor är innerst inne','Hur man ser på andra människors utseende','En religiös tro på en eller flera gudar','Ett partiprogram med förslag till nya lagar'],'Alla ideologier bygger på en människosyn.'],
  ['Vad är ett partiprogram?',['Ett dokument med partiets ideologi och förslag','En lista med namnen på partiets medlemmar','Ett tv-program där partierna debatterar','Partiets budget för hur pengarna ska användas'],'Där står vilka förändringar partiet tycker bör genomföras.'],
  ['Vad är ett flerpartisystem?',['Att vi kan välja mellan flera olika partier','Att flera partier alltid styr tillsammans','Att partierna byter namn inför varje val','Att alla partier får lika många röster i valet'],'Det är viktigt för demokratin att vi kan välja mellan olika partier.'],
  ['Vilka partier placeras till vänster på skalan?',['Socialdemokraterna och Vänsterpartiet','Kristdemokraterna och Centerpartiet','Sverigedemokraterna och Liberalerna','Moderaterna och Kristdemokraterna'],'De tror att en stark stat skapar ett bättre och mer jämlikt samhälle.'],
  ['Vad kännetecknar nationalistiska partier?',['De vill stärka nationen och värna landets traditioner','De vill ta bort alla gränser mellan länder i världen','De driver nästan bara frågor om miljö och klimat','De vill att EU ska få bestämma mycket mer över landet'],'Det finns nationalistiska partier i de flesta länder i världen.'],
  ['Vad är ett enfrågeparti?',['Ett parti som främst driver en enda fråga','Ett parti som bara har en enda medlem','Ett parti som bara ställer upp i ett enda val','Ett parti som saknar en egen ideologi'],'Nya partier bildas ofta när människor är missnöjda med de befintliga partiernas politik.'],
  ['Vad är partistöd?',['Statliga pengar efter hur många röster partiet fått','Pengar som medlemmarna betalar till sitt parti','Pengar som stora företag skänker till partierna','Pengar från EU till alla partier i medlemsländerna'],'Stödet gör att partierna har råd att driva sin verksamhet.'],
  ['Vad betyder det att kompromissa i politiken?',['Att ge efter lite för att få igenom det viktigaste','Att alltid få sin vilja igenom i alla viktiga frågor','Att avgå från sin post när man förlorar en fråga','Att byta till ett annat parti som tycker som man själv'],'Politiker har olika åsikter och tvingas därför ofta kompromissa.'],
  ['Vad är egenmakt?',['När man själv gör livet bättre för sig och andra','När man har makt att bestämma över andra människor','När politiker har makten att stifta och ändra lagar','Den makt som kungen har över landet och folket'],'Makt handlar inte bara om att bestämma över andra.'],
  ['Vad menas med fundamentalism som statsskick?',['Att religiösa ledare måste godkänna politikernas beslut','Att grundlagarna är det viktigaste av allt i landet','Att landet river allt gammalt och börjar om från grunden','Att det bara finns ett enda parti som får styra landet'],'Statsskick betyder sättet att styra ett land.'],
  ['Vad är mänskliga rättigheter?',['Regler för hur alla människor ska behandlas, överallt','Svenska lagar som bara gäller för svenska medborgare','EU:s regler för hur handeln mellan länder ska ske','Ordningsregler för hur elever ska bete sig i skolan'],'Grundtanken är att alla människor är födda fria och har samma värde. De skyddas av våra grundlagar.'],
  ['Vad innebär tryckfrihetsförordningen?',['Att alla får starta tidningar, utan granskning i förväg','Att alla tidningar måste vara gratis för den som läser','Att staten äger tidningarna och styr vad de skriver','Att bara utbildade journalister får skriva i tidningar'],'Man får dock inte ljuga eller avslöja hemligheter om till exempel Sveriges försvar.']
 ]},
{id:7,namn:'Stockholm',under:'Riksdagen – så styrs Sverige, EU och Norden',tema:'riksdag',del:'Beslutsfattande och politiska idéer',kap:'kap. 16–17 · s. 256–312',portar:5,langd:80,svar:4,
 fragor:[
  ['Hur många ledamöter har riksdagen?',['349','249','449','149'],'De väljs vart fjärde år av folket.'],
  ['Hur ofta är det riksdagsval i Sverige?',['Vart fjärde år','Vartannat år','Vart femte år','Varje år'],'Är vi inte nöjda kan vi välja nya ledamöter nästa gång det är val.'],
  ['Hur många procent behöver ett parti för att komma in i riksdagen?',['4 procent','2 procent','10 procent','1 procent'],'Det kallas fyraprocentsspärren.'],
  ['Vad är ett mandat?',['En plats i riksdagen','En röst i riksdagsvalet','Ett politiskt parti','En ny lag i riksdagen'],'Ju fler röster ett parti får, desto fler mandat får partiet.'],
  ['Vad är ett proportionellt valsystem?',['Ju fler röster ett parti får, desto fler mandat','Det parti som får flest röster får alla platser','Alla partier får lika många platser, oavsett röster','Talmannen bestämmer hur platserna ska fördelas'],'För att hela landet ska bli representerat finns det 29 valkretsar i Sverige.'],
  ['Vem håller ordning på arbetet i riksdagen?',['Talmannen','Statsministern','Kungen','Justitieministern'],'Talmannen ger också efter valet en partiledare i uppdrag att bilda regering.'],
  ['Vad är en proposition?',['Ett förslag från regeringen till riksdagen','Ett förslag från en ledamot i riksdagen','En färdig lag som riksdagen redan har beslutat','Ett beslut som en domstol har fattat i ett mål'],'Förslag från riksdagsledamöterna kallas i stället motioner.'],
  ['Vad är en motion?',['Ett förslag från en riksdagsledamot','Ett förslag från regeringen till riksdagen','En färdig lag som redan har börjat gälla','Ett beslut som EU har fattat för alla'],'Motioner och propositioner är de två sätt som förslag når riksdagen.'],
  ['Vad gör riksdagens utskott?',['Utreder en fråga innan riksdagen beslutar','Dömer i mål där politiker har brutit mot lagen','Bestämmer över alla kommunerna i varje län','Skriver regeringens förslag till riksdagen'],'Det finns 15 utskott i riksdagen.'],
  ['Vad är riksdagens uppgifter?',['Stifta lagar, besluta budget och granska regeringen','Styra landet och genomföra alla beslut som fattas','Döma i domstol och bestämma vilka straff brotten ger','Sköta sjukvården, skolorna och all kollektivtrafik'],'Statsbudgeten bestämmer hur statens pengar ska fördelas och användas.'],
  ['Vad gör regeringen?',['Styr landet, ger förslag och genomför riksdagens beslut','Stiftar alla lagar och beslutar om statens budget','Dömer i domstol och kontrollerar att lagarna följs','Väljer riksdagens ledamöter och utser talmannen'],'Regeringen ansvarar också för utrikespolitiken och leder den statliga förvaltningen.'],
  ['Vad kallas de övriga medlemmarna i regeringen, förutom statsministern?',['Statsråd','Talmän','Nämndemän','Utskottsledamöter'],'Regeringen består av ett tjugotal personer med statsministern som chef.'],
  ['Vem ger en partiledare i uppgift att bilda regering?',['Talmannen','Kungen','Den avgående statsministern','Riksdagens största utskott'],'Det sker efter ett riksdagsval.'],
  ['Vad är parlamentarism?',['Att regeringen måste ha stöd av riksdagen','Att riksdagen styr landet direkt utan regering','Att kungen utser regeringen efter valet','Att folket röstar om varje enskild fråga'],'Det folkvalda parlamentet utser eller godkänner regeringen i ett land.'],
  ['Vad är en misstroendeförklaring?',['När riksdagen kräver att regeringen ska avgå','När ett parti byter ut sin ledare efter ett val','När ett lagförslag stoppas av ett av utskotten','När folket röstar nej i en folkomröstning'],'Saknar regeringen stöd kan den tvingas avgå.'],
  ['Vad är en minoritetsregering?',['En regering utan egen majoritet i riksdagen','En regering som bara består av ett parti','En regering som företräder landets minoriteter','En regering som just har avgått efter valet'],'Minoritetsregeringar är vanligast i Sverige och måste samarbeta med andra partier.'],
  ['På vilka tre nivåer fattas politiska beslut i Sverige?',['Kommun, region och hela landet','Kommun, länsstyrelse och EU','Stadsdel, kommun och hela landet','Skola, kommun och riksdagen'],'Tillsammans utgör de tre nivåerna vårt statsskick.'],
  ['Vad betyder lokal självstyrelse?',['Att kommunerna själva får fatta egna beslut','Att staten bestämmer allt som händer i kommunen','Att regionen styr över alla kommuner i länet','Att EU bestämmer hur kommunerna ska styras'],'Staten har ändå genom lagar bestämt att kommunerna måste sköta vissa uppgifter.'],
  ['Vad är kommunfullmäktige?',['Kommunens högsta beslutande organ','Den domstol som finns i kommunen','Regionens ledning för sjukvården','Kommunens budget för hela året'],'Kommunstyrelsen lämnar förslag till fullmäktige och genomför besluten.'],
  ['Varifrån får kommunerna sina pengar?',['Kommunalskatt, statsbidrag och avgifter','Enbart från staten, genom statsbidrag','Bara från avgifter för skola och vård','Från en skatt på företagens vinster'],'Kommunen ansvarar bland annat för skola, renhållning och äldreomsorg.'],
  ['Vad är regionens viktigaste uppgift?',['Att ansvara för sjukvården i länet','Att driva grundskolorna i länet','Att stifta lagar för sitt län','Att sköta polisen och brandkåren'],'Regionen ansvarar också för kollektivtrafiken.'],
  ['Hur många medlemsstater hade EU år 2020?',['27','28','25','30'],'EU samarbetar om handel, ekonomi, miljö, jordbruk, utrikespolitik och säkerhet.'],
  ['Vilka är EU:s fyra friheter?',['Fri rörlighet för varor, människor, tjänster och pengar','Fri rörlighet för varor, mat, vapen och kontanter','Yttrandefrihet, tryckfrihet, religionsfrihet och mötesfrihet','Fri rörlighet för studenter, turister, varor och bilar'],'De gäller på EU:s inre marknad.'],
  ['Vilken EU-institution kan kallas EU:s regering?',['Kommissionen','Europaparlamentet','Ministerrådet','EU-domstolen'],'I kommissionen ingår en person från varje medlemsland.'],
  ['Vad kan Europaparlamentet jämföras med?',['Den svenska riksdagen','Den svenska regeringen','Högsta domstolen','Kommunfullmäktige'],'Ledamöterna är folkvalda från alla medlemsländer.'],
  ['Hur ofta är det val till Europaparlamentet?',['Vart femte år','Vart fjärde år','Vartannat år','Varje år'],'Då röstar vi på svenska politiker som sitter tillsammans med politiker från andra länder.'],
  ['Vad gör EU-domstolen?',['Ser till att alla EU-länder följer EU:s regler','Dömer i svenska brottmål som är extra grova','Bestämmer räntan i alla länder som har euro','Kontrollerar hur EU:s pengar används av länderna'],'Länder kan vända sig dit om de är oense om hur en regel ska tolkas.'],
  ['Vad händer om en svensk lag krockar med EU:s lag?',['EU:s lag väger tyngre','Svensk lag väger tyngre','Domstolen väljer fritt','Riksdagen avgör varje gång'],'Det gäller i alla EU-länder.'],
  ['Vad heter EU:s gemensamma valuta?',['Euro','Krona','Mark','Dollar'],'19 av medlemsländerna hade euro. Övriga länder har en egen nationell valuta.'],
  ['Vilka länder ingår i Norden?',['Danmark, Finland, Island, Norge och Sverige','Sverige, Norge, Danmark, Estland och Finland','Sverige, Norge och Danmark, men inte Finland','Alla länder som har en kust mot Östersjön'],'Länderna ligger nära varandra och har en gemensam historia.'],
  ['Vilka nordiska länder är republiker?',['Finland och Island','Norge och Danmark','Sverige och Finland','Island och Norge'],'Norge, Danmark och Sverige är monarkier.'],
  ['Vad är Nordiska rådet?',['Ett samarbete mellan parlamenten i Norden','Ett samarbete mellan regeringarna i Norden','En militär allians som försvarar Norden','En gemensam domstol för alla länder i Norden'],'Det är lite som en nordisk riksdag, fast utan så mycket politisk makt.'],
  ['Vad är Nordiska ministerrådet?',['Ett samarbete mellan regeringarna i Norden','Ett samarbete mellan parlamenten i Norden','En gemensam bank för länderna i Norden','En gemensam domstol för alla länder i Norden'],'Där träffas ministrarna och diskuterar till exempel miljö- och jordbruksfrågor.']
 ]},
{id:8,namn:'Norrköping',under:'Industristaden – arbete, ekonomi och välfärd',tema:'arbete',del:'Samhällsresurser och fördelning',kap:'kap. 18–20 · s. 313–402',portar:5,langd:82,svar:4,
 fragor:[
  ['Vad är bruttolön?',['Lönen innan skatten är dragen','Det du får i handen efter skatt','Lönen plus alla bidrag man får','Pengarna du får som pension'],'Nettolön är det du får i handen när skatten är dragen.'],
  ['Vad är nettolön?',['Det du får kvar när skatten är dragen','Hela lönen innan skatten har dragits','De pengar som du har sparat på banken','Bidrag som du får från staten varje månad'],'Inkomstskatten går till kommunen och staten.'],
  ['Vad är förvärvsarbete?',['Arbete som man får lön för','Arbete hemma utan betalning','Arbete i en förening utan lön','Läxor och arbete i skolan'],'Arbete gratis för en förening eller hjälporganisation kallas ideellt arbete.'],
  ['Vilka räknas till arbetskraften i Sverige?',['Alla 15–75 år som jobbar eller är arbetslösa','Bara de mellan 15 och 75 år som har ett jobb','Alla över 18 år, även de som är pensionärer','Alla som betalar skatt, oavsett hur gamla de är'],'När man bara räknar dem som har arbete talar man om sysselsättning.'],
  ['Vad menas med att Sverige blivit ett tjänstesamhälle?',['Fler jobbar med tjänster än med att tillverka varor','De flesta jobbar för staten och inte i företag','Nästan alla varor vi köper tillverkas i Sverige','Alla har ungefär samma sorts yrke och samma lön'],'Sjuksköterskor, frisörer och IT-konsulter utför tjänster.'],
  ['Vad är specialisering i arbetslivet?',['Att man jobbar med en viss del av ett yrke','Att man byter jobb ofta för att lära sig mer','Att man startar och driver ett eget företag','Att man arbetar utomlands en del av året'],'En hjärtspecialist arbetar bara med patienter som har problem med hjärtat.'],
  ['Vad är ett kollektivavtal?',['Ett avtal om lön och villkor mellan facket och arbetsgivarna','Ett avtal mellan två kollegor om hur de ska dela jobbet','En lag om lön och villkor som riksdagen har bestämt för alla','Ett personligt kontrakt mellan en anställd och chefen'],'Avtalen kan handla om löneökningar, övertid och rätten till ledighet.'],
  ['Vad heter arbetstagarnas egna organisationer?',['Fackförbund','Arbetsgivarorganisationer','Kollektiv','A-kassor'],'Arbetsgivarna har i stället arbetsgivarorganisationer.'],
  ['Vad reglerar arbetsmiljölagen?',['Att risken för ohälsa och olyckor på jobbet ska vara liten','Hur hög lönen minst ska vara för alla olika jobb','Hur många veckor semester man har rätt till varje år','Vem som får anställas och vem som kan bli uppsagd'],'Även anställda utan kollektivavtal skyddas av arbetsrättens lagar.'],
  ['Vad är a-kassan?',['En frivillig försäkring som ger pengar vid arbetslöshet','En skatt som alla som jobbar måste betala på lönen','Ett bidrag från kommunen till den som har det svårt','Den allmänna pension som man får när man blir gammal'],'Många anställda betalar varje månad in pengar till arbetslöshetskassan.'],
  ['Vad är en provanställning?',['En anställning på högst sex månader som kan bli fast','En anställning som alltid varar i exakt ett år','Ett sommarjobb för unga som fortfarande går i skolan','Praktik utan lön där man får prova på ett yrke'],'Är både arbetsgivaren och den anställde nöjda kan den övergå i tillsvidareanställning.'],
  ['Vilken grupp är särskilt utsatt för arbetslöshet?',['Unga, särskilt de utan gymnasieutbildning','Vuxna med lång utbildning från universitet','Egna företagare som driver stora företag','De som har de högsta lönerna i landet'],'Idag kräver nästan alla arbeten att man minst har gått klart gymnasiet.'],
  ['Vad är en marknadsekonomi?',['Utbud och efterfrågan styr vad som tillverkas och priset','Staten bestämmer allt som ska tillverkas och priset','Ingen får äga något själv, utan allt ägs av alla','Alla priser på varor bestäms i en lag av riksdagen'],'Inget land i världen har en helt renodlad marknadsekonomi.'],
  ['Vad är en planekonomi?',['Staten bestämmer vad och hur mycket som ska tillverkas','Marknaden styr priserna genom utbud och efterfrågan','Stora företag äger allt och bestämmer över staten','Alla är egna företagare och planerar sitt arbete'],'Skillnaden mellan systemen är synen på hur mycket staten ska bestämma.'],
  ['Vad är en blandekonomi?',['Mest marknadsekonomi, men staten styr vissa områden','Enbart planekonomi, där staten bestämmer över allt','Enbart marknadsekonomi, där staten aldrig lägger sig i','En ekonomi där man byter varor utan att använda pengar'],'Staten styr för att uppnå politiska mål och för att skillnaderna inte ska bli för stora.'],
  ['Vad är konkurrens?',['När flera företag tävlar om samma kunder','När bara ett företag säljer en viss vara','När staten säljer varor till lägre priser','När alla priser är fasta och lika överallt'],'Motsatsen till konkurrens är monopol.'],
  ['Vad är monopol?',['När bara ett företag säljer en viss vara','När flera företag tävlar om samma kunder','När staten äger alla företag i landet','När priset på en vara är mycket lågt'],'Monopol är motsatsen till konkurrens.'],
  ['Vad är efterfrågan?',['Hur mycket kunderna vill köpa till ett visst pris','Hur mycket företagen vill sälja till ett visst pris','Det pris som en vara har i affären just nu','Hur många företag som säljer på marknaden'],'Om många vill köpa en vara kan företagen höja priset.'],
  ['Vad är utbud?',['Hur mycket företagen vill sälja till ett visst pris','Hur mycket kunderna vill köpa till ett visst pris','Hur mycket pengar staten har att använda i sin budget','Hur mycket lön de anställda får för sitt arbete'],'Är utbudet för stort kan företagen behöva sänka priset.'],
  ['Vad är jämviktspris?',['Priset där utbud och efterfrågan möts','Det lägsta pris som en vara kan säljas för','Det högsta pris som kunderna kan tänka sig','Det pris som staten bestämmer i en lag'],'Kunderna vill då köpa lika många varor som företagen vill sälja.'],
  ['Vad står BNP för?',['Bruttonationalprodukt','Betalningsnivå per person','Bruttonettoprodukt','Budget och nationell plan'],'BNP används för att visa hur rikt ett land är och hur ekonomin utvecklas.'],
  ['Hur räknar man ut BNP?',['Man lägger ihop värdet av alla varor och tjänster på ett år','Man lägger ihop alla löner som betalas ut under ett år','Man räknar ihop alla skatter som staten får in på ett år','Man räknar hur många företag och fabriker som finns i landet'],'För att kunna jämföra länder delar man summan med antalet invånare – BNP per person.'],
  ['Vad är inflation?',['När priserna stiger och vi får mindre för pengarna','När priserna sjunker så att vi får mer för pengarna','När lönerna höjs så att alla får mer pengar','När arbetslösheten ökar och fler förlorar jobbet'],'När priserna höjs vill de som arbetar ha högre lön, och då höjer företagen priserna ännu mer.'],
  ['Vad är högkonjunktur?',['När ekonomin i landet går bra','När ekonomin i landet går dåligt','När priserna i affärerna sjunker','När staten lånar mycket pengar'],'Konjunkturer är när ekonomin växlar mellan att vara stark och svag.'],
  ['Vilka är produktionsfaktorerna?',['Arbetskraft, råvaror, realkapital och kunskap','Pengar, banker, aktier och statliga företag','Löner, skatter, företagens vinster och räntor','Utbud, efterfrågan, konkurrens och priser'],'Realkapital betyder maskiner och verktyg.'],
  ['Vad är offentlig sektor?',['Verksamhet som drivs av stat, kommuner och regioner','Alla privata företag, butiker och fabriker','Bankerna, försäkringsbolagen och deras kunder','All handel som svenska företag har med utlandet'],'Den offentliga sektorn ansvarar för välfärden i Sverige.'],
  ['Vad menas med välfärd?',['Hur vi har det med inkomst, hälsa, utbildning och bostad','Hur mycket pengar staten har kvar i budgeten varje år','Hur många människor i landet som har ett fast arbete','Hur stort landets BNP är jämfört med andra länder'],'Välfärden beskrivs ofta som ett socialt skyddsnät.'],
  ['Vad bygger den nordiska välfärdsmodellen på?',['Standardtrygghet – man kan leva ungefär som förut','Grundskydd – staten garanterar bara ett minimum','Självhjälp – var och en får ordna allt på egen hand','Företagsansvar – arbetsgivaren betalar för allt'],'Modellen bygger på tanken om jämlikhet, att alla människor är lika mycket värda.'],
  ['Vad är socialförsäkringar?',['Stöd från staten, till exempel när man blir sjuk eller får barn','Försäkringar som man själv köper av ett försäkringsbolag','Pengar som kommunen ger när man inte har någon inkomst','Ett kollektivavtal som facket och arbetsgivarna har skrivit'],'Sjukförsäkring och pension är obligatoriska, a-kassan är frivillig.'],
  ['Vad är försörjningsstöd?',['Pengar från kommunen när pengarna inte räcker','Den allmänna pensionen från staten när man är gammal','Ersättning från a-kassan när man blir arbetslös','Barnbidraget som alla föräldrar får varje månad'],'Man kan söka det när socialförsäkringarna inte räcker.'],
  ['Vad är välfärdstjänster?',['Förskola, hemtjänst och sjukvård som betalas med skatt','Tjänster som man köper och betalar för helt själv','Tjänster som bankerna säljer, som lån och sparkonton','Tjänster som företag köper och säljer till varandra'],'De ska hjälpa enskilda personer i olika skeden av livet.'],
  ['Varför blir välfärden dyrare?',['Fler blir äldre och det är svårt att hitta personal','Skatterna har sänkts kraftigt de senaste åren','Det föds alldeles för många barn varje år i Sverige','Staten har slutat låna pengar från andra länder'],'Sverige har ändå en av världens mest utvecklade välfärder.'],
  ['Vad var byteshandel?',['Att man bytte varor innan det fanns pengar','Att man handlade med varor från andra länder','Att man köpte saker på avbetalning och lån','Att man använde sedlar i stället för mynt'],'De första pengarna var metallmynt vars värde berodde på metallen och vikten.'],
  ['Vad visar det ekonomiska kretsloppet?',['Hur hushåll, företag, banker, det offentliga och utlandet hör ihop','Hur sedlar och mynt trycks och sedan delas ut av Riksbanken','Hur skatten på lönen räknas ut för olika hushåll och företag','Hur hushållen sparar sina pengar på banken och får ränta'],'Med hjälp av kretsloppet ser man hur en förändring i en del av ekonomin påverkar en annan del.']
 ]},
{id:9,namn:'Malmö',under:'Öresund – en global värld',tema:'global',del:'En global värld',kap:'kap. 21–24 · s. 403–467',portar:5,langd:84,svar:4,
 fragor:[
  ['Vad betyder globalisering?',['Att länder och människor knyts närmare varandra','Att länder stänger sina gränser mot varandra','Att alla människor i världen börjar prata samma språk','Att handeln mellan länder i världen minskar'],'Makt, politik och ekonomi handlar inte längre bara om enskilda länder utan om hela världen.'],
  ['Vad är export?',['När ett lands företag säljer varor utomlands','När ett lands företag köper varor från utlandet','När varor tillverkas och säljs inom landet','När man reser utomlands och handlar varor där'],'Sverige måste få inkomster från exporten för att kunna betala importen.'],
  ['Vad är import?',['När ett lands företag köper varor från utlandet','När ett lands företag säljer varor utomlands','När ett land tillverkar alla sina varor själv','När man betalar tull för att resa in i ett land'],'Ett litet land som Sverige kan inte tillverka allt vi behöver själva.'],
  ['Varför handlar länder med varandra?',['Naturtillgångar och klimat är olika i olika länder','Alla länder har exakt samma naturtillgångar och klimat','FN kräver att alla länder handlar med varandra','EU förbjuder länderna att tillverka sina egna varor'],'Även den tekniska utvecklingsnivån och konsumenternas efterfrågan påverkar.'],
  ['Vad är tull?',['En avgift på importerade varor','En skatt som man betalar på lönen','En avgift för att resa utomlands','Ett bidrag till svenska företag'],'Tull gör importerade varor dyrare och är ett exempel på handelshinder.'],
  ['Vad är frihandel?',['När handeln är fri och det inte finns tullar','När staten äger och styr all handel i landet','När man bara handlar inom det egna landet','När varorna i affärerna är gratis för alla'],'Frihandel är motsatsen till handelshinder.'],
  ['Vad är EU när det gäller handel?',['En tullunion utan tullar mellan länderna','En militär allians som försvarar alla medlemmar','En organisation helt utan gemensamma regler','En bank som lånar ut pengar till alla länder'],'Inom EU finns även EMU, där några länder har infört den gemensamma valutan euro.'],
  ['Vad är ett multinationellt företag?',['Ett företag som har verksamhet i många olika länder','Ett företag som ägs tillsammans av flera stater','Ett företag som bara säljer varor till utlandet','Ett företag som ägs helt av staten i sitt land'],'De har stora resurser och kan påverka ett lands ekonomi när de startar eller lägger ner verksamhet.'],
  ['Vad menas med suveränitetsprincipen?',['Att en stat får sköta sig själv utan andras inblandning','Att FN får bestämma över alla länder i hela världen','Att stormakterna får bestämma över alla små länder','Att alla länder i världen måste ha samma lagar och regler'],'Om grundläggande mänskliga rättigheter kränks kan det ändå vara skäl för andra länder att ingripa.'],
  ['Vad är skillnaden mellan ett land och en stat?',['En stat styrs av någon i området – ett land behöver inte det','Det finns ingen skillnad alls – orden betyder samma sak','Ett land är alltid större och har fler invånare än en stat','En stat måste vara medlem i FN – ett land behöver inte det'],'Grönland är till exempel ett land men inte en stat, eftersom det tillhör Danmark.'],
  ['Vad menas med en nation?',['En grupp med samma språk, religion, historia och kultur','Ett geografiskt område som har tydliga gränser','En stat som är medlem i FN och som har en egen armé','Den regering som styr över ett land och dess invånare'],'Ordet nation måste inte vara kopplat till ett geografiskt område.'],
  ['Hur många stater är medlemmar i FN?',['193','27','150','100'],'FN är den största internationella organisationen i världen och arbetar för fred och säkerhet.'],
  ['Vilket FN-organ kan ingripa för att stoppa en konflikt?',['Säkerhetsrådet','Generalförsamlingen','Internationella domstolen','Sekretariatet'],'I generalförsamlingen finns ledamöter från alla medlemsstater.'],
  ['Vilka länder har vetorätt i FN:s säkerhetsråd?',['Frankrike, Kina, Ryssland, Storbritannien och USA','Tyskland, Japan, Indien, Brasilien och Sydafrika','Alla femton länder som sitter i säkerhetsrådet','Sverige, Norge, Danmark, Finland och Island'],'De måste alla samtycka, annars går beslutet inte igenom.'],
  ['Vad betyder vetorätt?',['Att ett land ensamt kan stoppa ett beslut','Att ett land får rösta två gånger om samma beslut','Att ett land alltid får tala först på mötet','Att ett land slipper betala medlemsavgift'],'Vetorätten finns i FN:s säkerhetsråd.'],
  ['Vad är en NGO?',['En icke-statlig organisation, som Röda korset','En avdelning inom FN som hjälper fattiga länder','Ett stort multinationellt företag, som Ikea','En statlig myndighet, som Migrationsverket'],'NGO står för non-governmental organization. Även WWF är en NGO.'],
  ['Vad är ett inbördeskrig?',['När grupper i samma land krigar mot varandra eller mot staten','När två grannländer krigar mot varandra om gränsen','När FN skickar in soldater för att stoppa en konflikt','När ett land tar över och ockuperar ett annat land'],'Förr utkämpades nästan alla krig mellan länder. Numera är inbördeskrig vanligare.'],
  ['Vad menas med "nya krig"?',['Krig som förs av krigsherrar och terrorgrupper och drabbar civila','Krig där stater använder helt nya och mycket moderna vapen','Krig mellan stormakter, till exempel USA, Kina och Ryssland','Krig som bara pågår en kort tid och sedan snabbt tar slut'],'Det är främst civilbefolkningen som drabbas, och bostadsområden, skolor och sjukhus som bombas.'],
  ['Vad skyddar krigets folkrätt?',['Sårade, sjuka, krigsfångar och civilbefolkning','Bara de soldater som fortfarande slåss i kriget','Bara ledarna och generalerna i länderna som krigar','Bara FN:s soldater och personal i krigsområdet'],'Fredens folkrätt beskriver i stället hur länder ska hålla kontakt med varandra.'],
  ['Vad är sanktioner?',['Ett sätt att straffa ett land genom att begränsa handeln','En militär attack mot ett annat lands städer och armé','Ett fredsavtal som två länder skriver under efter ett krig','En FN-styrka som skickas för att skydda befolkningen'],'Då blir landets export och import lidande.'],
  ['Vad är säkerhetspolitik?',['Det regeringen gör för att landet inte ska hamna i krig','Det som polisen gör för att minska brottsligheten i landet','Det som görs för att skydda datorer och mobiler mot virus','Hur EU kontrollerar vem som får komma in i unionen'],'Internationell säkerhet är de samlade insatser som regeringarna gör gemensamt.'],
  ['Vad är en försvarsallians?',['När länder lovar att försvara varandra vid angrepp','När länder lovar att handla med varandra utan tullar','När länder lovar att skrota sina vapen tillsammans','När FN skickar fredsbevarande trupper till ett land'],'Den mest kända försvarsalliansen är NATO.'],
  ['Vad är terrorbalans?',['När två länder inte anfaller, för båda kan förgöra varandra','När två länder köper och säljer exakt lika mycket till varandra','När FN medlar mellan två länder som har en konflikt','När två länder lovar att förstöra alla sina vapen samtidigt'],'Kapprustningen mellan USA och Sovjetunionen pågick fram till 1991 och kallas det kalla kriget.'],
  ['Vad betyder nedrustning?',['Att länder skrotar sina vapen','Att länder skaffar fler vapen','Att man bygger fler skyddsrum','Att ett krig avslutas med fred'],'Motsatsen, att satsa på fler vapen och soldater, kallas upprustning.'],
  ['Vad består Sveriges totalförsvar av?',['Det civila och det militära försvaret','Bara armén, marinen och flygvapnet','Polisen, militären och kustbevakningen','FN-styrkor och hemvärnet i Sverige'],'Civilförsvaret sköter sjukvård och räddningstjänst i krig. Försvarsmakten ansvarar för armé, marin och flygvapen.'],
  ['Vad är en pacifist?',['Någon som tycker att våld alltid är fel och vägrar bära vapen','En soldat som skickas ut i en FN-styrka för att skapa fred','En diplomat som förhandlar om fred mellan länder i krig','Någon som tycker att ett starkt försvar är bästa sättet att få fred'],'Organisationer som arbetar för fred ingår i fredsrörelsen.'],
  ['Vad gör FN:s fredsbevarande styrkor?',['Skickas till konfliktområden för att skydda befolkningen','Startar krig mot diktaturer för att införa demokrati','Säljer vapen till de FN-länder som behöver försvara sig','Dömer krigsförbrytare i en domstol när kriget är slut'],'FN:s fredsarbete sker främst i säkerhetsrådet, bland annat genom förhandlingar.'],
  ['Vad är terrorism?',['Att med våld mot oskyldiga försöka påverka politiken','Alla former av krig mellan två eller flera länder','Att demonstrera utan tillstånd för att protestera','Att sprida falska nyheter på nätet för att lura folk'],'FN har fördömt terrorism som ett hot mot demokrati, mänskliga rättigheter och fred.'],
  ['Vad är en fördel med globaliseringen enligt dess anhängare?',['Demokrati och rättigheter sprids och varor blir billigare','Alla länder blir exakt lika och får samma kultur','Handeln minskar och länderna klarar sig bättre själva','Resandet minskar och miljön blir mycket bättre för alla'],'Internationella kontakter mellan personer och företag motverkar konflikter och krig.'],
  ['Vad är en nackdel med globaliseringen enligt kritikerna?',['Klyftorna mellan rika och fattiga ökar och miljön tar skada','Varor blir dyrare och alla länder får mindre att välja på','För få länder handlar med varandra och handeln minskar','Länderna blir för olika och kan inte förstå varandra'],'Kritikerna menar också att stora företag kan utnyttja fattiga länder.'],
  ['Vad är värnplikt?',['Att alla unga svenskar kan tvingas göra militärutbildning','Att man frivilligt söker till militären som ett jobb','Att arbeta för FN i ett annat land där det är krig','Att alla vuxna betalar en särskild skatt till försvaret'],'Motsatsen till värnplikt är frivillig militärtjänstgöring.'],
  ['Vad innebär Sveriges säkerhetspolitik enligt boken?',['En kombination av alliansfrihet och internationellt samarbete','Att Sverige alltid går med i alla allianser som det bjuds in till','Att Sverige inte samarbetar med något annat land i världen','Att Sverige alltid håller med USA och gör som USA vill'],'Helt alliansfria är vi inte, eftersom vi som EU-medlem har ansvar att hjälpa andra medlemsländer.']
 ]},

<script>
/* =======================  GRUND  ======================= */
const duk=document.getElementById('duk'), ctx=duk.getContext('2d');
const W=400,H=288,TILE=24,ROWS=12,GR=9;
let VH=288,OFF=0;   // synlig höjd anpassas efter skärmen              // GR = markens översta rad
const overlagg=document.getElementById('overlagg');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const slump=(a,b)=>a+Math.random()*(b-a);
const slumpI=(a,b)=>Math.floor(slump(a,b+1));
const valj=a=>a[Math.floor(Math.random()*a.length)];
const blanda=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function passaDuk(){
  const l=document.getElementById('duk-lada');
  const lw=Math.max(200,l.clientWidth), lh=Math.max(160,l.clientHeight);
  VH=Math.round(clamp(lh/(lw/W),H,400)); OFF=VH-H;
  duk.width=W; duk.height=VH;
  const s=Math.min(lw/W,lh/VH);
  duk.style.width=Math.floor(W*s)+'px'; duk.style.height=Math.floor(VH*s)+'px';
}

/* =======================  SPARAT  ======================= */
const NY='sverigeresan.v1';

/* =======================  LJUD  ======================= */
let ac=null;
function pip(f,t,typ,vol){
  if(!spar.ljudEff)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=typ||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.05,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+t);
  }catch(e){}
}
const ljudHopp =()=>pip(430,.11,'square',.045);
const ljudRulle=()=>{pip(760,.07,'triangle',.06);setTimeout(()=>pip(1150,.09,'triangle',.05),60);};
const ljudRatt =()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>pip(f,.13,'triangle',.06),i*85));};
const ljudFel  =()=>{pip(190,.18,'sawtooth',.045);setTimeout(()=>pip(140,.24,'sawtooth',.04),140);};
const ljudAj   =()=>{pip(300,.1,'square',.05);setTimeout(()=>pip(180,.2,'square',.045),90);};
const ljudPort =()=>{[392,523,659].forEach((f,i)=>setTimeout(()=>pip(f,.16,'sine',.06),i*70));};

/* =======================  UPPLÄSNING  ======================= */
let rost=null;
function rosterLista(){
  if(!('speechSynthesis' in window))return [];
  const alla=speechSynthesis.getVoices()||[];
  const sv=alla.filter(v=>/^sv/i.test(v.lang||''));
  return sv.length?sv:alla;
}
function rostPoang(v){
  const n=(v.name||'').toLowerCase(); let p=0;
  if(/premium/.test(n))p+=120;
  else if(/enhanced|förbättrad|forbattrad|neural|natural/.test(n))p+=90;
  if(/siri/.test(n))p+=60;
  if(v.localService===false)p+=40;          // t.ex. Googles nätröster
  if(/compact|komprimerad|eloquence/.test(n))p-=60;
  if(/alva|klara|oskar|joanna/.test(n))p+=10;
  if(v.lang==='sv-SE')p+=6;
  return p;
}
function valjRost(){
  const l=rosterLista(); if(!l.length){rost=null;return;}
  if(spar.rostNamn){ const t=l.find(v=>v.name===spar.rostNamn); if(t){rost=t;return;} }
  rost=l.slice().sort((a,b)=>rostPoang(b)-rostPoang(a))[0];
}
if('speechSynthesis' in window){valjRost();speechSynthesis.onvoiceschanged=valjRost;}
const tyst=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();};
function las(text){
  if(!spar.tal||!('speechSynthesis' in window))return;
  tyst(); if(!rost)valjRost();
  // dela upp i korta meningar – bättre satsmelodi och mindre risk att iOS klipper av
  const bitar=String(text).split(/(?<=[.!?])\s+/).filter(t=>t.trim());
  setTimeout(()=>{
    for(const bit of bitar){
      const u=new SpeechSynthesisUtterance(bit);
      u.lang='sv-SE'; if(rost)u.voice=rost; u.rate=.94; u.pitch=1.02;
      speechSynthesis.speak(u);
    }
  },80);
}

/* =======================  STYRNING  ======================= */
const tang={vanster:false,hoger:false,upp:false,ner:false,hopp:false};
let hoppTryck=false;
const KARTA={ArrowLeft:'vanster',KeyA:'vanster',ArrowRight:'hoger',KeyD:'hoger',
  ArrowUp:'upp',KeyW:'upp',ArrowDown:'ner',KeyS:'ner',Space:'hopp',KeyZ:'hopp',Enter:'hopp',KeyX:'hopp'};
addEventListener('keydown',e=>{const k=KARTA[e.code];if(k){if(!tang[k]&&k==='hopp')hoppTryck=true;tang[k]=true;e.preventDefault();}});
addEventListener('keyup',e=>{const k=KARTA[e.code];if(k){tang[k]=false;e.preventDefault();}});
function knappStyr(el,namn){
  const ned=e=>{e.preventDefault();if(namn==='hopp'&&!tang.hopp)hoppTryck=true;tang[namn]=true;el.classList.add('ner');};
  const upp=e=>{e.preventDefault();tang[namn]=false;el.classList.remove('ner');};
  el.addEventListener('pointerdown',ned);
  el.addEventListener('pointerup',upp); el.addEventListener('pointercancel',upp);
  el.addEventListener('pointerleave',upp);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
['vanster','hoger','upp','ner'].forEach(n=>knappStyr(document.getElementById(n),n));
knappStyr(document.getElementById('hopp'),'hopp');

/* =======================  BANBYGGE  ======================= */
function tomGrid(cols){return Array.from({length:ROWS},()=>Array(cols).fill('.'));}
function mark(g,c0,c1){for(let c=c0;c<c1;c++)for(let r=GR;r<ROWS;r++)if(g[r])g[r][c]='#';}
function block(g,c0,c1,r0,r1){for(let c=c0;c<c1;c++)for(let r=r0;r<r1;r++)if(g[r]&&c>=0)g[r][c]='#';}

function byggBana(v){
  const svart=v.id;
  const bitar=['plan','grop','plattform'];
  if(svart>=2)bitar.push('trappa','grop');
  if(svart>=3)bitar.push('hoppkedja');
  if(svart>=4)bitar.push('taggar');
  if(svart>=5)bitar.push('rorlig');
  if(svart>=6)bitar.push('hoppkedja','rorlig');

  const g=tomGrid(v.langd+40);
  const rullor=[],portar=[],rorliga=[];
  const npcar=[]; let hav=null;
  const fragor=blanda(v.boss?bossFragor():v.fragor);
  const stationer=[];
  for(let k=0;k<v.portar;k++) stationer.push({typ:'port'});
  const upp=(UPPDRAG[v.id]||[]);
  if(upp.length){
    const kliv=Math.max(1,Math.floor(v.portar/(upp.length+1)));
    upp.forEach((u,k)=>stationer.splice(Math.min(stationer.length,(k+1)*kliv+k),0,{typ:'npc',u}));
  }
  let fi=0, c=0;
  const steg=v.langd/(stationer.length+1); let nasta=steg+4;
  mark(g,0,9); c=9;

  while(stationer.length || c<v.langd){
    if(stationer.length && c>=nasta){
      const st=stationer.shift(); mark(g,c,c+7);
      if(st.typ==='port')
        portar.push({x:(c+3)*TILE+12,y:GR*TILE,oppen:false,fraga:fragor[fi++%fragor.length],glod:0});
      else
        npcar.push({x:(c+3)*TILE+12,y:GR*TILE,u:st.u,klar:false});
      c+=7; nasta+=steg; continue;
    }
    const b=valj(bitar);
    if(b==='plan'){const w=slumpI(5,8);mark(g,c,c+w);
      if(Math.random()<.75)rullor.push({x:(c+Math.floor(w/2))*TILE+12,y:(GR-2)*TILE,tagen:false});
      c+=w;}
    else if(b==='grop'){const a=slumpI(3,4),gap=slumpI(2,Math.min(3,1+Math.ceil(svart/2))),b2=slumpI(3,4);
      mark(g,c,c+a); mark(g,c+a+gap,c+a+gap+b2);
      rullor.push({x:(c+a+gap/2)*TILE,y:(GR-3)*TILE,tagen:false});
      c+=a+gap+b2;}
    else if(b==='plattform'){const w=slumpI(7,9);mark(g,c,c+w);
      const pr=GR-3,pc=c+1,pw=slumpI(2,3); block(g,pc,pc+pw,pr,pr+1);
      rullor.push({x:(pc+pw/2)*TILE,y:(pr-2)*TILE,tagen:false});
      if(w>7){const pr2=GR-5,pc2=c+4; block(g,pc2,pc2+2,pr2,pr2+1);
        rullor.push({x:(pc2+1)*TILE,y:(pr2-2)*TILE,tagen:false});}
      c+=w;}
    else if(b==='trappa'){mark(g,c,c+9);
      block(g,c+2,c+3,GR-1,GR); block(g,c+3,c+4,GR-2,GR); block(g,c+4,c+5,GR-3,GR);
      rullor.push({x:(c+4.5)*TILE,y:(GR-5)*TILE,tagen:false});
      c+=9;}
    else if(b==='hoppkedja'){mark(g,c,c+3); let x=c+3;
      for(let i=0;i<3;i++){const gap=2,pr=GR-1-i;block(g,x+gap,x+gap+2,pr,pr+1);
        rullor.push({x:(x+gap+1)*TILE,y:(pr-2)*TILE,tagen:false}); x+=gap+2;}
      mark(g,x+2,x+6); c=x+6;}
    else if(b==='taggar'){const w=9;mark(g,c,c+w);
      g[GR-1][c+4]='^'; if(svart>=6)g[GR-1][c+5]='^';
      rullor.push({x:(c+4.5)*TILE+12,y:(GR-4)*TILE,tagen:false});
      c+=w;}
    else if(b==='rorlig'){mark(g,c,c+3);
      const x0=(c+3)*TILE-10, x1=(c+8)*TILE-64+10;
      rorliga.push({x:x0,y:(GR-1)*TILE,w:72,h:12,x0,x1,dir:1,fart:.8});
      rullor.push({x:(c+5.5)*TILE,y:(GR-3)*TILE,tagen:false});
      mark(g,c+8,c+12); c+=12;}
  }
  if(v.hav){                                   // Röda havet på väg ut ur Egypten
    mark(g,c,c+6);
    npcar.push({x:(c+3)*TILE,y:GR*TILE,u:HAVSUPPDRAG,klar:false,oppnarHav:true});
    c+=6;
    hav={c0:c,c1:c+7,oppet:false,anim:0};
    c+=7; mark(g,c,c+6); c+=6;
  }
  mark(g,c,c+9); c+=9;
  const cols=c;
  for(let r=0;r<ROWS;r++){ const rad=g[r];
    for(let i=0;i<cols;i++) if(rad[i]===undefined||rad[i]==='')rad[i]='.';
    rad.length=cols; }
  return {g,cols,rullor,portar,rorliga,npcar,hav,malX:(cols-5)*TILE};
