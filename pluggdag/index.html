<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#0F1524;--kort:#18213A;--kort2:#1F2A48;--text:#F2F5FA;--dov:#A9B3C6;--linje:#2C3758;--acc:#7EA6FF;--ratt:#5FCB8A;--gul:#F2C14E;--paus:#2A2F45;
  --rubrik:"Lexend","Avenir Next","Segoe UI",sans-serif;--brod:"Atkinson Hyperlegible","Verdana",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#25335C,transparent),var(--bg);color:var(--text);font:18px/1.5 var(--brod);min-height:100vh;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:14px}
.topp{display:flex;gap:10px;align-items:center}
.topp a{font:700 .95rem var(--rubrik);color:var(--text);text-decoration:none;border:1px solid var(--linje);border-radius:12px;padding:8px 12px;background:#1E2638}
h1{font:800 2rem/1.1 var(--rubrik);margin:6px 0 0}
.under{margin:0;color:var(--dov)}
.matare{height:12px;border-radius:999px;background:#232C47;overflow:hidden}
.matare i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ratt));border-radius:inherit;transition:width .4s}
.status{margin:0;font:700 .95rem var(--rubrik);color:var(--dov)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:linear-gradient(180deg,var(--kort2),var(--kort));border:1px solid var(--linje);border-radius:18px;padding:14px 14px 14px 12px;
  display:grid;grid-template-columns:auto 1fr;gap:4px 12px;box-shadow:0 3px 0 #0A0F1C;transition:opacity .3s,transform .2s}
li.paus{background:var(--paus);box-shadow:none}
li.klar{opacity:.55}
li.nu{border-color:var(--acc);box-shadow:0 0 0 3px rgba(126,166,255,.25),0 3px 0 #0A0F1C}
.bock{grid-row:span 3;width:44px;height:44px;border-radius:14px;border:2px solid var(--linje);background:#121a2e;color:transparent;font-size:1.4rem;
  cursor:pointer;display:grid;place-items:center;align-self:start}
li.klar .bock{background:var(--ratt);border-color:var(--ratt);color:#0b2414}
.huvud{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.huvud b{font:700 1.12rem/1.25 var(--rubrik)}
.tid{font:700 .78rem var(--rubrik);color:var(--gul);background:rgba(242,193,78,.12);border-radius:999px;padding:2px 8px}
.bonus{font:700 .72rem var(--rubrik);color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:1px 7px}
.text{margin:0;color:#D9E0EE}
.lankar{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.lankar a,.las{font:700 .92rem var(--rubrik);color:#0B1428;background:var(--acc);text-decoration:none;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;box-shadow:0 3px 0 #3E5BA8}
.las{background:transparent;color:var(--acc);border:2px solid var(--acc);box-shadow:none;padding:7px 12px}
.flikar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:thin}
.flikar button{flex:0 0 auto;font:700 .92rem var(--rubrik);color:var(--text);background:#1E2638;border:1px solid var(--linje);border-radius:12px;padding:8px 12px;cursor:pointer}
.flikar button.vald{background:var(--acc);color:#0B1428;border-color:var(--acc)}
.flikar button.idag::after{content:" · idag";font-weight:400}
.flikar button.gjord{opacity:.6}
.slut{text-align:center;font:800 1.3rem var(--rubrik);color:var(--ratt);margin:6px 0 0;min-height:1.5em}
button:focus-visible,a:focus-visible{outline:3px solid var(--gul);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="topp"><a href="../index.html">‹ Hem</a></div>
<nav class="flikar" id="flikar" aria-label="Välj dag"></nav>
<h1 id="rubrik"></h1>
<p class="under" id="under"></p>
<div class="matare" aria-hidden="true"><i id="matare"></i></div>
<p class="status" id="status" aria-live="polite"></p>
<ol id="pass"></ol>
<p class="slut" id="slut" aria-live="polite"></p>
</div>
<script>
(function(){
  'use strict';
  var PLAN = {"id":"lovplan-kemi-v44","rubrik":"Lovplan: kemi","underrubrik":"En kort plan per dag. Kemi först, ett pass i taget. Välj dagens flik och bocka av.","slut":"Klart för idag. Riktigt bra jobbat!","dagar":[{"id":"2026-10-27","datum":"2026-10-27","flik":"Tis 27/10","rubrik":"Kemi dag 1: atomen","underrubrik":"Protoner, neutroner, elektroner och skalen.","pass":[{"tid":"5 min","rubrik":"Kom igång","text":"Öppna Atomresan. Gå till bana 1 och tryck på Titta först.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"15 min","rubrik":"Bana 1: atomens byggstenar","text":"Spela banan. Tänk på vad som finns i kärnan och vad som finns i skalen.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"15 min","rubrik":"Bana 2: elektronskalen","text":"Titta först, spela sen. K-skalet har två platser, L-skalet åtta.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"10 min","rubrik":"Paus","text":"Res dig, drick vatten, gå en sväng. Inga skärmar.","paus":true},{"tid":"15 min","rubrik":"Bana 3: atomnummer och atommassa","text":"Titta först, spela sen.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"10 min","rubrik":"Öva att förklara högt","text":"Öppna Öva muntligt och välj atomen. Säg svaret högt innan du tittar på exemplet.","lankar":[["Öva muntligt","muntligt/index.html"]]},{"tid":"15 min","rubrik":"Bonus: medveten konsument","text":"Bara om du orkar. Konsumentkollen, bana 1.","lankar":[["Konsumentkollen","spel/konsumentkollen.html"]],"bonus":true}]},{"id":"2026-10-28","datum":"2026-10-28","flik":"Ons 28/10","rubrik":"Kemi dag 2: periodiska systemet","underrubrik":"Grupper, perioder och grundämnesfamiljerna.","pass":[{"tid":"5 min","rubrik":"Minns du?","text":"Öva muntligt: ta tre frågor om atomen. Säg dem högt.","lankar":[["Öva muntligt","muntligt/index.html"]]},{"tid":"15 min","rubrik":"Bana 4: periodiska systemet","text":"Titta först, spela sen. Samma grupp betyder lika många valenselektroner.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"15 min","rubrik":"Bana 5: grundämnesfamiljer","text":"Alkalimetaller, halogener och ädelgaser. Titta först, spela sen.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"10 min","rubrik":"Paus","text":"Rör på dig en stund.","paus":true},{"tid":"10 min","rubrik":"Öva att förklara högt","text":"Välj familjerna. Varför har man helium i ballonger? Varför är natrium i vatten farligt?","lankar":[["Öva muntligt","muntligt/index.html"]]},{"tid":"20 min","rubrik":"Slöjd: dokumentera","text":"Lägg in bilderna från slöjden i skolans digitala anteckningsbok och skriv kort vad du gjort varje lektion."},{"tid":"15 min","rubrik":"Bonus: reklam och påverkan","text":"Konsumentkollen, bana 2.","lankar":[["Konsumentkollen","spel/konsumentkollen.html"]],"bonus":true}]},{"id":"2026-10-29","datum":"2026-10-29","flik":"Tor 29/10","rubrik":"Kemi dag 3: joner","underrubrik":"Varför atomer lämnar eller tar elektroner.","pass":[{"tid":"5 min","rubrik":"Kom igång","text":"Atomresan, bana 6. Tryck på Titta först.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"15 min","rubrik":"Bana 6: joner","text":"Spela banan. Plus om atomen lämnar elektroner, minus om den tar emot.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"15 min","rubrik":"Bana 7: jonföreningar","text":"Titta först, spela sen. Natrium och klor blir koksalt.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"10 min","rubrik":"Paus","text":"Res dig, drick vatten.","paus":true},{"tid":"10 min","rubrik":"Rita och förklara","text":"Öva muntligt, välj joner. Rita en natriumatom och en natriumjon på ett papper och förklara skillnaden högt.","lankar":[["Öva muntligt","muntligt/index.html"]]},{"tid":"15 min","rubrik":"Bonus: dina rättigheter","text":"Konsumentkollen, bana 3.","lankar":[["Konsumentkollen","spel/konsumentkollen.html"]],"bonus":true}]},{"id":"2026-10-30","datum":"2026-10-30","flik":"Fre 30/10","rubrik":"Kemi dag 4: formler och molekyler","underrubrik":"Formelmassa, balansering och bindningar.","pass":[{"tid":"15 min","rubrik":"Bana 8: formler och formelmassa","text":"Titta först, spela sen. Räkna med u.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"15 min","rubrik":"Bana 9: balansera","text":"Lika många atomer av varje sort på båda sidor om pilen.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"10 min","rubrik":"Paus","text":"Rör på dig en stund.","paus":true},{"tid":"15 min","rubrik":"Bana 10: molekyler och bindningar","text":"Ny bana. Titta först, spela sen.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"10 min","rubrik":"Framtidshäftet","text":"Om du har häftet hemma: gör förberedelsedelen inför tisdag."},{"tid":"15 min","rubrik":"Bonus: handla på nätet","text":"Konsumentkollen, bana 4.","lankar":[["Konsumentkollen","spel/konsumentkollen.html"]],"bonus":true}]},{"id":"2026-11-01","datum":"2026-11-01","flik":"Sön 1/11","rubrik":"Valfritt: lätt repetition","underrubrik":"Bara om du vill. Kort och lätt.","pass":[{"tid":"10 min","rubrik":"Scrolla kemi","text":"Svep genom kemifrågorna. Missade frågor kommer tillbaka.","lankar":[["Scrolla","scroll/index.html"]],"bonus":true},{"tid":"10 min","rubrik":"Titta på två filmer","text":"Kemi i flödet. Välj två filmer du inte sett.","lankar":[["Flödet: kemi","flode/index.html#kemi"]],"bonus":true}]},{"id":"2026-11-02","datum":"2026-11-02","flik":"Mån 2/11","rubrik":"Kemi dag 5: lösningar som leder ström","underrubrik":"Efter skolan. Labben med salt, socker och vatten.","pass":[{"tid":"15 min","rubrik":"Bana 11: lösningar som leder ström","text":"Ny bana. Titta först, spela sen.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"10 min","rubrik":"Öva att förklara högt","text":"Välj lösningar och bindningar. Varför leder saltvatten ström men inte sockervatten?","lankar":[["Öva muntligt","muntligt/index.html"]]},{"tid":"10 min","rubrik":"Paus","text":"Ät något och vila.","paus":true},{"tid":"10 min","rubrik":"Provsimulering","text":"Öva muntligt: sex frågor i rad. Svara högt, titta på svaren efteråt.","lankar":[["Öva muntligt","muntligt/index.html"]]}]},{"id":"2026-11-03","datum":"2026-11-03","flik":"Tis 3/11","rubrik":"Kemi dag 6: allt blandat","underrubrik":"Efter skolan. Slutbanan i Atomresan.","pass":[{"tid":"20 min","rubrik":"Bana 12: allt blandat","text":"Slutbanan blandar allt. Det gör inget om du missar, du får försöka igen.","lankar":[["Atomresan","spel/atomresan.html"]]},{"tid":"10 min","rubrik":"Paus","text":"Rör på dig en stund.","paus":true},{"tid":"10 min","rubrik":"Det svåraste","text":"Öva muntligt: välj det område där du har minst bockar.","lankar":[["Öva muntligt","muntligt/index.html"]]}]},{"id":"2026-11-04","datum":"2026-11-04","flik":"Ons 4/11","rubrik":"Kort dag","underrubrik":"Tandläkaren i eftermiddag. Bara två korta pass.","pass":[{"tid":"10 min","rubrik":"Provsimulering","text":"Sex frågor i rad, säg svaren högt.","lankar":[["Öva muntligt","muntligt/index.html"]]},{"tid":"10 min","rubrik":"Scrolla kemi","text":"Svep genom kemifrågorna.","lankar":[["Scrolla","scroll/index.html"]]}]},{"id":"2026-11-05","datum":"2026-11-05","flik":"Tor 5/11","rubrik":"Dagen före","underrubrik":"Lugnt. Förklara för någon hemma.","pass":[{"tid":"15 min","rubrik":"Förklara för någon","text":"Öva muntligt med någon hemma. Den andra läser frågan, du svarar högt.","lankar":[["Öva muntligt","muntligt/index.html"]]},{"tid":"10 min","rubrik":"Tre filmer","text":"Titta på tre kemifilmer i flödet.","lankar":[["Flödet: kemi","flode/index.html#kemi"]]},{"tid":"","rubrik":"Sov i tid","text":"Lägg undan skärmen tidigt ikväll. Du har förberett dig bra.","paus":true}]},{"id":"2026-11-06","datum":"2026-11-06","flik":"Fre 6/11","rubrik":"Lugn morgon","underrubrik":"Ät frukost. Bara en kort sak.","pass":[{"tid":"5 min","rubrik":"En film","text":"Titta på filmen om grundämnesfamiljerna. Andas lugnt. Du kan det här.","lankar":[["Flödet: kemi","flode/index.html#kemi"]]}]}]};
  var DAGAR = PLAN.dagar || [{ id: PLAN.id, rubrik: PLAN.rubrik, underrubrik: PLAN.underrubrik, pass: PLAN.pass }];
  function las(t){ if (!window.speechSynthesis) return; speechSynthesis.cancel();
    String(t).split(/(?<=[.!?])\s+/).filter(Boolean).forEach(function(b){ var u = new SpeechSynthesisUtterance(b); u.lang = 'sv-SE'; u.rate = .94; speechSynthesis.speak(u); }); }
  function hamta(n){ try { return JSON.parse(localStorage.getItem(n)) || {}; } catch (e) { return {}; } }
  function nyckel(d){ return 'plugg9.pluggdag.' + (PLAN.dagar ? PLAN.id + '.' : '') + d.id; }
  function arbete(d){ return d.pass.map(function(p, i){ return p.paus || p.bonus ? -1 : i; }).filter(function(i){ return i >= 0; }); }
  function allaKlara(d){ var k = hamta(nyckel(d)); return arbete(d).every(function(i){ return k[i]; }); }
  // dagens flik: dagens datum, annars nästa dag i planen, annars den sista
  var idag = new Date(), iso = idag.getFullYear() + '-' + ('0' + (idag.getMonth() + 1)).slice(-2) + '-' + ('0' + idag.getDate()).slice(-2);
  var start = 0;
  if (PLAN.dagar) { start = DAGAR.length - 1; for (var j = 0; j < DAGAR.length; j++) if ((DAGAR[j].datum || '') >= iso) { start = j; break; } }
  var nav = document.getElementById('flikar');
  if (!PLAN.dagar) nav.hidden = true;
  DAGAR.forEach(function(d, j){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = d.flik || d.rubrik;
    if (d.datum === iso) b.className = 'idag';
    b.onclick = function(){ visaDag(j); }; nav.appendChild(b);
  });
  var ol = document.getElementById('pass'), dag, klara, arb;
  function visaDag(j){
    dag = DAGAR[j]; klara = hamta(nyckel(dag)); arb = arbete(dag);
    [].forEach.call(nav.children, function(b, k){ b.classList.toggle('vald', k === j); b.classList.toggle('gjord', k !== j && allaKlara(DAGAR[k])); });
    if (nav.children[j]) nav.children[j].scrollIntoView({ block: 'nearest', inline: 'center' });
    document.getElementById('rubrik').textContent = dag.rubrik;
    document.getElementById('under').textContent = dag.underrubrik || '';
    ol.innerHTML = '';
    dag.pass.forEach(function(p, i){
      var li = document.createElement('li'); if (p.paus) li.className = 'paus';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'bock'; b.textContent = '✓';
      b.setAttribute('aria-label', 'Klart: ' + p.rubrik);
      b.onclick = function(){ klara[i] = !klara[i]; try { localStorage.setItem(nyckel(dag), JSON.stringify(klara)); } catch (e) {} rita(); if (klara[i] && !p.paus) las('Bra jobbat!'); };
      var h = document.createElement('div'); h.className = 'huvud';
      h.innerHTML = '<b></b>' + (p.tid ? '<span class="tid"></span>' : '') + (p.bonus ? '<span class="bonus">bonus</span>' : '');
      h.querySelector('b').textContent = p.rubrik; if (p.tid) h.querySelector('.tid').textContent = p.tid;
      var t = document.createElement('p'); t.className = 'text'; t.textContent = p.text;
      var l = document.createElement('div'); l.className = 'lankar';
      (p.lankar || []).forEach(function(x){ var a = document.createElement('a'); a.href = '../' + x[1]; a.textContent = x[0] + ' →'; l.appendChild(a); });
      var lb = document.createElement('button'); lb.type = 'button'; lb.className = 'las'; lb.textContent = '🔊 Läs upp';
      lb.onclick = function(){ las(p.rubrik + '. ' + p.text); }; l.appendChild(lb);
      li.appendChild(b); li.appendChild(h); li.appendChild(t); li.appendChild(l); ol.appendChild(li);
    });
    rita();
  }
  function rita(){
    var lis = ol.children, nu = -1;
    for (var i = 0; i < lis.length; i++) { lis[i].classList.toggle('klar', !!klara[i]); lis[i].classList.remove('nu'); if (nu < 0 && !klara[i]) nu = i; }
    if (nu >= 0) lis[nu].classList.add('nu');
    var gjort = arb.filter(function(i){ return klara[i]; }).length;
    document.getElementById('matare').style.width = (arb.length ? Math.round(100 * gjort / arb.length) : 100) + '%';
    document.getElementById('status').textContent = arb.length ? gjort + ' av ' + arb.length + ' pass klara' : 'Bara valfria pass idag';
    document.getElementById('slut').textContent = arb.length && gjort === arb.length ? PLAN.slut : '';
  }
  visaDag(start);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(function(){});
})();
</script>
