EXP.aska={
  namn:'Blixt och åska',
  intro:'Ljuset från blixten kommer fram nästan direkt. Ljudet går bara 340 meter på en sekund. Tryck på Blixt, räkna sekunderna tills mullret kommer, och dra sedan reglaget till rätt avstånd.',
  steg:[
    'Räkna ut hur långt bort den första blixten slog ner.',
    'Räkna ut hur långt bort den andra blixten slog ner.',
    'Räkna ut hur långt bort den tredje blixten slog ner.'
  ],
  fraga:['Varför ser man blixten innan man hör åskan?',
    ['Ljuset går mycket snabbare än ljudet',
     'Ljudet går snabbare än ljuset',
     'Åskan startar senare än blixten',
     'Öronen hinner inte med lika fort som ögonen'],
    'Ljuset går nästan en miljon gånger snabbare än ljudet, så blixten syns direkt. Ljudet hinner ungefär 340 meter varje sekund i luft. Räkna sekunderna och dela med tre, så får du ungefär avståndet i kilometer. Sex sekunder betyder alltså ungefär två kilometer.'],
  bygg(api){
    const F=api.farg, P=new G.Partiklar({max:150});
    const TID=blanda([3,6,9,2,5,4]);
    const MOLN=[[250,76,40],[312,58,48],[382,74,44],[452,56,50],[522,76,42],[588,62,36]];
    let R=null, klara=0, nr=0, gissning=1;
    const km=v=>dec(v,1).replace(/,0$/,'');   // talsyntesen ska säga «1 kilometer», inte «1 komma noll»
    api.avlas('t','Sekunder efter blixten'); api.avlas('v','Ljudets fart');
    api.avlas('d','Ditt svar'); api.avlas('r','Rätta svar');
    const blixtB=api.knapp({id:'blixt',text:'Blixt!',primar:true,vid:nyBlixt});
    api.slider({id:'avstand',etikett:'Avstånd till blixten',min:.2,max:4,steg:.1,varde:gissning,fmt:v=>dec(v,1)+' km',
      vid:v=>{ gissning=v; if(R&&R.muller&&!R.klart)api.peka('svara'); }});
    const svaraB=api.knapp({id:'svara',text:'Svara',vid:svara});
    svaraB.disabled=true;
    api.peka('blixt'); hjalpStart();
    api.tips('Tryck på Blixt och räkna sekunderna tills du hör mullret.');

    function hjalpStart(){ api.hint(['Blixten och mullret kommer från samma ställe, men inte samtidigt.',
      'Knappen Blixt startar ett nytt åskslag.','Tryck på knappen Blixt.']); }
    function hjalpVanta(){ api.hint(['Räkna lugnt: ett, två, tre.','Vänta tills mullret kommer.',
      'Titta på sekundräknaren uppe till vänster medan du räknar.']); }
    function hjalpSvar(){ api.hint(['Ljudet hinner 340 meter varje sekund.',
      'Ta sekunderna gånger 340 meter, eller dela sekunderna med tre för att få kilometer.',
      R.tid+' sekunder gånger 340 meter blir '+heltal(R.tid*340)+' meter, alltså ungefär '+km(R.tid*.34)+' kilometer. Dra Avstånd dit och tryck på Svara.']); }
    function nyBlixt(){
      if(R&&!R.klart)return;
      R={tid:TID[nr++%TID.length],t:0,muller:false,klart:false,gnista:true};
      blixtB.disabled=true; svaraB.disabled=true;
      api.peka('avstand'); hjalpVanta();
      api.tips('Blixt! Räkna sekunderna tills mullret kommer.');
      api.pip(1400,.05,'square',.02);
    }
    function mullra(){
      const x=api.ljudkontext(); if(!x)return;
      try{ const len=Math.floor(x.sampleRate*1.4), buf=x.createBuffer(1,len,x.sampleRate), d=buf.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
        const s=x.createBufferSource(), fl=x.createBiquadFilter(), g=x.createGain();
        fl.type='lowpass'; fl.frequency.value=180; g.gain.value=.45;
        s.buffer=buf; s.connect(fl); fl.connect(g); g.connect(x.destination); s.start();
      }catch(e){}
    }
    function svara(){
      if(!R||!R.muller||R.klart)return;
      R.klart=true; R.ratt=R.tid*.34; R.gissning=gissning; R.ok=Math.abs(gissning-R.ratt)<=.25;
      svaraB.disabled=true; blixtB.disabled=false;
      const rad=R.tid+' sekunder gånger 340 meter blir '+heltal(R.tid*340)+' meter, alltså ungefär '+km(R.ratt)+' kilometer.';
      if(R.ok){ api.klar(klara); klara++; api.tips('Rätt! '+rad); }
      else api.tips('Nästan. '+rad+' Ta en ny blixt och prova igen.');
      api.peka('blixt'); hjalpStart();
    }

    return {rita(c,t,dt){
      const dam=lugn()?.3:1;
      let flash=0;
      if(R){ R.t+=dt; if(R.t<.28)flash=(1-R.t/.28)*(lugn()?.3:1);
        if(!R.muller&&R.t>=R.tid){ R.muller=true; mullra(); svaraB.disabled=false;
          api.peka('avstand'); hjalpSvar();
          api.tips('Mullret kom efter '+R.tid+' sekunder. Dra reglaget till rätt avstånd och tryck på Svara.'); } }

      G.scen(c,{topp:'#070C12',botten:'#16222F',stjarnor:.3,vinjett:true});
      for(let i=0;i<MOLN.length;i++){ const m=MOLN[i];
        G.klot(c,m[0]+Math.sin(t*.25+i)*4*dam,m[1],m[2],'#1F2E3D'); }
      if(flash>0){ G.glod(c,470,150,200,'#DCE7F0',flash*.9);
        c.save(); c.fillStyle='rgba(230,240,255,'+(flash*.4)+')'; c.fillRect(0,0,CW,CH); c.restore();
        G.poly(c,[[476,84],[452,168],[482,168],[446,296],[506,158],[474,158],[500,84]],'#FFF8C4'); }
      if(R&&R.gnista){ R.gnista=false;
        for(let i=0;i<20;i++)P.skapa({x:470,y:296,vx:slump(-130,130),vy:slump(-230,-60),liv:.8,r:slump(1.5,3),farg:'#FFD166',gravitation:420}); }
      if(!lugn())for(let i=0;i<3;i++)
        P.skapa({x:slump(0,CW),y:-4,vx:-28,vy:slump(230,290),liv:1.35,r:1.3,farg:'rgba(150,185,225,.45)',gravitation:60});
      P.uppdatera(dt); P.rita(c);

      G.golv(c,300,{farg:'#16222F',djup:'#0A1119',linjer:true});
      if(R&&!R.klart)G.glod(c,470,298,42,'#FFD166',.16+.12*Math.abs(Math.sin(t*4))*dam);
      G.skugga(c,92,302,26,7,.6);
      G.person(c,92,300,1.15,'#DCE7F0');

      if(R&&!R.muller){ const p=clamp(R.t/R.tid,0,1), r=p*378;
        c.save(); c.beginPath(); c.rect(0,0,CW,302); c.clip();
        for(let k=0;k<3;k++){ const rr=r-k*16; if(rr<6)continue;
          c.beginPath(); c.arc(470,296,rr,Math.PI*.72,Math.PI*1.28);
          c.strokeStyle='rgba(255,126,182,'+(.7-k*.2)+')'; c.lineWidth=3; c.stroke(); }
        c.restore();
        const mx=470-p*378;
        G.poly(c,[[mx,316],[mx+13,308],[mx+13,324]],'#FF7EB6');
        G.text(c,'ljudet',mx+19,322,{f:'#FF7EB6'}); }

      const lapp=R?(R.klart?dec(R.ratt,1)+' km':(R.muller?'hur långt bort?':'…')):'hur långt bort?';
      G.matband(c,92,336,470,lapp,R&&R.klart?(R.ok?'#7BD389':'#FF7A7A'):'#5CB8FF');
      if(R&&R.klart){
        G.rund(c,180,250,200,26,13,'rgba(7,12,18,.78)','rgba(255,209,102,.4)',1);
        G.text(c,R.tid+' s · 340 m/s = '+heltal(R.tid*340)+' m',280,268,{a:'center',f:'#FFD166'});
        G.callout(c,404,220,'Rätt: '+dec(R.ratt,1)+' km',{till:[470,294],farg:'#7BD389'});
        G.callout(c,176,302,(R.ok?'Ditt svar: ':'Du sa: ')+dec(R.gissning,1)+' km',{till:[112,284],farg:R.ok?'#7BD389':'#FF7A7A'}); }

      G.bricka(c,14,14,176,96,{titel:'Tid efter blixten',farg:F});
      const sek=R?(R.muller?R.tid:Math.floor(R.t)):0;
      G.digit(c,sek+' s',30,90,{farg:'#9FF0FF',storlek:34});
      G.bricka(c,14,120,176,86,{titel:'Så räknar du',farg:'#5CB8FF'});
      G.text(c,'340 m varje sekund',26,162,{f:'#DCE7F0'});
      G.text(c,'3 sekunder ≈ 1 km',26,188,{f:'#FFD166'});
      G.rund(c,486,326,140,30,15,'rgba(7,12,18,.72)','rgba(238,243,247,.2)',1);
      G.text(c,'Rätt: '+Math.min(klara,3)+' av 3',556,346,{a:'center',f:klara>0?'#7BD389':'#A3B3C5'});

      api.satt('t',sek+' s'); api.satt('v','340 m/s');
      api.satt('d',dec(gissning,1)+' km'); api.satt('r',Math.min(klara,3)+' av 3');
    }};
  }
};

EXP.vakuum={
  namn:'Klockan i vakuum',
  intro:'En väckarklocka ringer under en glasklocka. Med pumpen suger du ut luften. Prickarna är luftens partiklar. Lyssna och titta på ljudvågorna medan luften försvinner.',
  steg:['Pumpa ut hälften av luften.','Pumpa ut all luft.','Släpp in luften igen.'],
  fraga:['Varför hörs inget ljud när all luft är borta?',
    ['Ljudet har inga partiklar att färdas i när luften är borta',
     'Klockan slutar ringa när luften pumpas ut ur glasklockan',
     'Glaset blir tätare och stoppar ljudet när det är tomt',
     'Pumpen låter så högt att den dränker klockans ringning'],
    'Klockan ringer hela tiden. Ljud är svängningar som förs vidare när partiklar knuffar på varandra, och i vakuum finns inga partiklar. Därför är det helt tyst i rymden, även om något exploderar.'],
  bygg(api){
    const AK=api.farg, CX=292, KLOCKA=248, BORD=306, TAK=138;
    let luft=100, nasta=0, ringer=0;
    const P=[];
    for(let i=0;i<70;i++) P.push({x:slump(CX-108,CX+108),y:slump(TAK-4,BORD-16),vx:slump(-46,46),vy:slump(-46,46)});

    api.avlas('l','Luft i glasklockan'); api.avlas('h','Hörs klockan?'); api.avlas('p','Antal partiklar');
    api.slider({id:'luft',etikett:'Luft i glasklockan',min:0,max:100,steg:10,varde:100,fmt:v=>v+' %',vid:v=>{
      luft=v;
      const fore=[api.gjort(0),api.gjort(1),api.gjort(2)];
      /* Stegen kollas efter varandra, så att det går bra att dra reglaget hela vägen i ett svep. */
      if(luft<=50&&!api.gjort(0)) api.klar(0);
      if(luft===0&&api.gjort(0)&&!api.gjort(1)) api.klar(1);
      if(luft===100&&api.gjort(1)&&!api.gjort(2)) api.klar(2);
      if(api.gjort(2)&&!fore[2]) api.tips('Luften är tillbaka och klockan hörs igen. Ljudet behövde partiklarna.');
      else if(api.gjort(1)&&!fore[1]) api.tips('Vakuum. Klockan ringer, men inga partiklar finns kvar som kan föra ljudet vidare. Helt tyst.');
      else if(api.gjort(0)&&!fore[0]) api.tips('Halva luften är ute. Hör du att ljudet blev svagare?');
      else api.tips(luft===0?'Helt tyst.':luft<=50?'Svagt ljud.':'Klockan hörs tydligt.',true);
      if(api.gjort(0)!==fore[0]||api.gjort(1)!==fore[1]) leda();
    }});
    api.peka('luft');
    leda();
    function leda(){
      if(!api.gjort(0)) api.hint(['Det finns bara ett reglage här. Prova att dra det åt vänster.','Ju mindre luft, desto färre partiklar som kan föra ljudet.','Dra Luft i glasklockan till femtio procent.']);
      else if(!api.gjort(1)) api.hint(['Fortsätt pumpa.','Dra reglaget hela vägen åt vänster.','Dra Luft i glasklockan till noll procent.']);
      else api.hint(['Nu släpper vi in luften igen.','Dra reglaget åt höger.','Dra Luft i glasklockan till hundra procent.']);
    }

    return {rita(c,t,dt){
      const lg=lugn(), andel=luft/100;
      nasta-=dt;
      if(nasta<=0){ nasta=.55; ringer=.35; if(luft>0) pip(1750+Math.random()*90,.09,'square',.002+andel*.014); }
      ringer=Math.max(0,ringer-dt);

      G.scen(c,{topp:'#0A0F18',botten:'#131E2C',rutnat:30,vinjett:true});
      G.golv(c,BORD,{farg:'#1A2636',djup:'#26374D'});

      /* luftpartiklar innanför kupan */
      const N=Math.round(andel*62);
      for(let i=0;i<N;i++){
        const q=P[i];
        const fart=lg?.35:1;
        q.x+=q.vx*dt*fart; q.y+=q.vy*dt*fart;
        if(q.x<CX-104){q.x=CX-104;q.vx=Math.abs(q.vx);}
        if(q.x>CX+104){q.x=CX+104;q.vx=-Math.abs(q.vx);}
        if(q.y<TAK+4){q.y=TAK+4;q.vy=Math.abs(q.vy);}
        if(q.y>BORD-12){q.y=BORD-12;q.vy=-Math.abs(q.vy);}
        G.cirkel(c,q.x,q.y,2.6,'rgba(170,215,255,.62)');
      }

      /* ljudvågor inne i kupan – bara om det finns partiklar */
      if(luft>0){
        for(let k=0;k<3;k++){
          const r=26+((t*70+k*34)%84);
          c.save(); c.globalAlpha=andel*(1-(r-26)/84)*.8;
          G.cirkel(c,CX,KLOCKA-6,r,null,'#FF7EB6',2.5);
          c.restore();
        }
      }

      /* väckarklockan */
      const sk=(ringer>0&&!lg)?Math.sin(t*58)*2.4:0;   // klockan ringer även i vakuum
      G.skugga(c,CX,BORD-4,44,8,.5);
      G.metall(c,CX-34,BORD-16,68,12,4,{ljus:'#C8D5E2',mork:'#5D6A79'});
      G.klot(c,CX+sk,KLOCKA,32,'#FF8080');
      G.cirkel(c,CX+sk,KLOCKA,25,'#F2F7FB');
      G.linje(c,CX+sk,KLOCKA,CX+sk,KLOCKA-16,'#101820',3);
      G.linje(c,CX+sk,KLOCKA,CX+sk+12,KLOCKA+5,'#101820',3);
      G.cirkel(c,CX+sk,KLOCKA,3,'#101820');
      G.klot(c,CX-26+sk,KLOCKA-30,10,'#FFC95C');
      G.klot(c,CX+26+sk,KLOCKA-30,10,'#FFC95C');
      G.linje(c,CX-20+sk,KLOCKA-27,CX+20+sk,KLOCKA-27,'#9DAFC4',3);
      /* ringmärken vid klockan: klockan ringer hela tiden, även i vakuum och i lugnt läge där den inte skakar.
         De står stilla, så att inget blinkar. */
      c.save(); c.strokeStyle='#FFC95C'; c.lineWidth=3; c.lineCap='round';
      for(const sida of [-1,1]) for(const r of [44,56]){
        c.beginPath(); c.arc(CX,KLOCKA,r,sida<0?Math.PI-.36:-.36,sida<0?Math.PI+.36:.36); c.stroke();
      }
      c.restore();

      /* glaskupan */
      G.glas(c,cc=>{
        cc.moveTo(CX-112,BORD);
        cc.lineTo(CX-112,TAK);
        cc.arc(CX,TAK,112,Math.PI,0);
        cc.lineTo(CX+112,BORD);
      },{hx:CX-92,hy:TAK-20,kant:'rgba(215,240,255,.78)',bredd:3});

      /* slang och pump */
      G.ror(c,[[CX+112,BORD-14],[CX+168,BORD-14],[CX+168,240],[CX+206,240]],11,'#6B7C8F');
      G.metall(c,498,196,58,96,9,{ljus:'#C8D5E2',mork:'#5D6A79'});
      const kolv=196+ (100-luft)*0.42;   // kolven går ner när du pumpar
      G.metall(c,506,kolv,42,13,4,{ljus:'#FFC95C',mork:'#B48326'});
      G.text(c,'PUMP',527,308,{a:'center',font:F_LITEN,f:'#9DAFC4'});
      if(!lg&&luft<100&&luft>0) for(let k=0;k<2;k++) G.cirkel(c,CX+112+((t*40+k*28)%56),BORD-14,3,'rgba(170,215,255,.35)');

      /* ljudvågor ut ur kupan */
      if(luft>0) for(let k=0;k<3;k++){
        const r=124+((t*58+k*40)%118);
        c.save(); c.globalAlpha=andel*(1-(r-124)/118)*.75;
        c.beginPath(); c.arc(CX,KLOCKA-6,r,Math.PI*1.12,Math.PI*1.42);
        c.strokeStyle='#FF7EB6'; c.lineWidth=3.2; c.stroke(); c.restore();
      }

      /* instrument */
      G.bricka(c,14,10,190,76,{titel:'Luft i glasklockan',farg:AK});
      G.digit(c,luft+' %',26,48,{farg:luft===0?'#FF8080':'#9FF0FF',storlek:24});
      G.stapel(c,26,60,166,11,andel,luft===0?'#FF8080':AK,{bakgrund:'#050A11'});

      G.bricka(c,436,10,190,76,{titel:'Hörs klockan?',farg:luft===0?'#FF8080':'#6FD68A'});
      G.digit(c,luft===0?'TYST':luft<=50?'SVAGT':'JA',448,48,{farg:luft===0?'#FF8080':luft<=50?'#FFC95C':'#6FD68A',storlek:22});
      G.text(c,luft===0?'inga partiklar kvar':N+' partiklar knuffar',448,72,{font:F_LITEN,f:'#9DAFC4'});

      G.callout(c,CX,112,luft===0?'Vakuum: klockan ringer, men det är tyst':'Partiklarna för ljudet vidare',
        {till:[CX,TAK+26],farg:luft===0?'#FFC95C':'#FF7EB6'});

      api.satt('l',luft+' %');
      api.satt('h',luft===0?'nej':luft<=50?'svagt':'ja');
      api.satt('p',N+' st');
    }};
  }
};

EXP.skydd={
  namn:'Stoppa strålningen',
  intro:'Till vänster står en radioaktiv källa. Till höger står en geigerräknare som knastrar varje gång strålning träffar den. Hitta det tunnaste skyddet som stoppar alfa och beta. Hitta sedan skyddet som minskar gamma mest.',
  steg:['Hitta det tunnaste skyddet som stoppar alfastrålning.','Hitta det tunnaste skyddet som stoppar betastrålning.','Hitta skyddet som minskar gammastrålningen mest.'],
  fraga:['Vilken strålning är svårast att skydda sig mot?',
    ['Gammastrålning','Alfastrålning','Betastrålning','Alla är lika lätta att skydda sig mot'],

  bygg(api){

    /* skydd: [namn, nivå, tjocklek i bilden, andel gamma som går igenom]
       Alfa och beta stoppas helt av tillräckligt skydd. Gamma stoppas aldrig helt:
       ungefär en centimeter bly släpper igenom hälften av den, så fem centimeter släpper igenom några få procent.
       Räknaren visar medelvärdet av de tre senaste sekunderna, så att ett fåtal pulser inte ser ut som noll.
       Medelvärdet börjar om vid varje byte, och först när strålningen från den nya inställningen hunnit fram till räknaren. */
    const SK={inget:['Inget skydd',0,0,1],papper:['Papper',1,5,1],alu:['Aluminium 5 mm',2,14,.92],bly1:['Bly 1 cm',3,28,.55],bly:['Bly 5 cm',3,46,.06]};
    const RATT={alfa:'papper',beta:'alu',gamma:'bly'};
    let kalla='alfa', skydd='inget', tick=0, rakn=0, puls=0, cps=0, cpsV=null, klocka=0, serie=[], fonster=[], gammaRest=Math.random();
    const pulsTxt=v=>{ const r=Math.round(v*10)/10; return Number.isInteger(r)?heltal(r):dec(r,1); };
    let parts=[];
    /* Mätningen börjar om vid varje byte. Siffran visas först när strålningen från den nya inställningen
       har hunnit fram till räknaren (flygtiden), annars blandas pulser från den gamla in. Tills dess visas ett streck. */
    function nyttFonster(fran){
      const v=FART[kalla]*(lugn()?.5:1);
      fonster=[]; cpsV=null; rakn=0; klocka=-((MAL-fran)/v+.1);
    }
    function bytKalla(v){ if(v===kalla){ kolla(); return; } kalla=v; parts=[]; tick=0; nyttFonster(START); kolla(); }
    function bytSkydd(v){
      if(v===skydd){ kolla(); return; }
      skydd=v;
      const fx=SX-SK[skydd][2]/2-4, bak=SX+SK[skydd][2]/2;
      /* Pulser i flykt behålls. De som redan är förbi skyddet är klara, de andra provas mot det nya.
         Inget kan befinna sig inuti skyddet. */
      parts=parts.filter(p=>skydd==='inget'||p.x<fx||p.x>bak);
      parts.forEach(p=>{ p.provad=p.x>=fx; });
      nyttFonster(fx); kolla();
    }
    const gnistor=new G.Partiklar({max:60});
    const stoppas=()=>kalla==='gamma' ? false : SK[skydd][1]>=KALL[kalla][2];
    /* Vad skyddet gör med just den här strålningen: [etikett i bilden, ord i mätaren, färg] */
    function verkan(){
      const igenom=skydd==='inget'?'inget skydd':'släpper igenom';   // ordet i mätaren: det är strålningen som går igenom, inte skyddet
      if(kalla!=='gamma') return stoppas() ? ['STOPPAS','stoppar','#6FD68A'] : ['GÅR IGENOM',igenom,'#FF8080'];
      const g=SK[skydd][3];
      return g>=.99 ? ['GÅR IGENOM',igenom,'#FF8080']
           : g>=.8  ? ['MINSKAR LITE','minskar lite','#FF8080']
           : g>=.3  ? ['HALVERAR','halverar','#FFC95C']
                    : ['MINSKAR MYCKET','minskar mycket','#6FD68A'];
    }

    api.avlas('cps','Geigerräknaren'); api.avlas('typ','Strålningen är'); api.avlas('sk','Skyddet');
    api.val({id:'k',etikett:'Strålning från källan',varde:kalla,alt:Object.keys(KALL).map(k=>[k,KALL[k][0]]),vid:bytKalla});
    api.val({id:'s',etikett:'Skydd mellan källa och mätare',varde:skydd,alt:Object.keys(SK).map(k=>[k,SK[k][0]]),vid:bytSkydd});
    api.peka('s');
    satHint();

    /* Hjälptrappan följer det första steget som inte är klart. */
    function satHint(){
      if(!api.gjort(0)) api.hint(['Prova ett skydd i taget och titta på geigerräknaren.','Alfapartiklar är stora och tunga. De stoppas av väldigt lite.','Välj Alfa och sedan Papper. Då slutar räknaren knastra.']);
      else if(!api.gjort(1)) api.hint(['Byt strålning och leta efter det tunnaste skyddet igen.','Beta är lättare att stoppa än gamma, men papper räcker inte.','Välj Beta och sedan Aluminium 5 mm. Då slutar räknaren knastra.']);
      else if(!api.gjort(2)) api.hint(['Gamma är svårast att skydda sig mot. Det behövs något tjockt och tungt.','Bly är tungt. Prova Bly 1 cm och sedan Bly 5 cm. Titta på räknaren.','Välj Gamma och sedan Bly 5 cm. Då kommer bara några få pulser igenom.']);
    }
    function kolla(){
      const i={alfa:0,beta:1,gamma:2}[kalla];
      const mat=skydd==='inget'?'luften':SK[skydd][0].toLowerCase();
      const nam=KALL[kalla][0];
      if(kalla==='gamma'){
        if(skydd==='bly'){
          api.klar(i); satHint();
          api.tips('Bly 5 cm minskar gammastrålningen mycket. Men några pulser kommer ändå igenom. Gamma stoppas aldrig helt.');
        } else if(skydd==='bly1') api.tips('Bly 1 cm minskar gammastrålningen till ungefär hälften. Prova ett tjockare skydd.',true);
        else if(skydd==='alu') api.tips('Gammastrålningen går nästan rakt igenom aluminium. Bara en liten del stoppas.',true);
        else api.tips('Gammastrålningen går rakt igenom '+mat+'.',true);
        return;
      }
      if(!stoppas()){
        api.tips(nam+'strålningen går rakt igenom '+mat+'.',true);
      } else if(RATT[kalla]===skydd){
        api.klar(i); satHint();
        api.tips(SK[skydd][0]+' stoppar '+nam.toLowerCase()+'strålningen, och tunnare skydd räcker inte.');
      } else {
        api.tips('Det stoppar strålningen – men finns det ett tunnare skydd som också räcker? Prova ett steg tunnare.');
      }
    }
    nyttFonster(START);
    kolla();

    return {rita(c,t,dt){
      const lg=lugn(), [kn,kbeskr,kniva,kfarg]=KALL[kalla], stopp=stoppas();
      klocka+=dt;

      G.scen(c,{topp:'#080D14',botten:'#111B24',rutnat:28,vinjett:true});
      G.golv(c,300,{farg:'#151F2A',djup:'#1E2A36'});

      /* nya partiklar */
      tick-=dt;
      if(tick<=0){ tick=kalla==='alfa'?.08:.055;
        parts.push({x:START,y:Y+slump(-42,42),v:FART[kalla],f:slump(0,6)}); }

      /* källan i sin blybehållare */
      G.skugga(c,KX,300,52,10,.55);
      G.metall(c,KX-46,Y-52,74,104,10,{ljus:'#7F8B62',mork:'#39412A'});
      G.rund(c,KX-40,Y-46,62,92,8,'#2A3320','#C3F53C',2);
      G.glod(c,KX-10,Y,42,'#C3F53C',.55+(lg?0:Math.sin(klocka*3)*.12));
      G.text(c,'☢',KX-10,Y+12,{a:'center',font:'30px sans-serif',f:'#C3F53C'});
      G.callout(c,KX-8,Y+84,kn.toUpperCase()+'STRÅLNING',{till:[KX-8,Y+48],farg:kfarg});

      /* skyddet */
      if(skydd!=='inget'){
        const w=SK[skydd][2];
        const material = skydd==='papper' ? {ljus:'#FAF6EC',mork:'#CFC6B2'}
                      : skydd==='alu'    ? {ljus:'#DCE7F0',mork:'#8C97A5'}
                                         : {ljus:'#7A8292',mork:'#3C424E'};
        G.skugga(c,SX,300,w/2+16,8,.5);
        G.metall(c,SX-w/2,Y-114,w,228,3,material);
        G.callout(c,SX,Y+140,SK[skydd][0],{till:[SX,Y+96],farg:verkan()[2]});
      } else {
        G.linje(c,SX,Y-114,SX,Y+114,'rgba(150,180,215,.2)',2,[6,8]);
        G.text(c,'inget skydd',SX,Y+136,{a:'center',font:F_LITEN,f:'#9DAFC4'});
      }

      /* strålningen */
      parts = parts.filter(p=>{
        p.x += p.v*dt*(lg?.5:1);
        const fx=SX-SK[skydd][2]/2-4;
        if(skydd!=='inget' && !p.provad && p.x>=fx){
          p.provad=true;
          /* alfa och beta stoppas helt eller inte alls. Av gammapulserna släpps en viss andel igenom, jämnt utspridda,
             så att räknaren inte hoppar mellan noll och flera pulser. */
          let stoppad=stopp;
          if(kalla==='gamma'){ gammaRest+=SK[skydd][3]; stoppad=gammaRest<1; if(!stoppad) gammaRest-=1; }
          if(stoppad){
            if(!lg) for(let k=0;k<2;k++) gnistor.skapa({x:fx,y:p.y,vx:slump(-70,-10),vy:slump(-40,40),liv:.3,r:2.2,farg:kfarg});
            return false;
          }
        }
        if(p.x>=MAL){ if(klocka>=0) rakn++; puls=.12; if(spar.ljudEff) pip(2400,.015,'square',.014); return false; }
        if(kalla==='alfa'){ G.klot(c,p.x,p.y,6,'#FF8080'); }
        else if(kalla==='beta'){ G.klot(c,p.x,p.y,3.4,'#5CB8FF'); }
        else { c.save(); c.beginPath();
          for(let k=0;k<32;k+=2) c.lineTo(p.x-k,p.y+Math.sin((p.x-k)/4+p.f)*5);
          c.shadowColor='#FFC95C'; c.shadowBlur=8; c.strokeStyle='#FFC95C'; c.lineWidth=2.2; c.stroke(); c.restore(); }
        return true;
      });
      gnistor.uppdatera(dt); gnistor.rita(c);

      /* geigerräknaren */
      puls=Math.max(0,puls-dt);
      G.skugga(c,DX+22,300,48,9,.5);
      G.metall(c,DX-22,Y-38,92,76,11,{ljus:'#C8D5E2',mork:'#4E5A69'});
      G.rund(c,DX-14,Y-28,76,56,8,'#0B121B','#DCE7F0',1.5);
      G.cirkel(c,DX-24,Y,13,'#9DAFC4','#5D6A79',2);
      const led=puls>0&&!lg;   // ingen blinkande lampa i lugnt läge
      if(led) G.glod(c,DX+46,Y-16,26,'#FF3B3B',puls*6);
      G.cirkel(c,DX+46,Y-16,6,led?'#FF3B3B':'#3A2A2A');
      G.digit(c,cpsV===null?'–':pulsTxt(cpsV)+'/s',DX+2,Y+8,{farg:cpsV>0?'#C3F53C':'#6B7C8F',storlek:15});
      G.text(c,'GEIGERRÄKNARE',DX+24,Y+56,{a:'center',font:F_LITEN,f:'#9DAFC4'});

      /* mätvärde per sekund */
      if(klocka>1){ cps=rakn/klocka; rakn=0; klocka=0;
        /* Gamma stoppas aldrig helt, så en första sekund helt utan pulser är bara otur i mätningen: mät om. */
        if(!(kalla==='gamma'&&cps===0&&!fonster.length)){
          fonster.push(cps); serie.push(cps); if(serie.length>46) serie.shift();
          const sen=fonster.slice(-3); cpsV=sen.reduce((a,b)=>a+b,0)/sen.length; } }

      /* instrument */
      G.bricka(c,14,10,222,64,{titel:'Strålningen är',farg:kfarg});
      G.digit(c,kn.toUpperCase(),26,42,{farg:kfarg,storlek:19});
      G.text(c,kbeskr,26,64,{font:F_LITEN,f:'#9DAFC4'});
      G.graf(c,394,10,232,86,serie,{min:0,max:22,farg:cpsV>0?'#C3F53C':'#6B7C8F',titel:'Pulser per sekund'});
      const vk=verkan();
      G.callout(c,308,44,vk[0],{till:[SX,Y-90],farg:vk[2]});

      api.satt('cps',cpsV===null?'mäter':pulsTxt(cpsV)+' pulser/s');
      api.satt('typ',kbeskr);
      api.satt('sk',verkan()[1]);
    }};
  }
};

EXP.halvering={
  namn:'Halveringstid',
  intro:'Här ligger hundra radioaktiva atomkärnor. De sönderfaller helt slumpmässigt, en i taget. Efter en halveringstid har ungefär hälften sönderfallit. Här visar labbet exakt hälften, så att det blir lätt att räkna. Varje ämne har sin egen halveringstid.',
  steg:['Vänta en halveringstid.','Vänta tills ungefär en åttondel av kärnorna är kvar.','Byt till kol-14 och vänta tre halveringstider.'],
  fraga:['Vad betyder halveringstid?',
    ['Tiden tills hälften av kärnorna har hunnit sönderfalla','Tiden tills all strålning från ämnet är helt borta','Halva den tid som ämnet över huvud taget finns kvar','Tiden det tar för en enda atomkärna att delas på mitten'],
    'Efter en halveringstid är hälften av kärnorna kvar, efter två en fjärdedel och efter tre en åttondel. Kol-14 har halveringstiden 5 730 år och används för att datera gamla ben och trä.'],
  bygg(api){
    const AK=api.farg;
    const ISO={radon:['Radon-222',3.8,'dagar'],jod:['Jod-131',8,'dagar'],kol:['Kol-14',5730,'år']};
    let iso='radon', n=0;
    let atom=Array(100).fill(1), blixt=Array(100).fill(0);
    const gnistor=new G.Partiklar({max:90});
    const kvarNu=()=>atom.filter(Boolean).length;
    const pos=i=>[46+(i%10)*27, 104+Math.floor(i/10)*23];
    /* 3,8 dagar ska inte bli «4 dagar»: heltal visas som heltal, annars med en decimal */
    const tidTxt=n=>{ const v=Math.round(n*ISO[iso][1]*10)/10; return (Number.isInteger(v)?heltal(v):dec(v,1))+' '+ISO[iso][2]; };
    const halvTxt=()=>(Number.isInteger(ISO[iso][1])?heltal(ISO[iso][1]):dec(ISO[iso][1],1))+' '+ISO[iso][2];

    api.avlas('n','Halveringstider'); api.avlas('kvar','Kärnor kvar'); api.avlas('tid','Tid som gått'); api.avlas('a','Andel kvar');
    api.val({id:'iso',etikett:'Radioaktivt ämne',varde:iso,alt:Object.keys(ISO).map(k=>[k,ISO[k][0]]),vid:v=>{iso=v;nolla();
      api.tips(ISO[iso][0]+' har halveringstiden '+halvTxt()+'.',true);
      if(api.gjort(1)&&!api.gjort(2)) satHint(); else api.peka('vanta');}});
    const vanta=api.knapp({id:'vanta',text:'⏳ Vänta en halveringstid',primar:true,vid:()=>{
      const kvarIdx=[]; atom.forEach((v,i)=>{ if(v) kvarIdx.push(i); });
      if(!kvarIdx.length){ api.tips('Alla kärnor har redan sönderfallit. Tryck på Börja om.'); return; }
      const bort=blanda(kvarIdx).slice(0,Math.round(kvarIdx.length/2));   // 100, 50, 25, 12, 6, 3, 1, 0
      bort.forEach(i=>{ atom[i]=0; blixt[i]=1;
        const [x,y]=pos(i);
        for(let k=0;k<3;k++) gnistor.skapa({x,y,vx:slump(-60,60),vy:slump(-60,60),liv:.5,r:2.4,farg:'#FFC95C'});
      });
      n++; pip(300,.22,'triangle',.04);
      const k=kvarNu();
      if(n>=1) api.klar(0);
      if(n>=3&&api.gjort(0)) api.klar(1);
      if(iso==='kol'&&n>=3&&api.gjort(1)) api.klar(2);
      api.tips(n+' halveringstid'+(n>1?'er':'')+': '+(k===1?'1 kärna':k+' kärnor')+' kvar av 100. Det har gått '+tidTxt(n)+'.');
      satHint();
    }});
    /* Hjälptrappan följer det första steget som inte är klart. */
    function satHint(){
      if(!api.gjort(1)) api.hint(['Tryck på Vänta en halveringstid igen.','En åttondel är ungefär 12 kärnor. Det tar tre halveringstider.','Tryck på knappen tills det står 3 halveringstider.']);
      else if(!api.gjort(2)){
        if(iso!=='kol'){ api.peka('iso'); api.hint(['Nu ska du byta ämne.','Kol-14 har en mycket längre halveringstid.','Välj Kol-14. Tryck sedan tre gånger på Vänta en halveringstid.']); }
        else { api.peka('vanta'); api.hint(['Du har valt Kol-14. Nu väntar du tre halveringstider.','Tryck på knappen Vänta en halveringstid.','Tryck tre gånger på Vänta en halveringstid.']); }
      }
    }
    api.knapp({id:'nolla',text:'↺ Börja om med 100 kärnor',vid:()=>{ nolla(); api.tips('Hundra nya kärnor. Nu kan du börja om.',true); }});
    function nolla(){ n=0; atom=Array(100).fill(1); blixt=Array(100).fill(0); }
    api.peka('vanta');
    api.hint(['Tryck på knappen Vänta en halveringstid.','Titta på hur många gröna kärnor som blir kvar.','Tryck på Vänta en halveringstid en gång.']);

    return {rita(c,t,dt){
      const kvar=kvarNu(), andel=kvar/100;

      G.scen(c,{topp:'#080D14',botten:'#111B24',rutnat:26,vinjett:true});

      /* kärnorna */
      G.bricka(c,22,72,296,260,{titel:'100 atomkärnor',farg:AK});
      for(let i=0;i<100;i++){
        const [x,y]=pos(i);
        blixt[i]=Math.max(0,blixt[i]-dt*1.4);
        if(atom[i]) G.klot(c,x,y,9,'#C3F53C');
        else{
          G.cirkel(c,x,y,9,'#22303E');
          if(blixt[i]>0) G.cirkel(c,x,y,9+(1-blixt[i])*15,null,'rgba(255,201,92,'+blixt[i]+')',2);
        }
      }
      gnistor.uppdatera(dt); gnistor.rita(c);

      /* sönderfallskurvan */
      const gx=358, gy=300, gw=250, gh=168;
      G.bricka(c,344,80,282,266,{titel:'Så många är kvar',farg:AK});
      G.linje(c,gx,gy,gx+gw,gy,'#9DAFC4',2);
      G.linje(c,gx,gy,gx,gy-gh,'#9DAFC4',2);
      G.text(c,'kärnor kvar',gx+6,gy-gh-8,{font:F_LITEN,f:'#9DAFC4'});
      G.text(c,'antal halveringstider',gx+gw,gy+36,{a:'right',font:F_LITEN,f:'#9DAFC4'});
      c.save(); c.beginPath();
      for(let x=0;x<=5;x+=.05){ const px=gx+x*gw/5, py=gy-gh*Math.pow(.5,x); x?c.lineTo(px,py):c.moveTo(px,py); }
      c.strokeStyle='rgba(195,245,60,.4)'; c.lineWidth=2.5; c.stroke(); c.restore();
      for(let k=0;k<=5;k++){
        G.linje(c,gx+k*gw/5,gy,gx+k*gw/5,gy+5,'#9DAFC4',1);
        G.text(c,String(k),gx+k*gw/5,gy+18,{a:'center',font:F_MONO,f:'#9DAFC4'});
      }
      [[1,'hälften'],[2,'en fjärdedel'],[3,'en åttondel']].forEach(([k,txt])=>{
        const py=gy-gh*Math.pow(.5,k);
        G.linje(c,gx,py,gx+k*gw/5,py,'rgba(150,180,215,.22)',1,[4,4]);
        if(n>=k) G.text(c,txt,gx+k*gw/5+6,py-4,{font:F_LITEN,f:'rgba(195,245,60,.75)'});
      });
      const px=gx+Math.min(n,5)*gw/5, py=gy-gh*andel;
      G.glod(c,px,py,20,'#FFC95C',.8);
      G.klot(c,px,py,7,'#FFC95C');

      /* instrument */
      G.bricka(c,22,8,190,54,{titel:'Halveringstider som gått',farg:AK});
      G.digit(c,String(n),34,46,{farg:'#9FF0FF',storlek:24});
      G.text(c,'varje tar '+halvTxt(),62,46,{font:F_LITEN,f:'#9DAFC4'});
      G.bricka(c,222,8,190,54,{titel:'Kärnor kvar',farg:AK});
      G.digit(c,kvar+' av 100',234,44,{farg:'#C3F53C',storlek:20});
      G.stapel(c,234,52,166,7,andel,'#C3F53C',{bakgrund:'#050A11'});
      G.bricka(c,422,8,204,54,{titel:'Tid som gått',farg:AK});
      G.digit(c,tidTxt(n),434,44,{farg:'#FFC95C',storlek:18});

      api.satt('n',String(n));
      api.satt('kvar',kvar+' av 100');
      api.satt('tid',tidTxt(n));
      api.satt('a',heltal(andel*100)+' %');
    }};
  }
};

EXP.spektrum={
  namn:'Strålningsspektrumet',
  intro:'Synligt ljus är bara en liten del av all elektromagnetisk strålning. I vakuum går allt lika fort, men våglängden skiljer. Kort våglängd betyder mer energi. Dra i reglaget och läs om varje sort.',
  steg:['Hitta strålningen som en värmekamera ser.','Hitta strålningen som ger solbränna.','Hitta strålningen som används för att ta bilder av skelettet.'],
  fraga:['Vad har all elektromagnetisk strålning gemensamt?',
    ['Den färdas med ljusets hastighet i vakuum','Den är farlig för människor i alla mängder','Den kan ses med blotta ögat om den är stark','Den behöver luft eller något annat ämne för att färdas'],
    'I vakuum går all elektromagnetisk strålning 300 000 kilometer per sekund. Den behöver ingen luft. Det som skiljer är våglängden och därmed energin. Därför når solljuset oss genom rymden medan ljud inte gör det.'],
  bygg(api){
    const AK=api.farg;
    const TYP=[
      ['Radiovågor','meter till kilometer','Radio och tv.','Ofarliga i vanliga mängder.','nej','#8FA8FF','Radio'],
      ['Mikrovågor','centimeter','Mikrovågsugn, wifi och mobiltelefoner.','Starka mikrovågor värmer vatten, till exempel i maten.','nej','#7CC6FE','Mikro'],
      ['Infraröd strålning','mindre än en millimeter','Värmestrålning, värmekameror och fjärrkontroller.','Känns som värme.','nej','#FF8080','IR'],
      ['Synligt ljus','ungefär 0,0005 millimeter','Det enda ögat kan se. Alla regnbågens färger.','Mycket starkt ljus kan skada ögat.','nej','#FFC95C','Ljus'],
      ['Ultraviolett strålning','kortare än violett ljus','Ger solbränna och D-vitamin.','Kan ge hudcancer och skada ögonen.','delvis','#B69CFF','UV'],
      ['Röntgenstrålning','mycket kort','Bilder av skelettet och kontroll av bagage.','Joniserande. Kan skada celler.','ja','#5CE1E6','Röntgen'],
      ['Gammastrålning','allra kortast','Strålbehandling mot cancer och sterilisering.','Joniserande. Har allra mest energi.','ja','#C3F53C','Gamma']
    ];
    let i=3, glid=3, hjalpNyckel=0;

    api.avlas('vl','Våglängd'); api.avlas('jon','Joniserande'); api.avlas('e','Energi, i ordning'); api.avlas('f','Farten');
    api.slider({id:'typ',etikett:'Strålning',min:0,max:6,steg:1,varde:i,fmt:v=>TYP[v][6],vid:v=>{
      i=v;
      const [n,,anv,risk]=TYP[i];
      api.tips(n+'. '+anv+' '+risk);
      /* stegen kan tas i valfri ordning */
      if(i===2) api.klar(0);
      if(i===4) api.klar(1);
      if(i===5) api.klar(2);
      /* hjälptrappan sätts om bara när ett steg blir klart */
      const nyckel=(api.gjort(0)?1:0)+(api.gjort(1)?1:0)+(api.gjort(2)?1:0);
      if(nyckel!==hjalpNyckel){ hjalpNyckel=nyckel; satHint(); }
    }});
    function satHint(){
      if(!api.gjort(0)) api.hint(['Värmekameror ser strålning som vi känner som värme.','Den ligger precis intill det synliga ljuset, på den långa sidan.','Dra reglaget till IR. IR betyder infraröd strålning.']);
      else if(!api.gjort(1)) api.hint(['Solbränna kommer av strålning med kortare våglängd än violett ljus.','Den kallas ultraviolett, förkortat UV.','Dra reglaget till UV. UV står mellan Ljus och Röntgen.']);
      else if(!api.gjort(2)) api.hint(['Skelettbilder tas med strålning som går genom mjuk vävnad.','Den heter röntgen.','Dra reglaget till Röntgen. Den står mellan UV och Gamma.']);
    }
    api.peka('typ');
    api.hint(['Dra i reglaget och läs vad som står om varje sort.','Du letar efter strålningen som känns som värme.','Dra reglaget till IR. IR betyder infraröd strålning.']);

    return {rita(c,t,dt){
      const [n,vl,anv,risk,jon,f]=TYP[i];
      glid += (i-glid)*Math.min(1,dt*8);
      const lg=lugn();

      G.scen(c,{topp:'#06090F',botten:'#0D1520',rutnat:30,vinjett:true});

      /* vågen – kortare våglängd ju längre åt höger */
      const lambda = 250/Math.pow(1.92,glid);
      G.vag(c,{x0:14,x1:626,y:126,amplitud:42,våglängd:lambda,fas:lg?0:t*4.6,färg:f,bredd:3.4,glöd:14});
      G.linje(c,14,126,626,126,'rgba(150,180,215,.18)',1);
      if(lambda>42) G.matband(c,320-lambda/2,186,320+lambda/2,'en våglängd',f);

      /* faktaruta */
      G.bricka(c,14,204,382,140,{titel:'Om den här strålningen',farg:f});
      G.text(c,n,28,246,{font:'600 21px Lexend, sans-serif',f});
      G.text(c,'Våglängd: '+vl,28,266,{font:F_LITEN,f:'#DCE7F0'});
      G.text(c,anv,28,288,{f:'#EDF3F9'});
      G.text(c,risk,28,310,{font:F_LITEN,f:'#9DAFC4'});
      G.text(c,'Farten i vakuum är alltid 300 000 km/s',28,332,{font:F_LITEN,f:'#5CE1E6'});

      /* energitrappa */
      G.bricka(c,410,204,216,140,{titel:'Energi',farg:AK});
      G.stapel(c,424,230,188,13,(i+1)/7,f,{bakgrund:'#050A11'});
      G.digit(c,jon==='ja'?'JONISERANDE':jon==='delvis'?'DELVIS JONISERANDE':'ICKE JONISERANDE',
        424,266,{farg:jon==='ja'?'#FF8080':jon==='delvis'?'#FFC95C':'#6FD68A',storlek:jon==='nej'?13:14});
      const forkl = jon==='nej' ? ['Har inte energi nog att','slå loss elektroner.']
                  : jon==='delvis' ? ['Bara de kortaste vågorna','slår loss elektroner.']
                  : ['Slår loss elektroner och','kan skada celler och arvsmassa.'];
      G.text(c,forkl[0],424,288,{font:F_LITEN,f:'#9DAFC4'});
      G.text(c,forkl[1],424,303,{font:F_LITEN,f:'#9DAFC4'});
      G.text(c,'Kort våglängd ger hög energi.',424,330,{font:F_LITEN,f:'#DCE7F0'});

      /* bandet med alla sorter */
      const bw=608, bx=16, by=16;
      TYP.forEach((ty,k)=>{
        const w=bw/7-5, x=bx+k*bw/7;
        const vald=k===i;
        G.rund(c,x,by,w,30,8, vald?ty[5]:'rgba(255,255,255,.07)', vald?null:'rgba(150,180,215,.2)',1);
        if(vald) G.glod(c,x+w/2,by+15,40,ty[5],.6);
        G.text(c,ty[6],x+w/2,by+20,{a:'center',font:F_LITEN,f:vald?'#08111C':'#9DAFC4',skugga:false});
      });
      G.text(c,'← lång våglängd, låg energi',16,64,{font:F_LITEN,f:'#9DAFC4'});
      G.text(c,'Bilden är inte i skala',320,64,{a:'center',font:F_LITEN,f:'#6B7C8F'});
      G.text(c,'kort våglängd, hög energi →',624,64,{a:'right',font:F_LITEN,f:'#9DAFC4'});

      api.satt('vl',vl);
      api.satt('jon',jon);
      api.satt('e',(i+1)+' av 7');
      api.satt('f','300 000 km/s');
    }};
  }
};

EXP.vaxthus={
  namn:'Växthuseffekten',
  intro:'Solljus värmer jorden. Jorden strålar ut värme som infraröd strålning. Växthusgaser, som koldioxid, fångar en del av värmen. Halten koldioxid mäts i ppm, miljondelar. Modellen är förenklad, och siffrorna är ungefärliga.',
  steg:['Ta bort atmosfären och se hur kallt det blir.','Sätt tillbaka atmosfären med 280 ppm koldioxid, som före industrialiseringen.','Öka koldioxiden till dagens nivå, 420 ppm eller mer.','Smält all is och se vad som händer med temperaturen.'],
  fraga:['Vad gör växthusgaserna i atmosfären?',
    ['De fångar en del av värmen som jorden strålar ut','De ger jorden mer solljus än den annars får','De stoppar solljuset så att mindre når marken','De skickar bort värmen från jorden ut i rymden'],
    'Utan växthuseffekt skulle jordens medeltemperatur vara ungefär minus 18 grader i stället för plus 15. Problemet är inte växthuseffekten i sig, utan att vi förstärker den genom att elda fossila bränslen.'],
  bygg(api){
    const AK=api.farg;
    let atm=true, co2=280, is=50;
    /* Förenklad modell. 3 grader per fördubbling av koldioxiden, och på sikt (när allt hunnit jämna ut sig). */
    const temp=()=>(atm ? 15+3*Math.log2(co2/280) : -18) + (50-is)*.04;
    /* Albedo: 0,30 är jordens verkliga värde. Mer is och snö ger lite högre albedo. */
    const alb=()=>.30+(is-50)*.0005;
    /* Andel av markens värmestrålning som stannar kvar. Det som slipper ut i rymden är lika med det solen ger (balans): ungefär 240 watt per kvadratmeter. */
    const fangad=()=>{
      if(!atm) return 0;
      const K=temp()+273.15, fran=5.67e-8*K*K*K*K;   // markens utstrålning, watt per kvadratmeter
      return clamp(1-240/fran,0,.9);
    };
    const isText=v=>v===0?'ingen is':v===25?'hälften så mycket':v===50?'som i dag':v===75?'1,5 gånger så mycket':v===100?'dubbelt så mycket':v+' %';

    api.avlas('T','Medeltemperatur'); api.avlas('co2','Koldioxid'); api.avlas('ut','Värme som fångas'); api.avlas('alb','Albedo');
    api.val({id:'atm',etikett:'Atmosfär',varde:'med',alt:[['med','Med atmosfär'],['utan','Utan atmosfär']],vid:v=>{atm=v==='med';kolla();}});
    api.slider({id:'co2',etikett:'Koldioxid i luften',min:180,max:800,steg:20,varde:co2,fmt:v=>v+' ppm',vid:v=>{co2=v;kolla();}});
    api.slider({id:'is',etikett:'Is och snö på jorden',min:0,max:100,steg:25,varde:is,fmt:isText,vid:v=>{is=v;kolla();}});
    api.peka('atm');
    api.hint(['Börja med att ta bort atmosfären och titta på termometern.','Utan atmosfär finns inget som håller kvar värmen.','Tryck på knappen Utan atmosfär.']);

    function kolla(){
      let nytt=false;
      if(!atm&&!api.gjort(0)){
        nytt=true; api.klar(0); api.peka('atm');
        api.tips('Utan atmosfär strålar all värme rakt ut i rymden. Medeltemperaturen blir ungefär minus 18 grader.');
        api.hint(['Sätt tillbaka atmosfären.','Ställ sedan koldioxiden på den nivå som fanns före industrialiseringen.','Tryck Med atmosfär och dra Koldioxid till 280 ppm.']);
      }
      if(atm&&co2===280&&api.gjort(0)&&!api.gjort(1)){
        nytt=true; api.klar(1); api.peka('co2');
        api.tips('Den naturliga växthuseffekten ger ungefär plus 15 grader. Utan den skulle jorden vara mycket kall.');
        api.hint(['Nu ökar vi koldioxiden till dagens nivå.','Dagens nivå är drygt 420 miljondelar.','Dra Koldioxid till 420 ppm eller mer.']);
      }
      if(atm&&co2>=420&&api.gjort(1)&&!api.gjort(2)){
        nytt=true; api.klar(2); api.peka('is');
        api.tips('Mer koldioxid fångar mer värme, och temperaturen stiger på sikt.');
        api.hint(['Nu smälter vi isen.','Mörk mark och mörkt hav tar upp mer värme än vit is.','Dra reglaget Is och snö längst åt vänster, till ingen is.']);
      }
      if(is===0&&api.gjort(2)&&!api.gjort(3)){
        nytt=true; api.klar(3);
        api.tips('Is reflekterar solljus. När isen smälter tar mörk mark och mörkt hav upp mer värme, och det blir ännu varmare. Det kallas en förstärkande återkoppling.');
      }
      if(!nytt) api.tips('Medeltemperaturen är nu '+dec(temp(),1)+' grader.',true);
    }

    return {rita(c,t,dt){
      const lg=lugn(), T=temp(), fang=fangad();
      const EX=326, EY=580, R=316;

      G.scen(c,{topp:'#03060C',botten:'#081222',stjarnor:.9,vinjett:true});

      /* solen */
      G.glod(c,44,44,74,'#FFC95C',.75);
      G.klot(c,44,44,26,'#FFE14D');

      /* atmosfärskal */
      if(atm){
        const a=clamp((co2-180)/620,0,1);
        for(let k=3;k>=1;k--){
          c.save(); c.globalAlpha=(.07+a*.16)/k*1.8;
          G.cirkel(c,EX,EY,R+30+k*22,'#78B4FF'); c.restore();
        }
        G.cirkel(c,EX,EY,R+34,null,'rgba(150,200,255,.5)',2);
      }

      /* jorden */
      G.klot(c,EX,EY,R,'#2E6FB0');
      c.save(); c.beginPath(); c.arc(EX,EY,R,0,7); c.clip();
      G.poly(c,[[96,300],[214,268],[304,292],[284,364],[96,364]],'#4E7F3E');
      G.poly(c,[[392,278],[520,302],[566,364],[368,364]],'#4E7F3E');
      const isw=is*3.3;
      if(isw>2){ G.rund(c,EX-isw/2,262,isw,42,21,'#F2F8FC');
        G.text(c,'is och snö',EX,288,{a:'center',font:F_LITEN,f:'#3C5A72',skugga:false}); }
      c.restore();
      if(atm) G.text(c,'ATMOSFÄR',EX,236,{a:'center',font:F_LITEN,f:'#9FC3FF'});

      /* inkommande solstrålar */
      const fas=(t*(lg?0:.55))%1;
      for(let k=0;k<4;k++){
        const x0=84+k*26, y0=62+k*9, x1=168+k*84, y1=292;
        G.linje(c,x0,y0,x1,y1,'rgba(255,201,92,.28)',2);
        const p=(fas+k*.25)%1;
        G.cirkel(c,x0+(x1-x0)*p,y0+(y1-y0)*p,4.5,'#FFC95C');
      }
      /* reflekterad stråle från isen */
      if(is>0){
        const p=(fas*1.3)%1;
        G.linje(c,EX,266,EX+128,60,'rgba(255,240,180,.22)',2);
        G.cirkel(c,EX+p*128,266-p*206,4,'rgba(255,245,200,.9)');
      }

      /* utgående värmestrålning */
      for(let k=0;k<5;k++){
        const x=206+k*62, p=((t*(lg?.12:.45))+k*.2)%1;
        const studs=k/5<fang;
        const topp=atm?154:26;
        const y = studs ? (p<.5 ? 292-(292-topp)*p*2 : topp+(292-topp)*(p-.5)*2) : 292-272*p;
        c.save(); c.beginPath();
        for(let j=0;j<26;j+=2) c.lineTo(x+Math.sin((y+j)/5)*4.5, y+j);
        c.strokeStyle=studs?'#FF8080':'rgba(255,128,128,.45)'; c.lineWidth=2.6; c.stroke(); c.restore();
      }
      if(atm&&fang>0) G.callout(c,120,168,heltal(fang*100)+' % fångas',{till:[236,168],farg:'#FF8080'});
      if(!atm) G.callout(c,120,120,'Värmen försvinner rakt ut',{till:[236,120],farg:'#7CC6FE'});

      /* instrument */
      G.bricka(c,436,12,192,84,{titel:'Medeltemperatur',farg:AK});
      G.digit(c,(T>0?'+':'')+dec(T,1)+' °C',448,52,{farg:T<0?'#7CC6FE':T>17?'#FF8080':'#9FF0FF',storlek:26});
      G.stapel(c,448,66,168,11,clamp((T+25)/50,0,1),T<0?'#7CC6FE':T>17?'#FF8080':'#6FD68A',{bakgrund:'#050A11'});
      G.text(c,'−25',448,90,{font:F_LITEN,f:'#9DAFC4'});
      G.text(c,'+25',616,90,{a:'right',font:F_LITEN,f:'#9DAFC4'});

      G.bricka(c,436,106,192,58,{titel:'Koldioxid i luften',farg:AK});
      G.digit(c,atm?co2+' ppm':'–',448,142,{farg:co2>420?'#FF8080':'#9FF0FF',storlek:20});
      G.bricka(c,436,174,192,58,{titel:'Albedo, reflekterat solljus',farg:AK});
      G.digit(c,dec(alb()*100,1)+' %',448,216,{farg:'#DCE7F0',storlek:20});

      api.satt('T',(T>0?'+':'')+dec(T,1)+' °C');
      api.satt('co2',atm?co2+' ppm':'ingen atmosfär');
      api.satt('ut',heltal(fang*100)+' %');
      api.satt('alb',dec(alb()*100,1)+' % reflekteras');
    }};
  }
};

EXP.exoplanet={
  namn:'Planetjakten',
  intro:'Planeter runt andra stjärnor kallas exoplaneter. När en planet passerar framför sin stjärna blir stjärnan lite svagare. Så hittar forskarna många av dem. Den gröna ringen är den beboeliga zonen, där vatten kan vara flytande.',
  steg:['Mät stjärnans ljus och fånga en dipp när planeten passerar.','Flytta planeten till den beboeliga zonen runt den solliknande stjärnan.','Byt till en röd dvärg och hitta den beboeliga zonen där.'],
  fraga:['Varför letar forskare efter planeter i den beboeliga zonen?',
    ['Där kan vatten vara flytande, och liv behöver vatten','Där finns alltid syre så att man kan andas','Där är planeterna alltid större än jorden','Där är det alltid exakt lika varmt som hos oss'],
    'För nära stjärnan kokar vattnet bort, för långt bort fryser det till is. Forskarna har hittat tusentals exoplaneter, men bara ett fåtal ligger i zonen.'],
  bygg(api){
    const AK=api.farg;
    /* Zonen följer ljusstyrkan: avstånd = 0,9–1,5 gånger roten ur ljusstyrkan (solen = 1).
       Röd dvärg ungefär 0,04 gånger solens ljus: zon 0,18–0,30, avrundad till 0,2–0,3.
       Het stjärna (typ F, ungefär 1,3 solmassor) ungefär 3,5 gånger: zon 1,68–2,81, avrundad till 1,7–2,8.
       En verklig blå jätte har sin zon hundratals gånger längre bort och lever bara några miljoner år, därför finns den inte med. */
    const ST={rod:['Röd dvärg',.2,.3,'#FF8A5A',15],
              sol:['Solliknande',.9,1.5,'#FFE14D',22],
              het:['Het stjärna',1.7,2.8,'#E3ECFF',26]};
    let st='het', a=1.0, mat=false, vink=0, dippSedd=false;
    const kurva=[];
    const CX=172, CY=182;
    const rp=v=>22+v*42;
    const zon=()=>a<ST[st][1]-.001?'varm':a>ST[st][2]+.001?'kall':'zon';

    api.avlas('a','Avstånd till stjärnan'); api.avlas('z','Planeten ligger'); api.avlas('lj','Stjärnans ljus'); api.avlas('s','Stjärna');
    api.val({id:'st',etikett:'Stjärna',varde:st,alt:Object.keys(ST).map(k=>[k,ST[k][0]]),vid:v=>{st=v;kolla();}});
    api.slider({id:'a',etikett:'Planetens avstånd. 1 är lika långt som jorden till solen',min:.1,max:3,steg:.1,varde:a,fmt:v=>dec(v,1),vid:v=>{a=Math.round(v*10)/10;kolla();}});
    /* Hjälpen följer knappen: före mätning pekar den på Mät, under mätning på att vänta. Efter första dippen styr stegen hjälpen. */
    const hintMat=()=>api.hint(['Tryck på knappen Mät stjärnans ljus.','Vänta sedan tills planeten går framför stjärnan. Kurvan dippar då.','Tryck Mät stjärnans ljus och vänta tills kurvan dippar.']);
    const hintVanta=()=>api.hint(['Vänta tills planeten går framför stjärnan. Kurvan dippar då.','Går det långsamt? Planeten går fortare runt nära stjärnan.','Dra avståndet till 0,5 och låt mätningen vara igång tills kurvan dippar.']);
    const mk=api.knapp({id:'mat',text:'📉 Mät stjärnans ljus',primar:true,vid:()=>{
      mat=!mat; mk.textContent = mat ? '⏹ Sluta mäta' : '📉 Mät stjärnans ljus';
      if(mat) api.tips('Mätningen igång. Vänta tills planeten går framför stjärnan.',true);
      if(!dippSedd){ if(mat) hintVanta(); else hintMat(); }
    }});
    api.peka('mat');
    hintMat();

    function kolla(){
      const z=zon();
      const om = st==='het' ? ' Het stjärna lyser starkt, så zonen ligger långt bort.'
               : st==='rod' ? ' Röd dvärg lyser svagt, så zonen ligger nära.' : '';
      api.tips((z==='varm' ? 'För nära stjärnan. Där kokar vattnet bort.'
              : z==='kall' ? 'För långt bort. Där fryser vattnet till is.'
                           : 'I den beboeliga zonen! Här kan vatten vara flytande.') + om, true);
      stegKoll();
    }
    function stegKoll(){
      const z=zon();
      if(z==='zon'&&st==='sol'&&api.gjort(0)&&!api.gjort(1)){
        api.klar(1); api.peka('st');
        api.hint(['Byt stjärna till en röd dvärg.','En sval stjärna har sin beboeliga zon mycket närmare sig.','Välj Röd dvärg och dra avståndet till ungefär 0,2.']);
      }
      if(z==='zon'&&st==='rod'&&api.gjort(1)) api.klar(2);
    }

    return {rita(c,t,dt){
      const [namn,z0,z1,farg,rs]=ST[st], lg=lugn();

      G.scen(c,{topp:'#03050B',botten:'#070C16',stjarnor:1,vinjett:true});

      /* beboelig zon */
      c.save(); c.globalAlpha=.2;
      G.cirkel(c,CX,CY,rp(z1),'#6FD68A'); c.restore();
      c.save(); c.globalCompositeOperation='destination-out';
      G.cirkel(c,CX,CY,rp(z0),'#000'); c.restore();
      G.cirkel(c,CX,CY,rp(z0),null,'rgba(111,214,138,.65)',1.5);
      G.cirkel(c,CX,CY,rp(z1),null,'rgba(111,214,138,.65)',1.5);
      G.cirkel(c,CX,CY,rp(a),null,'rgba(255,255,255,.2)',1,[4,5]);

      /* stjärnan */
      G.glod(c,CX,CY,rs*2.6,farg,.9);
      G.klot(c,CX,CY,rs*.62,farg);

      /* planeten */
      vink += dt*(lg?.5:1.5)/Math.pow(Math.max(a,.3),1.5);
      const px=CX+Math.cos(vink)*rp(a), py=CY+Math.sin(vink)*rp(a);
      const z=zon();
      const pf = z==='zon' ? '#5CB8FF' : z==='varm' ? '#FF8A5A' : '#E6EEF6';
      G.klot(c,px,py,6.5,pf);

      G.text(c,'sett uppifrån',CX,26,{a:'center',font:F_LITEN,f:'#9DAFC4'});
      G.text(c,'↓ vi tittar härifrån',CX,CH-12,{a:'center',font:F_LITEN,f:'#9DAFC4'});
      {
        const rm=rp((z0+z1)/2), dx=-.617, dy=-.787;
        G.callout(c,50,28,'beboelig zon',{till:[CX+dx*rm,CY+dy*rm],farg:'#6FD68A'});
      }

      /* ljuskurvan */
      const framfor = Math.sin(vink)>0 && Math.abs(Math.cos(vink)*rp(a)) < rs*.62+6;
      const ljus = framfor ? .962 : 1;
      if(mat){
        kurva.push(ljus+slump(-.0025,.0025));
        if(kurva.length>240) kurva.shift();
        if(framfor&&!dippSedd){ dippSedd=true; api.klar(0); api.peka('st');
          api.tips('Där! Dippen i kurvan betyder att planeten passerade framför stjärnan. Metoden kallas transitmetoden. I verkligheten är dippen mycket mindre än här.');
          api.hint(['Nu ska du hitta den beboeliga zonen.','Byt till den solliknande stjärnan och prova avstånd runt 1,0.','Välj Solliknande och dra avståndet till 1,2.']);
          stegKoll();
        }
      }
      G.graf(c,352,58,272,150,kurva,{min:.95,max:1.005,farg:'#9FF0FF',titel:'Stjärnans ljusstyrka över tid',ram:'rgba(92,225,230,.4)'});
      if(!mat) G.text(c,'Tryck på Mät stjärnans ljus',488,140,{a:'center',f:'#9DAFC4'});
      else if(dippSedd) G.text(c,'Dippen = planeten passerar framför',488,224,{a:'center',font:F_LITEN,f:'#FFC95C'});
      if(framfor&&mat) G.glod(c,488,132,70,'#FFC95C',.35);

      /* instrument */
      G.bricka(c,352,236,132,52,{titel:'Avstånd (jorden = 1)',farg:AK});
      G.digit(c,dec(a,1),364,274,{farg:'#9FF0FF',storlek:20});

EXP.pendel={
  namn:'Pendelundersökningen',
  intro:'Vad bestämmer hur lång tid en pendel tar på sig för en svängning? En svängning är ett helt varv fram och tillbaka. Du kan ändra längd, massa och utslag. Ändra bara en sak åt gången, annars vet du inte vad som gjorde skillnaden.',
  steg:['Gör en första mätning.','Ändra bara längden och mät igen.','Ändra bara massan och mät igen.','Ändra bara utslaget och mät igen.'],
  fraga:['Du ändrade längd, massa och utslag. Vad påverkade svängningstiden?',
    ['Bara längden','Bara massan','Bara utslaget','Alla tre lika mycket'],
    'Bara längden. Massan spelar ingen roll, och ett litet utslag ger nästan samma tid. Här finns inget luftmotstånd, vilket är en förenkling. Galileo Galilei upptäckte det för över 400 år sedan, genom precis den här sortens rättvisa test.'],
  bygg(api){
    const AK=api.farg;
    const ALT={ L:[[.25,'0,25 m'],[.5,'0,5 m'],[1,'1 m'],[2,'2 m']],
                m:[[.1,'0,1 kg'],[.5,'0,5 kg'],[1,'1 kg']],
                u:[[10,'10°'],[20,'20°'],[30,'30°']] };
    const skriv=(k,v)=>{ const a=ALT[k].find(x=>x[0]===v); return a?a[1]:String(v); };
    const OBJ={L:'längden',m:'massan',u:'utslaget'}, DEN={L:'den',m:'den',u:'det'};
    const STEGK=[null,'L','m','u'];                     // vilket reglage varje steg handlar om
    const ANNAT={L:v=>v===2?1:2, m:v=>v===1?.1:1, u:v=>v===30?10:30};   // ett värde som alltid är något annat
    let L=1, m=.5, u=20;
    const rader=[];

    /* När ett steg klaras läser motorn slutsatsen och sedan nästa uppdrag (eller frågan) i ett enda stycke, direkt.
       Tipset är därför tyst just då. Annars läses det genast, och den senaste texten vinner alltid. */
    function sag(text,steg){
      if(steg!=null && !api.gjort(steg)){ api.tips(text,true); api.klar(steg,text); }
      else api.tips(text);
    }

    /* Hjälpen går alltid att följa: sista stegen säger exakt vilka tre värden som ska väljas. */
    function hjalp(){
      const n=[0,1,2,3].find(i=>!api.gjort(i)), sist=rader[rader.length-1];
      if(n===undefined) return;
      if(!sist){
        api.peka('mat');
        api.hint(['Börja med att mäta. Du behöver ett värde att jämföra med.','Mät en gång, så får du en rad i tabellen.','Tryck på knappen Mät en svängning.']);
        return;
      }
      const k=STEGK[n], mal={L:sist.L,m:sist.m,u:sist.u};
      mal[k]=ANNAT[k](sist[k]);
      api.peka(k);
      api.hint(['Nu ska du undersöka '+OBJ[k]+'. Ändra bara '+DEN[k]+'.',
        'Titta på sista raden i tabellen. Behåll de andra två som där och ändra bara '+OBJ[k]+'.',
        'Välj Längd '+skriv('L',mal.L)+', Massa '+skriv('m',mal.m)+' och Utslag '+skriv('u',mal.u)+'. Tryck sedan på Mät en svängning.']);
    }
    const efterVal=()=>{ const s=rader[rader.length-1]; if(s && (s.L!==L||s.m!==m||s.u!==u)) api.peka('mat'); };

    api.avlas('T','Senaste svängningstid'); api.avlas('n','Antal mätningar'); api.avlas('bytt','Du ändrade senast');
    api.val({id:'L',etikett:'Längd på snöret',varde:L,alt:ALT.L,vid:v=>{L=+v;efterVal();}});
    api.val({id:'m',etikett:'Massa på vikten',varde:m,alt:ALT.m,vid:v=>{m=+v;efterVal();}});
    api.val({id:'u',etikett:'Utslag, hur långt du drar ut den',varde:u,alt:ALT.u,vid:v=>{u=+v;efterVal();}});
    api.knapp({id:'mat',text:'⏱ Mät en svängning',primar:true,vid:()=>{
      /* T = 2π·√(L/g), med g = 9,82 N/kg. Litet extra tid vid stort utslag (1 + θ²/16, θ i radianer) och ett litet mätfel. */
      const rad=u*Math.PI/180;
      const T=2*Math.PI*Math.sqrt(L/9.82)*(1+rad*rad/16)+slump(-.008,.008);
      const forra=rader[rader.length-1];
      rader.push({L,m,u,T});
      if(rader.length>6) rader.shift();
      api.satt('T',dec(T,2)+' s'); api.satt('n',String(rader.length));
      if(!forra){
        api.satt('bytt','–');
        sag('Första mätningen: '+dec(T,2)+' sekunder. Nu har du något att jämföra med.',0);
        hjalp();
        return;
      }
      const byt=[forra.L!==L&&'längden', forra.m!==m&&'massan', forra.u!==u&&'utslaget'].filter(Boolean);
      api.satt('bytt', byt.length?byt.join(' och '):'ingenting');
      if(byt.length===0){
        sag('Du ändrade ingenting. Tiden blev '+dec(T,2)+' sekunder, nästan som förra gången. Små skillnader är mätfel. Ändra en sak för att undersöka något nytt.');
      } else if(byt.length>1){
        sag('Du ändrade '+byt.join(' och ')+' samtidigt. Då går det inte att veta vad som gjorde skillnaden. Ändra bara en sak åt gången.');
      } else {
        const k=byt[0], stor=Math.abs(T-forra.T)/forra.T>.08, fran=dec(forra.T,2), till=dec(T,2);
        let text='Du ändrade bara '+k+'. ';
        if(stor) text+='Tiden ändrades tydligt, från '+fran+' till '+till+' sekunder. '+(k==='längden'?'Längden påverkar svängningstiden.':'Mät en gång till för att se om det var mätfel.');
        else text+='Tiden ändrades nästan inte, från '+fran+' till '+till+' sekunder. '+
          (k==='massan'?'Massan påverkar inte svängningstiden. Små skillnader är mätfel.'
          :k==='utslaget'?'Så länge utslaget är litet påverkar det knappt.'
          :'Mät en gång till.');
        sag(text, k==='längden'?1:k==='massan'?2:3);
      }
      hjalp();
    }});
    api.knapp({id:'rensa',text:'↺ Töm tabellen',vid:()=>{ rader.length=0; api.satt('n','0'); api.satt('T','–'); api.satt('bytt','–');
      api.tips('Tabellen är tom. Börja om med en första mätning.',true); hjalp(); }});
    hjalp();

    return {rita(c,t,dt){
      const lg=lugn();
      const PX=150, PY=36, len=L*118;                       // snörets längd ritas i skala: 1 m = 118 px
      const T0=2*Math.PI*Math.sqrt(L/9.82);
      const vin=u*Math.PI/180*Math.cos(2*Math.PI*t/T0)*(lg?.35:1);
      const bx=PX+Math.sin(vin)*len, by=PY+Math.cos(vin)*len;
      const r=9+m*11;

      G.scen(c,{topp:'#0A1119',botten:'#16222F',rutnat:28,vinjett:true});

      /* stativ */
      G.metall(c,PX-72,PY-9,144,12,4,{ljus:'#C8D5E2',mork:'#5D6A79'});
      G.metall(c,PX-66,PY+3,10,290,3,{ljus:'#9DAFC4',mork:'#4E5A69'});
      G.skugga(c,PX-61,300,42,8,.5);

      /* utslagsbåge */
      c.save(); c.beginPath();
      c.arc(PX,PY,len,Math.PI/2-u*Math.PI/180,Math.PI/2+u*Math.PI/180);
      c.strokeStyle='rgba(232,195,158,.24)'; c.lineWidth=2; c.setLineDash([5,5]); c.stroke(); c.restore();
      G.linje(c,PX,PY,PX,PY+len+16,'rgba(255,255,255,.14)',1,[4,5]);

      /* längd: mått från upphängningen till vikten, till höger om pendeln */
      const MX=PX+100;
      G.linje(c,MX-6,PY,MX+6,PY,AK,1.5); G.linje(c,MX-6,PY+len,MX+6,PY+len,AK,1.5);
      G.pil(c,MX,PY+len/2,MX,PY+2,AK,1.5); G.pil(c,MX,PY+len/2,MX,PY+len-2,AK,1.5);
      G.etikett(c,skriv('L',L),MX+8,PY+len/2+5,{f:AK,font:F_LITEN,a:'left'});

      /* pendeln */
      G.linje(c,PX,PY,bx,by,'#DCE7F0',2.2);
      G.cirkel(c,PX,PY,4,'#9DAFC4');
      G.skugga(c,bx,by+r+8,r,4,.35);
      G.klot(c,bx,by,r,'#E8C39E');
      G.callout(c,bx,by+r+26,skriv('m',m),{till:[bx,by],farg:'#E8C39E'});

      /* mättabell */
      const tx=326, ty=26, rw=302;
      G.bricka(c,tx-12,ty-14,rw,68+rader.length*30,{titel:'Mättabell',farg:AK});
      ['Längd','Massa','Utslag','Tid'].forEach((h,i)=>
        G.text(c,h,tx+i*74,ty+18,{font:F_LITEN,f:'#E8C39E'}));
      G.linje(c,tx-4,ty+26,tx+rw-20,ty+26,'rgba(232,195,158,.35)',1);
      rader.forEach((rad,j)=>{
        const y=ty+48+j*30, forra=rader[j-1];
        const mark=k => forra && forra[k]!==rad[k] ? '#FFC95C' : '#DCE7F0';
        if(j%2) G.rund(c,tx-6,y-16,rw-16,26,6,'rgba(255,255,255,.035)');
        G.text(c,skriv('L',rad.L),tx,y,{font:F_MONO,f:mark('L')});
        G.text(c,skriv('m',rad.m),tx+74,y,{font:F_MONO,f:mark('m')});
        G.text(c,skriv('u',rad.u),tx+148,y,{font:F_MONO,f:mark('u')});
        G.text(c,dec(rad.T,2)+' s',tx+222,y,{font:F_MONO,f:'#9FF0FF'});
      });
      if(!rader.length) G.text(c,'Inga mätningar än',tx+130,ty+50,{a:'center',f:'#9DAFC4'});
      else G.text(c,'gult = det du ändrade sedan raden ovanför',tx-4,ty+66+rader.length*30,{font:F_LITEN,f:'#FFC95C'});

      /* rättvist test-påminnelse */
      G.bricka(c,314,302,314,46,{titel:'Rättvist test',farg:AK});
      G.text(c,'Ändra EN sak i taget. Håll resten lika.',326,338,{f:'#DCE7F0'});

      api.satt('n',String(rader.length));
    }};
  }
};

    const GULD='#FFD166', BLA='#5CB8FF', CYAN='#9FF0FF', DOV='#9DAFC4';
    const PAL={
      al:{l:'#F2F6FA',m:'#B7C2CE',d:'#6E7A88',t:'#FAFCFE',txt:'#101820'},
      jarn:{l:'#AAB7C4',m:'#6F7C8A',d:'#36404B',t:'#C2CCD6',txt:'#F2F6FA'},
      mess:{l:'#FFE595',m:'#D9AE3E',d:'#8A6414',t:'#FFF0BA',txt:'#101820'},
      bly:{l:'#939BA5',m:'#626A74',d:'#2D333A',t:'#A5ADB7',txt:'#F2F6FA'}
    };
    const DENS={al:2.7,jarn:7.8,mess:8.5,bly:11.3};
    /* Lärarens densitetstabell (g/cm³) plus stål och mässing. Järn och stål har samma värde. */
    const TAB=[['Aluminium',2.7],['Bly',11.3],['Glas',2.5],['Guld',19.3],['Järn',7.8],
      ['Kvicksilver',13.6],['Mässing',8.5],['Stål',7.8],['Tändvätska',0.8],['Vatten',1.0]];

    /* tre cylindrar: oftast lärarens trio, ibland byts en mot bly. Alltid slumpad ordning. */
    let kit=['al','jarn','mess'];
    if(Math.random()<.35) kit[Math.floor(Math.random()*3)]='bly';
    kit=blanda(kit);
    const cyl=kit.map((m,k)=>({k,mat:m,m:Math.round(DENS[m]*V0),vagd:false,mattV:false,rho:false,matOK:false,
      namn:null,visaRatt:false,plats:'bank',pos:{x:SLOT(k),y:BANK-CYH},fx:0,fy:0,tx:0,ty:0,u:1}));
    const dens=c=>Math.round(c.m/V0*10)/10;
    const ratta=c=>TAB.filter(t=>Math.abs(t[1]-dens(c))<1e-6).map(t=>t[0]);
    const f1=x=>dec(x,1);

    let valt=0, senast=null, vantar=null, rhoAlt=[];
    const blink={}, splash=new G.Partiklar({max:60});
    let sistBotten={};

    /* ---- reglage ---- */
    api.avlas('vag','Vågen visar'); api.avlas('niva','Vattennivå'); api.avlas('vol','Volym, vald cylinder');
    api.avlas('rho','Densitet, vald cylinder');
    const cylCtl=api.val({id:'cyl',etikett:'Vilken cylinder?',varde:0,
      alt:[[0,'Cylinder 1'],[1,'Cylinder 2'],[2,'Cylinder 3']],vid:v=>{ sattValt(+v,false); }});
    api.knapp({id:'vag',text:'Lägg på vågen',primar:true,vid:()=>placera('vag')});
    api.knapp({id:'sank',text:'Sänk ner i mätglaset',primar:true,vid:()=>placera('glas')});
    const rhoCtl=api.val({id:'rho',etikett:'Vilken densitet får du?',varde:'-',
      alt:[['a',' '],['b',' '],['c',' '],['d',' ']],vid:v=>valjRho(v)});
    const matCtl=api.val({id:'mat',etikett:'Vilket material är det?',varde:'-',
      alt:TAB.map(t=>[t[0],t[0]]),vid:v=>valjMat(String(v))});
    const visa=(id,pa)=>{ const el=api.reglage.querySelector('[data-ctl="'+id+'"]'); if(el) el.style.display=pa?'':'none'; };

    /* ---- flytta cylindrar ---- */
    function malFor(c){
      if(c.plats==='vag') return {x:VX,y:PLATTA-CYH};
      if(c.plats==='glas') return {x:GC,y:210};
      return {x:SLOT(c.k),y:BANK-CYH};
    }
    function flytta(c,plats){
      c.fx=c.pos.x; c.fy=c.pos.y; c.plats=plats;
      const m=malFor(c); c.tx=m.x; c.ty=m.y; c.u=lugn()?1:0;
      if(c.u>=1) c.pos={x:m.x,y:m.y};
    }
    function stig(c){                                    // upp, åt sidan, ner
      const e=c.u*c.u*(3-2*c.u);
      const glas=c.plats==='glas'||(c.fx===GC&&c.fy>GT);
      const ly=Math.min(glas?0:124,c.fy,c.ty);
      const a=c.fy-ly, b=Math.abs(c.tx-c.fx), d=c.ty-ly, tot=(a+b+d)||1;
      let s=e*tot;
      if(s<=a) return {x:c.fx,y:c.fy-s};
      s-=a; if(s<=b) return {x:c.fx+(c.tx>c.fx?1:-1)*s,y:ly};
      s-=b; return {x:c.tx,y:ly+Math.min(s,d)};
    }

    /* ---- tillstånd ---- */
    const nastaOvagd=()=>cyl.findIndex(c=>!c.vagd);
    const nastaEjSankt=()=>cyl.findIndex(c=>!c.mattV);
    const nastaEjKlar=()=>cyl.findIndex(c=>!c.matOK);
    const stegNu=()=>nastaOvagd()>=0?0:nastaEjSankt()>=0?1:2;
    const namnNr=k=>'Cylinder '+(k+1);

    function sattValt(k,tyst){
      valt=k; cylCtl.set(k,true);
      byggRho(); matCtl.set('-',true);
      if(!tyst) api.tips(namnNr(k)+' är vald.',true);
      uppdatera();
    }
    function framat(k,attr){                              // flytta valet till nästa cylinder som saknar något
      for(let i=1;i<=3;i++){ const j=(k+i)%3; if(!cyl[j][attr]){ sattValt(j,true); return; } }
    }

    function placera(plats){
      const k=valt, c=cyl[k];
      cyl.forEach(o=>{ if(o!==c && o.plats!=='bank') flytta(o,'bank'); });   // bara en cylinder i taget är framme
      if(c.plats!==plats) flytta(c,plats);
      clearTimeout(vantar);
      vantar=setTimeout(()=>ankommit(k,plats), lugn()?30:ANK*1000+60);
    }

    function ankommit(k,plats){
      const c=cyl[k]; if(c.plats!==plats) return;
      const m=c.m;
      if(plats==='vag'){
        const forst=!c.vagd; c.vagd=true; if(forst) blink[k+'-vikt']=1.4;
        senast={typ:'vag',k};
        const kvar=cyl.filter(o=>!o.vagd).length;
        if(!kvar&&!api.gjort(0)){
          const t='Du har vägt alla tre. De väger olika mycket, fast de ser lika stora ut.';
          api.tips(namnNr(k)+' väger '+m+' g. '+t,true); api.klar(0,namnNr(k)+' väger '+m+' g. '+t);
          sattValt(Math.max(0,nastaEjSankt()),true);
        } else {
          api.pip(784,.1,'triangle',.05);
          api.tips(namnNr(k)+' väger '+m+' g.'+(kvar?' Du har '+(kvar===1?'en cylinder':kvar+' cylindrar')+' kvar att väga.':''),false);
        }
        if(kvar) framat(k,'vagd');
      } else if(plats==='glas'){
        const forst=!c.mattV; c.mattV=true; if(forst) blink[k+'-vol']=1.4;
        senast={typ:'glas',k};
        const kvar=cyl.filter(o=>!o.mattV).length;
        const sag='Vattnet steg från 60 till 70 milliliter. Volymen är 70 minus 60, alltså '+V0+' milliliter. Det är '+V0+' kubikcentimeter.';
        if(!kvar&&!api.gjort(1)){
          const t='Alla tre tar lika stor plats, '+V0+' kubikcentimeter. Du mätte volymen med vattnet.';
          api.tips(sag+' '+t,true); api.klar(1,sag+' '+t);
          sattValt(0,true);
        } else {
          api.pip(784,.1,'triangle',.05);
          api.tips(sag,false);
        }
        if(kvar) framat(k,'mattV');
      }
      byggRho(); uppdatera();
    }

    /* ---- densitet och material ---- */
    function byggRho(){
      const c=cyl[valt], m=c.m;
      const o=[
        {t:f1(dens(c))+' g/cm³',ok:true},
        {t:m+' g/cm³',ok:false,msg:'Det är bara massan. Du ska dela den med volymen: '+m+' delat med '+V0+'.'},
        {t:dec(m/100,2)+' g/cm³',ok:false,msg:'Du delade med 100. Volymen är '+V0+' cm³, inte 100.'},
        {t:dec(V0/m,2)+' g/cm³',ok:false,msg:'Det är volym delat med massa. Massan ska stå överst: '+m+' delat med '+V0+'.'}];
      rhoAlt=blanda(o);
      const kn=api.reglage.querySelectorAll('[data-ctl="rho"] .seg button');
      kn.forEach((b,i)=>{ b.textContent=rhoAlt[i].t; });
      rhoCtl.set(c.rho?'abcd'[rhoAlt.findIndex(x=>x.ok)]:'-',true);
    }
    function valjRho(v){
      const c=cyl[valt];
      if(stegNu()<2){ api.tips('Väg och mät alla tre cylindrarna först.',true); rhoCtl.set('-',true); return; }
      const ok=rhoAlt.findIndex(x=>x.ok);
      if(c.rho){ api.tips('Det här har du redan räknat ut. Välj material.',true); rhoCtl.set('abcd'[ok],true); return; }
      const o=rhoAlt['abcd'.indexOf(v)]; if(!o) return;
      if(o.ok){
        c.rho=true; blink[c.k+'-rho']=1.4; senast={typ:'rho',k:c.k};
        api.pip(784,.1,'triangle',.05);
        api.tips('Rätt! '+c.m+' delat med '+V0+' är '+f1(dens(c))+' gram per kubikcentimeter. Titta nu i tabellen. Vilket material har '+f1(dens(c))+'?',false);
      } else {
        api.tips('Inte riktigt. '+o.msg,true);
      }
      uppdatera();
    }
    function valjMat(namn){
      const c=cyl[valt];
      if(stegNu()<2){ api.tips('Väg och mät alla tre cylindrarna först.',true); matCtl.set('-',true); return; }
      if(!c.rho){ api.tips('Räkna först ut densiteten med knapparna ovanför.',true); matCtl.set('-',true); return; }
      if(c.matOK){ api.tips('Den här cylindern är redan klar.',true); matCtl.set(c.namn,true); return; }
      const rad=TAB.find(t=>t[0]===namn); if(!rad) return;
      const ratt=ratta(c);
      if(ratt.indexOf(namn)>=0){
        c.matOK=true; c.namn=namn; blink[c.k+'-mat']=1.4; senast={typ:'mat',k:c.k};
        const kvar=cyl.filter(o=>!o.matOK).length;
        const dubbel=ratt.length>1;
        const t1=namn+' har densiteten '+f1(rad[1])+', precis som '+namnNr(c.k).toLowerCase()+'.'+
          (dubbel?' Järn och stål har samma värde i tabellen, så båda är rätt. Stål är mest järn.':'');
        if(!kvar){
          api.tips(t1,true);
          api.klar(2,t1+' Du hittade alla tre materialen med massa, volym och densitet.');
        } else {
          api.pip(784,.1,'triangle',.05);
          api.tips(t1,false);
          framat(c.k,'matOK');
        }
      } else {
        c.visaRatt=true;
        api.tips('Inte riktigt. '+namn+' har densiteten '+f1(rad[1])+'. '+namnNr(c.k)+' har '+f1(dens(c))+'. Leta efter en rad i tabellen med '+f1(dens(c))+'.',true);
      }
      uppdatera();
    }

    /* ---- vad som visas, pekas ut och hjälps med just nu ---- */
    function uppdatera(){
      const s=stegNu(), c=cyl[valt];
      visa('vag',s===0); visa('sank',s===1);
      visa('rho',s===2 && !c.rho); visa('mat',s===2 && c.rho && !c.matOK);
      if(api.gjort(2)){ api.peka(null); return; }
      if(s===0){
        const n=nastaOvagd(), vilken=valt!==n;
        api.peka(vilken?'cyl':'vag');
        api.hint(['Vågen visar hur mycket massa en cylinder har.',
          'Du har vägt '+cyl.filter(o=>o.vagd).length+' av tre. Väg en cylinder i taget.',
          (vilken?'Tryck på '+namnNr(n)+'. ':'')+'Tryck på knappen Lägg på vågen.']);
      } else if(s===1){
        const n=nastaEjSankt(), vilken=valt!==n;
        api.peka(vilken?'cyl':'sank');
        api.hint(['Volym är hur mycket plats något tar. Vattnet visar den.',
          'När en cylinder sänks ner trycker den undan vatten. Då stiger nivån. Hur mycket den stiger är volymen.',
          (vilken?'Tryck på '+namnNr(n)+'. ':'')+'Tryck på knappen Sänk ner i mätglaset.']);
      } else {
        const n=nastaEjKlar();
        if(valt!==n && c.matOK){
          api.peka('cyl');
          api.hint(['Du har fler cylindrar kvar.','Välj en cylinder som inte har något material än.','Tryck på '+namnNr(n)+'.']);
        } else if(!c.rho){
          api.peka('rho');
          api.hint(['Densitet är massa delat med volym.',
            namnNr(valt)+' har massan '+c.m+' gram och volymen '+V0+' kubikcentimeter. Räkna '+c.m+' delat med '+V0+'.',
            'Räkna '+c.m+' delat med '+V0+'. Tryck på '+rhoAlt.find(x=>x.ok).t+'.']);
        } else {
          api.peka('mat');
          const r=ratta(c);
          api.hint(['Titta i densitetstabellen i duken. Leta efter samma tal som du räknade ut.',
            'Vilket material har densiteten '+f1(dens(c))+'? Raden finns i tabellen.',
            'Tryck på '+r[0]+'.']);
        }
      }
    }
    sattValt(0,true);

    /* ---- ritning ---- */
    function cylRita(c,x,y,o,nr,pa){
      const w=CYW,h=CYH,p=PAL[o.mat];
      const g=c.createLinearGradient(x-w/2,0,x+w/2,0);
      g.addColorStop(0,p.d); g.addColorStop(.24,p.l); g.addColorStop(.58,p.m); g.addColorStop(1,p.d);
      c.fillStyle=g;
      c.fillRect(x-w/2,y+5,w,h-10);
      c.beginPath(); c.ellipse(x,y+h-5,w/2,5,0,0,7); c.fill();
      c.beginPath(); c.ellipse(x,y+5,w/2,5,0,0,7); c.fillStyle=p.t; c.fill();
      c.strokeStyle='rgba(10,16,25,.55)'; c.lineWidth=1;
      c.beginPath(); c.ellipse(x,y+5,w/2,5,0,0,7); c.stroke();
      c.beginPath(); c.moveTo(x-w/2,y+5); c.lineTo(x-w/2,y+h-5); c.moveTo(x+w/2,y+5); c.lineTo(x+w/2,y+h-5); c.stroke();
      c.save(); c.globalAlpha=.4; G.linje(c,x-w/2+5,y+9,x-w/2+5,y+h-9,'#FFFFFF',2); c.restore();
      G.text(c,String(nr),x,y+h/2+6,{a:'center',font:'700 16px "Atkinson Hyperlegible", Verdana, sans-serif',f:p.txt,skugga:false});
    }
    function cell(t,x,y,farg,bred,fl,al){
      if(fl>0) G.rund(c0,x-bred/2,y-14,bred,19,6,'rgba(255,201,92,'+(.38*fl)+')');
      G.text(c0,t,x,y,{a:al||'center',font:F12,f:farg,skugga:false});
    }
    let c0=null;                                          // ritytan i den pågående bildrutan

    return {rita(c,t,dt){
      c0=c;
      const lg=lugn(), sel=cyl[valt];
      cyl.forEach(o=>{ if(o.u<1){ o.u=Math.min(1,o.u+dt/ANK); o.pos=stig(o); } });
      for(const kk in blink){ blink[kk]=Math.max(0,blink[kk]-dt); }

      /* vattnet stiger när en cylinder tränger ner */
      let tryckt=0;
      cyl.forEach(o=>{ if(Math.abs(o.pos.x-GC)<3){ tryckt+=V0*clamp((o.pos.y+CYH-mlY(NIVA0))/CYH,0,1); } });
      const niva=NIVA0+tryckt, yN=mlY(niva);
      cyl.forEach(o=>{ const b=o.pos.y+CYH, y60=mlY(NIVA0), i=Math.abs(o.pos.x-GC)<3;
        if(!lg && i && sistBotten[o.k]!==undefined && sistBotten[o.k]<y60 && b>=y60){
          for(let n=0;n<12;n++) splash.skapa({x:GC+slump(-12,12),y:y60,vx:slump(-50,50),vy:slump(-120,-40),liv:slump(.35,.7),r:slump(1.2,2.6),farg:'#CFE9FF',gravitation:320});
        }
        sistBotten[o.k]=i?b:y60-1; });
      splash.uppdatera(lg?dt*.3:dt);

      const pa=cyl.find(o=>o.plats==='vag'&&o.u>=1);
      const iGlas=cyl.find(o=>o.plats==='glas'&&o.u>=1);

      G.scen(c,{topp:'#070C12',botten:'#16222F',rutnat:32,vinjett:true});
      G.golv(c,BANK,{farg:'#1F2E3D',djup:'#0B121B',linjer:true});

      /* ---- bordet: vågen ---- */
      G.skugga(c,VX,BANK+6,VB/2+16,9,.55);
      G.metall(c,VX-VB/2,256,VB,40,7,{ljus:'#DCE7F0',mork:'#6B7C8F'});
      G.rund(c,VX-VB/2+10,264,VB-20,26,5,'#050A11','rgba(92,225,230,.55)',1.5);
      G.digit(c,(pa?pa.m:0)+' g',VX,284,{farg:CYAN,storlek:19,a:'center'});
      G.metall(c,VX-9,246,18,12,2,{ljus:'#C8D5E2',mork:'#6B7C8F'});
      G.metall(c,VX-VB/2+8,PLATTA,VB-16,8,4,{ljus:'#E4ECF4',mork:'#7D8B9B'});
      G.text(c,'Våg',VX,316,{a:'center',font:F_LITEN,f:'#A3B3C5'});

      /* ---- bordet: stativ och mätglas ---- */
      G.skugga(c,GC,BANK+7,GW/2+22,8,.5);
      G.metall(c,316,BANK-9,32,9,2,{ljus:'#C8D5E2',mork:'#6B7C8F'});
      G.metall(c,328,GT-14,8,BANK-GT+6,2,{ljus:'#C8D5E2',mork:'#6B7C8F'});
      G.metall(c,GC-3,GT-12,336-GC+3,7,2,{ljus:'#C8D5E2',mork:'#6B7C8F'});
      G.metall(c,GX-7,GB-2,GW+14,8,3,{ljus:'#C8D5E2',mork:'#6B7C8F'});

      /* vatten i glaset */
      G.rekt(c,GX+2,yN,GW-4,GB-2-yN,'rgba(92,184,255,.45)');
      /* cylinder i glaset (hänger i snöret) */
      const iG=cyl.filter(o=>Math.abs(o.pos.x-GC)<3 && o.pos.y>GT-4);
      iG.forEach(o=>{
        if(o.pos.y>GT) G.linje(c,GC,GT-6,GC,o.pos.y+4,'rgba(235,240,245,.85)',1.4);
        cylRita(c,o.pos.x,o.pos.y,o,o.k+1);
      });
      if(!iG.length){ G.linje(c,GC,GT-6,GC,GT+6,'rgba(235,240,245,.85)',1.4); G.cirkel(c,GC,GT+9,3.2,null,'#EDF3F9',1.4); }
      /* tonat vatten över cylindern, så den syns genom vattnet */
      G.rekt(c,GX+2,yN,GW-4,GB-2-yN,'rgba(92,184,255,.26)');
      G.vag(c,{x0:GX+2,x1:GX+GW-2,y:yN,amplitud:lg?0:1.1,vaglangd:30,fas:t*2,farg:'#8FD0FF',bredd:2,glod:6});
      splash.rita(c);
      G.glas(c,[[GX,GT],[GX,GB],[GX+GW,GB],[GX+GW,GT]],{hx:GX,hy:GT});

      /* skala */
      for(let ml=0;ml<=100;ml+=5){
        const yy=mlY(ml), stor=ml%10===0;
        G.linje(c,GX+GW-(stor?12:6),yy,GX+GW-1,yy,'rgba(220,231,240,.7)',1);
        if(stor){ const farg0=ml===NIVA0?GULD:(ml===Math.round(niva)&&iGlas&&Math.abs(niva-70)<.5)?BLA:'#C4D3E3';
          const fet=ml===NIVA0||farg0===BLA;
          G.text(c,String(ml),GX+GW+6,yy+4,{font:fet?'700 12px "Atkinson Hyperlegible", Verdana, sans-serif':F_LITEN,f:farg0,skugga:false}); }
      }
      G.linje(c,GX+3,mlY(NIVA0),GX+GW-3,mlY(NIVA0),GULD,1.6,[5,3]);
      if(iGlas) G.linje(c,GX+3,mlY(NIVA0+V0),GX+GW-3,mlY(NIVA0+V0),BLA,1.6,[5,3]);
      G.text(c,'Mätglas',GC,316,{a:'center',font:F_LITEN,f:'#A3B3C5'});

      /* ---- bordet: cylindrarna ---- */
      G.text(c,'Cylindrar',66,316,{a:'center',font:F_LITEN,f:'#A3B3C5'});
      cyl.forEach(o=>{ if(o.plats!=='bank') G.rund(c,SLOT(o.k)-CYW/2,BANK-CYH,CYW,CYH,6,null,'rgba(163,179,197,.3)',1); });
      cyl.forEach(o=>{
        const p=o.pos; if(Math.abs(p.x-GC)<3 && p.y>GT-4) return;
        if(o.plats==='bank' && o.u>=1) G.skugga(c,p.x,BANK+3,CYW/2+4,4,.5);
        cylRita(c,p.x,p.y,o,o.k+1);
      });
      /* markering av vald cylinder */
      { const p=sel.pos, puls=lg?0:Math.sin(t*4)*1.5;
        G.rund(c,p.x-CYW/2-4-puls,p.y-4-puls,CYW+8+puls*2,CYH+8+puls*2,9,null,'#FFC95C',2.2); }

      /* ---- vad händer just nu ---- */
      let ct, cm=null, cf='#FFC95C';
      const sn=stegNu();
      if(!senast){ ct=sn===0?'Väg cylindrarna en i taget':sn===1?'Mät volymen med vattnet':'Räkna ut densiteten'; cm=[sel.pos.x,sel.pos.y-4]; }
      else if(senast.typ==='vag'){ ct=namnNr(senast.k)+' väger '+cyl[senast.k].m+' g'; cm=[VX+CYW/2,PLATTA-CYH*.7]; }
      else if(senast.typ==='glas'){ ct='Vattnet steg från 60 till 70 ml'; cm=[GC-GW/2+4,mlY(NIVA0+V0)]; cf=BLA; }
      else if(senast.typ==='rho'){ ct=cyl[senast.k].m+' g delat med '+V0+' cm³ = '+f1(dens(cyl[senast.k]))+' g/cm³'; cf=CYAN; }
      else { ct=namnNr(senast.k)+' är '+cyl[senast.k].namn.toLowerCase(); cf='#7BD389'; }

/* Nettokraft – lärarens exempel: bil 1 000 N − 400 N = 600 N, pulka 20 N − 1 N = 19 N, dragkamp 60 N mot 50 N = 10 N.

EXP.nettokraft={
  namn:'Nettokraft',
  intro:'Nettokraft är resultatet av krafter som samarbetar eller motarbetar varandra. Dra i reglagen och titta på pilarna. Föremålet börjar alltid stilla, och rörelsen visas förenklat.',

    'Krafter som motverkar varandra drar du ifrån varandra: 1 200 minus 500 är 700. Nettokraften pekar åt den större kraftens håll, alltså framåt.'],
  bygg(api){
    const SC={
      drag :{n:'Dragkamp', max:200,  steg:10,  h0:60,  v0:50,  hn:'Lag höger',   vn:'Lag vänster', tH:'LAGET TILL HÖGER DRAR', tV:'LAGET TILL VÄNSTER DRAR', glid:false},
      pulka:{n:'Pulka',    max:40,   steg:1,   h0:20,  v0:1,   hn:'Dragkraft',   vn:'Friktion',    tH:'DRAGKRAFT ÅT HÖGER', tV:'FRIKTION ÅT VÄNSTER', glid:true},
      bil  :{n:'Bil',      max:1500, steg:100, h0:800, v0:300, hn:'Motorkraft',  vn:'Friktion',    tH:'MOTORKRAFT ÅT HÖGER', tV:'FRIKTION ÅT VÄNSTER', glid:true}
    };

    let sc='drag', H=SC.drag.h0, V=SC.drag.v0, v=0, off=0, skrol=0, byter=false;
    const fN=x=>heltal(x)+' N';
    const oH={id:'hoger',etikett:'Kraft åt höger',min:0,max:SC.drag.max,steg:SC.drag.steg,varde:H,fmt:fN,vid:x=>{ if(byter) return; H=x; andrat(); }};
    const oV={id:'vanster',etikett:'Kraft åt vänster',min:0,max:SC.drag.max,steg:SC.drag.steg,varde:V,fmt:fN,vid:x=>{ if(byter) return; V=x; andrat(); }};

    api.avlas('h','Åt höger'); api.avlas('v','Åt vänster'); api.avlas('n','Nettokraft'); api.avlas('r','Rörelse');

    const sH=api.slider(oH), sV=api.slider(oV);

    const netto=()=>H-V;
    const forsta=()=>[0,1,2].find(k=>!api.gjort(k));

    function valjScen(k){

      G.glas(c,[[cx-26,GY-62],[cx+24,GY-62],[cx+28,GY-47],[cx-30,GY-47]],{hx:cx-60,hy:GY-90});
      [cx-38,cx+38].forEach(wx=>{
        G.klot(c,wx,GY-12,13,'#0B121B'); G.cirkel(c,wx,GY-12,5,'#A3B3C5');
        const a=-skrol/13; G.linje(c,wx,GY-12,wx+Math.cos(a)*10,GY-12+Math.sin(a)*10,'#DCE7F0',2);
      });

    function pulka(c,cx){
      c.save(); c.translate(cx,GY); c.scale(K,K); c.translate(-cx,-GY);
      G.skugga(c,cx,GY+3,64,7,.5);
      G.linje(c,cx-52,GY-5,cx+52,GY-5,'#A3B3C5',4);
      G.linje(c,cx+52,GY-5,cx+62,GY-17,'#A3B3C5',4);
      G.linje(c,cx-34,GY-5,cx-34,GY-20,'#A3B3C5',3); G.linje(c,cx+34,GY-5,cx+34,GY-20,'#A3B3C5',3);
      G.rund(c,cx-46,GY-30,92,11,4,'#C98A4B','rgba(10,16,25,.6)',1.5);
      G.cirkel(c,cx-8,GY-68,9,'#DCE7F0');
      G.linje(c,cx-8,GY-58,cx-10,GY-32,'#DCE7F0',7);
      G.linje(c,cx-10,GY-34,cx+26,GY-38,'#DCE7F0',6);
      G.linje(c,cx-8,GY-52,cx+24,GY-46,'#DCE7F0',4);
      c.restore();
    }
    function lag(c,x,lutn,f){

    }
    return {rita(c,t,dt){
      const S=SC[sc], n=netto(), lg=lugn();
      const acc = n===0 ? 0 : Math.sign(n)*(30+120*Math.min(1,Math.abs(n)/(S.max*.6)))*(lg?.35:1);
      v=clamp(v+acc*dt,-300,300);
      if(S.glid) skrol-=v*dt;
      else { off+=v*dt; if(Math.abs(off)>70){ off=clamp(off,-70,70); v=0; } }
      const cx=320, fx=cx+off, nf=n===0?KB:KN;
