    api.val({id:'avst',etikett:'Föremålets avstånd',varde:avst,alt:[[5,'5 cm'],[7,'7 cm'],[15,'15 cm'],[20,'20 cm'],[30,'30 cm']],vid:v=>{avst=+v;api.tips(TYP[typ].namn+', '+avst+' cm bort. '+bildText()+'.',true);nytt();}});
    const vBruk=api.val({id:'bruk',etikett:'Vardagsföremål',varde:'',
      alt:Object.keys(BRUK).map(k=>[k,BRUK[k].namn]),vid:v=>{bruk=v;valtBruk();}});

    const ctl=id=>document.querySelector('#reglage [data-ctl="'+id+'"]');
    const visa=(id,pa)=>{ const e=ctl(id); if(e) e.classList.toggle('dold',!pa); };
    const skarmAktiv=()=>lage==='par'&&typ==='konvlins'&&api.gjort(0);
    function synlighet(){
      visa('ant',lage==='par'); visa('skarm',skarmAktiv()); visa('avst',lage==='bild');
      visa('lage',api.gjort(0)); visa('bruk',api.gjort(0));
    }
    synlighet();

    /* ---------- fysik ---------- */
    function bildData(){
      const F=TYP[typ].F, a=avst*K;
      const b=isFinite(F)?a*F/(a-F):-a, m=-b/a;
      return {a:a,b:b,m:m,virt:b<0,cm:b/K};
    }
    const stor=m=>{ const x=Math.abs(m);
      if(x>1.05) return dec(x,1).replace(',0','')+' gånger större';
      if(x<0.95){ const y=1/x; return dec(y,1).replace(',0','')+' gånger mindre'; }
      return 'lika stor'; };
    function bildText(){
      const d=bildData();
      return (d.virt?'Syns bara genom linsen':'Kan fångas på en skärm')+', '+(d.m>0?'rättvänd':'upp och ner')+', '+stor(d.m);
    }
    function norm(v){ const l=Math.hypot(v[0],v[1])||1; return [v[0]/l,v[1]/l]; }
    function tMax(x,y,dx,dy){
      let t=1e9;
      if(dx>1e-9) t=Math.min(t,(BX1-x)/dx); else if(dx<-1e-9) t=Math.min(t,(BX0-x)/dx);
      if(dy>1e-9) t=Math.min(t,(BY1-y)/dy); else if(dy<-1e-9) t=Math.min(t,(BY0-y)/dy);
      return Math.max(0,t);
    }
    const TAU=20*Math.PI/180;
    /* en parallell stråle på höjden h över axeln: träffpunkt, riktning efter elementet och ev. räknad fokus */
    function strale(h){
      const T=TYP[typ], y0=AY-h;
      if(T.lins){
        const d=norm([1,h/T.F]);
        return {hit:[EX,y0],d:d,virt:T.F<0?[EX+T.F,AY]:null};
      }
      if(typ==='planspegel'){
        const s=(y0-AY)/Math.cos(TAU), xh=EX-s*Math.sin(TAU);
        return {hit:[xh,y0],d:[-Math.cos(2*TAU),-Math.sin(2*TAU)],virt:null};
      }
      const F=T.F, xh=EX-h*h/(4*F), N2=1+h*h/(4*F*F);
      return {hit:[xh,y0],d:[1-2/N2,(h/F)/N2],virt:F<0?[EX-F,AY]:null};
    }

    /* ---------- hjälp: vad ska hon göra nu? ---------- */
    function hintNu(){
      if(!api.gjort(0)){
        const nasta=FYRA.find(t=>!besokt.has(t));
        const sista=lage!=='par'?'Tryck på Parallella strålar under Visa.':ant<3?'Tryck på 3 under Antal strålar.':'Tryck på '+TYP[nasta].namn+' under Typ.';
        api.hint(['Prova en ny typ och titta på strålarna.','Du ska se alla fyra: konvex lins, konkav lins, konvex spegel och konkav spegel.',sista]);
        api.peka(lage!=='par'?'lage':ant<3?'ant':'typ');
      } else if(!api.gjort(1)){
        const ny=Object.keys(BRUK).find(k=>!klarBruk.has(k));
        const sista=bruk&&!klarBruk.has(bruk)?'Tryck på '+TYP[BRUK[bruk].svar].namn+' under Typ.':'Tryck på '+BRUK[ny].namn+' under Vardagsföremål.';
        api.hint(['Varje vardagsföremål har en typ som passar.','Tänk på vad föremålet ska göra: samla, sprida eller förstora.',sista]);
        api.peka(bruk&&!klarBruk.has(bruk)?'typ':'bruk');
      } else if(!api.gjort(2)){
        let sista, p;
        if(lage!=='par'){ sista='Tryck på Parallella strålar under Visa.'; p='lage'; }
        else if(typ!=='konvlins'){ sista='Tryck på Konvex lins under Typ.'; p='typ'; }
        else if(ant<3){ sista='Tryck på 3 under Antal strålar.'; p='ant'; }
        else { sista='Dra Skärmens avstånd till linsen till 10 cm.'; p='skarm'; }
        api.hint(['Brännpunkten är där alla strålar möts i en punkt.','Dra skärmen tills ljusprickarna ligger i en enda punkt.',sista]);
        api.peka(p);
      } else if(!api.gjort(3)){
        let sista, p;
        if(lage!=='bild'){ sista='Tryck på Bilden av ett föremål under Visa.'; p='lage'; }
        else if(typ!=='konvlins'&&typ!=='konkspegel'){ sista='Tryck på Konvex lins under Typ.'; p='typ'; }
        else { sista='Tryck på 5 cm under Föremålets avstånd.'; p='avst'; }
        api.hint(['Förstoringsglaset och sminkspegeln förstorar när föremålet är nära.','Föremålet ska stå närmare än brännpunkten, som är tio centimeter bort.',sista]);
        api.peka(p);
      } else { api.hint(['Du har gjort alla steg.']); api.peka(null); }
    }

    function kollaSteg(){
      if(!api.gjort(0)&&lage==='par'&&ant>=3&&FYRA.includes(typ)){
        besokt.add(typ);
        if(FYRA.every(t=>besokt.has(t))){
          const t='Konvex lins och konkav spegel samlar ljuset. Konkav lins och konvex spegel sprider det.';
          api.tips(t,true); api.klar(0,t); synlighet(); }
      }
      if(!api.gjort(2)&&skarmAktiv()&&ant>=3&&skarm===10){
        const t='Där möts alla strålar i en punkt. Det är brännpunkten, eller fokus. Den ligger tio centimeter från linsen.';
        api.tips(t,true); api.klar(2,t);
      }
      if(!api.gjort(3)&&lage==='bild'&&(typ==='konvlins'||typ==='konkspegel')&&avst<10){
        const t='Nära brännpunkten blir bilden förstorad och rättvänd. Så fungerar ett förstoringsglas och en sminkspegel.';
        api.tips(t,true); api.klar(3,t);
      }
    }
    function nytt(){ kollaSteg(); hintNu(); }

    function valtTyp(){
      const T=TYP[typ];
      /* match av vardagsföremål (steg två) */
      if(bruk&&!klarBruk.has(bruk)){
        const B=BRUK[bruk];
        if(B.svar===typ){
          klarBruk.add(bruk);
          const knapp=vBruk.el.querySelector('button[data-v="'+bruk+'"]'); if(knapp) knapp.textContent='✓ '+B.namn;
          bruk=''; vBruk.set('',true);
          if(klarBruk.size===Object.keys(BRUK).length){
            api.tips(B.ratt,true); api.klar(1,B.ratt);
          } else { api.tips(B.ratt+' '+(Object.keys(BRUK).length-klarBruk.size)+' kvar.'); }
        } else {
          api.tips('Inte riktigt. '+GOR[typ]+' '+B.krav+' Prova en annan typ.');
        }
        kollaSteg(); hintNu(); synlighet(); return;
      }
      synlighet();
      if(lage==='par'){
        if(ant<3&&FYRA.includes(typ)) api.tips(T.sag+' Använd tre eller fem strålar så ser du det tydligt.');
        else api.tips(T.sag);
      } else api.tips(T.namn+', '+avst+' cm bort. '+bildText()+'.');
      kollaSteg(); hintNu();
    }
    function valtLage(){
      synlighet();
      if(lage==='bild') api.tips('Nu ser du ett föremål och dess bild. '+TYP[typ].namn+', '+avst+' cm bort. '+bildText()+'.');
      else api.tips('Parallella strålar: se om ljuset samlas eller sprids.');
      kollaSteg(); hintNu();
    }
    function valtBruk(){
      const B=BRUK[bruk];
      if(klarBruk.has(bruk)){ api.tips(B.ratt); return; }
      api.tips(B.krav+' Vilken typ passar? Tryck på typen.');
      hintNu();
    }
    hintNu(); api.peka('typ');
    api.tips('Tryck på en typ under Typ. Titta på hur strålarna beter sig.',true);

    /* ---------- ritning ---------- */
    const chev=(c,x1,y1,x2,y2,f)=>{
      const l=Math.hypot(x2-x1,y2-y1); if(l<46) return;
      const mx=(x1+x2)/2, my=(y1+y2)/2, a=Math.atan2(y2-y1,x2-x1);
      G.poly(c,[[mx+Math.cos(a)*6,my+Math.sin(a)*6],[mx+Math.cos(a+2.5)*7,my+Math.sin(a+2.5)*7],[mx+Math.cos(a-2.5)*7,my+Math.sin(a-2.5)*7]],f);
    };
    const ray=(c,x1,y1,x2,y2,f,al,br)=>{
      c.save(); c.globalAlpha=al==null?1:al; c.shadowColor=f; c.shadowBlur=9;
      G.linje(c,x1,y1,x2,y2,f,br||2.4); c.restore();
      chev(c,x1,y1,x2,y2,f);
    };
    const virt=(c,x1,y1,x2,y2)=>G.linje(c,x1,y1,x2,y2,'rgba(255,217,138,.6)',1.8,[6,5]);
    const pilObj=(c,x,hh,f,al,streck)=>{
      const L=Math.abs(hh); if(L<5) return; const sg=hh>=0?-1:1, ty=AY+sg*L, kb=Math.min(14,L*.6);
      c.save(); c.globalAlpha=al;
      c.beginPath(); c.moveTo(x-3.5,AY); c.lineTo(x-3.5,ty-sg*kb); c.lineTo(x-9,ty-sg*kb); c.lineTo(x,ty);
      c.lineTo(x+9,ty-sg*kb); c.lineTo(x+3.5,ty-sg*kb); c.lineTo(x+3.5,AY); c.closePath();
      if(streck){ c.setLineDash([5,4]); c.lineWidth=2.2; c.strokeStyle=f; c.fillStyle='rgba(159,240,255,.18)'; c.fill(); c.stroke(); c.setLineDash([]); }
      else { c.fillStyle=f; c.fill(); }
      c.restore();
    };
    function ritaElement(c,T,schem){
      if(T.lins){
        const konv=T.F>0, hh=HM;
        G.glas(c,cc=>{
          if(konv){ cc.moveTo(EX,AY-hh); cc.quadraticCurveTo(EX+26,AY,EX,AY+hh); cc.quadraticCurveTo(EX-26,AY,EX,AY-hh); }
          else { cc.moveTo(EX-13,AY-hh); cc.lineTo(EX+13,AY-hh); cc.quadraticCurveTo(EX-7,AY,EX+13,AY+hh); cc.lineTo(EX-13,AY+hh); cc.quadraticCurveTo(EX+7,AY,EX-13,AY-hh); }
        },{fyll:'rgba(92,225,230,.15)',kant:'#5CE1E6',bredd:2.6,hx:EX-34,hy:AY-70});
        return;
      }
      const pts=[];
      if(typ==='planspegel'){
        const tau=schem?0:TAU;
        for(let s=-HM-6;s<=HM+6;s+=6) pts.push([EX-s*Math.sin(tau),AY+s*Math.cos(tau)]);
      } else {
        const Fv=schem?T.F*3.4:T.F;
        for(let h=-HM;h<=HM;h+=4) pts.push([EX-h*h/(4*Fv),AY-h]);
      }
      c.save(); c.lineCap='round'; c.lineJoin='round';
      c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0]+6,p[1]):c.moveTo(p[0]+6,p[1])); c.strokeStyle='#3B4858'; c.lineWidth=9; c.stroke();
      c.strokeStyle='rgba(120,138,160,.8)'; c.lineWidth=1.6;
      for(let i=0;i<pts.length;i+=3){ c.beginPath(); c.moveTo(pts[i][0]+9,pts[i][1]); c.lineTo(pts[i][0]+17,pts[i][1]+7); c.stroke(); }
      c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.strokeStyle='#EAF1F8'; c.lineWidth=3.2; c.stroke();
      c.restore();
    }

    function passa(c,t,x,y,maxW,f,storst){        // text som krymper (till 11 px) tills den ryms
      let px=storst||14, fn;
      for(;px>=11;px-=.5){ fn='700 '+px+'px "Atkinson Hyperlegible", Verdana, sans-serif'; c.font=fn; if(c.measureText(t).width<=maxW) break; }
      G.text(c,t,x,y,{f:f,font:fn,skugga:false});
    }
    function ritaBar(c,T,bildRad){
      G.bricka(c,8,292,624,62,{farg:A});
      passa(c,T.l1,20,310,600,T.farg,14);
      passa(c,bildRad||T.l2,20,328,600,'#EEF3F7',14);
      passa(c,api.gjort(1)?T.l3:'Vardagsexempel hittar du i steg två.',20,346,600,'#9DAFC4',13);
    }

    function ritaPar(c,t,lg){
      const T=TYP[typ], hs=HTAL[ant];
      /* axel och brännpunkter */
      G.linje(c,6,AY,CW-6,AY,'rgba(160,185,210,.35)',1.2,[7,6]);
      const R=hs.map(strale);
      /* ev. skärm (konvex lins) */
      const xs=EX+skarm*K, medSkarm=skarmAktiv();
      /* infallande strålar */
      R.forEach((r,i)=>{ ray(c,0,r.hit[1],r.hit[0],r.hit[1],RYG,1,2.4); });
      ritaElement(c,T,false);
      /* utgående strålar */
      const spots=[];
      R.forEach((r,i)=>{
        let tm=tMax(r.hit[0],r.hit[1],r.d[0],r.d[1]);
        if(medSkarm){ const ts=(xs-r.hit[0])/r.d[0]; if(ts<tm){ tm=ts; spots.push([xs,r.hit[1]+r.d[1]*ts]); } }
        const ex=r.hit[0]+r.d[0]*tm, ey=r.hit[1]+r.d[1]*tm;
        ray(c,r.hit[0],r.hit[1],ex,ey,RUT,1,2.6);
        if(r.virt) virt(c,r.hit[0],r.hit[1],r.virt[0],r.virt[1]);
      });
      /* brännpunkt */
      if(typ!=='planspegel'){
        const real=T.F>0, fx=T.lins?EX+T.F:EX-T.F;
        if(real){ G.glod(c,fx,AY,22,'#FFD166',.8); G.cirkel(c,fx,AY,5,'#FFD166'); }
        else { G.cirkel(c,fx,AY,5,'rgba(255,209,102,.15)','#FFD166',2); }
        if(!medSkarm||!spots.length){
          G.callout(c,clamp(fx,92,CW-92),AY+(real?-124:-124),real?'Brännpunkt (fokus), 10 cm':'Räknad fokus, 10 cm',{till:[fx,AY-6],farg:'#FFD166'});
        }
      } else {
        const r0=R[Math.floor(R.length/2)], px=r0.hit[0], py=r0.hit[1];
        G.linje(c,px,py,px-Math.cos(TAU)*118,py-Math.sin(TAU)*118,'rgba(255,255,255,.6)',1.6,[7,5]);
        c.save(); c.lineWidth=2.4; c.strokeStyle='#FFD98A'; c.beginPath(); c.arc(px,py,52,Math.PI,Math.PI+TAU); c.stroke();
        c.strokeStyle='#FFF1C2'; c.beginPath(); c.arc(px,py,52,Math.PI+TAU,Math.PI+2*TAU); c.stroke(); c.restore();
        G.etikett(c,'20° in',px-78,py-10,{f:'#FFD98A',font:FM});
        G.etikett(c,'20° ut',px-68,py-36,{f:'#FFF1C2',font:FM});
        G.etikett(c,'Normal',px-Math.cos(TAU)*118-4,py-Math.sin(TAU)*118-14,{f:'#C5D1DE',font:FM});
        G.callout(c,EX+110,AY-130,'Ingen fokus: ljuset ändrar bara riktning',{farg:'#FFD166',font:FM});
      }
      /* skärmen */
      if(medSkarm){
        G.rekt(c,xs-3,AY-112,6,224,'rgba(238,243,247,.9)');
        G.glod(c,xs,AY,40,'#FFFFFF',.15);
        spots.forEach(s=>{ G.glod(c,s[0],s[1],14,'#FFD166',.9); G.cirkel(c,s[0],s[1],3.6,'#FFF3C4'); });
        const skarp=skarm===10&&ant>=3;
        G.callout(c,clamp(xs+4,100,CW-110),AY-128,skarp?'Alla strålar möts: fokus!':'Skärmen '+skarm+' cm från linsen',{till:[xs,AY-112],farg:skarp?'#7BD389':'#A3B3C5',font:FM});
        G.matband(c,EX,AY+104,xs,skarm+' cm','#9DAFC4');
      }
      G.text(c,T.namn,16,24,{f:T.farg,font:F_RUB});
      ritaBar(c,T);
      const fok=typ==='planspegel'?'ingen':(T.F>0?'verklig, 10 cm':'räknad (ingen riktig), 10 cm');
      api.satt('typ',T.namn); api.satt('ljus',T.ljus); api.satt('fokus',fok);
      api.satt('bild',api.gjort(0)?'välj Bilden av ett föremål':'–');
    }

    function ritaBild(c,t,lg){
      const T=TYP[typ], F=T.F, d=bildData(), m=d.m;
      const mirror=!T.lins, xo=EX-d.a, yt=AY-OBJH;
      const foldUt=u=>mirror?2*EX-u:u;
      G.linje(c,6,AY,CW-6,AY,'rgba(160,185,210,.35)',1.2,[7,6]);
      if(typ!=='planspegel'){
        const fl=T.lins?[EX+FP,EX-FP]:[F>0?EX-FP:EX+FP];
        fl.forEach(fx=>{ G.cirkel(c,fx,AY,4.5,'#FFD166'); G.text(c,'F',fx,AY+22,{a:'center',f:'#FFD166',font:FM}); });
      }
      ritaElement(c,T,true);
      /* huvudstrålar: parallell, genom mitten, och en ned mot elementet */
      const hits=[AY-OBJH, AY, AY+40];
      const rader=hits.map(yh=>{
        const sin=(yh-yt)/(EX-xo), h=AY-yh, sut=sin+(isFinite(F)?h/F:0);
        return {yh:yh,sin:sin,sut:sut};
      });
      const R=rader.map(r=>{
        const dd=norm([1,r.sut]); let tm;
        /* i den uppvikta världen går strålen åt höger; spegeln viker den tillbaka */
        const sx=mirror?-1:1;
        tm=tMax(EX,r.yh,sx*dd[0],dd[1]);
        return {r:r,dd:dd,sx:sx,tm:tm};
      });
      R.forEach(o=>{ ray(c,xo,yt,EX,o.r.yh,RYG,1,2.2); });
      R.forEach(o=>{
        const ex=EX+o.sx*o.dd[0]*o.tm, ey=o.r.yh+o.dd[1]*o.tm;
        ray(c,EX,o.r.yh,ex,ey,RUT,1,2.4);
        if(d.virt){
          const ui=EX+d.b, yi=AY-m*OBJH;
          virt(c,EX,o.r.yh,foldUt(ui),yi);
        }
      });
      /* föremålet och bilden */
      const ximg=foldUt(EX+d.b), himg=m*OBJH;
      pilObj(c,xo,OBJH,'#FFC95C',1,false);
      pilObj(c,ximg,himg,d.virt?'rgb(159,240,255)':'#7BD389',d.virt?.95:1,d.virt);
      {
        const ytop=AY-himg, upp=himg>=0, hx=clamp(ximg+(mirror&&d.virt?44:0),72,CW-72);
        const hy=upp?clamp(ytop-26,44,AY-50):AY-64;
        G.callout(c,hx,hy,d.virt?'Syns bara genom linsen':'Bild på skärm',{till:[ximg,upp?ytop-3:ytop+3],farg:d.virt?'#9FF0FF':'#7BD389',font:FM});
      }
      G.callout(c,clamp(xo,60,CW-60),AY+66,'Föremål, '+avst+' cm',{till:[xo,AY+4],farg:'#FFC95C',font:FM});
      G.text(c,T.namn,16,24,{f:T.farg,font:F_RUB});
      ritaBar(c,T,bildText()+'.');
      api.satt('typ',T.namn); api.satt('ljus',T.ljus);
      api.satt('fokus',typ==='planspegel'?'ingen':(T.F>0?'verklig, 10 cm':'räknad (ingen riktig), 10 cm'));
      api.satt('bild',bildText());
    }

    return {rita(c,t,dt){
      const lg=lugn();
      G.scen(c,{topp:'#070C12',botten:'#0E1621',rutnat:32,vinjett:true});
      if(lage==='par') ritaPar(c,t,lg); else ritaBild(c,t,lg);
      if(api.gjort(0)&&api.gjort(1)&&api.gjort(2)&&api.gjort(3)) G.rund(c,2,2,CW-4,CH-4,14,null,'#7BD389',3);
    }};
  }
};
/* Ögat och synfel. Modell: hornhinnan (25 dioptrier) och linsen räknas som två tunna linser med glasögonen framför.
   Strålarna följs steg för steg (paraxialt). Normalt öga: 24 mm från lins till näthinna, och linsen kan bli
   tjockare med upp till 6 dioptrier. Närsynt öga är längre och översynt kortare. Glasögonens styrka är vald så att
   de passar just det synfelet. Ritningen är inte i skala, och ögat är förenklat (ingen glaskropp med eget brytningsindex). */
EXP.ogat={
  namn:'Ögat och synfel',
  intro:'Du ser ett genomskuret öga. Ljuset ska samlas på näthinnan. Ögat är förenklat: hornhinnan och linsen räknas som tunna linser, och ritningen är inte i skala.',
  steg:['Tryck på varje del av ögat och läs vad den gör.',
    'Titta med ett normalt öga på nära håll. Bilden ska vara skarp.',
    'Välj Närsynt. Rätta synen med glasögon så att bilden blir skarp långt bort.',
    'Välj Översynt. Rätta synen med glasögon så att bilden blir skarp nära.'],
  fraga:['Vad är det som är fel i ett närsynt öga?',
    ['Ögat är för långt, så ljuset samlas framför näthinnan',
     'Ögat är för kort, så ljuset samlas bakom näthinnan',
     'Pupillen släpper in för lite ljus, så bilden blir svag',
     'Synnerven bryter ljuset för mycket, så bilden blir suddig'],
    'Ett närsynt öga är för långt, så ljuset samlas för tidigt, framför näthinnan. Konkava linser sprider ljuset, så att det samlas på näthinnan.'],
  bygg(api){
    const A=api.farg, S=6.5, EY=134, XC=200, PC=25, DCL=3.6, DG=12, AMAX=6.0, RP=4, L0=24, NARA=250;
    const XL=XC+DCL*S, XG=XC-DG*S, XS=78;
    const FM='700 13.5px "Atkinson Hyperlegible", Verdana, sans-serif';
    const PG={inga:0,konkav:-3,konvex:6};
    const DEL={
      hornhinna:{namn:'Hornhinnan',rad:['Skyddar ögat mot smuts och damm.','Den hjälper linsen att bryta ljuset.'],
        sag:'Hornhinnan skyddar ögat mot smuts och damm. Den hjälper linsen att bryta ljuset.'},
      pupill:{namn:'Pupillen',rad:['Släpper in ljus i ögat.','Den anpassar sig efter hur mycket ljus som finns.'],
        sag:'Pupillen släpper in ljus i ögat. Den anpassar sig efter hur mycket ljus som finns runt oss.'},
      lins:{namn:'Linsen',rad:['Bryter ljuset in mot näthinnan.','Den anpassar sig efter hur nära eller långt bort du tittar.'],
        sag:'Linsen bryter ljuset. Den anpassar sig efter hur nära eller långt bort du tittar.'},
      nathinna:{namn:'Näthinnan',rad:['Här fokuseras ljuset och en bild uppstår.','Bilden skickas till hjärnan via synnerven.'],
        sag:'På näthinnan fokuseras ljuset och en bild uppstår. Bilden skickas till hjärnan via synnerven.'},
      synnerv:{namn:'Synnerven',rad:['Skickar signaler från näthinnan till hjärnan.','Först då ser du bilden.'],
        sag:'Synnerven skickar signalerna från näthinnan till hjärnan. Då ser du.'}
    };
    const DELORD=['hornhinna','pupill','lins','nathinna','synnerv'];
    let del='', synfel='normalt', avst='lang', glas='inga';
    const sedda=new Set();

    /* ---------- fysik ---------- */
    function spar(a,Pg){            // enhetsstråle: lins och näthinna oberoende av Pl
      const m1=(isFinite(a)?1/a:0)-Pg/1000, yc=1+m1*DG, m2=m1-yc*PC/1000, yl=yc+m2*DCL;
      return {m2:m2,yl:yl};
    }
    const bAv=(a,Pg,Pl)=>{ const t=spar(a,Pg), m3=t.m2-t.yl*Pl/1000; return m3<0?-t.yl/m3:Infinity; };
    const t0=spar(Infinity,0), PL0=1000*(t0.m2+t0.yl/L0)/t0.yl;
    const LANGD={normalt:L0, narsynt:bAv(Infinity,PG.konkav,PL0), oversynt:bAv(Infinity,PG.konvex,PL0)};
    function fysik(){
      const L=LANGD[synfel], a=avst==='lang'?Infinity:NARA, Pg=PG[synfel==='normalt'?'inga':glas];
      const t=spar(a,Pg), need=1000*(t.m2+t.yl/L)/t.yl;
      const Pl=clamp(need,PL0,PL0+AMAX), b=bAv(a,Pg,Pl), delta=b-L, r=RP*Math.abs(delta)/b;
      const rays=[-3.6,-1.8,0,1.8,3.6].map(y0=>{
        const m0=isFinite(a)?y0/a:0, m1=m0-y0*Pg/1000, yc=y0+m1*DG, m2=m1-yc*PC/1000, yl=yc+m2*DCL, m3=m2-yl*Pl/1000;
        return {y0:y0,m0:m0,yc:yc,yl:yl,yr:yl+m3*L,m3:m3};
      });
      return {L:L,a:a,Pg:Pg,Pl:Pl,dPl:Pl-PL0,b:b,delta:delta,r:r,skarp:r<=0.06,rays:rays,
        pct:clamp(Math.round(100*(1-r/0.6)),0,100)};
    }
    const pxX=mm=>XL+mm*S, pxY=mm=>EY-mm*S;

    /* ---------- reglage ---------- */
    api.avlas('syn','Ögat'); api.avlas('bild','Bilden hamnar'); api.avlas('skarpa','Skärpa'); api.avlas('lins','Linsen');
    api.val({id:'del',etikett:'Del av ögat',varde:'',alt:DELORD.map(k=>[k,DELKNAPP(k)]),
      vid:v=>{del=v;valtDel();}});
    api.val({id:'syn',etikett:'Ögat',varde:synfel,alt:[['normalt','Normalt öga'],['narsynt','Närsynt'],['oversynt','Översynt']],vid:v=>{synfel=v;valtSyn();}});
    const vAvst=api.val({id:'avst',etikett:'Titta på',varde:avst,alt:[['lang','Långt bort'],['nara','Nära (25 cm)']],vid:v=>{avst=v;valtAvst();}});
    const vGlas=api.val({id:'glas',etikett:'Glasögon',varde:glas,alt:[['inga','Inga'],['konkav','Konkav lins'],['konvex','Konvex lins']],vid:v=>{glas=v;valtGlas();}});
    const ctl=id=>document.querySelector('#reglage [data-ctl="'+id+'"]');
    const visa=(id,pa)=>{ const e=ctl(id); if(e) e.classList.toggle('dold',!pa); };
    const synlighet=()=>{ visa('glas',synfel!=='normalt'); visa('syn',api.gjort(0)); visa('avst',api.gjort(0)); };
    synlighet();

    const bildOrd=f=>Math.abs(f.delta)<0.15?'på näthinnan':dec(Math.abs(f.delta),1)+' mm '+(f.delta<0?'framför':'bakom')+' näthinnan';
    const skarpOrd=f=>f.skarp?'skarp':f.pct>=55?'lite suddig':'suddig';

    function hintNu(){
      const f=fysik();
      if(!api.gjort(0)){
        const ny=DELORD.find(k=>!sedda.has(k));
        api.hint(['Tryck på en del av ögat under Del av ögat.','Läs vad delen gör i rutan under bilden.','Tryck på '+DELKNAPP(ny)+' under Del av ögat.']);
        api.peka('del');
      } else if(!api.gjort(1)){
        api.hint(['Linsen i ögat kan bli tjockare när du tittar nära.','Då hamnar bilden fortfarande på näthinnan.',
          synfel!=='normalt'?'Tryck på Normalt öga under Ögat.':'Tryck på Nära (25 cm) under Titta på.']);
        api.peka(synfel!=='normalt'?'syn':'avst');
      } else if(!api.gjort(2)){
        let sista,p;
        if(synfel!=='narsynt'){ sista='Tryck på Närsynt under Ögat.'; p='syn'; }
        else if(avst!=='lang'){ sista='Tryck på Långt bort under Titta på.'; p='avst'; }
        else { sista='Tryck på Konkav lins under Glasögon.'; p='glas'; }
        api.hint(['Ett närsynt öga är för långt. Ljuset samlas för tidigt.','Närsynta rättas med en lins som sprider ljuset.',sista]);
        api.peka(p);
      } else if(!api.gjort(3)){
        let sista,p;
        if(synfel!=='oversynt'){ sista='Tryck på Översynt under Ögat.'; p='syn'; }
        else if(avst!=='nara'){ sista='Tryck på Nära (25 cm) under Titta på.'; p='avst'; }
        else { sista='Tryck på Konvex lins under Glasögon.'; p='glas'; }
        api.hint(['Ett översynt öga är för kort. Ljuset samlas bakom näthinnan.','Översynta rättas med en lins som samlar ljuset.',sista]);
        api.peka(p);
      } else { api.hint(['Du har gjort alla steg.']); api.peka(null); }
    }
    function DELKNAPP(k){ return {hornhinna:'Hornhinna',pupill:'Pupill',lins:'Lins',nathinna:'Näthinna',synnerv:'Synnerv'}[k]; }

    function kolla(){
      const f=fysik();
      if(!api.gjort(1)&&synfel==='normalt'&&avst==='nara'&&f.skarp){
        const t='Linsen blir tjockare när du tittar nära. Då hamnar bilden fortfarande på näthinnan.';
        api.tips(t,true); api.klar(1,t); }
      if(!api.gjort(2)&&synfel==='narsynt'&&glas==='konkav'&&avst==='lang'&&f.skarp){
        const t='Rätt! En konkav lins sprider ljuset en aning, så att det samlas på näthinnan i stället för framför den.';
        api.tips(t,true); api.klar(2,t); }
      if(!api.gjort(3)&&synfel==='oversynt'&&glas==='konvex'&&avst==='nara'&&f.skarp){
        const t='Rätt! En konvex lins samlar ljuset mer, så att det hamnar på näthinnan i stället för bakom den.';
        api.tips(t,true); api.klar(3,t); }
      synlighet(); hintNu();
    }

    function valtDel(){
      const D=DEL[del]; sedda.add(del);
      api.tips(D.sag);
      if(sedda.size===DELORD.length&&!api.gjort(0)){
        const t='Så ser du: ljus reflekteras från föremålet in i ögat. Det bryts i hornhinnan och linsen och fokuseras på näthinnan. Synnerven skickar bilden till hjärnan.';
        api.tips(t,true); api.klar(0,t); synlighet();
      }
      hintNu();
    }
    function valtSyn(){
      glas='inga'; vGlas.set('inga',true);
      avst=synfel==='oversynt'?'nara':'lang'; vAvst.set(avst,true);
      const tx={
        normalt:'Normalt öga. Ljuset samlas på näthinnan, både långt bort och nära.',
        narsynt:'Närsynt öga. Ögat är för långt, så ljuset samlas för tidigt, framför näthinnan. Långt bort blir det suddigt.',
        oversynt:'Översynt öga. Ögat är för kort, så ljuset samlas bakom näthinnan. Linsen kan bara bli så tjock, så det blir suddigt, särskilt nära.'}[synfel];
      api.tips(tx); kolla();
    }
    function valtAvst(){
      const f=fysik();
      api.tips((avst==='lang'?'Du tittar långt bort. ':'Du tittar nära. ')+(f.dPl>0.5?'Linsen blir tjockare. ':'')+'Bilden hamnar '+bildOrd(f)+'. Det blir '+skarpOrd(f)+'.');
      kolla();
    }
    function valtGlas(){
      const f=fysik();
      api.tips(glas==='inga'?'Inga glasögon. Bilden hamnar '+bildOrd(f)+'.':
        (glas==='konkav'?'Konkav lins. Den sprider ljuset. ':'Konvex lins. Den samlar ljuset. ')+'Bilden hamnar '+bildOrd(f)+'. Det blir '+skarpOrd(f)+'.');
      kolla();
    }
    hintNu();
    api.tips('Tryck på en del av ögat under Del av ögat och läs vad den gör.',true);

    /* ---------- ritning ---------- */
    function ghost(c,rit,px){
      if(px<.8){ rit(0,0); return; }
      c.save();
      for(let i=0;i<12;i++){ const v=i/12*Math.PI*2; c.globalAlpha=.16; rit(Math.cos(v)*px,Math.sin(v)*px); }
      c.globalAlpha=.3; rit(0,0); c.restore();
    }
    function etikettDel(c,k,x,y,till){
      const akt=del===k;
      G.callout(c,x,y,DELKNAPP(k),{till:till,farg:akt?'#FFC95C':'#A3B3C5',font:FM});
    }

    function ritaOga(c,t,lg,f){
      const L=f.L, XR=XL+L*S, XLEFT=XC+8, EX=(XLEFT+XR)/2, AX=(XR-XLEFT)/2, BY=84;
      /* ögonglob */
      G.skugga(c,EX,EY+BY+8,AX*1.05,10,.45);
      const g=c.createRadialGradient(EX-AX*.2,EY-BY*.3,10,EX,EY,AX*1.1);
      g.addColorStop(0,'#1B2D42'); g.addColorStop(1,'#0F1A28');
      c.save(); c.beginPath(); c.ellipse(EX,EY,AX,BY,0,0,Math.PI*2); c.fillStyle=g; c.fill();
      c.strokeStyle='#DCE7F0'; c.lineWidth=3; c.stroke(); c.restore();
      /* näthinna */
      c.save(); c.beginPath(); c.ellipse(EX,EY,AX-2,BY-2,0,-1.05,1.05); c.strokeStyle=del==='nathinna'?'#FFC95C':'#E0707A'; c.lineWidth=del==='nathinna'?7:5; c.lineCap='round'; c.stroke(); c.restore();
      /* synnerv */
      const nx=EX+AX*Math.cos(.42), ny=EY+BY*Math.sin(.42);
      c.save(); c.lineCap='round'; c.beginPath(); c.moveTo(nx-2,ny); c.lineTo(nx+44,ny+26);
      c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=15; c.stroke();
      c.strokeStyle=del==='synnerv'?'#FFC95C':'#F2C879'; c.lineWidth=11; c.stroke(); c.restore();
      /* iris och pupill */
      const kant=Math.min(BY-2,BY*Math.sqrt(Math.max(0,1-Math.pow((EX-(XL-5))/AX,2))));
      c.save(); c.lineCap='round';
      [[EY-RP*S-2,EY-kant],[EY+RP*S+2,EY+kant]].forEach(p=>{ c.beginPath(); c.moveTo(XL-5,p[0]); c.lineTo(XL-5,p[1]);
        c.strokeStyle=del==='pupill'?'#FFC95C':'#8A6A44'; c.lineWidth=7; c.stroke(); });
      c.restore();
      /* lins: tjockleken visar hur mycket ögat anpassar sig */
      const tj=4+7*clamp(f.dPl/AMAX,0,1);
      c.save(); c.beginPath(); c.moveTo(XL,EY-38); c.quadraticCurveTo(XL+tj*2,EY,XL,EY+38); c.quadraticCurveTo(XL-tj*2,EY,XL,EY-38);
      c.fillStyle='rgba(120,200,235,.34)'; c.fill(); c.strokeStyle=del==='lins'?'#FFC95C':'#7FD8F0'; c.lineWidth=del==='lins'?4:2.5; c.stroke(); c.restore();
      /* hornhinna */
      c.save(); c.beginPath(); c.moveTo(XC+16,EY-34); c.quadraticCurveTo(XC-12,EY,XC+16,EY+34);
      c.fillStyle='rgba(190,230,255,.22)'; c.fill(); c.strokeStyle=del==='hornhinna'?'#FFC95C':'rgba(200,235,255,.95)'; c.lineWidth=del==='hornhinna'?5:3; c.stroke(); c.restore();
      return {XR:XR,EX:EX,AX:AX,nx:nx,ny:ny};
    }

    function glasogon(c){
      if(synfel==='normalt'||glas==='inga') return;
      const konkav=glas==='konkav', hh=62;
      G.glas(c,cc=>{
        if(!konkav){ cc.moveTo(XG,EY-hh); cc.quadraticCurveTo(XG+20,EY,XG,EY+hh); cc.quadraticCurveTo(XG-20,EY,XG,EY-hh); }
        else { cc.moveTo(XG-10,EY-hh); cc.lineTo(XG+10,EY-hh); cc.quadraticCurveTo(XG-5,EY,XG+10,EY+hh); cc.lineTo(XG-10,EY+hh); cc.quadraticCurveTo(XG+5,EY,XG-10,EY-hh); }
      },{fyll:'rgba(92,225,230,.18)',kant:'#5CE1E6',bredd:2.6,hx:XG-30,hy:EY-60});
      G.linje(c,XG,EY-hh,XG-8,EY-hh-14,'#9DAFC4',3); G.linje(c,XG,EY+hh,XG-8,EY+hh+14,'#9DAFC4',3);
    }

    function ritaStralar(c,t,lg,f,o){
      const XR=o.XR, rays=f.rays;
      rays.forEach((r,i)=>{
        const ystart=r.y0+r.m0*((XS-XG)/S);
        const pts=[[XS,pxY(ystart)],[XG,pxY(r.y0)],[XC,pxY(r.yc)],[XL,pxY(r.yl)],[XR,pxY(r.yr)]];
        c.save(); c.shadowColor=A; c.shadowBlur=9; c.lineJoin='round'; c.beginPath();
        pts.forEach((p,k)=>k?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
        c.strokeStyle='#FFE9A6'; c.lineWidth=2.4; c.stroke(); c.restore();
        if(f.delta>0.15&&isFinite(f.b)){          // fortsätter bakom näthinnan
          const xf=XL+f.b*S;
          c.save(); c.setLineDash([5,5]); c.beginPath(); c.moveTo(XR,pxY(r.yr)); c.lineTo(xf,EY);
          c.strokeStyle='rgba(255,233,166,.55)'; c.lineWidth=1.8; c.stroke(); c.restore();
        }
      });
      /* brännpunkten (fokus) */
      const xf=XL+Math.min(f.b,L0*3)*S;
      G.glod(c,xf,EY,18,'#FFD166',.9); G.cirkel(c,xf,EY,4,'#FFF3C4');
      G.callout(c,Math.min(xf+50,452),EY-44,'Fokus',{till:[xf,EY-3],farg:'#FFD166',font:FM});
      /* ljusfläck på näthinnan */
      const rad=3+f.r*S*1.6;
      G.glod(c,XR,EY,16+rad*2.2,'#FFE9A6',f.skarp?1:.55);
      if(f.skarp) G.cirkel(c,XR,EY,3.2,'#FFFFFF');
    }

    function ritaObjekt(c,f){
      G.rund(c,30,EY-26,28,52,5,'#EEF3F7','#9DAFC4',1.5);
      G.text(c,'E',44,EY+13,{a:'center',f:'#0A1220',font:'800 34px "Atkinson Hyperlegible", Verdana, sans-serif',skugga:false});
      G.text(c,avst==='lang'?'Långt bort':'Nära, 25 cm',44,EY+46,{a:'center',f:'#DCE7F0',font:FM});
      G.text(c,'ej i skala',44,EY+62,{a:'center',f:'#9DAFC4',font:F_LITEN});
    }

    function ritaPaneler(c,f){
      /* så ser du */
      G.bricka(c,470,8,160,98,{titel:'SÅ SER DU',farg:f.skarp?'#7BD389':A});
      c.save(); c.beginPath(); c.rect(472,24,156,80); c.clip();
      ghost(c,(dx,dy)=>G.text(c,'E',550+dx,90+dy,{a:'center',f:'#F4F8FB',font:'800 66px "Atkinson Hyperlegible", Verdana, sans-serif',skugga:false}),clamp(f.r*14,0,10));
      c.restore();
      /* mätvärden */
      G.bricka(c,470,112,160,152,{titel:'MÄTVÄRDEN',farg:A});
      const pa=Math.abs(f.delta)<0.15;
      G.text(c,'Bilden hamnar',482,144,{f:'#A3B3C5',font:F_LITEN});
      G.text(c,pa?'på näthinnan':dec(Math.abs(f.delta),1)+' mm '+(f.delta<0?'framför':'bakom'),482,163,{f:pa?'#7BD389':'#FF8A5B',font:FM});
      if(!pa) G.text(c,'näthinnan',482,179,{f:'#FF8A5B',font:FM});
      G.text(c,'Skärpa: '+f.pct+' %',482,200,{f:'#A3B3C5',font:F_LITEN});
      G.stapel(c,482,206,136,10,f.pct/100,f.skarp?'#7BD389':'#FFB36B',{bakgrund:'#16222F'});
      G.text(c,'Linsen blir tjockare',482,236,{f:'#A3B3C5',font:F_LITEN});
      G.stapel(c,482,242,136,8,clamp(f.dPl/AMAX,0,1),A,{bakgrund:'#16222F'});
      for(let i=0;i<4;i++){ const gj=api.gjort(i), bx=470+i*41;
        G.rund(c,bx,270,36,26,7,gj?'rgba(123,211,137,.22)':'rgba(42,60,79,.55)',gj?'#7BD389':'#2A3C4F',1.5);
        G.text(c,gj?'✓':String(i+1),bx+18,287,{a:'center',f:gj?'#7BD389':'#A3B3C5',font:FM}); }
    }

    function passa(c,t,x,y,maxW,f,storst){        // text som krymper (till 11 px) tills den ryms
      let px=storst||14, fn;
      for(;px>=11;px-=.5){ fn='700 '+px+'px "Atkinson Hyperlegible", Verdana, sans-serif'; c.font=fn; if(c.measureText(t).width<=maxW) break; }
      G.text(c,t,x,y,{f:f,font:fn,skugga:false});
    }
    function ritaBar(c,f){
      G.bricka(c,8,268,452,84,{farg:A});
      if(del){
        const D=DEL[del];
        G.text(c,D.namn.toUpperCase(),20,288,{f:'#FFC95C',font:F_RUB,skugga:false});
        passa(c,D.rad[0],20,308,428,'#EEF3F7',14);
        passa(c,D.rad[1],20,326,428,'#EEF3F7',14);
      } else {
        const rubrik={normalt:'NORMALT ÖGA',narsynt:'NÄRSYNT ÖGA · ögat är för långt',oversynt:'ÖVERSYNT ÖGA · ögat är för kort'}[synfel];
        G.text(c,rubrik,20,288,{f:synfel==='normalt'?'#7BD389':'#FFC95C',font:F_RUB,skugga:false});
        const rad={
          normalt:['Ljuset samlas på näthinnan, både långt bort och nära.','Linsen blir tjockare när du tittar nära.'],
          narsynt:['Ljuset samlas för tidigt, framför näthinnan.','Rättas med en konkav lins (negativ lins, spridningslins).'],
          oversynt:['Ljuset samlas bakom näthinnan. Linsen kan inte bli tjock nog.','Rättas med en konvex lins (positiv lins, samlingslins).']}[synfel];
        passa(c,rad[0],20,308,428,'#EEF3F7',14);
        passa(c,rad[1],20,326,428,'#EEF3F7',14);
      }
      passa(c,'Tryck på knapparna för att välja del, synfel och glasögon.',20,344,428,'#9DAFC4',12);
    }

    return {rita(c,t,dt){
      const lg=lugn(), f=fysik();
      G.scen(c,{topp:'#070C12',botten:'#0E1621',rutnat:false,vinjett:true});
      ritaObjekt(c,f);
      const o=ritaOga(c,t,lg,f);
      glasogon(c);
      ritaStralar(c,t,lg,f,o);
      /* delarnas namn */
      etikettDel(c,'hornhinna',128,56,[XC-4,EY-26]);
      etikettDel(c,'pupill',214,20,[XL-5,EY-RP*S-10]);
      etikettDel(c,'lins',262,54,[XL+1,EY-34]);
      etikettDel(c,'nathinna',o.XR-6,22,[o.XR-3,EY-50]);
      etikettDel(c,'synnerv',o.nx+16,o.ny+72,[o.nx+30,o.ny+19]);
      if(synfel==='normalt'||glas==='inga'){} else G.callout(c,XG,EY+90,'Glasögon',{till:[XG,EY+48],farg:'#5CE1E6',font:FM});
      if(synfel!=='normalt') G.callout(c,XL+28,EY+112,synfel==='narsynt'?'Ögat är för långt':'Ögat är för kort',{farg:'#FFC95C',font:FM});
      ritaPaneler(c,f); ritaBar(c,f);
      api.satt('syn',{normalt:'Normalt',narsynt:'Närsynt (för långt)',oversynt:'Översynt (för kort)'}[synfel]);
      api.satt('bild',bildOrd(f));
      api.satt('skarpa',skarpOrd(f)+' ('+f.pct+' %)');
      api.satt('lins',f.dPl<.3?'slapp och tunn':f.dPl>=AMAX-.05?'så tjock den kan bli':'tjockare');
      if(api.gjort(0)&&api.gjort(1)&&api.gjort(2)&&api.gjort(3)) G.rund(c,2,2,CW-4,CH-4,14,null,'#7BD389',3);
    }};
  }
};
/* ---------------------------------------------------------------

   MAL = Skolverkets centrala innehåll i fysik för årskurs 7–9 (Lgr22),
   ordagrant. Varje punkt är kopplad till de rum som tränar den.
   --------------------------------------------------------------- */
const MAL = [
  { id:'m1', kort:'Universum och exoplaneter', rum:[9],
    text:'Universums uppkomst, uppbyggnad och utveckling samt förutsättningar för att finna planeter och liv i andra solsystem.' },
  { id:'m2', kort:'Partiklar, tryck och densitet', rum:[1],
    text:'Partikelmodell av materiens egenskaper samt fasövergångar, tryck, volym, densitet och temperatur.' },
  { id:'m3', kort:'Strålningsbalans och klimat', rum:[8],
    text:'Fysikaliska förklaringsmodeller av jordens strålningsbalans, växthuseffekten och klimatförändringar.' },
  { id:'m4', kort:'Energi och energikällor', rum:[5],
    text:'Energins flöde och oförstörbarhet samt olika energislags kvalitet. Olika typer av energikällor samt deras för- och nackdelar för samhället och miljön.' },
  { id:'m5', kort:'Strålning och dess risker', rum:[7,3],
    text:'Partikelstrålning och elektromagnetisk strålning, deras användningsområden och risker.' },
  { id:'m6', kort:'Ljus', rum:[3,12],
    text:'Hur ljus breder ut sig, reflekteras och bryts.' },
  { id:'m7', kort:'Ljud', rum:[6],

    nyckelord:['560 − 380 = 180 g','vatten 1 g/cm³','volym = massa delat med densitet','180 cm³'] },
  { id:'mu-densitet-7', omrade:'materia', delmoment:'densitet',

    borja:'Jag räknar ut densiteten för …',

    nyckelord:['massa delat med volym','8,5, 7,8 och 2,7 g/cm³','densitetstabell','mässing, järn/stål, aluminium'] },

  { id:'mu-tryck-2', omrade:'materia', delmoment:'tryck',

  { id:'mu-tryck-3', omrade:'materia', delmoment:'tryck',

  /* ---- kraft: Massa, tyngd och kraft ---- */
  { id:'mu-kraft-1', omrade:'materia', delmoment:'kraft',

    borja:'Massa är mängden …',

    nyckelord:['massa = mängd materia','vikt = massa, gram','tyngd = kraft som drar neråt','newton','gravitation'] },
  { id:'mu-kraft-2', omrade:'materia', delmoment:'kraft',
    fraga:'Ett bord har massan 15 kilogram. Hur stor är dess tyngd, och hur räknar du?',

    svar:'Hundra gram dras ner med kraften en newton på jorden. Ett kilogram är tusen gram, alltså tio gånger så mycket, och det ger tio newton. Då blir tyngden för 15 kilogram tio gånger 15, alltså 150 newton.',
    nyckelord:['100 g = 1 N','1 kg = 10 N','15 × 10','150 N'] },
  { id:'mu-kraft-3', omrade:'materia', delmoment:'kraft',
    fraga:'Du hänger en vikt på 50 gram och en vikt på 100 gram i en dynamometer samtidigt. Vad visar den?',
    borja:'En dynamometer mäter …',
    svar:'En dynamometer mäter kraft i newton. Hundra gram ger en newton, och 50 gram ger en halv newton. Tillsammans är massan 150 gram. Dynamometern visar då 1,5 newton.',

  { id:'mu-kraft-4', omrade:'materia', delmoment:'kraft',
    fraga:'Varför kan man hoppa högre på månen än på jorden? Vad händer med massan?',
    borja:'Månen har svagare …',
    svar:'Månen har svagare gravitation än jorden, ungefär en sjättedel. Därför blir tyngden mindre där. En person med massan 60 kilogram har tyngden 600 newton på jorden och ungefär 100 newton på månen. Massan är fortfarande 60 kilogram.',
    nyckelord:['svagare gravitation','mindre tyngd','massan är samma','600 N → ca 100 N'] },
  { id:'mu-kraft-5', omrade:'materia', delmoment:'kraft',
    fraga:'Vad menas med att en astronaut är tyngdlös, och vad händer med astronautens massa?',
    borja:'Tyngdlös betyder att man …',
    svar:'Tyngdlös betyder att man inte påverkas av någon gravitation, eller att man faller fritt så att man inte känner någon tyngd. Det händer långt ute i rymden, och i en rymdstation som cirklar runt jorden. Astronauten har precis lika stor massa som på jorden. Massan är mängden materia, och den ändras inte.',
    nyckelord:['påverkas inte av gravitation / känner ingen tyngd','samma massa som tidigare','massa = mängd materia','tyngd är inte samma sak som massa'] },

  /* ---- krafttyper: Olika sorters krafter ---- */
  { id:'mu-krafttyper-1', omrade:'materia', delmoment:'krafttyper',
    fraga:'Förklara vad tyngdkraft och normalkraft är. Hur är de när du står still på golvet?',
    borja:'Tyngdkraften, eller gravitationen, är …',
    svar:'Tyngdkraften, eller gravitationen, är kraften som drar mig neråt. Normalkraften är kraften som golvet trycker uppåt på mig med. När jag står still är de lika stora. Därför ramlar jag inte genom golvet.',
    nyckelord:['tyngdkraft / gravitation – neråt','normalkraft – uppåt','lika stora','golvet håller dig uppe'] },
  { id:'mu-krafttyper-2', omrade:'materia', delmoment:'krafttyper',
    fraga:'En bok med massan 2 kilogram ligger stilla på ett bord. Vilka krafter verkar på boken, och hur stora är de?',
    borja:'Tyngdkraften drar boken …',
    svar:'Tyngdkraften drar boken neråt. Två kilogram ger tyngdkraften 20 newton. Bordet trycker upp på boken med normalkraften, och den är också 20 newton. De är lika stora och motsatta, så nettokraften blir noll och boken ligger stilla.',
    nyckelord:['tyngdkraft 20 N neråt','normalkraft 20 N uppåt','lika stora','nettokraft noll'] },
  { id:'mu-krafttyper-3', omrade:'materia', delmoment:'krafttyper',
    fraga:'Vad är dragkraft och tryckkraft? Ge exempel, och berätta vad krafter kan göra med ett föremål.',
    borja:'Dragkraft och tryckkraft använder jag när …',
    svar:'Dragkraft och tryckkraft använder jag när jag drar eller trycker, till exempel när jag öppnar och stänger en dörr. Krafter påverkar materia. De kan sätta saker i rörelse, stoppa dem eller ändra riktningen. De kan också ändra formen på något, som när jag trycker ihop en svamp.',
    nyckelord:['dragkraft och tryckkraft','öppna och stänga dörrar','muskelkraft','krafter påverkar materia','krafter styr rörelser'] },

  /* ---- friktion: Friktion och luftmotstånd ---- */
  { id:'mu-friktion-1', omrade:'materia', delmoment:'friktion',
    fraga:'Förklara vad friktion är, och ge exempel på mycket och lite friktion.',
    borja:'Friktion är kraften mellan …',
    svar:'Friktion är kraften mellan två ytor som gnids mot varandra. Mycket friktion ger dåligt glid, till exempel sandpapper, bromsar och vinterdäck. Lite friktion ger bra glid, till exempel slipade skridskor, vallade skidor och rutschkanor. Friktionen motverkar rörelsen.',
    nyckelord:['kraft mellan två ytor','mycket friktion = dåligt glid','lite friktion = bra glid','sandpapper, bromsar, vinterdäck','skridskor, skidor, rutschkana'] },
  { id:'mu-friktion-2', omrade:'materia', delmoment:'friktion',
    fraga:'Du ska flytta en låda längs golvet. Hur kan du öka, och hur kan du minska, kraften som behövs?',
    borja:'Kraften blir större om …',
    svar:'Mer massa i lådan, till exempel en blycylinder, pressar den hårdare mot golvet och ger mer friktion. Ett grovt underlag ger också mer friktion. Jag minskar kraften genom att ta bort massa, använda ett slätt eller smort underlag eller sätta hjul under lådan.',
    nyckelord:['tyngre låda = mer friktion','grövre underlag','slätt underlag','hjul eller smörjning'] },
  { id:'mu-friktion-3', omrade:'materia', delmoment:'friktion',
    fraga:'Vad betyder hög friktion för motståndet och glidet? Förklara med vinterdäck och skridskor.',
    borja:'Hög friktion betyder …',
    svar:'Hög friktion betyder stort motstånd och dåligt glid. Ett vinterdäck ska ha hög friktion, så att bilen får grepp på snö och is och kan bromsa. En skridsko ska ha låg friktion, så att den glider lätt på isen. Hög friktion är alltså inte lite motstånd, utan stort motstånd.',
    nyckelord:['hög friktion = stort motstånd','dåligt glid','vinterdäck – mycket friktion','skridskor – lite friktion'] },
  { id:'mu-friktion-4', omrade:'materia', delmoment:'friktion',
    fraga:'Vad är luftmotstånd, och hur kan en cyklist minska det?',
    borja:'Luftmotstånd är en kraft som …',
    svar:'Luftmotstånd är en kraft som luften ger mot något som rör sig genom den, och den bromsar rörelsen. Det blir större ju snabbare jag åker och ju större yta som möter luften. Cyklisten kan huka sig ner och ha tajta kläder. Då möter cyklisten mindre luft och får mindre luftmotstånd.',
    nyckelord:['luftmotstånd bromsar','större yta ger mer','högre fart ger mer','huka sig ner'] },

    borja:'Ett föremål som är stilla …',

    nyckelord:['stilla förblir stilla','rörelse fortsätter','tills en kraft påverkar','tröghet'] },
  { id:'mu-tregheten-2', omrade:'materia', delmoment:'tregheten',
    fraga:'Varför ska man ha bilbälte? Förklara med tröghet.',
    borja:'När bilen bromsar tvärt …',
    svar:'När bilen bromsar tvärt fortsätter kroppen framåt med samma fart, för den är trög. Utan bälte slungas man mot rutan eller instrumentbrädan. Bältet ger en kraft bakåt som stoppar kroppen tillsammans med bilen. Därför räddar bältet liv.',
    nyckelord:['bilen stannar, kroppen fortsätter','trögheten','bältet ger en kraft','kraft som stoppar'] },
  { id:'mu-tregheten-3', omrade:'materia', delmoment:'tregheten',
    fraga:'Du rycker snabbt bort en duk under glas på ett bord, och glasen blir kvar. Varför?',

    svar:'Glasen är stilla och vill fortsätta vara stilla, för de är tröga. När duken rycks bort snabbt hinner friktionen mellan duk och glas inte flytta dem. Därför blir glasen kvar på bordet. Det funkar bara om rycket är riktigt snabbt.',
    nyckelord:['stilla föremål förblir stilla','trögheten','snabbt ryck','kort tid för friktionen'] },
  { id:'mu-tregheten-4', omrade:'materia', delmoment:'tregheten',
    fraga:'Varför är det svårare att få igång en full kundvagn än en tom? Vad har massan med tröghet att göra?',
    borja:'Större massa ger …',
    svar:'Större massa ger större tröghet. En full kundvagn är tröggare, så det krävs mer kraft för att få igång den och för att stoppa den. En tom vagn har mindre massa och mindre tröghet. Den är lättare att sätta i rörelse och att stoppa.',
    nyckelord:['större massa, större tröghet','mer kraft behövs','svårare att starta och stoppa'] },

  /* ---- nettokraft: Nettokraft och resultant ---- */

  { id:'mu-nettokraft-3', omrade:'materia', delmoment:'nettokraft',

  { id:'mu-nettokraft-4', omrade:'materia', delmoment:'nettokraft',

  { id:'mu-nettokraft-5', omrade:'materia', delmoment:'nettokraft',

  /* ---- rorelse: Hastighet och rörelse ---- */

    borja:'Stoppsträckan är hela sträckan …',
    svar:'Stoppsträckan är hela sträckan en bil rullar från att föraren ser faran tills bilen står still. Den är reaktionssträckan plus bromssträckan. Reaktionssträckan är sträckan bilen hinner medan föraren reagerar. Bromssträckan är sträckan medan bilen bromsar.',
    nyckelord:['stoppsträcka','reaktionssträcka','bromssträcka','reaktionstid'] },
  { id:'mu-trafik-2', omrade:'materia', delmoment:'trafik',

    nyckelord:['reaktionssträcka = fart × reaktionstid','10 m/s i 1 s = 10 m','dubbel fart: dubbel reaktionssträcka','bromssträckan 4 gånger så lång'] },
  { id:'mu-trafik-3', omrade:'materia', delmoment:'trafik',

  { id:'mu-trafik-4', omrade:'materia', delmoment:'trafik',

    nyckelord:['reaktionssträcka = fart × reaktionstid','1 s: 20 m','2 s: 40 m','20 m längre','mobilen ger längre reaktionstid'] },

  { id:'mu-havstang-5', omrade:'materia', delmoment:'havstang',

    borja:'Optiken handlar om …',

  { id:'mu-ljuskallor-3', omrade:'optik', delmoment:'ljuskallor',

  { id:'mu-ljuskallor-4', omrade:'optik', delmoment:'ljuskallor',
    fraga:'Vad betyder orden reflektera och absorbera?',
    borja:'Att reflektera betyder att …',
    svar:'Att reflektera betyder att studsa mot. Ljus som träffar en yta kan studsa tillbaka. Att absorbera betyder att dra åt sig eller suga till sig. Ljus som inte reflekteras absorberas, och då blir ytan varmare.',
    nyckelord:['reflektera = studsa mot','absorbera = dra åt sig','ljus som inte reflekteras absorberas'] },
  { id:'mu-ljuskallor-5', omrade:'optik', delmoment:'ljuskallor',
    fraga:'Varför syns en vit jacka bättre i mörker än en svart jacka, och hur fungerar en reflex?',

    borja:'Ljuset sprids av …',

  { id:'mu-utbredning-3', omrade:'optik', delmoment:'utbredning',
    fraga:'En liten lampa sitter 1 meter från en vägg. Ett föremål, 10 centimeter högt, hålls 0,5 meter från lampan. Hur stor blir skuggan, och vad händer om du flyttar föremålet närmare väggen?',

    nyckelord:['liten ljuskälla – skarp skugga','stor ljuskälla – halvskugga','ljus från många ställen','suddig kant'] },

         'Lyssna kan du få texten uppläst. I menyn väljer du röst, fart och textstorlek.' },
];
function visaCoach(i){
  if(i>=COACH.length){
    spar.coachSedd = true; spara();
    document.querySelector('.coach') && document.querySelector('.coach').remove();
    las('Nu kör vi! Tryck på Fortsätt eller välj första rummet.');
    return;
  }
  const c = COACH[i];
  let el = document.querySelector('.coach');
  if(!el){ el = document.createElement('div'); el.className='coach'; document.body.appendChild(el); }
  el.innerHTML = '<div class="coachkort">'+
    '<p class="etikett" style="color:var(--guld)">Snabbintroduktion '+(i+1)+' av '+COACH.length+'</p>'+
    '<h2>'+esc(c.rubrik)+'</h2><p style="margin-top:8px">'+esc(c.text)+'</p>'+
    '<div class="coachpunkter">'+COACH.map((_,k)=>'<i class="'+(k===i?'nu':'')+'"></i>').join('')+'</div>'+
    '<div class="rad"><button class="knapp primar" id="cNasta">'+(i===COACH.length-1?'Kör igång!':'Nästa →')+'</button>'+
    '<button class="knapp" id="cHoppa">Hoppa över</button></div></div>';
  las(c.rubrik+'. '+c.text);
  el.querySelector('#cNasta').onclick = () => { ljudKlick(); visaCoach(i+1); };
  el.querySelector('#cHoppa').onclick = () => { ljudKlick(); visaCoach(COACH.length); };
  el.querySelector('#cNasta').focus({preventScroll:true});
}

const ljudknapp = $('#ljudknapp');
function visaLjudknapp(){
  ljudknapp.setAttribute('aria-pressed', String(spar.tal));
  ljudknapp.textContent = spar.tal ? '🔊' : '🔇';
  ljudknapp.title = spar.tal ? 'Uppläsning är på' : 'Uppläsning är av';
}
ljudknapp.onclick = () => {
  spar.tal = !spar.tal; spara(); visaLjudknapp(); tyst();
  if(spar.tal) las('Uppläsning på.');
};
$('#menyknapp').onclick = () => overlagg.classList.contains('dold') ? visaMeny() : dolj();
$('#hemknapp').onclick = () => { dolj(); visaLabbet(); };
addEventListener('keydown', e => {
  if(e.key==='Escape'){
    if(!overlagg.classList.contains('dold')) dolj();
    else if(lage.vy!=='labbet') visaLabbet();
  }
});
