      if(S.glid){
        const o=((skrol%70)+70)%70;
        for(let x=-70+o;x<CW+70;x+=70) G.rekt(c,x,GY+9,30,4,'rgba(238,243,247,.38)');
      }

      let bx=cx, ay;
      if(sc==='drag'){
        ay=150;
        G.linje(c,cx,GY-84,cx,GY+2,'rgba(238,243,247,.3)',1.5,[4,5]);
        G.text(c,'mitten',cx,GY+16,{a:'center',font:F_LITEN,f:'#A3B3C5'});
        [64,100,136].forEach(x=>lag(c,x,-.25,KV));
        [504,540,576].forEach(x=>lag(c,x,.25,KH));
        G.ror(c,[[56,GY-35],[584,GY-35]],5,'#E0944A');
        G.linje(c,fx,GY-35,fx,GY-76,'#DCE7F0',2.5);
        G.poly(c,[[fx,GY-76],[fx+26,GY-68],[fx,GY-60]],KN,'rgba(7,12,18,.7)',1.2);
        G.linje(c,fx,GY-78,fx,ay,KN,1.4,[4,3]);
        bx=fx;
        lagpil(c,fx+10,ay,1,H,KH,S.hn,'left');
        lagpil(c,fx-10,ay,-1,V,KV,S.vn,'right');
      } else {
        ay = sc==='bil' ? GY-39 : GY-22;
        if(sc==='bil') bil(c,cx); else pulka(c,cx);
        lagpil(c,cx+86,ay,1,H,KH,S.hn,'left');
        lagpil(c,cx-(sc==='bil'?86:74),ay,-1,V,KV,S.vn,'right');
      }

      /* nettokraften */
      const nl=langd(Math.abs(n)), ny=292, dir=n>=0?1:-1;
      if(n===0){
        G.cirkel(c,bx,ny,14,'rgba(111,214,138,.22)',KB,2.5);
        G.text(c,'0',bx,ny+5,{a:'center',f:KB,font:F_BROD,skugga:false});
        G.callout(c,bx,ny+27,'Nettokraft 0 N: balans',{till:[bx,ny+14],farg:KB});
      } else {
        G.pil(c,bx,ny,bx+dir*nl,ny,KN,7);

        G.callout(c,lx,ny+27,'Nettokraft '+fN(Math.abs(n))+(n>0?' åt höger':' åt vänster'),{till:[bx+dir*nl/2,ny+4],farg:KN});
      }

      const text = n===0 ? (sc==='drag'?'Lika starka lag. Ingen vinner mark.':'Krafterna är lika stora. Rörelsen ändras inte.')
        : sc==='drag' ? 'Laget till '+(n>0?'höger':'vänster')+' drar hårdast. Flaggan flyttas åt '+(n>0?'höger':'vänster')+'.'
        : sc==='bil' ? 'Nettokraften åt höger: bilen ökar farten framåt.'
        : 'Nettokraften åt höger: pulkan ökar farten framåt.';
      G.etikett(c,text,320,348,{f:'#EEF3F7',kant:nf,font:F_BROD});

      /* mätarrutor överst */
      [[10,S.tV,fN(V),KV],[222,'NETTOKRAFT',fN(Math.abs(n)),nf],[434,S.tH,fN(H),KH]].forEach((b,j)=>{
        G.bricka(c,b[0],6,196,56,{titel:b[1],farg:b[3]});
        G.digit(c,b[2],b[0]+98,52,{farg:b[3],storlek:22,a:'center'});
      });
      if(n!==0) G.text(c,n>0?'åt höger':'åt vänster',222+188,52,{a:'right',font:F_LITEN,f:KN,skugga:false});
      if(n===0) G.glod(c,320,34,60,KB,.45);
    }};
  }
};
/* Tröghet – lärarens formulering: stilla föremål fortsätter vara stilla och föremål som rör sig fortsätter röra sig tills en kraft påverkar dem.
   Tre försök: dukdrag, vagn med och utan bälte, tung och lätt kloss.
   Förenklingar: allt rör sig i sidled, farten visas inte skalenligt, och i kloss-försöket finns ingen friktion (som på en luftkuddebana). */
EXP.tregheten={
  namn:'Tröghet',
  intro:'Tröghet betyder att något fortsätter som förut tills en kraft ändrar det. Stilla saker vill stå still och rörliga saker vill fortsätta röra sig. Du gör tre förenklade försök.',
  steg:['Dra duken med ett snabbt ryck så att glaset blir stående.','Kör vagnen mot stoppklossen utan bälte och sedan med bälte.','Putta klossarna med samma kraft och se vilken som får högst fart.'],
  fraga:['Varför flyger dockan framåt när vagnen stannar tvärt, utan bälte?',
    ['Ingen kraft stoppar dockan, så den fortsätter framåt','Vagnen drar dockan framåt med en stor kraft','Dockan blir tyngre i samma stund som vagnen stannar','Tyngdkraften trycker dockan framåt när vagnen stannar'],
    'Något som rör sig fortsätter röra sig tills en kraft stoppar det. Det är tröghet, och bältet är kraften som stoppar dockan.'],
  bygg(api){
    const AK=api.farg;
    const GRUPP={duk:['ryck','dra'],vagn:['balte','kor'],kloss:['tung','putta']};
    const KLAR_TID=3.2;                       // sekunder som resultatet står kvar innan försöket ställs tillbaka
    const f1=v=>{ const r=Math.round(v*10)/10; return Number.isInteger(r)?String(r):dec(r,1); };
    let del='duk', ryck=2, balte='utan', tung=10;
    const gjort={duk:false,utan:false,med:false,latt:false};
    let lastRes={duk:'',vagn:'',kloss:''};

    /* ---------- reglage ---------- */
    api.avlas('del','Försök'); api.avlas('inst','Inställning'); api.avlas('res','Resultat');
    api.val({id:'del',etikett:'Försök',varde:del,alt:[['duk','Dukdrag'],['vagn','Vagn'],['kloss','Kloss']],vid:v=>{ del=v; byt(); }});
    api.slider({id:'ryck',etikett:'Ryckets fart',min:1,max:10,steg:1,varde:ryck,
      fmt:v=>v+(v<=3?' (långsamt)':v>=8?' (snabbt)':''),vid:v=>{ ryck=v; if(D.fas==='klar') nyD(); status(); vagled(); }});
    const knDra=api.knapp({id:'dra',text:'Dra i duken',primar:true,vid:()=>dra()});
    api.val({id:'balte',etikett:'Bälte',varde:balte,alt:[['utan','Utan bälte'],['med','Med bälte']],vid:v=>{ balte=v; if(W.fas==='klar'||W.fas==='vilar') nyW(); status(); vagled(); }});
    const knKor=api.knapp({id:'kor',text:'Kör vagnen',primar:true,vid:()=>kor()});
    api.val({id:'tung',etikett:'Massan på den tunga klossen',varde:tung,alt:[[5,'5 kg'],[10,'10 kg'],[20,'20 kg']],vid:v=>{ tung=+v; if(K.fas==='klar'||K.fas==='vilar') nyK(); status(); vagled(); }});
    const knPutta=api.knapp({id:'putta',text:'Putta klossarna',primar:true,vid:()=>putta()});

    function byt(){
      Object.keys(GRUPP).forEach(k=>GRUPP[k].forEach(id=>{
        const el=api.reglage.querySelector('[data-ctl="'+id+'"]'); if(el) el.style.display=(k===del?'':'none'); }));
      nyD(); nyW(); nyK();
      status(); vagled();
      api.tips(del==='duk'?'Glaset står på en duk. Dra duken åt höger med reglaget och knappen.'
        : del==='vagn'?'Vagnen kör mot en stoppkloss. Dockan sitter lös i vagnen eller med bälte.'
        : 'Två klossar, en lätt och en tung. Båda får samma putt.',true);
    }
    function status(){
      api.satt('del',del==='duk'?'Dukdrag':del==='vagn'?'Vagn':'Kloss');
      api.satt('inst',del==='duk'?'Ryckets fart '+ryck:del==='vagn'?(balte==='utan'?'Utan bälte':'Med bälte'):'Tung kloss '+tung+' kg');
      api.satt('res',lastRes[del]||'–');
    }

    /* ---------- steg och hjälp ---------- */
    function kollaSteg(){
      if(gjort.duk) api.klar(0,'Ett snabbt ryck hinner knappt flytta glaset. Glaset vill stå still. Det är trögheten.');
      if(gjort.utan&&gjort.med) api.klar(1,'Utan bälte fortsätter dockan framåt när vagnen stannar. Bältet är kraften som stoppar den.');
      if(gjort.latt) api.klar(2,'Samma kraft ger den tunga klossen mycket lägre fart. Större massa ger större tröghet.');
      vagled();
    }
    function vagled(){
      const i=[0,1,2].find(k=>!api.gjort(k));
      if(i===undefined){ api.peka(null); return; }
      if(i===0){
        api.peka(del!=='duk'?'del':ryck!==10?'ryck':'dra');
        api.hint(['Testa gärna först ett långsamt drag och se vad glaset gör.',
          'Ett snabbt ryck hinner knappt flytta glaset. Det är trögheten.',
          (del!=='duk' ? 'Tryck på Dukdrag under Försök. ' : '')+(ryck!==10 ? 'Dra reglaget Ryckets fart till 10, längst till höger. ' : '')+'Tryck på Dra i duken.']);
      } else if(i===1){
        const sak=!gjort.utan?'utan':'med', namn=sak==='utan'?'Utan bälte':'Med bälte';
        api.peka(del!=='vagn'?'del':balte!==sak?'balte':'kor');
        api.hint([!gjort.utan&&!gjort.med ? 'Du kör två gånger: först utan bälte, sedan med bälte.' : 'Nu fattas körningen '+namn.toLowerCase()+'.',
          'Titta på vad dockan gör när vagnen stannar.',
          (del!=='vagn'?'Tryck på Vagn under Försök. ':'')+'Välj '+namn+' under Bälte. Tryck på Kör vagnen.']);
      } else {
        api.peka(del!=='kloss'?'del':'putta');
        api.hint(['Båda klossarna får exakt samma putt.',
          'Titta på hur snabbt var och en glider efter putten.',
          (del!=='kloss'?'Tryck på Kloss under Försök. ':'')+'Tryck på Putta klossarna.']);
      }
    }

    /* ======================================================
       DEL 1: DUKDRAG
       ====================================================== */
    const FL=330, TY=236, TX0=100, TX1=430, GX0=230, CL0=150, CR0=380;
    const AC=300, AT=200;                    // glasets acceleration av duken och inbromsning mot bordet (px/s²)
    let D;
    function nyD(){
      D={fas:'vilar',cl:CL0,cr:CR0,gx:GX0,gv:0,gy:0,gvy:0,rot:0,fall:false,landat:false,vc:0,tk:0,t:0,tklar:0,
         kontakt:false,slosh:0,duksl:0,utfall:'',cmm:0};
      knDra.disabled=false;
    }
    nyD();
    const rynckFart=s=>100+(s-1)*60;
    function dra(){
      if(del!=='duk') return;
      if(D.fas==='drar') return;
      if(D.fas!=='vilar') nyD();
      D.fas='drar'; D.vc=rynckFart(ryck); knDra.disabled=true;
      api.tips('Du drar duken. Titta på glaset.',true);
    }
    function stegD(h){
      const drar = D.cl<=TX1+10;
      const vcNu = drar ? D.vc : 0;
      if(drar){ D.cl+=D.vc*h; D.cr+=D.vc*h; } else D.duksl+=h;
      if(!D.fall){
        const pa = vcNu>0 && D.gx>D.cl && D.gx<D.cr;
        D.kontakt=pa;
        if(pa){
          const rel=vcNu-D.gv, da=AC*h;
          D.gv += Math.abs(rel)<da ? rel : Math.sign(rel)*da;
          D.tk+=h;
        } else if(D.gv>0) D.gv=Math.max(0,D.gv-AT*h);
        D.gx+=D.gv*h;
        if(D.gx>TX1){ D.fall=true; D.gvy=0; }
      } else {
        D.kontakt=false;
        if(!D.landat){
          D.gvy+=900*h; D.gy+=D.gvy*h; D.gx+=D.gv*h; D.rot=Math.min(1.5,D.rot+3.2*h);
          if(TY-32+D.gy>=FL-14){ D.landat=true; D.gy=FL-14-(TY-32); D.rot=1.5; D.gv=0; D.gvy=0; }
        }
      }
    }
    const dukSlut=()=>{
      if(D.cl<=TX1+10) return false;
      return D.fall ? D.landat : D.gv===0;
    };
    function avslutaD(){
      D.fas='klar'; D.tklar=0; knDra.disabled=false;
      const disp=D.gx-GX0, cm=Math.round(disp/4);
      D.cmm=cm;
      D.utfall = D.fall?'fall' : disp<=36?'kvar':'bit';
      lastRes.duk = D.utfall==='fall'?'glaset föll av':D.utfall==='kvar'?'glaset blev kvar ('+cm+' cm)':'glaset flyttade sig '+cm+' cm';
      status();
      if(D.utfall==='kvar'){ gjort.duk=true;
        api.tips('Glaset blev stående och flyttade sig bara '+cm+' centimeter. Friktionen hann inte dra med det. Det är trögheten.');
      } else if(D.utfall==='fall')
        api.tips('Glaset följde med duken och föll av. Vid ett långsamt drag hinner friktionen dra med glaset. Prova ett snabbare ryck.');
      else
        api.tips('Glaset flyttade sig '+cm+' centimeter. Prova ett ännu snabbare ryck.');
      kollaSteg();
    }
    function glas(c,x,y,rot,slosh){
      c.save(); c.translate(x,y); c.rotate(rot);
      const h=64, bb=15, bt=19, niva=h/2-h*.6;
      const bredd=yy=>bb+(bt-bb)*(h/2-yy)/h;
      const yL=niva-slosh*7, yR=niva+slosh*7;
      G.poly(c,[[-bb,h/2],[bb,h/2],[bredd(yR),yR],[-bredd(yL),yL]],'rgba(92,184,255,.6)');
      G.glas(c,[[-bb,h/2],[bb,h/2],[bt,-h/2],[-bt,-h/2]],{hx:-40,hy:-52});
      c.restore();
    }
    function ritaD(c,t,dt){
      if(D.fas==='drar'){
        const n=Math.max(1,Math.ceil(dt/.004)), h=dt/n;
        for(let k=0;k<n;k++) stegD(h);
        D.t+=dt;
        if(dukSlut()||D.t>7) avslutaD();
      } else if(D.fas==='klar'){
        D.tklar+=dt; if(D.tklar>KLAR_TID) nyD();
      }
      if(D.fas==='klar' && D.cl>TX1+10) D.duksl+=dt;
      D.slosh += ((D.kontakt?1:0)-D.slosh)*Math.min(1,dt*10);
      const pa = D.gx>D.cl && D.gx<D.cr;

      G.scen(c,{topp:'#0A1220',botten:'#101B2B',rutnat:34,vinjett:true});
      G.golv(c,FL,{farg:'#0D1622',djup:'#1B2836',linjer:false});
      G.skugga(c,265,FL+5,200,8,.5);
      G.rekt(c,TX0+18,TY+12,12,FL-TY-12,'#7A5A38'); G.rekt(c,TX1-30,TY+12,12,FL-TY-12,'#7A5A38');
      G.rund(c,TX0,TY,TX1-TX0,12,4,'#B58554','rgba(10,16,25,.6)',1.5);

      if(D.cl<TX1+400 && D.duksl<.6){
        c.save(); c.globalAlpha=clamp(1-D.duksl/.6,0,1);

        c.beginPath(); c.rect(0,0,CW,CH); c.clip();
        G.rekt(c,x0,TY-5+dy,x1-x0,5,'#FF9EC4');
        for(let x=Math.ceil(x0/24)*24;x<x1;x+=24) G.rekt(c,x,TY-4+dy,10,3,'#FFE3EE');

      }

        const hx=D.cr+12, hy=TY-9;
        if(hx<CW-8){ G.linje(c,hx,hy,hx+60,hy-34,'#E8C8A8',9); G.cirkel(c,hx,hy,9,'#F3C9A3','rgba(10,16,25,.5)',1.5); }
      }
      /* markering för glasets startplats */
      G.linje(c,GX0-22,TY+3,GX0-22,TY+11,'rgba(238,243,247,.55)',2); G.linje(c,GX0+22,TY+3,GX0+22,TY+11,'rgba(238,243,247,.55)',2);
      G.text(c,'start',GX0,TY+28,{a:'center',font:F_LITEN,f:'#A3B3C5'});
      /* glaset */
      const baseY = pa && !D.fall ? TY-5 : TY;
      if(!D.fall) glas(c,D.gx,baseY-32,0,D.slosh);
      else glas(c,D.gx,TY-32+D.gy,D.rot,0);
      if(D.fall&&D.landat) for(let i=0;i<5;i++) G.cirkel(c,D.gx-18+i*13,FL-3,2+((i*3)%3),'rgba(92,184,255,.6)');
      if(D.kontakt){
        G.pil(c,D.gx-4,TY-2,D.gx+34,TY-2,'#7CC6FE',3);
        G.text(c,'friktion',D.gx+38,TY+1,{font:F_LITEN,f:'#7CC6FE'});
      }

      /* uppgiftsrutor */
      const tkTxt=dec(D.tk,2)+' s';
      G.bricka(c,10,6,190,56,{titel:'RYCKETS FART',farg:AK});
      G.digit(c,ryck+' av 10',105,52,{storlek:22,a:'center'});
      G.bricka(c,210,6,210,56,{titel:'GLASET FLYTTADE SIG',farg:D.utfall==='kvar'?'#6FD68A':AK});
      G.digit(c,D.fas==='vilar'?'–':D.utfall==='fall'?'föll av':(D.fas==='klar'?D.cmm+' cm':Math.max(0,Math.round((D.gx-GX0)/4))+' cm'),315,52,
        {storlek:22,a:'center',farg:D.utfall==='kvar'?'#6FD68A':'#9FF0FF'});
      G.bricka(c,430,6,200,56,{titel:'DUKEN DRAR I GLASET I',farg:AK});
      G.digit(c,tkTxt,530,52,{storlek:22,a:'center',farg:'#FFC95C'});

      /* förklaring i duken */
      let txt, farg='#FFC95C';
      if(D.fas==='vilar'){ txt='Glaset står stilla på duken.'; }
      else if(D.fas==='drar'){ txt=D.kontakt?'Friktionen drar glaset med duken en kort stund.':(D.fall?'Glaset följde med duken och faller.':'Duken är ute under glaset. Glaset vill stå still.'); }
      else if(D.utfall==='kvar'){ txt='Glaset blev kvar. Det vill stå still: tröghet!'; farg='#6FD68A'; }
      else if(D.utfall==='fall'){ txt='Långsamt drag: friktionen hinner dra med glaset.'; farg='#FF8A8A'; }
      else { txt='Glaset flyttade sig en bit. Dra snabbare.'; farg='#FFC95C'; }
      G.etikett(c,txt,320,100,{f:'#EEF3F7',kant:farg,font:F_BROD});
      if(D.fas==='vilar') G.callout(c,GX0,TY-92,'glas med vatten',{till:[GX0,TY-68],farg:'#7CC6FE'});
    }

    /* ======================================================
       DEL 2: VAGN MED OCH UTAN BÄLTE
       ====================================================== */
    const GY=262, X0=60, CHOCK=360, STOPX=CHOCK-61, VK=150, Z=1.3;
    let W;
    const stoft=new G.Partiklar({max:60});
    function nyW(){
      W={fas:'vilar',x:X0,v:0,ts:0,tk:0,dx:X0-10,dy:0,dvx:0,dvy:0,rot:0,landat:false,balte:balte,res:''};
      knKor.disabled=false;
    }
    nyW();
    function kor(){
      if(del!=='vagn') return;
      if(W.fas==='kor'||W.fas==='efter') return;
      if(W.fas!=='vilar') nyW();
      W.balte=balte; W.fas='kor'; W.v=VK; knKor.disabled=true;
      api.tips('Vagnen rullar mot stoppklossen. Titta på dockan när vagnen stannar.',true);
    }
    function avslutaW(){
      W.fas='klar'; W.tk=0; knKor.disabled=false;
      if(W.balte==='utan'){ gjort.utan=true; W.res='dockan flög framåt'; lastRes.vagn=W.res; status();
        api.tips('Vagnen stannade, men dockan fortsatte framåt i samma fart. Ingen kraft stoppade den. Det är trögheten.'); }
      else { gjort.med=true; W.res='bältet stoppade dockan'; lastRes.vagn=W.res; status();
        api.tips('Bältet drog dockan bakåt med en kraft och stoppade den. Då följde dockan med vagnen.'); }
      kollaSteg();
    }
    function vagnKropp(c,x){
      G.skugga(c,x,GY+3,74,7,.5);
      G.metall(c,x-55,GY-44,110,14,4,{ljus:'#FFB08A',mork:'#B35A38'});
      G.rund(c,x-52,GY-72,8,28,3,'#C98A4B','rgba(10,16,25,.5)',1);
      [x-34,x+34].forEach(wx=>{ G.klot(c,wx,GY-12,12,'#0B121B'); G.cirkel(c,wx,GY-12,4,'#A3B3C5'); });
      G.rund(c,x+55,GY-28,7,16,2,'#A3B3C5');
    }
    function docka(c,x,y,ang,rem,rakt){
      const F='#DCE7F0', fi=(rakt||0)*Math.PI/2;
      c.save(); c.translate(x,y); c.rotate(ang);
      G.linje(c,0,0,0,-26,F,9);
      G.linje(c,0,0,26*Math.cos(fi),26*Math.sin(fi),F,7);
      G.linje(c,0,-20,16,-12,F,5);
      G.cirkel(c,0,-38,9,F,'rgba(10,16,25,.6)',1.2);
      G.linje(c,-9,-38,9,-38,'#0B121B',1.5); G.linje(c,0,-47,0,-29,'#0B121B',1.5);
      if(rem) G.linje(c,-6,-30,14,-2,'#FFC95C',4);
      c.restore();
    }
    function ritaW(c,t,dt){
      if(W.fas==='kor'){
        W.x+=W.v*dt;
        if(W.x>=STOPX){ W.x=STOPX; W.v=0; W.fas='efter'; W.ts=0; W.dvx=VK; W.dvy=0;
          for(let i=0;i<14;i++) stoft.skapa({x:CHOCK,y:GY-4,vx:slump(-60,90),vy:slump(-120,-20),liv:.6,r:slump(1.5,3),farg:'#A3B3C5',gravitation:260}); }
        if(W.fas==='kor') W.dx=W.x-10;
      } else if(W.fas==='efter'){
        W.ts+=dt;
        if(W.balte==='utan'){
          W.dx+=W.dvx*dt;
          if(W.dx>W.x+50){
            W.dvy+=900*dt; W.dy+=W.dvy*dt; W.rot=Math.min(1.55,W.rot+3*dt);
            if(W.dy>=40){ W.dy=40; W.landat=true; }
          }
          if(W.landat){ W.dvx=Math.max(0,W.dvx-300*dt); W.dvy=0; }
          if(W.landat&&W.dvx<=0) { W.fas='slutw'; W.ts=0; }
        } else if(W.ts>1.1){ W.fas='slutw'; W.ts=0; }
      } else if(W.fas==='klar'){
        W.tk+=dt; if(W.tk>KLAR_TID) nyW();
      }
      if(W.fas==='slutw') avslutaW();

      const ang = W.balte==='med' && W.fas==='efter' && W.ts<.6 ? .62*Math.sin(Math.PI*W.ts/.6) : (W.balte==='utan'&&W.fas!=='vilar'&&W.fas!=='kor'? W.rot : 0);
      const dumpX = W.balte==='med' || W.fas==='vilar' || W.fas==='kor' ? W.x-10 : W.dx;
      const dumpY = GY-46 + (W.balte==='utan' ? W.dy : 0);

      G.scen(c,{topp:'#0A1220',botten:'#101B2B',rutnat:34,vinjett:true});
      G.golv(c,GY,{farg:'#0D1622',djup:'#1B2836',linjer:false});
      G.linje(c,0,GY+4,CW,GY+4,'#6B7C8F',3);
      for(let x=10;x<CW;x+=48) G.rekt(c,x,GY+10,22,4,'rgba(238,243,247,.2)');
      /* stoppklossen (ritas i samma skala som vagnen) */
      c.save(); c.translate(0,GY); c.scale(Z,Z); c.translate(0,-GY);
      G.rekt(c,CHOCK,GY-16,26,16,'#FF6B6B');
      for(let i=0;i<3;i++) G.poly(c,[[CHOCK+i*9,GY],[CHOCK+i*9+5,GY],[CHOCK+i*9+11,GY-16],[CHOCK+i*9+6,GY-16]],'#EEF3F7');
      G.rund(c,CHOCK-.5,GY-16.5,27,17,2,null,'rgba(10,16,25,.6)',1.5);
      c.restore();

      c.save(); c.translate(0,GY); c.scale(Z,Z); c.translate(0,-GY);
      vagnKropp(c,W.x);
      docka(c,dumpX,dumpY,ang,W.balte==='med',W.balte==='utan'?clamp(W.rot/1.55,0,1):0);
      stoft.uppdatera(dt); stoft.rita(c);
      c.restore();

      /* kraften från bältet */
      if(W.balte==='med' && W.fas==='efter' && W.ts<.7){
        const px=dumpX*Z, py=GY+(dumpY-GY)*Z;
        G.pil(c,px+4,py-30,px-58,py-30,'#FFC95C',4);
        G.callout(c,px-64,py-66,'Bältet drar bakåt',{farg:'#FFC95C',a:'right'});
      }

      G.bricka(c,10,6,190,56,{titel:'BÄLTE',farg:AK});
      G.digit(c,(W.fas==='vilar'?balte:W.balte)==='utan'?'UTAN':'MED',105,52,{storlek:22,a:'center'});
      const dock = W.fas==='vilar'||W.fas==='kor' ? 'sitter still' : W.balte==='utan' ? (W.landat?'ligger framför':'flyger framåt') : (W.ts<.7?'hålls tillbaka':'sitter kvar');
      G.bricka(c,210,6,210,56,{titel:'DOCKAN',farg:AK});
      G.digit(c,dock,315,52,{storlek:19,a:'center',farg:'#9FF0FF'});
      const fo=W.fas==='vilar'||W.fas==='kor';
      G.bricka(c,430,6,200,56,{titel:'KRAFT STOPPAR DOCKAN',farg:AK});
      G.digit(c,fo?'–':W.balte==='med'?'ja, bältet':'ingen',530,52,{storlek:19,a:'center',farg:fo?'#9FF0FF':(W.balte==='med'?'#6FD68A':'#FF8A8A')});

      let txt, farg='#FFC95C';
      if(W.fas==='vilar') txt = 'Vagnen står still. Tryck på Kör vagnen.';
      else if(W.fas==='kor') txt='Vagnen och dockan rör sig åt höger i samma fart.';
      else if(W.balte==='utan'){ txt = W.landat?'Dockan fortsatte framåt. Ingen kraft stoppade den.':'Vagnen stannar, men dockan fortsätter framåt!'; farg='#FF8A8A'; }
      else { txt = W.ts<.7?'Bältet drar dockan bakåt och stoppar den.':'Bältet höll kvar dockan.'; farg='#6FD68A'; }
      if(W.fas==='klar'){ txt = W.balte==='utan'?'Utan bälte: dockan fortsatte framåt.':'Med bälte: dockan stannade med vagnen.'; farg=W.balte==='utan'?'#FF8A8A':'#6FD68A'; }
      G.etikett(c,txt,320,100,{f:'#EEF3F7',kant:farg,font:F_BROD});
      G.callout(c,(CHOCK+13)*Z,GY-62,'stoppkloss',{till:[(CHOCK+13)*Z,GY-22],farg:'#FF8A8A'});
    }

    /* ======================================================
       DEL 3: TUNG OCH LÄTT KLOSS
       ====================================================== */
    const KX0=118, PPM=36, FK=20, TP=.5, ML=2, SL_=46, MALX=KX0+13*PPM;
    const L1=170, L2=272;                     // bottenkant för varje bana
    let K;
    function nyK(){ K={fas:'vilar',t:0,xl:KX0,xt:KX0,vl:0,vt:0,tk:0,fl:0,ft:0}; knPutta.disabled=false; }
    nyK();
    function putta(){
      if(del!=='kloss') return;
      if(K.fas==='kor') return;
      if(K.fas!=='vilar') nyK();
      K.fas='kor'; knPutta.disabled=true;
      api.tips('Båda klossarna får samma putt, '+FK+' N i en halv sekund.',true);
    }
    function avslutaK(){
      K.fas='klar'; K.tk=0; knPutta.disabled=false;
      gjort.latt=true;
      const vl=FK*TP/ML, vt=FK*TP/tung;
      lastRes.kloss='lätt '+f1(vl)+' m/s, tung '+f1(vt)+' m/s';
      status();
      api.tips('Samma kraft, men olika fart. Den lätta klossen fick '+f1(vl)+' meter per sekund och den tunga '+f1(vt)+' meter per sekund. Den tunga har större tröghet, så det är svårare att få igång den.');
      kollaSteg();
    }
    function kloss(c,x,bot,s,f,txt){
      G.skugga(c,x+s/2,bot+3,s*.7,5,.5);
      G.metall(c,x,bot-s,s,s,5,{ljus:G._ljusare(f,.25),mork:G._morkare(f,.35)});
      G.text(c,txt,x+s/2,bot-s/2+5,{a:'center',font:F_BROD,f:'#0B121B',skugga:false});
    }
    function ritaK(c,t,dt){
      if(K.fas==='kor'){
        K.t+=dt;
        const al=FK/ML, at=FK/tung;
        const push=K.t<TP;
        if(push){ K.vl=al*K.t; K.vt=at*K.t; } else { K.vl=al*TP; K.vt=at*TP; }
        K.xl+=K.vl*PPM*dt; K.xt+=K.vt*PPM*dt;
        K.fl=push?FK:0;
        if(K.xl+SL_>=MALX||K.t>3.4) avslutaK();
      } else if(K.fas==='klar'){ K.tk+=dt; if(K.tk>KLAR_TID) nyK(); }

      G.scen(c,{topp:'#0A1220',botten:'#101B2B',rutnat:34,vinjett:true});
      const sT = tung===5?60:tung===10?76:90;
      [[L1,'LÄTT'],[L2,'TUNG']].forEach(([y,n])=>{
        G.rund(c,KX0-50,y,CW-KX0+36,8,4,'#6B7C8F','rgba(10,16,25,.6)',1);
      });
      for(let m=0;m<=12;m+=2){ const x=KX0+m*PPM;
        G.linje(c,x,L2+10,x,L2+18,'#A3B3C5',1.5);
        G.text(c,m+' m',x,L2+34,{a:'center',font:F_LITEN,f:'#A3B3C5'}); }
      G.linje(c,MALX,L1-70,MALX,L2+10,'#6FD68A',2,[5,5]);
      G.text(c,'mål',MALX,L1-76,{a:'center',font:F_LITEN,f:'#6FD68A'});
      kloss(c,K.xl,L1,SL_,'#7CC6FE',ML+' kg');
      kloss(c,K.xt,L2,sT,'#FF8A5B',tung+' kg');
      /* putten */
      const pushar=K.fas==='kor'&&K.t<TP+.25;
      if(pushar||K.fas==='vilar'){
        [[L1,SL_,K.xl],[L2,sT,K.xt]].forEach(([y,s,x])=>{
          const ay=y-s/2;
          G.pil(c,x-56,ay,x-6,ay,'#FFC95C',4);
          G.etikett(c,'putt '+FK+' N',x-84,ay-14,{a:'left',f:'#FFC95C',kant:'#FFC95C',font:F_LITEN});
        });
      }
      /* fartstaplar */
      const vl=FK*TP/ML, vt=FK*TP/tung, visa=K.fas==='kor'&&K.t>=TP||K.fas==='klar';
      G.bricka(c,430,6,200,56,{titel:'FART EFTER PUTTEN',farg:AK});
      G.text(c,'lätt',440,34,{font:F_LITEN,f:'#7CC6FE'}); G.stapel(c,474,24,92,10,visa?vl/5:0,'#7CC6FE',{bakgrund:'#16222F'});
      G.text(c,visa?f1(vl)+' m/s':'–',622,34,{a:'right',font:F_LITEN,f:'#EEF3F7'});
      G.text(c,'tung',440,52,{font:F_LITEN,f:'#FF8A5B'}); G.stapel(c,474,42,92,10,visa?vt/5:0,'#FF8A5B',{bakgrund:'#16222F'});
      G.text(c,visa?f1(vt)+' m/s':'–',622,52,{a:'right',font:F_LITEN,f:'#EEF3F7'});
      G.bricka(c,10,6,190,56,{titel:'KRAFT PÅ VARDERA',farg:AK});
      G.digit(c,FK+' N',105,52,{storlek:22,a:'center'});
      G.bricka(c,210,6,210,56,{titel:'MASSOR',farg:AK});
      G.digit(c,ML+' kg och '+tung+' kg',315,52,{storlek:18,a:'center',farg:'#9FF0FF'});

      let txt, farg='#FFC95C';
      if(K.fas==='vilar') txt='Två klossar får samma putt. Tryck på Putta klossarna.';
      else if(K.fas==='kor'&&K.t<TP) txt='Samma kraft på båda klossarna.';
      else if(K.fas==='kor') txt='Ingen kraft längre: klossarna glider vidare i samma fart.';
      else { txt='Den tunga klossen fick lägre fart: större massa, större tröghet.'; farg='#6FD68A'; }
      G.etikett(c,txt,320,100,{f:'#EEF3F7',kant:farg,font:F_BROD});
    }

    byt();
    vagled();
    return {rita(c,t,dt){
      if(del==='duk') ritaD(c,t,dt); else if(del==='vagn') ritaW(c,t,dt); else ritaK(c,t,dt);
    }};
  }
};
/* Testa hävstänger – lärarens labb: vikterna 10, 20, 50 och 100 g (0,1 / 0,2 / 0,5 / 1 N). Balans när vridmomentet är lika stort på båda sidor.
   Förenkling: brädan väger ingenting, och avståndet mäts i steg om 5 cm från vridpunkten. Den lättare vikten hänger alltid till vänster. */
EXP.havstanglab={
  namn:'Testa hävstänger',
  intro:'Du har vikter på 10, 20, 50 och 100 gram. Välj två och få brädan i balans. Brädan väger ingenting, och vridmoment är kraft gånger hävarm.',
  steg:['Välj par A. Få balans mellan 10 g och 20 g.','Välj par C. Få balans mellan 10 g och 100 g.','Välj par F. Få balans mellan 50 g och 100 g.'],
  fraga:['Den ena vikten är fem gånger tyngre än den andra. Hur ska de hänga för balans?',
    ['Den tunga fem gånger närmare vridpunkten','Den tunga fem gånger längre från vridpunkten','Båda lika långt från vridpunkten','Den tunga fem centimeter närmare vridpunkten'],
    'Vridmomentet är kraft gånger hävarm och ska vara lika stort på båda sidor. Fem gånger så stor kraft kräver fem gånger så kort hävarm, så avstånden är omvänt proportionella mot vikterna.'],
  bygg(api){
    const AK=api.farg, BL='#7CC6FE', OR='#FF8A5B', GRN='#6FD68A';
    const PARS={A:[10,20],B:[10,50],C:[10,100],D:[20,50],E:[20,100],F:[50,100]};
    const MAL=[{p:'A',dl:20,dr:10},{p:'C',dl:50,dr:5},{p:'F',dl:20,dr:10}];
    const CX=320, CY=158, PX=5.2, GR=298;
    const BLOCK={10:30,20:36,50:44,100:54};
    let par='A', dl=30, dr=30, tilt=0, blink=0;
    const kommat=v=>String(v).replace('.',',');
    const fN=m=>kommat(m/100), fM=cm=>kommat(cm/100), fT=t=>kommat(t/10000);

    api.avlas('v','Vänster sida'); api.avlas('h','Höger sida'); api.avlas('l','Läge');
    api.val({id:'par',etikett:'Välj två vikter',varde:par,
      alt:Object.keys(PARS).map(k=>[k,k+': '+PARS[k][0]+' g + '+PARS[k][1]+' g']),
      vid:v=>{ par=v; dl=30; dr=30; kolla(); }});
    api.slider({id:'dl',etikett:'Lätta vikten (vänster)',min:5,max:50,steg:5,varde:dl,fmt:v=>v+' cm',vid:v=>{ dl=v; kolla(); }});
    api.slider({id:'dr',etikett:'Tunga vikten (höger)',min:5,max:50,steg:5,varde:dr,fmt:v=>v+' cm',vid:v=>{ dr=v; kolla(); }});

    const sidor=()=>{ const [ml,mr]=PARS[par]; return {ml,mr,tl:ml*dl,tr:mr*dr}; };
    const nasta=()=>[0,1,2].find(k=>!api.gjort(k));

    function forklara(){
      const {ml,mr,tl,tr}=sidor();
      const v=fN(ml)+' N × '+fM(dl)+' m = '+fT(tl)+' Nm', h=fN(mr)+' N × '+fM(dr)+' m = '+fT(tr)+' Nm';
      const slut = tl===tr ? 'Lika stora. Balans!' : tr>tl ? 'Höger sida är störst. Brädan tippar åt höger.' : 'Vänster sida är störst. Brädan tippar åt vänster.';
      return 'Vänster '+v+'. Höger '+h+'. '+slut;
    }
    function slutsats(i){
      const {ml,mr}=sidor();
      const bas='Balans! '+ml+' gram hänger '+dl+' centimeter från vridpunkten och '+mr+' gram hänger '+dr+' centimeter från vridpunkten. Vridmomentet är '+fT(sidor().tl)+' newtonmeter på båda sidor.';
      if(i===0) return bas+' Den tyngre vikten hänger närmare mitten.';
      if(i===1) return bas+' Vikten på 100 gram är tio gånger tyngre, så den hänger tio gånger närmare mitten.';
      return bas+' Regeln: ju tyngre vikt, desto närmare mitten. Avstånden är omvänt proportionella mot vikterna.';
    }
    function kolla(){
      const {tl,tr}=sidor(), i=nasta(), bal=tl===tr;
      api.tips(forklara(),true);
      api.satt('v',fT(tl)+' Nm'); api.satt('h',fT(tr)+' Nm'); api.satt('l',bal?'balans':tr>tl?'tippar åt höger':'tippar åt vänster');
      if(bal) blink=1.2;
      if(i!==undefined && bal && par===MAL[i].p) api.klar(i,slutsats(i));
      vagled();
    }
    function vagled(){
      const i=nasta();
      if(i===undefined){ api.peka(null); return; }
      const m=MAL[i], val=par!==m.p ? 'Välj par '+m.p+'. ' : '';
      api.peka(par!==m.p?'par':dl!==m.dl?'dl':'dr');
      const [ml,mr]=PARS[m.p];
      const tips = i===0 ? ['Vridmomentet till vänster måste vara lika stort som till höger. Vridmoment är kraft gånger hävarm.',
          '20 gram är dubbelt så tungt som 10 gram. Då ska 20 gram hänga på halva avståndet.']
        : i===1 ? ['100 gram är tio gånger tyngre än 10 gram.','Då ska 100 gram hänga tio gånger närmare vridpunkten. Sätt 10 gram längst ut, på 50 cm.']
        : ['100 gram är dubbelt så tungt som 50 gram.','Dubbelt så tung vikt betyder halva avståndet.'];
      api.hint([tips[0],tips[1],val+'Ställ Lätta vikten ('+ml+' g) på '+m.dl+' cm och Tunga vikten ('+mr+' g) på '+m.dr+' cm.']);
    }
    kolla();

    /* ---- ritning ---- */
    function mark(c,x,y,t,f,a){ G.etikett(c,t,x,y,{a:a||'center',f:f,kant:f,font:F_LITEN}); }
    return {rita(c,t,dt){
      const {ml,mr,tl,tr}=sidor(), bal=tl===tr, lg=lugn();
      blink=Math.max(0,blink-dt);
      const mellan=Math.abs(tr-tl)/(tl+tr);
      const mal = bal ? 0 : Math.sign(tr-tl)*clamp(.03+.13*Math.min(1,mellan*2.4),.03,.16);
      tilt += (mal-tilt)*Math.min(1,dt*4);
      const cs=Math.cos(tilt), sn=Math.sin(tilt);
      const pt=(cm,off)=>[CX+cm*PX*cs-off*sn, CY+cm*PX*sn+off*cs];

      G.scen(c,{topp:'#132133',botten:'#20364B',rutnat:34,vinjett:true});
      G.golv(c,GR,{farg:'#233A2A',djup:'#2E4A33',kant:'rgba(150,200,160,.35)',linjer:false});
      G.skugga(c,CX,GR+3,70,8,.5);
      G.poly(c,[[CX,CY+10],[CX-36,GR],[CX+36,GR]],'#6B7C8F','#98A7B6',2);
      G.poly(c,[[CX,CY+10],[CX-36,GR],[CX-14,GR]],'rgba(255,255,255,.12)');

      /* brädan med måttskala */
      c.save(); c.translate(CX,CY); c.rotate(tilt);
      G.metall(c,-272,-11,544,22,6,{ljus:'#E8D2A8',mork:'#B58554'});
      for(let k=-50;k<=50;k+=5){
        if(!k) continue;
        const x=k*PX, lang=k%10===0;
        G.linje(c,x,-11,x,lang?-1:-5,'rgba(60,40,20,.8)',lang?1.6:1.1);
        if(lang) G.text(c,String(Math.abs(k)),x,9,{a:'center',font:F_LITEN,f:'#3A2814',skugga:false});
      }
      /* hävarmar som färgade streck ovanför brädan */
      G.linje(c,0,-19,-dl*PX,-19,BL,4); G.linje(c,-dl*PX,-25,-dl*PX,-13,BL,2.5); G.linje(c,0,-25,0,-13,'#EEF3F7',2.5);
      G.linje(c,0,-19,dr*PX,-19,OR,4);  G.linje(c,dr*PX,-25,dr*PX,-13,OR,2.5);
      c.restore();
      G.cirkel(c,CX,CY,7,'#0B121B','#EEF3F7',2);
      G.linje(c,CX-3.5,CY-3.5,CX+3.5,CY+3.5,'#FF6B8A',2); G.linje(c,CX+3.5,CY-3.5,CX-3.5,CY+3.5,'#FF6B8A',2);

      /* vikterna */
      [[-dl,ml,BL],[dr,mr,OR]].forEach(([cm,m,f])=>{
        const [x,y]=pt(cm,11), s=BLOCK[m];
        G.linje(c,x,y,x,y+22,'#C8D5E2',2);
        G.cirkel(c,x,y,2.5,'#C8D5E2');
        G.skugga(c,x,y+22+s+2,s*.7,4,.35);
        G.metall(c,x-s/2,y+22,s,s,5,{ljus:G._ljusare(f,.25),mork:G._morkare(f,.4)});

    const HCM=20, DCM=10, DW=180;                 // pappskivans höjd, stor lampas höjd, avstånd lampa–vägg (cm)
    const HP=HCM*S2;                              // pappskivans höjd i bildpunkter
    let dist=100, stor=true, damm=false;
    const H=[
      ['Skuggan ändras när du flyttar pappskivan.','Flytta pappskivan närmare lampan. Då växer skuggan på väggen.','Dra reglaget Avstånd lampa–pappskiva till 60 centimeter eller mindre.'],
      ['Nu ska skuggan bli mindre.','Flytta pappskivan längre bort från lampan.','Dra reglaget Avstånd lampa–pappskiva till 130 centimeter eller mer.'],
      ['Titta på skuggans kant på väggen. Den är suddig.','En stor lampa ger en suddig kant. Prova en annan lampa.','Tryck på Liten lampa under rubriken Lampa.'],
      ['Nu ska du se ljuset i luften.','Damm i luften gör ljusstrålen synlig.','Tryck på Dammigt under rubriken Rummet.']
    ];
    const PEKA=['avst','avst','lampa','rum'];
    const SLUTS=[
      'Skuggan blev större. Ju närmare lampan, desto större skugga.',
      'Skuggan blev mindre. Ju längre från lampan, desto mindre skugga.',
      'Skarp kant! En liten lampa skickar ljus från en enda punkt, så kanten blir skarp.',
      'Nu syns ljusstrålen från sidan. Dammkornen reflekterar ljuset åt alla håll, och en del når ditt öga.'
    ];
    // dammkorn på fasta platser (samma varje gång)
    let sd=7; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
    const DAMM=Array.from({length:240},()=>({x:LX+10+rnd()*(SX-LX-14),y:YT+4+rnd()*(YB-YT-8),f:rnd()*6.28,r:.9+rnd()*1.1}));
    const PEKDAMM={x:150,y:112,f:1,r:1.8};         // kornet som etiketten pekar på

    api.avlas('avst','Avstånd lampa–pappskiva'); api.avlas('hela','Hela skuggan');
    api.avlas('mork','Helt mörk del'); api.avlas('kant','Skuggans kant');
    api.slider({id:'avst',etikett:'Avstånd lampa–pappskiva',min:50,max:160,steg:10,varde:dist,fmt:v=>v+' cm',vid:v=>{dist=v;kolla('avst');}});
    api.val({id:'lampa',etikett:'Lampa',varde:'stor',alt:[['stor','Stor lampa'],['liten','Liten lampa']],vid:v=>{stor=v==='stor';kolla('lampa');}});
    api.val({id:'rum',etikett:'Rummet',varde:'ren',alt:[['ren','Ren luft'],['damm','Dammigt']],vid:v=>{damm=v==='damm';kolla('rum');}});

    const geo=()=>{ const k=DW/dist, d=stor?DCM:0;
      const hela=HCM*k+d*(k-1), mork=Math.max(0,HCM*k-d*(k-1));
      return {k:k,d:d,hela:hela,mork:mork,halv:(hela-mork)/2}; };
    // hur stor del av lampan syns från punkten (x,y)? 0 = helt mörkt, 1 = fullt ljus
    const ljus=(x,y,OX,g)=>{ if(x<=OX) return 1;
      const kx=(x-LX)/(OX-LX), dp=g.d*S2;
      const ub=Math.max(0,HP*kx/2-dp/2*(kx-1)), ob=HP*kx/2+dp/2*(kx-1), a=Math.abs(y-AY);
      if(a<=ub) return 0; if(a>=ob) return 1; return (a-ub)/(ob-ub); };

    function nastaHint(){ const n=[0,1,2,3].find(i=>!api.gjort(i));
      if(n===undefined){ api.peka(null); return; }
      api.hint(H[n]); api.peka(PEKA[n]); }
    function klara(i){ if(api.gjort(i)) return false; api.tips(SLUTS[i],true); api.klar(i,SLUTS[i]); nastaHint(); return true; }
    function kolla(vad){
      const g=geo();
      let k=false;
      if(g.hela>55) k=klara(0)||k;
      if(g.hela<35) k=klara(1)||k;
      if(!stor) k=klara(2)||k;
      if(damm) k=klara(3)||k;
      if(k) return;
      if(vad==='avst') api.tips('Pappskivan är '+dist+' cm från lampan. Skuggan är '+Math.round(g.hela)+' centimeter.',true);
      else if(vad==='lampa') api.tips(stor?'Stor lampa: ljuset kommer från många punkter. Kanten blir suddig, en halvskugga.':'Liten lampa: ljuset kommer från en punkt. Kanten blir skarp.',true);
      else if(vad==='rum') api.tips(damm?'Damm i luften: dammkornen reflekterar ljuset, så strålen syns.':'Ren luft: ljuset syns inte från sidan. Strålarna är bara ritade.',true);
    }
    nastaHint();
    api.tips('Flytta pappskivan med reglaget och titta på skuggan på väggen.',true);

    return {rita(c,t,dt){
      const lg=lugn(), g=geo(), OX=LX+dist*S2, dp=g.d*S2;
      const ob=HP*g.k/2+dp/2*(g.k-1), ub=Math.max(0,HP*g.k/2-dp/2*(g.k-1));
      const hela=Math.round(g.hela), mork=Math.round(g.mork), klar=api.gjort(0)&&api.gjort(1)&&api.gjort(2)&&api.gjort(3);
      G.scen(c,{topp:'#070C12',botten:'#0E1621',stjarnor:0,rutnat:false,vinjett:true});
      G.golv(c,FL,{farg:'#16222F',djup:'#0B121B',linjer:false});

      /* ljus i dammigt rum: lysande luft och dammkorn. Skuggan syns som ett mörkt hål. */
      if(damm){
        const rad=(alfa)=>{ const gr=c.createLinearGradient(LX,0,SX,0);
          gr.addColorStop(0,'rgba(255,240,190,'+(.3*alfa)+')'); gr.addColorStop(1,'rgba(255,240,190,'+(.1*alfa)+')');
          c.fillStyle=gr; c.fillRect(LX,YT,SX-LX,YB-YT); };
        c.save(); c.beginPath(); c.rect(LX,YT,SX-LX,YB-YT);
        c.moveTo(OX,AY-HP/2); c.lineTo(SX,AY-ob); c.lineTo(SX,AY+ob); c.lineTo(OX,AY+HP/2); c.closePath();
        c.clip('evenodd'); rad(1); c.restore();
        if(ob-ub>1){
          [-1,1].forEach(sg=>{ c.save(); c.beginPath(); c.moveTo(OX,AY+sg*HP/2); c.lineTo(SX,AY+sg*ob); c.lineTo(SX,AY+sg*ub); c.closePath();
            c.clip(); rad(.5); c.restore(); });
        }
        c.save();
        DAMM.concat([PEKDAMM]).forEach(p=>{
          const rx=lg?0:Math.sin(t*.6+p.f)*5, ry=lg?0:Math.cos(t*.5+p.f*1.3)*5;
          const px=p.x+rx, py=p.y+ry, lj=ljus(px,py,OX,g);
          if(lj<=0.02) return;
          const fall=1/(1+Math.pow((px-LX)/170,2));
          c.globalAlpha=clamp((.2+.8*fall)*lj,0,1)*(lg?1:.75+.25*Math.sin(t*2+p.f*3));
          c.fillStyle='#FFF4CF'; c.beginPath(); c.arc(px,py,p.r,0,7); c.fill();
        });
        c.restore();
      }

      /* stativ */
      G.skugga(c,18,FL,30,7,.5); G.skugga(c,OX,FL,26,6,.5);
      G.ror(c,[[18,AY+26],[18,FL-6]],7,'#6B7C8F');
      G.metall(c,2,FL-8,32,8,3);
      G.ror(c,[[OX,AY+HP/2],[OX,FL-6]],5,'#6B7C8F');
      G.metall(c,OX-15,FL-8,30,8,3);

      /* ritade ljusstrålar (streckade) */
      const pa=lg?0:-t*14;
      const stral=(x1,y1,x2,y2,f,b,streck)=>{ c.save(); c.lineCap='round'; c.setLineDash(streck||[]); c.lineDashOffset=pa;
        c.strokeStyle=f; c.lineWidth=b; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.restore(); };
      const steg=stor?2:1;
      for(let j=-6;j<=6;j+=steg){
        const yw=AY+j*20, yo=AY+(yw-AY)*(OX-LX)/(SX-LX), stopp=Math.abs(yo-AY)<=HP/2;
        if(stopp) stral(LX,AY,OX,yo,'rgba(255,236,170,.4)',1.3,[5,4]);
        else stral(LX,AY,SX,yw,'rgba(255,236,170,.4)',1.3,[5,4]);
      }
      // kantstrålarna: de som går precis över och under pappskivan
      const kant=(yL,yE,f,b)=>{ const yw=yL+(yE-yL)*(SX-LX)/(OX-LX); stral(LX,yL,SX,yw,f,b); };
      if(stor){
        kant(AY-dp/2,AY-HP/2,'#FF9A5C',2); kant(AY+dp/2,AY+HP/2,'#FF9A5C',2);
        kant(AY+dp/2,AY-HP/2,'#FFD35C',2); kant(AY-dp/2,AY+HP/2,'#FFD35C',2);
      } else { kant(AY,AY-HP/2,'#FFD35C',2); kant(AY,AY+HP/2,'#FFD35C',2); }

      /* lampa */
      G.metall(c,6,AY-26,24,52,6,{ljus:'#DCE7F0',mork:'#6B7C8F',vinkel:20});
      G.rund(c,26,AY-14,8,28,3,'#0B121B');
      if(stor){ G.glod(c,LX+2,AY,64,'#FFF1C4',.95); G.rund(c,LX-5,AY-dp/2,10,dp,4,'#FFF6D8','#FFE9A6',1.2); }
      else { G.glod(c,LX+1,AY,36,'#FFF1C4',.95); G.cirkel(c,LX+1,AY,3.5,'#FFFFFF'); }

      /* pappskivan */
      G.rund(c,OX-3.5,AY-HP/2,7,HP,2,'#D9A066','#8A5A2B',1.4);

      /* väggen med skuggans ljusprofil */
      const w0=SX, wb=26, y0=YT, y1=YB, fr=y=>clamp((y-y0)/(y1-y0),0,1);
      const grd=c.createLinearGradient(0,y0,0,y1), LIT='#F6E7B0', DARK='#141A24';
      const stops=[[0,LIT],[fr(AY-ob),LIT],[fr(AY-ub),DARK],[fr(AY+ub),DARK],[fr(AY+ob),LIT],[1,LIT]];
      stops.forEach((s,i)=>{ let o=s[0]; if(i>0&&o<stops[i-1][0]) o=stops[i-1][0]; grd.addColorStop(clamp(o,0,1),s[1]); });
      G.skugga(c,w0+wb/2,FL,22,6,.5);
      G.rund(c,w0,y0,wb,y1-y0,3,grd,'#3A4C5F',1.5);
      G.rekt(c,w0+wb/2-3,y1,6,FL-y1,'#4A5A6B');
      G.metall(c,w0-6,FL-8,wb+12,8,3);

      /* mått på väggen: hela skuggan */
      const bx=w0+wb+10;
      G.linje(c,bx,AY-ob,bx,AY+ob,'#FFD35C',2);
      G.linje(c,bx-5,AY-ob,bx+5,AY-ob,'#FFD35C',2); G.linje(c,bx-5,AY+ob,bx+5,AY+ob,'#FFD35C',2);
      if(ub>1&&ob-ub>1){ G.linje(c,bx+9,AY-ub,bx+9,AY+ub,'#FF9A5C',2);
        G.linje(c,bx+5,AY-ub,bx+13,AY-ub,'#FF9A5C',2); G.linje(c,bx+5,AY+ub,bx+13,AY+ub,'#FF9A5C',2); }
      G.text(c,hela+' cm',bx+18,AY+5,{font:'700 13px "IBM Plex Mono", monospace',f:'#FFD35C'});

      /* etiketter */
      G.callout(c,LX+16,22,stor?'Stor lampa':'Liten lampa',{farg:A});
      G.callout(c,w0+wb/2-14,22,'Vägg med skugga',{farg:A});
      G.callout(c,clamp(OX,60,SX-60),AY+HP/2+44,'Pappskiva 20 cm',{till:[OX,AY+HP/2+3],farg:'#D9A066'});
      G.callout(c,216,22,damm?'Ljus i dammigt rum':'Ritade ljusstrålar',{farg:damm?'#FFF4CF':'#A3B3C5'});
      if(damm) G.callout(c,230,92,'Dammkorn reflekterar ljuset',{till:[PEKDAMM.x,PEKDAMM.y],farg:'#FFF4CF'});
      G.matband(c,LX,343,SX,'180 cm från lampan till väggen','#9DAFC4');

      /* mätpanel */
      G.bricka(c,PX,10,PW,50,{titel:'AVSTÅND',farg:A});
      G.digit(c,dist+' cm',PX+12,50,{farg:'#9FF0FF',storlek:24});
      G.bricka(c,PX,68,PW,50,{titel:'HELA SKUGGAN',farg:'#FFD35C'});
      G.digit(c,hela+' cm',PX+12,108,{farg:hela>55||hela<35?'#7BD389':'#9FF0FF',storlek:24});
      G.bricka(c,PX,126,PW,50,{titel:'HELT MÖRK DEL',farg:'#FF9A5C'});
      G.digit(c,mork+' cm',PX+12,166,{farg:'#9FF0FF',storlek:24});
      G.bricka(c,PX,184,PW,50,{titel:'SKUGGANS KANT',farg:stor?'#FF9A5C':'#7BD389'});
      G.digit(c,stor?'SUDDIG':'SKARP',PX+12,224,{farg:stor?'#FF9A5C':'#7BD389',storlek:24});
      G.text(c,'Steg',PX,258,{f:'#A3B3C5',font:F_LITEN});
      for(let i=0;i<4;i++){ const gj=api.gjort(i), x=PX+i*39;
        G.rund(c,x,266,35,28,7,gj?'rgba(123,211,137,.22)':'rgba(42,60,79,.55)',gj?'#7BD389':'#2A3C4F',1.5);
        G.text(c,gj?'✓':String(i+1),x+17.5,285,{a:'center',f:gj?'#7BD389':'#A3B3C5',font:F_RUB}); }
      if(g.halv>0.5) G.text(c,'Halvskugga: '+dec(g.halv,0)+' cm',PX,316,{f:'#FF9A5C',font:F_LITEN});
      else G.text(c,'Ingen halvskugga',PX,316,{f:'#7BD389',font:F_LITEN});
      if(klar) G.rund(c,2,2,CW-4,CH-4,14,null,'#7BD389',3);

      api.satt('avst',dist+' cm'); api.satt('hela',hela+' cm'); api.satt('mork',mork+' cm');
      api.satt('kant',stor?'suddig, halvskugga':'skarp');
    }};
  }
};
/* Station: Reflektion (canvas). Reflektionslagen för plan spegel, och fyra ytor: spegel, matt vit yta, svart yta, glas.
   Fysik: vinkel in = vinkel ut, båda från normalen. Matt yta sprider åt alla håll. Svart yta absorberar (blir varm). Glas släpper igenom nästan allt.
   Procentsiffrorna är ungefärliga (typiska värden). Brytningen i glaset ritas inte. */
EXP.reflektion={
  namn:'Reflektion',
  intro:'Ljus som träffar en spegel studsar. Infallsvinkeln är lika stor som reflektionsvinkeln, och båda mäts från normalen. Sedan jämför du fyra ytor.',
  steg:['Ställ infallsvinkeln på 30 grader och se reflektionsvinkeln.','Rikta ljuset med spegeln så att det träffar ögat.','Prova de fyra ytorna och jämför vad ljuset gör.'],
  fraga:['Varför ser du ingen spegelbild i en vit vägg?',
    ['Väggen sprider ljuset åt alla håll i stället för åt ett håll','Väggen absorberar allt ljus och skickar inget tillbaka mot dig','Väggen skickar ut eget ljus, så den lyser av sig själv','Väggen släpper igenom ljuset, så du ser bara det som finns bakom'],
    'En spegel reflekterar ljuset åt ett håll, så du ser en bild. En matt vägg reflekterar ljuset åt alla håll, så du ser väggen men ingen spegelbild.'],
  bygg(api){
    const A=api.farg, MX=232, MY=262, R=186, PX=474, PW=156;
    const MAL=[25,40,55,65], te=valj(MAL);             // ögats vinkel från normalen (slumpas)
    const YTOR={
      spegel:{namn:'Spegel',refl:90,abs:10,gen:0,
        tips:'Spegel: ljuset reflekteras åt ett håll. Därför ser du en spegelbild.'},
      matt:{namn:'Matt vit yta',refl:80,abs:20,gen:0,
        tips:'Matt vit yta: ljuset reflekteras åt alla håll. Därför ser du väggen från alla håll, men ingen spegelbild.'},
      svart:{namn:'Svart yta',refl:5,abs:95,gen:0,
        tips:'Svart yta: nästan allt ljus absorberas och blir värme. Därför blir en svart tröja varmare än en vit.'},
      glas:{namn:'Glas',refl:8,abs:2,gen:90,
        tips:'Glas: nästan allt ljus släpps igenom, och lite studsar. Ljuset bryts också lite i glaset, men det ritar vi inte här.'}
    };
    const NAMN=['spegel','matt','svart','glas'];
    const UTR=['Ljuset studsar åt ett håll','Ljuset sprids åt alla håll','Ljuset absorberas: värme','Ljuset släpps igenom'];
    let vin=10, yta='spegel'; const besokt=new Set(['spegel']);
    const rad=a=>a*Math.PI/180;

    api.avlas('in','Infallsvinkel'); api.avlas('ut','Reflektionsvinkel'); api.avlas('yta','Yta'); api.avlas('oga','Ögat ser');
    api.slider({id:'vin',etikett:'Infallsvinkel',min:0,max:80,steg:5,varde:vin,fmt:v=>v+' grader',vid:v=>{vin=v;kolla('vin');}});
    api.val({id:'yta',etikett:'Yta',varde:'spegel',alt:[['spegel','Spegel'],['matt','Matt vit yta'],['svart','Svart yta'],['glas','Glas']],
      vid:v=>{yta=v;besokt.add(v);kolla('yta');}});

    const HINT=[
      ['Infallsvinkeln är vinkeln mellan strålen och normalen.','Dra reglaget Infallsvinkel och titta på mätaren Reflektionsvinkel.','Dra reglaget Infallsvinkel till 30 grader.'],
      ['Ögat ser ljuset bara om strålen studsar mot det.','Reflektionsvinkeln ska vara lika stor som ögats vinkel, '+te+' grader. Då måste infallsvinkeln också vara det.','Dra reglaget Infallsvinkel till '+te+' grader.']
    ];
    const kvarYtor=()=>NAMN.filter(n=>!besokt.has(n));
    function nastaHint(){
      const n=[0,1,2].find(i=>!api.gjort(i));
      if(n===undefined){ api.peka(null); return; }
      if(n<2&&yta!=='spegel'){ api.hint(['Reflektionslagen övar du med en spegel.','Välj Spegel som yta.','Tryck på Spegel under rubriken Yta.']); api.peka('yta'); return; }
      if(n<2){ api.hint(HINT[n]); api.peka('vin'); return; }
      const kv=kvarYtor().map(k=>YTOR[k].namn);
      api.hint(['Nu ska du jämföra ytorna.','Prova de ytor du inte har provat än.','Tryck på '+(kv.length>1?kv.slice(0,-1).join(', ')+' och '+kv[kv.length-1]:kv[0])+' under rubriken Yta.']); api.peka('yta');
    }
    const traffar=()=>yta==='spegel'&&Math.abs(vin-te)<.5;
    function klara(i,text){ if(api.gjort(i)) return false; api.tips(text,true); api.klar(i,text); nastaHint(); return true; }
    function kolla(vad){

      if(vad==='yta'){ api.tips(YTOR[yta].tips); nastaHint(); }
      else if(vad==='vin'){
        if(yta==='spegel') api.tips('Infallsvinkel '+vin+' grader. Reflektionsvinkel '+vin+' grader.'+(traffar()?'':' Ögat ser inget ljus än.'),true);
        else api.tips('Infallsvinkel '+vin+' grader.',true);
      }
    }
    nastaHint();
    api.tips('Dra reglaget Infallsvinkel och se hur ljuset studsar.',true);

    function strale(c,x1,y1,x2,y2,f,alfa,b){
      c.save(); c.lineCap='round'; c.globalAlpha=alfa; c.shadowColor=f; c.shadowBlur=12;
      c.strokeStyle=f; c.lineWidth=b||4; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
      c.shadowBlur=0; c.globalAlpha=alfa*.9; c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=1.3; c.stroke(); c.restore();
    }
    function huvud(c,x,y,ang,f,s){ s=s||9; c.save(); c.fillStyle=f; c.beginPath();
      c.moveTo(x+Math.cos(ang)*s,y+Math.sin(ang)*s);
      c.lineTo(x+Math.cos(ang+2.5)*s,y+Math.sin(ang+2.5)*s); c.lineTo(x+Math.cos(ang-2.5)*s,y+Math.sin(ang-2.5)*s);
      c.closePath(); c.fill(); c.restore(); }
    // ytorna
    const Y_NAMN={spegel:'Spegel',matt:'Matt vit yta',svart:'Svart yta'};
    function yt(c,t,lg){
      const x0=MX-150, w=300;
      if(yta!=='glas'){
        const gr=c.createLinearGradient(0,MY-34,0,MY); const h=.5*YTOR[yta].abs/100*(lg?1:.85+.15*Math.sin(t*3));
        gr.addColorStop(0,'rgba(255,138,91,0)'); gr.addColorStop(1,'rgba(255,138,91,'+h+')');
        c.fillStyle=gr; c.fillRect(x0,MY-34,w,34);

        G.rekt(c,x0+8,MY+8,5,50,'#2A3C4F'); G.rekt(c,x0+w-13,MY+8,5,50,'#2A3C4F');
        G.metall(c,x0-4,MY+58,w+8,8,3);
        G.text(c,'Glas',MX+100,MY+38,{a:'center',f:'#CFE7FA',font:F_LITEN});
      } else {
        const bas=yta==='spegel'?'#1B2735':yta==='matt'?'#E9E5DB':'#08090D', kant=yta==='matt'?'#B9B3A5':yta==='svart'?'#7A8798':'#3A4350';
        G.rund(c,x0,MY-2,w,40,5,bas,kant,1.5);
        if(yta==='spegel'){
          G.metall(c,x0,MY-6,w,8,2,{ljus:'#F2F7FB',mork:'#8FA3B8'});
          c.save(); c.globalAlpha=.35; G.poly(c,[[x0+40,MY+4],[x0+70,MY+4],[x0+110,MY+36],[x0+80,MY+36]],'#FFFFFF'); c.restore();
        } else if(yta==='matt'){
          c.save(); c.fillStyle='rgba(120,112,95,.5)';
          for(let i=0;i<80;i++){ const px=x0+8+((i*37.7)%(w-16)), py=MY+4+((i*13.3)%30); c.fillRect(px,py,2,2); }
          c.strokeStyle='#B9B3A5'; c.lineWidth=2; c.beginPath(); c.moveTo(x0,MY-2);
          for(let i=0;i<=75;i++){ c.lineTo(x0+i*4,MY-2-((i*7)%5)); } c.stroke(); c.restore();
        } else {
          const v=lg?.8:.75+.25*Math.sin(t*3);
          c.save(); c.lineCap='round';
          for(let k=0;k<5;k++){ const bx=x0+30+k*60, sv=lg?0:Math.sin(t*2+k)*3; c.globalAlpha=.85*v*(k%2?.75:1); c.strokeStyle='#FF8A5B'; c.lineWidth=2.6;
            c.beginPath(); c.moveTo(bx,MY-8); c.bezierCurveTo(bx-8+sv,MY-20,bx+8-sv,MY-30,bx,MY-42); c.stroke(); }
          c.restore();
        }
        G.text(c,Y_NAMN[yta],MX+100,MY+27,{a:'center',f:yta==='matt'?'#5B554A':'#DCE7F0',font:F_LITEN,skugga:false});
        G.rekt(c,MX-14,MY+38,28,20,'#2A3C4F'); G.metall(c,MX-60,MY+56,120,8,3);
      }
    }

    return {rita(c,t,dt){
      const lg=lugn(), v=rad(vin), tr=rad(te), Y=YTOR[yta];
      const M=[MX,MY], L=[MX-Math.sin(v)*R,MY-Math.cos(v)*R], Rf=[MX+Math.sin(v)*R,MY-Math.cos(v)*R], E=[MX+Math.sin(tr)*R,MY-Math.cos(tr)*R];
      const aligned=Math.abs(vin-te)<.5, hit=traffar();
      const ogaLjus = yta==='spegel'?(aligned?1:0) : yta==='matt'?Math.cos(tr)*.9 : yta==='svart'?.06 : (aligned?.12:0);
      const klar=api.gjort(0)&&api.gjort(1)&&api.gjort(2);
      G.scen(c,{topp:'#070C12',botten:'#0E1621',stjarnor:0,rutnat:32,vinjett:true});
      yt(c,t,lg);

      /* normalen */
      G.linje(c,MX,MY,MX,MY-168,'rgba(255,255,255,.55)',2,[8,6]);
      /* siktlinje till ögat */
      G.linje(c,MX,MY,E[0],E[1],'rgba(92,225,230,.28)',1.5,[3,5]);

      /* vinkelbågar */
      c.save(); c.lineWidth=3;
      c.strokeStyle='#FFD35C'; c.beginPath(); c.arc(MX,MY,54,-Math.PI/2-v,-Math.PI/2); c.stroke();
      if(yta==='spegel'||yta==='glas'){ c.strokeStyle='#5CE1E6'; c.globalAlpha=yta==='glas'?.5:1; c.beginPath(); c.arc(MX,MY,66,-Math.PI/2,-Math.PI/2+v); c.stroke(); }
      c.restore();
      if(vin>=15){
        G.etikett(c,vin+'°',MX-Math.sin(v/2)*96,MY-Math.cos(v/2)*96+4,{f:'#FFD35C',font:F_MONO,a:'center'});
        if(yta==='spegel'||yta==='glas') G.etikett(c,vin+'°',MX+Math.sin(v/2)*104,MY-Math.cos(v/2)*104+4,{f:'#5CE1E6',font:F_MONO,a:'center'});
      }

      /* ljuset in */
      strale(c,L[0],L[1],MX,MY,'#FFE9A6',1,4);
      huvud(c,(L[0]+MX)/2,(L[1]+MY)/2,Math.atan2(MY-L[1],MX-L[0]),'#FFE9A6',10);
      G.glod(c,MX,MY,22,'#FFE9A6',.9);

      /* ljuset ut, olika för olika ytor */
      if(yta==='spegel'){
        const sl=aligned?E:Rf;
        strale(c,MX,MY,sl[0],sl[1],'#5CE1E6',.95,4);
        huvud(c,MX+(sl[0]-MX)*.55,MY+(sl[1]-MY)*.55,Math.atan2(sl[1]-MY,sl[0]-MX),'#5CE1E6',10);
      } else if(yta==='matt'){
        for(let i=-4;i<=4;i++){ const ph=rad(i*19), ln=34+86*Math.cos(ph), al=.14+.55*Math.cos(ph);
          strale(c,MX,MY,MX+Math.sin(ph)*ln,MY-Math.cos(ph)*ln,'#9FF0FF',al,3); }
        strale(c,MX,MY,E[0],E[1],'#9FF0FF',.55*Math.cos(tr)+.1,3);
      } else if(yta==='svart'){
        strale(c,MX,MY,MX+(Rf[0]-MX)*.45,MY+(Rf[1]-MY)*.45,'#5CE1E6',.12,3);
      } else {
        const gx=MX+Math.sin(v)*72, gy=MY+Math.cos(v)*72;
        strale(c,MX,MY,gx,gy,'#FFE9A6',.8,4);
        huvud(c,MX+Math.sin(v)*36,MY+Math.cos(v)*36,Math.atan2(Math.cos(v),Math.sin(v)),'#FFE9A6',9);
        G.glod(c,gx,gy,24,'#FFE9A6',.7);
        const sl=aligned?E:[MX+(Rf[0]-MX)*.5,MY+(Rf[1]-MY)*.5];
        strale(c,MX,MY,sl[0],sl[1],'#5CE1E6',.2,3);
      }

      G.etikett(c,'normalen',te<=30?MX-8:MX+8,MY-146,{f:'#DCE7F0',font:F_LITEN,a:te<=30?'right':'left'});

      /* lampan */
      c.save(); c.translate(L[0],L[1]); c.rotate(Math.atan2(Math.cos(v),Math.sin(v)));
      G.metall(c,-44,-10,44,20,5,{ljus:'#DCE7F0',mork:'#6B7C8F',vinkel:0});
      G.rekt(c,-4,-8,5,16,'#FFF6D8'); G.rekt(c,-40,-4,6,8,'#FF7A7A'); c.restore();
      G.etikett(c,'Ficklampa',clamp(L[0]-8,50,CW-90),clamp(L[1]-24,36,300),{f:'#DCE7F0',font:F_LITEN});

      /* ögat */
      const lj=clamp(ogaLjus,0,1);
      if(lj>.05) G.glod(c,E[0],E[1],40,hit?'#7BD389':'#9FF0FF',lj);
      c.save(); c.translate(E[0],E[1]);
      c.fillStyle='#F2F6FA'; c.beginPath(); c.ellipse(0,0,19,12,0,0,7); c.fill();
      c.strokeStyle=hit?'#7BD389':'#5CE1E6'; c.lineWidth=2.4; c.stroke();
      const io=MX<E[0]?-4:4; G.cirkel(c,io,0,7.5,'#2E6FD0'); G.cirkel(c,io,0,3.6,'#06090E'); c.restore();
      G.callout(c,E[0]+(te>50?-6:12),E[1]-36,hit?'TRÄFF! Ögat ser ljus':'Ögat: '+te+'° från normalen',{till:[E[0],E[1]-13],farg:hit?'#7BD389':'#5CE1E6'});

      /* vad som händer nu */
      G.callout(c,10,344,UTR[NAMN.indexOf(yta)],{a:'left',farg:A});

      /* mätpanel */
      G.bricka(c,PX,10,PW,50,{titel:'INFALLSVINKEL',farg:'#FFD35C'});
      G.digit(c,vin+'°',PX+12,50,{farg:'#FFE9A6',storlek:24});
      G.bricka(c,PX,66,PW,50,{titel:'REFLEKTIONSVINKEL',farg:'#5CE1E6'});
      if(yta==='spegel') G.digit(c,vin+'°',PX+12,106,{farg:'#9FF0FF',storlek:24});
      else if(yta==='glas') G.digit(c,vin+'° svag',PX+12,106,{farg:'#9FF0FF',storlek:17});
      else G.digit(c,yta==='matt'?'ALLA HÅLL':'INGEN',PX+12,106,{farg:'#9FF0FF',storlek:17});
      G.bricka(c,PX,122,PW,104,{titel:'LJUSET GÖR (UNGEFÄR)',farg:A});
      [['Reflekteras',Y.refl,'#5CE1E6'],['Absorberas',Y.abs,'#FF8A5B'],['Släpps igenom',Y.gen,'#FFE9A6']].forEach((r,i)=>{
        const y=150+i*25;
        G.text(c,r[0],PX+12,y,{f:'#DCE7F0',font:F_LITEN,skugga:false});
        G.text(c,r[1]+' %',PX+PW-12,y,{f:r[2],font:F_LITEN,a:'right',skugga:false});
        G.stapel(c,PX+12,y+5,PW-24,7,r[1]/100,r[2],{bakgrund:'#16222F'});
      });
      G.bricka(c,PX,232,PW,52,{titel:'ÖGAT SER',farg:hit?'#7BD389':'#5CE1E6'});
      const oga = yta==='spegel'?(aligned?'LJUS: spegelbild':'INGET LJUS') : yta==='matt'?'LJUS: ytan syns' : yta==='svart'?'NÄSTAN INGET' : (aligned?'SVAG REFLEX':'NÄSTAN INGET');
      G.text(c,oga,PX+12,272,{f:lj>.5?'#7BD389':'#9FF0FF',font:'700 14px "IBM Plex Mono", monospace',skugga:false});
      G.text(c,'Steg',PX,304,{f:'#A3B3C5',font:F_LITEN});
      for(let i=0;i<3;i++){ const gj=api.gjort(i), x=PX+i*52;
        G.rund(c,x,311,46,28,7,gj?'rgba(123,211,137,.22)':'rgba(42,60,79,.55)',gj?'#7BD389':'#2A3C4F',1.5);
        G.text(c,gj?'✓':String(i+1),x+23,330,{a:'center',f:gj?'#7BD389':'#A3B3C5',font:F_RUB}); }
      if(klar) G.rund(c,2,2,CW-4,CH-4,14,null,'#7BD389',3);

      api.satt('in',vin+'°');
      api.satt('ut',yta==='spegel'?vin+'°':yta==='glas'?vin+'° (svag)':yta==='matt'?'åt alla håll':'ingen');
      api.satt('yta',Y.namn);
      api.satt('oga',oga.toLowerCase());
    }};
  }
};
/* Station: Osynligt ljus och strålning (para). Lärarens ord: frekvens = hur ofta, IR = värmestrålning, UV = solbränna och hudcancer, röntgen går igenom mycket, radioaktiv strålning i kärnkraftverk. */
EXP.osynligt={typ:'para',namn:'Osynligt ljus',
  intro:'Synligt ljus är bara en liten del av strålningen. Resten är osynlig, för att den svänger för sällan eller för ofta för våra ögon. Para ihop ordet med rätt förklaring.',
  steg:['Tryck på ett ord till vänster och sedan på rätt förklaring till höger.'],

/* Totalreflektion: ljus i glas mot luft, gränsvinkeln, och ljus som studsar fram i en böjd glasfiber.
   Fysiken: glas n = 1,5 → gränsvinkel = asin(1/1,5) ≈ 41,8°. Glasblocket är en halvcirkel, så strålen träffar
   den runda ytan längs radien och går in och ut utan att brytas där. Fibern räknas med riktig strålföljning
   (rakt stycke, kurva, rakt stycke) där varje träff på väggen prövas mot gränsvinkeln. */
EXP.totalreflektion={
  namn:'Totalreflektion',
  intro:'Du lyser inifrån ett glasblock mot luften. Vid en viss vinkel kommer inget ljus ut. Då studsar allt ljus tillbaka. Det kallas totalreflektion.',
  steg:['Dra reglaget Vinkel tills ljuset i luften precis försvinner. Det är gränsvinkeln.',
    'Ställ in en större vinkel än gränsvinkeln. Då studsar allt ljus kvar i glaset.',
    'Välj Fiber. Skicka ljuset hela vägen ut i andra änden.'],
  fraga:['Varför studsar ljuset hela vägen genom en böjd glasfiber?',
    ['Det träffar väggen i större vinkel än gränsvinkeln och reflekteras helt',
     'Det träffar väggen i mindre vinkel än gränsvinkeln och reflekteras helt',
     'Insidan av fibern har en spegelbeläggning som reflekterar allt ljus',
     'Ljuset går snabbare i glas än i luft och trycks därför framåt hela vägen'],
    'Ljuset går från optiskt tätare glas mot luft och träffar väggen i större vinkel än gränsvinkeln, ungefär 42 grader. Då reflekteras allt ljus, och så skickas internet genom fiber.'],
  bygg(api){
    const FM='700 13.5px "Atkinson Hyperlegible", Verdana, sans-serif';
    const A=api.farg, N=1.5, GRANS=Math.asin(1/N)*180/Math.PI;          // 41,8°
    const RAD=Math.PI/180;
    /* glasblock */
    const CX=215, CY=172, R=116, LR=150;
    /* fiber */
    const FW=20, FX0=100, FY0=272, FS1=120, FS2=100, FBETA=35;
    const HINT={
      b1:['Börja med en liten vinkel och dra reglaget långsamt åt höger.','Titta på strålen i luften. Den böjer sig närmare ytan. Leta efter vinkeln där den försvinner.','Dra Vinkel till 42 grader.'],
      b2:['Nu ska allt ljus studsa kvar i glaset.','Större vinkel än gränsvinkeln ger totalreflektion.','Dra Vinkel till 60 grader.'],
      f0:['Fibern är en tunn glasstav som ljuset ska ta sig igenom.','Du byter bild med knapparna Glasblock och Fiber.','Tryck på Fiber under Visa.'],
      f1:['Ljuset läcker ut i kurvan. Då är vinkeln mot normalen för liten.','Böj fibern mjukare. Dra Skarp böj mot ett.','Dra Skarp böj till 3.']
    };
    let scen='block', vin=20, boj=8, hittad=false, fb=null;
    const FP=new G.Partiklar({max:40});
    let puls=0;

    api.avlas('v','Vinkel mot normalen'); api.avlas('ut','Ljus går ut i luften');
    api.avlas('stuts','Ljus som studsar tillbaka'); api.avlas('gv','Gränsvinkel för glas');
    api.val({id:'scen',etikett:'Visa',varde:'block',alt:[['block','Glasblock'],['fiber','Fiber']],vid:v=>{scen=v;byt();}});
    api.slider({id:'vin',etikett:'Vinkel mot normalen',min:0,max:80,steg:1,varde:vin,fmt:v=>v+'°',vid:v=>{vin=v;kolla();}});
    api.slider({id:'boj',etikett:'Skarp böj',min:1,max:10,steg:1,varde:boj,fmt:v=>v+' av 10',vid:v=>{boj=v;fb=null;kolla();}});

    const ctl=id=>document.querySelector('#reglage [data-ctl="'+id+'"]');
    const klarMed=(i,text)=>{ api.tips(text,true); api.klar(i,text); };
    const visa=(id,pa)=>{ const e=ctl(id); if(e) e.classList.toggle('dold',!pa); };
    const scenSynlig=()=>visa('scen',api.gjort(1));

    /* Fresnel för glas mot luft, vanligt (opolariserat) ljus: hur stor del som studsar tillbaka */
    function refl(deg){
      const th=deg*RAD, st=N*Math.sin(th); if(st>=1) return 1;
      const ci=Math.cos(th), ct=Math.sqrt(1-st*st);
      const rs=Math.pow((N*ci-ct)/(N*ci+ct),2), rp=Math.pow((N*ct-ci)/(N*ct+ci),2);
      return (rs+rp)/2;
    }
    const blockdata=()=>{ const s=N*Math.sin(vin*RAD), tot=s>=1; return {tot:tot, phi:tot?null:Math.asin(s)/RAD, R:refl(vin)}; };

    /* ----- fibern: strålföljning ----- */
    function fiberGeom(){
      const rc=125-11*boj, x1=FX0+FS1, cy=FY0-rc, xe=x1+rc, ye=cy-FS2;
      return {rc:rc,x1:x1,cy:cy,xe:xe,ye:ye};
    }
    function lat(g,x,y){        // sidoavstånd s från mittlinjen (plus = yttre vägg) och väggens normal
      if(x<g.x1) return {s:y-FY0,nx:0,ny:1};
      if(y>=g.cy){ const dx=x-g.x1, dy=y-g.cy, r=Math.hypot(dx,dy)||1e-9; return {s:r-g.rc,nx:dx/r,ny:dy/r}; }
      return {s:x-g.xe,nx:1,ny:0};
    }
    function foljFiber(){
      const g=fiberGeom(), al=Math.asin(Math.sin(FBETA*RAD)/N);
      let dx=Math.cos(al), dy=-Math.sin(al), x=FX0+.5, y=FY0;
      const pts=[[FX0,FY0]], stud=[]; let leak=null, ok=false, minV=90; const st=.5;
      for(let i=0;i<9000;i++){
        const nx=x+dx*st, ny=y+dy*st;
        if(ny<=g.ye && y<g.cy && nx>=g.xe-FW/2 && nx<=g.xe+FW/2){ pts.push([x,y]); ok=true; break; }
        if(nx<=FX0-1) break;
        const q=lat(g,nx,ny);
        if(Math.abs(q.s)>FW/2){
          let a=0,b=st;
          for(let k=0;k<16;k++){ const m=(a+b)/2, p=lat(g,x+dx*m,y+dy*m); if(Math.abs(p.s)>FW/2) b=m; else a=m; }
          const qx=x+dx*b, qy=y+dy*b, p=lat(g,qx,qy), sg=p.s>=0?1:-1, wx=p.nx*sg, wy=p.ny*sg;
          const ci=clamp(dx*wx+dy*wy,-1,1), si=Math.sqrt(Math.max(0,1-ci*ci)), ti=Math.acos(ci)/RAD;
          pts.push([qx,qy]); minV=Math.min(minV,ti);
          if(N*si>=1){ stud.push({x:qx,y:qy,v:ti}); dx-=2*ci*wx; dy-=2*ci*wy; x=qx+dx*.01; y=qy+dy*.01; continue; }
          const tx=dx-ci*wx, ty=dy-ci*wy, tl=Math.hypot(tx,ty)||1, sp=N*si, cp=Math.sqrt(1-sp*sp);
          leak={x:qx,y:qy,v:ti,ox:wx*cp+tx/tl*sp,oy:wy*cp+ty/tl*sp};
          break;
        }
        x=nx; y=ny;
      }
      return {g:g,pts:pts,stud:stud,leak:leak,ok:ok,minV:minV};
    }
    const fiber=()=>fb||(fb=foljFiber());

    /* ----- logik ----- */
    function byt(){
      visa('vin',scen==='block'); visa('boj',scen==='fiber'); scenSynlig();
      if(scen==='block'){
        api.hint(!api.gjort(0)?HINT.b1:!api.gjort(1)?HINT.b2:!api.gjort(2)?HINT.f0:HINT.b2);
        api.peka(api.gjort(0)&&api.gjort(1)&&!api.gjort(2)?'scen':'vin');
        api.tips(!api.gjort(0)?'Dra reglaget Vinkel långsamt åt höger och titta på ljuset i luften.':'Ställ in en större vinkel än gränsvinkeln.',true);
      } else {
        api.hint(HINT.f1);
        api.peka('boj');
        kolla();
      }
    }
    function kolla(){
      if(scen==='block'){
        const b=blockdata();
        if(!api.gjort(0)){
          if(vin>=41&&vin<=43){ hittad=true;
            klarMed(0,'Där! Strålen i luften försvinner vid ungefär 42 grader. Det är gränsvinkeln för glas. Glas är optiskt tätare än luft.');
            api.hint(HINT.b2); api.peka('vin'); }
          else if(vin>43) api.tips('Nu är det redan totalreflektion. Dra tillbaka lite, till ungefär 42 grader.',true);
          else if(vin>=35) api.tips('Strålen i luften går nästan längs ytan. Dra lite till åt höger.',true);
          else api.tips('Ljuset går ut i luften och böjer sig från normalen. Dra åt höger.',true);
        } else if(!api.gjort(1)){
          if(vin>=50){ klarMed(1,'Det är totalreflektion. Allt ljus studsar tillbaka in i glaset.');
            scenSynlig(); api.hint(HINT.f0); api.peka('scen'); }
          else if(b.tot) api.tips('Totalreflektion! Dra lite längre så att det syns tydligt, minst femtio grader.',true);
          else api.tips('Ljuset kommer ut. Dra vinkeln större än gränsvinkeln.',true);
        } else {
          api.tips(b.tot?'Totalreflektion. Allt ljus studsar kvar i glaset.':'Under gränsvinkeln går det mesta ljuset ut i luften.',true);
        }
      } else {
        const f=fiber();
        if(f.ok){
          if(!api.gjort(2)){ klarMed(2,'Ljuset studsar fram genom hela fibern. Så skickas internet och ljus till kirurgikameror.'); api.peka(null); }
          else api.tips('Ljuset kommer ut i andra änden. Alla träffar på väggen ger totalreflektion.',true);
        } else if(f.leak){
          api.tips('Ljuset läcker ut i kurvan. Där träffar det väggen med vinkeln '+dec(f.leak.v,1)+' grader mot normalen. Det är under gränsvinkeln, 41,8 grader. Böj fibern mjukare.',true);
          api.hint(HINT.f1);
        }
      }
    }
    api.hint(HINT.b1); api.peka('vin'); visa('boj',false); scenSynlig();
    api.tips('Dra reglaget Vinkel långsamt åt höger och titta på ljuset i luften.',true);

    /* ----- ritning ----- */
    function punktLangs(pts,d){
      let tot=0; for(let i=1;i<pts.length;i++) tot+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
      if(tot<1) return pts[0]; d=((d%tot)+tot)%tot;
      for(let i=1;i<pts.length;i++){ const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
        if(d<=l){ const k=d/(l||1); return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k]; } d-=l; }
      return pts[pts.length-1];
    }
    const stral=(c,x1,y1,x2,y2,al,br,f)=>{ c.save(); c.globalAlpha=al; c.shadowColor=A; c.shadowBlur=13;
      G.linje(c,x1,y1,x2,y2,f||'#FFE9A6',br||4.5); c.restore(); };
    const plat=(c,x,y,s,f)=>{ c.font=F_MONO; const w=c.measureText(s).width+14;
      G.rund(c,x-w/2,y-12,w,24,7,'rgba(7,12,18,.9)',f,1.3); G.text(c,s,x,y+5,{a:'center',f:f,font:F_MONO,skugga:false}); };

    function panelSteg(c,y){
      for(let i=0;i<3;i++){ const gj=api.gjort(i), bx=446+i*62;
        G.rund(c,bx,y,54,26,7,gj?'rgba(123,211,137,.22)':'rgba(42,60,79,.55)',gj?'#7BD389':'#2A3C4F',1.5);
        G.text(c,gj?'klart':String(i+1),bx+27,y+17,{a:'center',f:gj?'#7BD389':'#A3B3C5',font:F_LITEN}); }
    }

    function ritaBlock(c,t,dt,lg){
      const b=blockdata(), th=vin*RAD, s=Math.sin(th), co=Math.cos(th);
      G.scen(c,{topp:'#070C12',botten:'#0E1621',rutnat:false,vinjett:true});
      G.text(c,'LUFT',16,34,{f:'#A3B3C5',font:F_RUB});
      /* glaset */
      G.skugga(c,CX,CY+R+10,R*.9,10,.5);
      G.glas(c,cc=>{ cc.moveTo(CX-R,CY); cc.arc(CX,CY,R,0,Math.PI); },{fyll:'rgba(120,200,235,.17)',kant:'rgba(215,238,255,.8)',bredd:2.5,hx:CX-80,hy:CY+10});
      G.linje(c,CX-R,CY,CX+R,CY,'rgba(235,246,255,.95)',2.5);
      G.text(c,'GLAS',CX+R+14,CY+66,{f:'#9FE7F5',font:F_RUB});
      G.text(c,'optiskt tätare',CX+R+14,CY+84,{f:'#9FE7F5',font:F_LITEN});
      G.text(c,'brytningsindex 1,5',CX+R+14,CY+100,{f:'#9FE7F5',font:F_LITEN});
      /* normalen */
      G.linje(c,CX,CY-124,CX,CY+R-4,'rgba(255,255,255,.5)',1.8,[8,6]);
      G.callout(c,CX+34,CY-130,'Normal',{till:[CX,CY-112],farg:'#A3B3C5',font:FM});
      /* lasern på bågen */
      const lx=CX-R*s, ly=CY+R*co;
      c.save(); c.translate(CX,CY); c.rotate(Math.atan2(co,-s));
      G.metall(c,R+3,-9,36,18,4,{ljus:'#DCE7F0',mork:'#6B7C8F'}); G.rekt(c,R+36,-3,5,6,'#FF5A5A'); c.restore();
      /* strålar i glaset */
      stral(c,lx,ly,CX,CY,1,4.5);
      G.pil(c,lx+(CX-lx)*.48,ly+(CY-ly)*.48,lx+(CX-lx)*.58,ly+(CY-ly)*.58,'#FFE9A6',3);
      const rx=CX+R*s, ry=CY+R*co, refA=b.tot?1:clamp(.2+b.R*2,.2,.9);
      stral(c,CX,CY,rx,ry,refA,b.tot?5.5:3,b.tot?'#FFD166':'#FFE9A6');
      G.glod(c,rx,ry,b.tot?26:12,'#FFD166',b.tot?.95:.4*refA);
      if(!b.tot){
        const ph=b.phi*RAD, ex=CX+LR*Math.sin(ph), ey=CY-LR*Math.cos(ph), ta=clamp(1-b.R*1.15,.15,1);
        stral(c,CX,CY,ex,ey,ta,3.2+1.8*ta);
        G.glod(c,CX,CY,22,'#FFE9A6',.7);
        c.save(); c.strokeStyle='#5CE1E6'; c.lineWidth=2; c.beginPath(); c.arc(CX,CY,66,-Math.PI/2,-Math.PI/2+ph); c.stroke(); c.restore();
        if(b.phi>14) plat(c,CX+Math.sin(ph/2)*92,CY-Math.cos(ph/2)*92,heltal(b.phi)+'°','#5CE1E6');
        G.callout(c,CX-92,CY-76,'Ljus går ut och bryts',{till:[CX+(ex-CX)*.55,CY+(ey-CY)*.55],farg:'#5CE1E6',font:FM});
      } else {
        G.glod(c,CX,CY,28,'#FFD166',.9);
        G.callout(c,CX-92,CY-76,'Inget ljus går ut',{till:[CX-26,CY-24],farg:'#FF8A5B',font:FM});
        G.callout(c,CX+8,CY+R+26,'TOTALREFLEKTION: allt studsar',{till:[CX+(rx-CX)*.62,CY+(ry-CY)*.62],farg:'#FFD166',font:FM});
      }
      c.save(); c.strokeStyle=A; c.lineWidth=2; c.beginPath(); c.arc(CX,CY,44,Math.PI/2,Math.PI/2+th); c.stroke();
      c.strokeStyle='#FFD166'; c.beginPath(); c.arc(CX,CY,44,Math.PI/2-th,Math.PI/2); c.stroke(); c.restore();
      if(vin>=6){ plat(c,CX-Math.sin(th/2)*64,CY+Math.cos(th/2)*64,vin+'°',A);
        if(b.tot) plat(c,CX+Math.sin(th/2)*64,CY+Math.cos(th/2)*64,vin+'°','#FFD166'); }
      /* mätpanel */
      G.bricka(c,446,10,182,198,{titel:'MÄTVÄRDEN',farg:A});
      G.text(c,'Vinkel mot normalen',458,46,{f:'#A3B3C5',font:F_LITEN});
      G.digit(c,vin+'°',458,72,{farg:'#9FF0FF',storlek:24});
      G.text(c,'Ljus som går ut i luften',458,96,{f:'#A3B3C5',font:F_LITEN});
      G.stapel(c,458,102,158,12,b.tot?0:1-b.R,'#5CE1E6',{bakgrund:'#16222F'});
      G.text(c,b.tot?'0 %':'ca '+heltal((1-b.R)*100)+' %',458,134,{f:b.tot?'#FF8A5B':'#5CE1E6',font:F_MONO});
      G.text(c,'Ljus som studsar tillbaka',458,156,{f:'#A3B3C5',font:F_LITEN});
      G.stapel(c,458,162,158,12,b.R,'#FFD166',{bakgrund:'#16222F'});
      G.text(c,b.tot?'100 %':'ca '+heltal(b.R*100)+' %',458,194,{f:'#FFD166',font:F_MONO});
      G.bricka(c,446,216,182,52,{titel:'GRÄNSVINKEL FÖR GLAS',farg:hittad?'#7BD389':A});
      G.digit(c,hittad?'42°':'?',458,254,{farg:hittad?'#7BD389':'#9DAFC4',storlek:22});
      panelSteg(c,282);
      api.satt('v',vin+'°');
      api.satt('ut',b.tot?'inget ljus':'ja, '+heltal(b.phi)+'° från normalen');
      api.satt('stuts',b.tot?'100 %':'ca '+heltal(b.R*100)+' %');
      api.satt('gv',hittad?'ungefär 42°':'hittas i steg ett');
    }

    function ritaFiber(c,t,dt,lg){
      const f=fiber(), g=f.g, rc=g.rc, W2=FW/2;
      G.scen(c,{topp:'#070C12',botten:'#0E1621',rutnat:false,vinjett:true});
      G.text(c,'LUFT',16,34,{f:'#A3B3C5',font:F_RUB});
      G.text(c,'Glasfiber',g.xe+24,g.ye+20,{f:'#9FE7F5',font:F_RUB});
      G.text(c,'kärnan av glas',g.xe+24,g.ye+38,{f:'#9FE7F5',font:F_LITEN});
      /* fiberns form */
      G.glas(c,cc=>{
        cc.moveTo(FX0,FY0+W2); cc.lineTo(g.x1,FY0+W2);
        cc.arc(g.x1,g.cy,rc+W2,Math.PI/2,0,true);
        cc.lineTo(g.xe+W2,g.ye); cc.lineTo(g.xe-W2,g.ye); cc.lineTo(g.xe-W2,g.cy);
        cc.arc(g.x1,g.cy,Math.max(1,rc-W2),0,Math.PI/2,false);
        cc.lineTo(FX0,FY0-W2);
      },{fyll:'rgba(120,200,235,.2)',kant:'rgba(215,238,255,.85)',bredd:2.2,hx:FX0,hy:FY0-60});
      /* lasern och strålen i luften */
      const be=FBETA*RAD, lx=FX0-Math.cos(be)*58, ly=FY0+Math.sin(be)*58;
      c.save(); c.translate(lx,ly); c.rotate(-be);
      G.metall(c,-40,-9,40,18,4,{ljus:'#DCE7F0',mork:'#6B7C8F'}); G.rekt(c,-3,-3,5,6,'#FF5A5A'); c.restore();
      stral(c,lx,ly,FX0,FY0,1,4);
      /* strålen i fibern */
      const pts=f.pts.slice();
      c.save(); c.lineJoin='round'; c.shadowColor=A; c.shadowBlur=13; c.beginPath();
      pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
      c.strokeStyle='#FFE9A6'; c.lineWidth=3.6; c.stroke(); c.restore();
      f.stud.forEach((p,i)=>{ G.glod(c,p.x,p.y,13,'#FFD166',.8); });
      if(!lg){ puls+=(dt||1/60)*140; for(let k=0;k<4;k++){ const q=punktLangs(pts,puls+k*70); G.cirkel(c,q[0],q[1],3.2,'#FFFFFF'); } }
      if(f.leak){
        const L=f.leak; stral(c,L.x,L.y,L.x+L.ox*70,L.y+L.oy*70,.9,3.2,'#FF9A6B');
        G.glod(c,L.x,L.y,22,'#FF8A5B',.9);
        G.callout(c,clamp(L.x-96,100,330),Math.max(44,L.y-66),'Ljuset läcker ut här',{till:[L.x,L.y],farg:'#FF8A5B',font:FM});
        G.text(c,'Vinkeln mot normalen är '+dec(L.v,1)+'°.',16,70,{f:'#FF8A5B',font:F_BROD});
        G.text(c,'Det är under gränsvinkeln, 41,8°.',16,90,{f:'#FF8A5B',font:F_BROD});
      } else if(f.ok){
        const e=pts[pts.length-1]; G.glod(c,e[0],g.ye,32,'#FFF3C4',1);
        stral(c,e[0],g.ye,e[0]+8,g.ye-52,.9,4);
        G.callout(c,e[0]+60,g.ye-54,'Ljuset kommer ut',{till:[e[0],g.ye-6],farg:'#7BD389',font:FM});
        if(f.stud[0]) G.callout(c,f.stud[0].x+34,FY0+W2+46,'Totalreflektion',{till:[f.stud[0].x,f.stud[0].y],farg:'#FFD166',font:FM});
      }
      /* mätpanel */
      G.bricka(c,446,10,182,198,{titel:'MÄTVÄRDEN',farg:A});
      G.text(c,'Minsta vinkel mot normalen',458,46,{f:'#A3B3C5',font:F_LITEN});
      G.digit(c,dec(f.minV,1)+'°',458,72,{farg:f.minV>=GRANS?'#7BD389':'#FF8A5B',storlek:24});
      G.text(c,'Gränsvinkel för glas: 42°',458,94,{f:'#FFD166',font:F_LITEN});
      G.text(c,'Antal studsar',458,122,{f:'#A3B3C5',font:F_LITEN});
      G.digit(c,String(f.stud.length),458,148,{farg:'#9FF0FF',storlek:24});
      G.rund(c,458,160,158,38,9,f.ok?'rgba(123,211,137,.2)':'rgba(255,122,122,.15)',f.ok?'#7BD389':'#FF7A7A',2);
      G.text(c,f.ok?'LJUS KOMMER FRAM':'LJUSET LÄCKER',537,184,{a:'center',f:f.ok?'#7BD389':'#FF8A5B',font:F_BROD});
      G.text(c,'Fibern är förenklad: glas i luft.',446,226,{f:'#9DAFC4',font:F_LITEN});
      G.text(c,'Skarp böj ger liten vinkel.',446,243,{f:'#9DAFC4',font:F_LITEN});
      panelSteg(c,282);
      api.satt('v',dec(f.minV,1)+'° (minsta mot normalen)');
      api.satt('ut',f.leak?'ja, i kurvan':'nej');
      api.satt('stuts',f.leak?'ljuset läcker':'100 %, '+f.stud.length+' studsar');
      api.satt('gv',hittad?'ungefär 42°':'hittas i steg ett');
    }

    return {rita(c,t,dt){
      const lg=lugn();
      if(scen==='block') ritaBlock(c,t,dt,lg); else ritaFiber(c,t,dt,lg);
      if(api.gjort(0)&&api.gjort(1)&&api.gjort(2)) G.rund(c,2,2,CW-4,CH-4,14,null,'#7BD389',3);
    }};
  }
};
/* Linser och speglar: konvex och konkav lins, konvex, konkav och plan spegel.
   Fysiken: ideala, tunna linser (strålen böjs i linsens mitt) och parabolspeglar, där alla strålar som kommer
   parallellt med axeln samlas exakt i brännpunkten. Brännvidden är tio centimeter (80 bildpunkter).
   Bildens läge räknas med 1/f = 1/a + 1/b. Fysiken för konkav spegel och konvex lins är lika, men spegeln
   skickar ljuset tillbaka. Därför räknas speglarna i en «uppvikt» värld där spegeln är en lins. */
EXP.linstyper={
  namn:'Linser och speglar',
  intro:'Speglar reflekterar ljus. Linser släpper igenom ljus. Du skickar strålar mot fem olika typer och ser om ljuset samlas eller sprids. Strålarna är förenklade: en tunn lins böjer dem i mitten.',
  steg:['Välj konvex lins, konkav lins, konvex spegel och konkav spegel. Se om ljuset samlas eller sprids.',
    'Para ihop varje vardagsföremål med rätt typ.',
    'Välj konvex lins och hitta brännpunkten. Flytta skärmen tills strålarna möts i en punkt.',
    'Visa bilden av ett föremål. Gör bilden förstorad och rättvänd.'],
  fraga:['Vad skiljer en spegel från en lins?',
    ['Spegeln reflekterar ljuset. Linsen släpper igenom och bryter ljuset.',
     'Spegeln släpper igenom ljuset. Linsen reflekterar ljuset och bryter det.',
     'Spegeln samlar alltid ljuset. Linsen sprider alltid ljuset åt alla håll.',
     'Spegeln är alltid platt. Linsen är alltid böjd utåt på mitten av glaset.'],
    'Speglar reflekterar ljus, linser släpper igenom ljus. Konvex lins och konkav spegel samlar ljuset, konkav lins och konvex spegel sprider det.'],
  bygg(api){
    const A=api.farg, AY=170, EX=320, K=8, FP=80, HM=96, OBJH=34;
    const FM='700 13.5px "Atkinson Hyperlegible", Verdana, sans-serif';
    const BX0=4, BX1=CW-4, BY0=40, BY1=286;
    const TYP={
      konvlins:{namn:'Konvex lins',lins:true,F:FP,farg:'#5CE1E6',
        l1:'KONVEX LINS · släpper igenom ljus',l2:'Samlar ljuset i en brännpunkt, som också kallas fokus.',l3:'Vardagsexempel: förstoringsglas, kameralins, glasögon för översynta.',
        sag:'Konvex lins. Ljuset samlas i en brännpunkt, som också kallas fokus.',ljus:'samlas'},
      konklins:{namn:'Konkav lins',lins:true,F:-FP,farg:'#5CE1E6',
        l1:'KONKAV LINS · släpper igenom ljus',l2:'Sprider ljuset. Ingen riktig fokus, men man räknar ut var den skulle hamna.',l3:'Vardagsexempel: glasögon för närsynta.',
        sag:'Konkav lins. Ljuset sprids. Den har ingen riktig fokus, men man räknar ut var den skulle hamna.',ljus:'sprids'},
      konvspegel:{namn:'Konvex spegel',lins:false,F:-FP,farg:'#C9B6FF',
        l1:'KONVEX SPEGEL · reflekterar ljus',l2:'Sprider ljuset. Bilden förminskas, så du ser mycket på en liten spegel.',l3:'Vardagsexempel: trafikspegel, butiksspegel, sidospegel på fordon.',
        sag:'Konvex spegel. Ljuset sprids. Bilden förminskas.',ljus:'sprids'},
      konkspegel:{namn:'Konkav spegel',lins:false,F:FP,farg:'#C9B6FF',
        l1:'KONKAV SPEGEL · reflekterar ljus',l2:'Samlar ljuset i en brännpunkt. Långt bort: upp och ner. Nära: förstorad.',l3:'Vardagsexempel: sminkspegel.',
        sag:'Konkav spegel. Ljuset samlas i en brännpunkt.',ljus:'samlas'},
      planspegel:{namn:'Plan spegel',lins:false,F:Infinity,farg:'#C9B6FF',
        l1:'PLAN SPEGEL · reflekterar ljus',l2:'Ljuset studsar likadant överallt. Vinkel in är lika stor som vinkel ut.',l3:'Vardagsexempel: spegeln hemma.',
        sag:'Plan spegel. Ljuset varken samlas eller sprids. Det ändrar bara riktning, och vinkeln in är lika stor som vinkeln ut.',ljus:'ändrar bara riktning'}
    };
    const FYRA=['konvlins','konklins','konvspegel','konkspegel'];
    const BRUK={
      forst:{namn:'Förstoringsglas',svar:'konvlins',
        krav:'Ett förstoringsglas släpper igenom ljus och förstorar.',
        ratt:'Rätt! Ett förstoringsglas är en konvex lins. Nära föremålet blir bilden förstorad.'},
      glas:{namn:'Glasögon för närsynta',svar:'konklins',
        krav:'Glasögon för närsynta släpper igenom ljus och sprider det.',
        ratt:'Rätt! Glasögon för närsynta har konkava linser. De sprider ljuset.'},
      trafik:{namn:'Trafikspegel',svar:'konvspegel',
        krav:'En trafikspegel reflekterar ljus och ska visa mycket på en liten yta.',
        ratt:'Rätt! En trafikspegel är konvex. Den förminskar bilden och ger överblick.'},
      smink:{namn:'Sminkspegel',svar:'konkspegel',
        krav:'En sminkspegel reflekterar ljus och förstorar när du är nära.',
        ratt:'Rätt! En sminkspegel är konkav. På nära håll förstoras bilden.'}
    };
    const GOR={
      konvlins:'En konvex lins släpper igenom ljus och samlar det.',
      konklins:'En konkav lins släpper igenom ljus och sprider det.',
      konvspegel:'En konvex spegel reflekterar ljus och förminskar bilden.',
      konkspegel:'En konkav spegel reflekterar ljus och förstorar på nära håll.',
      planspegel:'En plan spegel reflekterar ljus och ger en bild i samma storlek.'
    };
    const RYG='#FFD98A', RUT='#FFF1C2';
    let typ='konvlins', lage='par', ant=3, avst=30, skarm=5, bruk='';
    const besokt=new Set(['konvlins']), klarBruk=new Set();
    const HTAL={1:[50],3:[-60,0,60],5:[-80,-40,0,40,80]};

    api.avlas('typ','Typ'); api.avlas('ljus','Ljuset'); api.avlas('fokus','Brännpunkt'); api.avlas('bild','Bilden');
    const vTyp=api.val({id:'typ',etikett:'Typ',varde:typ,
      alt:[['konvlins','Konvex lins'],['konklins','Konkav lins'],['konvspegel','Konvex spegel'],['konkspegel','Konkav spegel'],['planspegel','Plan spegel']],
      vid:v=>{typ=v;valtTyp();}});
    api.val({id:'lage',etikett:'Visa',varde:lage,alt:[['par','Parallella strålar'],['bild','Bilden av ett föremål']],vid:v=>{lage=v;valtLage();}});
